<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genetics: Case Files</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2336;
    --border: #2a3050;
    --accent: #e8ff47;
    --accent2: #ff6b6b;
    --accent3: #6bc5ff;
    --accent4: #b47fff;
    --text: #e8eaf0;
    --muted: #7a82a0;
    --villain: #ff4444;
    --hero: #44ff99;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ─── HEADER ─── */
  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .progress-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-bar-bg {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    white-space: nowrap;
  }

  /* ─── CATEGORY TABS ─── */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 14px 24px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 700;
  }

  /* ─── MAIN LAYOUT ─── */
  .main {
    display: flex;
    height: calc(100vh - 110px);
  }

  /* ─── CASE LIST ─── */
  .case-list {
    width: 240px;
    min-width: 240px;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .case-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .case-item:hover { background: var(--surface); }
  .case-item.active { background: var(--surface2); }
  .case-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }

  .case-number {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .case-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }

  .case-tag {
    font-size: 10px;
    margin-top: 5px;
    display: inline-block;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .tag-ar { background: rgba(107,197,255,0.15); color: var(--accent3); }
  .tag-ad { background: rgba(180,127,255,0.15); color: var(--accent4); }
  .tag-xl { background: rgba(255,107,107,0.15); color: var(--accent2); }
  .tag-chr { background: rgba(232,255,71,0.15); color: var(--accent); }
  .tag-iem { background: rgba(68,255,153,0.15); color: var(--hero); }
  .tag-hgb { background: rgba(255,165,0,0.15); color: #ffaa44; }
  .tag-mt { background: rgba(255,192,203,0.15); color: #ffb3c6; }

  .solved-check {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    font-size: 14px;
  }

  /* ─── CASE VIEWER ─── */
  .case-viewer {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    padding: 0;
  }

  /* ─── CASE HERO ─── */
  .case-hero {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px;
    position: relative;
    overflow: hidden;
  }

  .case-hero::before {
    content: attr(data-emoji);
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 64px;
    opacity: 0.12;
    pointer-events: none;
  }

  .case-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .case-name {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .case-subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    letter-spacing: 0.04em;
  }

  /* ─── CONTENT SECTIONS ─── */
  .content-body {
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Scene-setter */
  .scene-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    border-left: 3px solid var(--accent3);
  }

  .scene-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--accent3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .scene-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.7;
  }

  /* Reveal sections */
  .reveal-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .reveal-header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .reveal-header:hover { background: var(--surface2); }

  .reveal-icon {
    font-size: 16px;
    width: 28px;
    text-align: center;
  }

  .reveal-title {
    font-size: 13px;
    font-weight: 600;
    flex: 1;
  }

  .reveal-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .reveal-toggle.open { transform: rotate(90deg); }

  .reveal-body {
    padding: 0 18px 18px;
    display: none;
    border-top: 1px solid var(--border);
  }
  .reveal-body.open {
    display: block;
    padding-top: 16px;
  }

  /* Villain / Hero boxes */
  .villain-hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
  }

  .vh-box {
    border-radius: 8px;
    padding: 14px;
  }

  .villain-box {
    background: rgba(255,68,68,0.08);
    border: 1px solid rgba(255,68,68,0.25);
  }

  .hero-box {
    background: rgba(68,255,153,0.07);
    border: 1px solid rgba(68,255,153,0.2);
  }

  .vh-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
  }

  .villain-box .vh-label { color: var(--villain); }
  .hero-box .vh-label { color: var(--hero); }

  .vh-content { font-size: 13px; line-height: 1.6; }

  /* Clue list / symptoms */
  .clue-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 4px;
  }

  .clue {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    line-height: 1.5;
  }

  .clue-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: 7px;
    flex-shrink: 0;
  }

  /* Pathway chain */
  .pathway {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 4px;
  }

  .pathway-step {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 6px;
  }

  .pathway-arrow {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-left: 20px;
    line-height: 1;
  }

  /* Stat pills */
  .stat-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .stat-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
  }

  .stat-val {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    display: block;
  }

  .stat-lbl {
    color: var(--muted);
    font-size: 11px;
  }

  /* Treatment / management */
  .tx-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }

  .tx-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 13px;
    line-height: 1.5;
  }

  .tx-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: rgba(232,255,71,0.1);
    border-radius: 4px;
    padding: 1px 6px;
    margin-top: 2px;
    flex-shrink: 0;
  }

  /* Key fact box */
  .key-fact {
    background: rgba(232,255,71,0.06);
    border: 1px solid rgba(232,255,71,0.2);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 4px;
  }

  .key-fact strong { color: var(--accent); }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
  }

  .empty-emoji { font-size: 48px; }
  .empty-text { font-size: 14px; }

  /* Mark solved button */
  .solve-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: rgba(232,255,71,0.08);
    border: 1px solid rgba(232,255,71,0.3);
    border-radius: 8px;
    color: var(--accent);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    width: fit-content;
    margin-top: 4px;
  }
  .solve-btn:hover {
    background: rgba(232,255,71,0.15);
    border-color: var(--accent);
  }
  .solve-btn.solved {
    background: rgba(68,255,153,0.08);
    border-color: rgba(68,255,153,0.3);
    color: var(--hero);
  }

  @media (max-width: 700px) {
    .case-list { width: 180px; min-width: 180px; }
    .content-body { padding: 16px; }
    .case-hero { padding: 18px 16px; }
    .villain-hero { grid-template-columns: 1fr; }
  }
</style>
</head>

// ── State ──
let activeCategory = "All";
let activeCase = null;
let solved = JSON.parse(localStorage.getItem('genetics_solved') || '{}');

function getFilteredCases() {
  if (activeCategory === "All") return CASES;
  return CASES.filter(c => c.category === activeCategory);
}

function updateProgress() {
  const solvedCount = Object.keys(solved).filter(k => solved[k]).length;
  const total = CASES.length;
  document.getElementById('progressFill').style.width = `${(solvedCount/total)*100}%`;
  document.getElementById('progressLabel').textContent = `${solvedCount} / ${total} solved`;
}

function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = CATEGORIES.map(cat => `
    <button class="tab ${cat === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>
  `).join('');
}

function selectCategory(cat) {
  activeCategory = cat;
  activeCase = null;
  renderTabs();
  renderCaseList();
  renderEmpty();
}

function renderCaseList() {
  const list = document.getElementById('caseList');
  const cases = getFilteredCases();
  list.innerHTML = cases.map((c, i) => `
    <div class="case-item ${activeCase?.id === c.id ? 'active' : ''}" onclick="selectCase('${c.id}')">
      <div class="case-number">CASE ${(i+1).toString().padStart(2,'0')}</div>
      <div class="case-title">${c.name}</div>
      <span class="case-tag ${c.tagClass}">${c.tagLabel}</span>
      ${solved[c.id] ? '<span class="solved-check">✓</span>' : ''}
    </div>
  `).join('');
}

function renderEmpty() {
  document.getElementById('caseViewer').innerHTML = `
    <div class="empty-state">
      <div class="empty-emoji">🔬</div>
      <div class="empty-text">Select a case to begin</div>
    </div>`;
}

function toggleReveal(id) {
  const body = document.getElementById(`reveal-body-${id}`);
  const toggle = document.getElementById(`reveal-toggle-${id}`);
  body.classList.toggle('open');
  toggle.classList.toggle('open');
  toggle.textContent = body.classList.contains('open') ? '▶' : '▶';
  if (body.classList.contains('open')) toggle.style.transform = 'rotate(90deg)';
  else toggle.style.transform = 'rotate(0deg)';
}

function selectCase(id) {
  activeCase = CASES.find(c => c.id === id);
  renderCaseList();
  renderCase(activeCase);
}

function markSolved(id) {
  solved[id] = !solved[id];
  localStorage.setItem('genetics_solved', JSON.stringify(solved));
  updateProgress();
  renderCaseList();
  // Update button
  const btn = document.getElementById(`solve-btn-${id}`);
  if (btn) {
    if (solved[id]) {
      btn.classList.add('solved');
      btn.innerHTML = '✓ Got it!';
    } else {
      btn.classList.remove('solved');
      btn.innerHTML = '○ Mark as Solved';
    }
  }
}

function makeReveal(c, revId, icon, title, content) {
  return `
    <div class="reveal-section">
      <div class="reveal-header" onclick="toggleReveal('${c.id}-${revId}')">
        <div class="reveal-icon">${icon}</div>
        <div class="reveal-title">${title}</div>
        <div class="reveal-toggle" id="reveal-toggle-${c.id}-${revId}" style="font-size:10px; transition:transform 0.2s;">▶</div>
      </div>
      <div class="reveal-body" id="reveal-body-${c.id}-${revId}">
        ${content}
      </div>
    </div>`;
}

function renderCase(c) {
  const viewer = document.getElementById('caseViewer');

  const pathwayHTML = c.pathway.map((step, i) => `
    <div class="pathway-step">
      <span style="font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);width:18px;flex-shrink:0">${i+1}.</span>
      <span>${step}</span>
    </div>
    ${i < c.pathway.length - 1 ? '<div class="pathway-arrow">↓</div>' : ''}
  `).join('');

  const symptomsHTML = `<div class="clue-list">${c.symptoms.map(s => `
    <div class="clue"><div class="clue-dot"></div><span>${s}</span></div>
  `).join('')}</div>`;

  const txHTML = `<div class="tx-list">${c.treatment.map((t,i) => `
    <div class="tx-item">
      <span class="tx-num">Rx${i+1}</span>
      <span>${t}</span>
    </div>
  `).join('')}</div>`;

  const epiHTML = `<div class="stat-row">${c.epidemiology.map(e => `
    <div class="stat-pill">
      <span class="stat-val">${e.val}</span>
      <span class="stat-lbl">${e.lbl}</span>
    </div>
  `).join('')}</div>`;

  const villainHeroHTML = `
    <div class="villain-hero">
      <div class="vh-box villain-box">
        <div class="vh-label">☠ The Villain</div>
        <div class="vh-content">${c.villain}</div>
      </div>
      <div class="vh-box hero-box">
        <div class="vh-label">✦ The Normal</div>
        <div class="vh-content">${c.hero}</div>
      </div>
    </div>`;

  viewer.innerHTML = `
    <div class="case-hero" data-emoji="${c.emoji}">
      <div class="case-eyebrow">Case File · ${c.category}</div>
      <div class="case-name">${c.name}</div>
      <div class="case-subtitle">${c.subtitle}</div>
      <div class="tag-row">
        <span class="badge case-tag ${c.tagClass}">${c.tagLabel}</span>
      </div>
    </div>

    <div class="content-body">

      <!-- Scene setter -->
      <div class="scene-card">
        <div class="scene-label">🩺 Clinical Scenario</div>
        <div class="scene-text">${c.scene}</div>
      </div>

      <!-- Villain vs Normal -->
      ${makeReveal(c, 'mech', '⚙️', 'Villain vs. Normal — The Mechanism', villainHeroHTML)}

      <!-- Pathway -->
      ${makeReveal(c, 'path', '🔗', 'Pathophysiology Chain', `<div class="pathway">${pathwayHTML}</div>`)}

      <!-- Symptoms -->
      ${makeReveal(c, 'sym', '📋', 'Clinical Features & Red Flags', symptomsHTML)}

      <!-- Key fact -->
      ${makeReveal(c, 'key', '💡', 'The Key Fact You Can\'t Forget', `<div class="key-fact">${c.keyFact}</div>`)}

      <!-- Treatment -->
      ${makeReveal(c, 'tx', '💊', 'Treatment & Management', txHTML)}

      <!-- Epidemiology -->
      ${makeReveal(c, 'epi', '📊', 'Numbers Worth Knowing', epiHTML)}

      <!-- Solve button -->
      <button class="solve-btn ${solved[c.id] ? 'solved' : ''}" id="solve-btn-${c.id}" onclick="markSolved('${c.id}')">
        ${solved[c.id] ? '✓ Got it!' : '○ Mark as Solved'}
      </button>

    </div>
  `;
}

// Init
renderTabs();
renderCaseList();
updateProgress();
</script>

</html>

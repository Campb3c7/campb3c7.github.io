<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   GENERIC EXAM ENGINE — renders any exam folder under exams/.
   This file contains NO exam content. Content lives in
   exams/<exam>/<lecture>/<objective>/{learn,test,apply}.js.
   You should almost never need to edit this file to add material.
   ════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0e0c;
  --surface: #1a1916;
  --surface2: #222018;
  --surface3: #28251f;
  --border: #2e2b26;
  --border2: #3a3730;
  --text: #f0ece3;
  --text2: #a09a8e;
  --text3: #6b6560;
  --accent: #e8c27a;
  --accent-dim: rgba(232,194,122,.12);
  --blue: #6fa8dc;
  --blue-dim: rgba(111,168,220,.12);
  --red: #e05c5c;
  --red-dim: rgba(224,92,92,.12);
  --green: #5cb87a;
  --green-dim: rgba(92,184,122,.12);
  --radius: 14px;
  --radius-sm: 9px;
}

html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
body { overflow: hidden; }

/* ─── LECTURE TAB BAR ─── */
#tabbar {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: rgba(15,14,12,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: stretch;
  overflow-x: auto; overflow-y: hidden;
  z-index: 100;
}
.tab-back {
  display: flex; align-items: center; justify-content: center;
  min-width: 64px; color: var(--text3); text-decoration: none;
  font-size: 12px; font-weight: 600; border-right: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-back:hover { color: var(--accent); }
.tab-item {
  flex: 1 0 auto; min-width: 76px; padding: 0 10px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  cursor: pointer; border: none; background: none;
  color: var(--text3); font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 600; transition: color .15s;
  position: relative; white-space: nowrap;
}
.tab-item .ico { font-size: 17px; line-height: 1; }
.tab-item.active { color: var(--accent); }
.tab-item.active::after {
  content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
  height: 2px; background: var(--accent); border-radius: 2px;
}

/* ─── VIEW ─── */
#view { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.container { max-width: 640px; margin: 0 auto; padding: 24px 18px 80px; }

.view-head { margin-bottom: 18px; }
.view-eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.view-title { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
.view-desc { font-size: 13.5px; color: var(--text2); margin-top: 6px; line-height: 1.6; }

/* ─── MODE SUBTABS (Learn / Test / Apply) ─── */
.subtab-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.subtab { padding: 8px 18px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text3); font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; transition: all .15s; }
.subtab.active { background: var(--accent); border-color: var(--accent); color: #0f0e0c; }

/* ─── ISSUES BANNER (content-file problems) ─── */
.issues { background: var(--red-dim); border: 1px solid rgba(224,92,92,.4); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 20px; font-family: 'DM Mono', monospace; font-size: 11.5px; line-height: 1.7; color: #e8a5a5; }
.issues .lbl { display: block; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--red); margin-bottom: 6px; }
.issues div { word-break: break-word; }

/* ─── TOPIC PICKER ─── */
.topic-list { display: flex; flex-direction: column; gap: 9px; }
.topic-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 15px 17px; cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  transition: border-color .15s, background .15s, transform .12s;
}
.topic-card:hover { border-color: var(--accent); background: var(--surface2); transform: translateX(3px); }
.topic-card.empty { opacity: .45; cursor: default; }
.topic-card.empty:hover { border-color: var(--border); background: var(--surface); transform: none; }
.topic-num { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--accent); opacity: .45; min-width: 30px; }
.topic-info { flex: 1; }
.topic-name { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.topic-meta { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--text3); }
.topic-arrow { color: var(--text3); font-size: 18px; }
.hy-flag { font-family: 'DM Mono', monospace; font-size: 8.5px; font-weight: 500; letter-spacing: .08em; background: var(--accent-dim); color: var(--accent); padding: 2px 6px; border-radius: 20px; border: 1px solid rgba(232,194,122,.25); text-transform: uppercase; }

.back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text3); cursor: pointer; margin-bottom: 20px; border: none; background: none; font-family: 'DM Sans', sans-serif; padding: 0; transition: color .15s; }
.back-btn:hover { color: var(--text2); }

/* ════════ LEARN ════════ */
.learn-progress-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.learn-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #f5d89a); border-radius: 99px; transition: width .4s; width: 0%; }
.learn-counter { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); text-align: center; margin-bottom: 14px; }
.learn-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 26px 22px; margin-bottom: 16px;
  animation: cardIn .28s cubic-bezier(.4,0,.2,1);
}
@keyframes cardIn { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
.learn-kicker { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); opacity:.8; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.learn-concept-title { font-family:'Playfair Display',serif; font-size:23px; font-weight:700; line-height:1.25; margin-bottom:14px; }
.learn-body { font-size:14.5px; line-height:1.72; color:#d8d3c8; }
.learn-body p { margin-bottom: 12px; }
.learn-body strong { color: var(--text); font-weight: 600; }
.learn-body .hl { color: var(--accent); font-weight: 500; }
.learn-body ul { margin: 10px 0 14px; padding-left: 4px; list-style: none; }
.learn-body ul li { position: relative; padding-left: 20px; margin-bottom: 8px; }
.learn-body ul li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }
.learn-body ol { margin: 10px 0 14px; padding-left: 24px; }
.learn-body ol li { margin-bottom: 8px; }

.learn-table { width:100%; border-collapse:collapse; margin:14px 0; font-size:12.5px; }
.learn-table th { background:var(--surface3); color:var(--accent); font-family:'DM Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; text-align:left; border:1px solid var(--border2); font-weight:500; }
.learn-table td { padding:8px 10px; border:1px solid var(--border); color:#cfc9bd; vertical-align:top; }
.learn-table tr:nth-child(even) td { background: rgba(255,255,255,.015); }

.box-mnemonic { background: var(--blue-dim); border:1px solid rgba(111,168,220,.3); border-radius:9px; padding:13px 15px; margin:14px 0; }
.box-mnemonic .lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--blue); margin-bottom:6px; display:block; }
.box-hy { background: var(--accent-dim); border:1px solid rgba(232,194,122,.3); border-radius:9px; padding:13px 15px; margin:14px 0; }
.box-hy .lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; display:block; }

.learn-actions { display:flex; gap:10px; }
.learn-btn { flex:1; border:none; border-radius:var(--radius-sm); padding:15px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .15s, transform .1s; }
.learn-btn:active { transform: scale(.98); }
.learn-btn-know { background: var(--green-dim); color: var(--green); border:1.5px solid rgba(92,184,122,.4); }
.learn-btn-dunno { background: var(--surface2); color: var(--text2); border:1.5px solid var(--border2); }
.learn-nav { display:flex; justify-content:space-between; margin-top:14px; }
.learn-nav button { background:none; border:none; color:var(--text3); font-size:12.5px; cursor:pointer; font-family:'DM Mono',monospace; padding:6px; transition:color .15s; }
.learn-nav button:hover { color:var(--text); }
.learn-nav button:disabled { opacity:.3; cursor:default; }

.learn-done { text-align:center; padding:30px 10px; animation: cardIn .3s; }
.learn-done-badge { font-size:42px; margin-bottom:14px; }
.learn-done h3 { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; margin-bottom:8px; }
.learn-done p { font-size:13.5px; color:var(--text2); margin-bottom:22px; line-height:1.6; }
.learn-done-stats { display:flex; gap:10px; justify-content:center; margin-bottom:24px; }

/* ════════ TEST / APPLY (quiz) ════════ */
.quiz-progress-track { height:4px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:8px; }
.quiz-progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),#f5d89a); border-radius:99px; transition:width .4s; width:0%; }
.quiz-counter { font-family:'DM Mono',monospace; font-size:11px; color:var(--text3); text-align:center; margin-bottom:16px; }
.q-meta { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); opacity:.75; margin-bottom:10px; }
.q-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 20px; margin-bottom:12px; animation:cardIn .25s; }
.q-text { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; line-height:1.4; }
.q-text.vignette { font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500; line-height:1.6; }
.choices-list { list-style:none; display:flex; flex-direction:column; gap:9px; margin-top:14px; }
.choice-btn { width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:13px 16px; text-align:left; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text); display:flex; gap:12px; align-items:flex-start; transition:border-color .13s, background .13s; line-height:1.5; }
.choice-btn:hover:not(:disabled) { border-color:var(--border2); background:var(--surface3); }
.choice-btn:disabled { cursor:default; }
.choice-btn.correct { border-color:var(--green); background:var(--green-dim); }
.choice-btn.wrong { border-color:var(--red); background:var(--red-dim); color:var(--text2); }
.choice-btn.dimmed { opacity:.4; }
.choice-letter { font-family:'DM Mono',monospace; font-size:11px; font-weight:500; color:var(--text3); min-width:18px; padding-top:1px; flex-shrink:0; }
.choice-btn.correct .choice-letter { color:var(--green); }
.choice-btn.wrong .choice-letter { color:var(--red); }
.explanation-box { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius-sm); padding:14px 16px; margin-top:4px; font-size:13.5px; line-height:1.7; color:var(--text2); display:none; }
.explanation-box.show { display:block; animation:fadeSlide .2s ease; }
@keyframes fadeSlide { from {opacity:0; transform:translateY(-6px);} to {opacity:1; transform:translateY(0);} }
.explanation-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; display:block; }
.next-row { display:none; justify-content:flex-end; margin-top:10px; }
.next-row.show { display:flex; }
.next-btn { background:var(--accent); color:#0f0e0c; border:none; border-radius:var(--radius-sm); padding:11px 24px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .15s; }
.next-btn:hover { opacity:.88; }

.complete-wrap { text-align:center; padding:24px 10px; animation:cardIn .3s; }
.complete-badge { font-size:46px; display:block; margin-bottom:16px; }
.complete-title { font-family:'Playfair Display',serif; font-size:30px; font-weight:900; margin-bottom:8px; background:linear-gradient(135deg,#f0ece3 30%,#e8c27a 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.complete-sub { font-size:14px; color:var(--text2); margin-bottom:26px; line-height:1.6; }
.score-ring { margin:0 auto 26px; width:100px; height:100px; position:relative; display:flex; align-items:center; justify-content:center; }
.score-ring svg { position:absolute; inset:0; transform:rotate(-90deg); }
.score-ring-bg { fill:none; stroke:var(--border); stroke-width:6; }
.score-ring-fill { fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
.score-pct { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; color:var(--accent); position:relative; z-index:1; }
.stats-row { display:flex; gap:10px; justify-content:center; margin-bottom:26px; }
.stat-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 18px; min-width:84px; }
.stat-val { display:block; font-family:'Playfair Display',serif; font-size:24px; font-weight:700; line-height:1; margin-bottom:4px; }
.stat-lbl { font-family:'DM Mono',monospace; font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; }
.cta-btns { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }
.btn-pri { background:var(--accent); color:#0f0e0c; border:none; border-radius:var(--radius-sm); padding:12px 20px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700; cursor:pointer; }
.btn-sec { background:var(--surface); color:var(--text2); border:1px solid var(--border2); border-radius:var(--radius-sm); padding:12px 20px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; }
.btn-sec:hover { border-color:var(--text3); color:var(--text); }

/* fatal load error */
.fatal { max-width: 560px; margin: 100px auto; padding: 0 20px; }
.fatal h2 { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 12px; }
.fatal p { color: var(--text2); font-size: 14px; line-height: 1.7; margin-bottom: 10px; }
.fatal code { font-family: 'DM Mono', monospace; font-size: 12.5px; color: var(--accent); background: var(--surface); padding: 2px 6px; border-radius: 5px; }

@media (max-width:400px){ .stats-row{gap:8px;} .stat-box{min-width:74px; padding:12px 14px;} }
</style>
</head>
<body>

<nav id="tabbar">
  <a class="tab-back" href="./">‹ Exams</a>
  <!-- one tab per lecture, built from exam.js -->
</nav>

<div id="view"><div class="container" id="main-container"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONTENT LOADER
   Reads ?exam=<folder>, then loads:
     exams/<folder>/exam.js                          → defineExam({...})
     exams/<folder>/<lecture>/<objective>/learn.js   → addCards([...])
     exams/<folder>/<lecture>/<objective>/test.js    → addQuestions([...])
     exams/<folder>/<lecture>/<objective>/apply.js   → addQuestions([...])
   Files are loaded one at a time so the engine always knows which
   file content came from. Missing files are fine (an objective can
   start with just learn.js). Malformed entries are skipped and
   reported in a banner instead of breaking the app.
   ═══════════════════════════════════════════════════════════════ */

var EXAM = { id: null, title: '', description: '', lectures: [] };
var ISSUES = [];          // human-readable problems found while loading
var ctx = null;           // { obj, kind, file } — file currently being loaded

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function loadScript(src){
  return new Promise(function(resolve){
    var s = document.createElement('script');
    s.src = src;
    s.onload = function(){ resolve(true); };
    s.onerror = function(){ resolve(false); };
    document.head.appendChild(s);
  });
}

var FOLDER_RE = /^[a-z0-9][a-z0-9._-]*$/i;

/* Called by exams/<exam>/exam.js */
window.defineExam = function(meta){
  if (!meta || typeof meta !== 'object') { ISSUES.push('exam.js: defineExam() needs an object.'); return; }
  EXAM.title = String(meta.title || EXAM.id);
  EXAM.description = String(meta.description || '');
  var lectures = meta.lectures;
  // Back-compat: a top-level "objectives" list becomes a single lecture
  // whose folder is "objectives" (matching the old path layout).
  if (!lectures && Array.isArray(meta.objectives)) {
    lectures = [{ folder: 'objectives', name: EXAM.title, objectives: meta.objectives }];
  }
  if (!Array.isArray(lectures) || !lectures.length) { ISSUES.push('exam.js: "lectures" is missing or empty.'); return; }
  lectures.forEach(function(lect, li){
    if (!lect || !lect.folder || !lect.name) {
      ISSUES.push('exam.js: lectures[' + li + '] needs both "folder" and "name". Skipped.'); return;
    }
    if (!FOLDER_RE.test(lect.folder)) {
      ISSUES.push('exam.js: lectures[' + li + '] folder "' + lect.folder + '" — use only letters, numbers, dashes, dots. Skipped.'); return;
    }
    var L = { folder: String(lect.folder), name: String(lect.name), icon: String(lect.icon || '📚'), objectives: [] };
    var objs = Array.isArray(lect.objectives) ? lect.objectives : [];
    if (!objs.length) ISSUES.push('exam.js: lecture "' + lect.name + '" has no objectives.');
    objs.forEach(function(o, i){
      if (!o || !o.folder || !o.name) {
        ISSUES.push('exam.js: ' + lect.folder + ' objectives[' + i + '] needs both "folder" and "name". Skipped.'); return;
      }
      if (!FOLDER_RE.test(o.folder)) {
        ISSUES.push('exam.js: ' + lect.folder + ' objectives[' + i + '] folder "' + o.folder + '" — use only letters, numbers, dashes, dots. Skipped.'); return;
      }
      L.objectives.push({ folder: String(o.folder), name: String(o.name), hy: !!o.hy, cards: [], test: [], apply: [] });
    });
    EXAM.lectures.push(L);
  });
};

/* Called by learn.js files. May be called multiple times per file. */
window.addCards = function(cards){
  if (!ctx || ctx.kind !== 'learn') { ISSUES.push((ctx ? ctx.file : 'unknown file') + ': addCards() only belongs in learn.js files.'); return; }
  if (!Array.isArray(cards)) { ISSUES.push(ctx.file + ': addCards() needs an array.'); return; }
  cards.forEach(function(card, i){
    var n = ctx.obj.cards.length + 1;
    if (!card || typeof card !== 'object') { ISSUES.push(ctx.file + ': card #' + (i+1) + ' is not an object. Skipped.'); return; }
    if (!card.title) { ISSUES.push(ctx.file + ': card #' + n + ' is missing "title". Skipped.'); return; }
    if (!card.html)  { ISSUES.push(ctx.file + ': card "' + card.title + '" is missing "html". Skipped.'); return; }
    ctx.obj.cards.push({ title: String(card.title), html: String(card.html), hy: !!card.hy });
  });
};

/* Called by test.js and apply.js files. May be called multiple times per file. */
window.addQuestions = function(questions){
  if (!ctx || (ctx.kind !== 'test' && ctx.kind !== 'apply')) { ISSUES.push((ctx ? ctx.file : 'unknown file') + ': addQuestions() only belongs in test.js / apply.js files.'); return; }
  if (!Array.isArray(questions)) { ISSUES.push(ctx.file + ': addQuestions() needs an array.'); return; }
  var bucket = ctx.obj[ctx.kind];
  questions.forEach(function(q){
    var n = bucket.length + 1;
    if (!q || typeof q !== 'object') { ISSUES.push(ctx.file + ': question #' + n + ' is not an object. Skipped.'); return; }
    if (!q.q) { ISSUES.push(ctx.file + ': question #' + n + ' is missing "q". Skipped.'); return; }
    if (!Array.isArray(q.choices) || q.choices.length < 2 || q.choices.length > 6) {
      ISSUES.push(ctx.file + ': question #' + n + ' needs a "choices" array of 2–6 strings. Skipped.'); return;
    }
    var correct = q.correct;
    if (typeof correct !== 'number' || !Number.isInteger(correct) || correct < 0 || correct >= q.choices.length) {
      ISSUES.push(ctx.file + ': question #' + n + ' — "correct" must be the INDEX of the right choice (0 = first choice, max ' + (q.choices.length-1) + '). Skipped.'); return;
    }
    var explain = q.explain != null ? q.explain : q.exp;
    if (explain == null) ISSUES.push(ctx.file + ': question #' + n + ' has no "explain" — it will show an empty explanation.');
    var stored = { q: String(q.q), choices: q.choices.map(String), correct: correct, explain: String(explain == null ? '' : explain) };
    // Optional explicit link to a learn card (0-based index into this objective's cards).
    // Used by Recall mode; if omitted the engine auto-links by keyword match.
    if (q.card != null) {
      if (typeof q.card === 'number' && Number.isInteger(q.card) && q.card >= 0) stored.card = q.card;
      else ISSUES.push(ctx.file + ': question #' + n + ' has an invalid "card" (must be a 0-based integer index). Ignored.');
    }
    bucket.push(stored);
  });
};

/* Attribute runtime errors (syntax errors, typos) to the file being loaded */
window.addEventListener('error', function(e){
  if (ctx && e.filename && e.filename.indexOf(ctx.file) !== -1) {
    ISSUES.push(ctx.file + ': script error — ' + e.message + ' (line ' + e.lineno + ')');
  }
}, true);

async function boot(){
  var examId = (new URLSearchParams(location.search).get('exam') || '').trim();
  if (!examId || !FOLDER_RE.test(examId)) {
    return fatal('No exam selected', 'Open this page as <code>app.html?exam=&lt;folder&gt;</code>, or pick an exam from the <a href="./" style="color:var(--accent)">exam list</a>.');
  }
  EXAM.id = examId;
  var base = 'exams/' + examId + '/';

  ctx = { obj: null, kind: 'exam', file: base + 'exam.js' };
  var ok = await loadScript(ctx.file);
  ctx = null;
  if (!ok) {
    return fatal('Exam not found', 'Could not load <code>' + esc(base) + 'exam.js</code>. Check that the folder exists and is listed in <code>exams/manifest.js</code>.');
  }

  for (var li = 0; li < EXAM.lectures.length; li++) {
    var lect = EXAM.lectures[li];
    for (var oi = 0; oi < lect.objectives.length; oi++) {
      var obj = lect.objectives[oi];
      var dir = base + lect.folder + '/' + obj.folder + '/';
      var kinds = ['learn', 'test', 'apply'];
      for (var k = 0; k < kinds.length; k++) {
        ctx = { obj: obj, kind: kinds[k], file: dir + kinds[k] + '.js' };
        await loadScript(ctx.file);   // missing file is fine — objective just has no content of that kind yet
        ctx = null;
      }
    }
  }

  if (!EXAM.lectures.length) {
    return fatal('Nothing to show', 'The exam loaded but defined no lectures.' + (ISSUES.length ? '<br><br>' + ISSUES.map(esc).join('<br>') : ''));
  }

  document.title = EXAM.title + ' — Study';
  restoreLast();
  buildTabs();
  renderHome();
}

function fatal(title, htmlMsg){
  document.getElementById('main-container').innerHTML =
    '<div class="fatal"><h2>' + esc(title) + '</h2><p>' + htmlMsg + '</p></div>';
}

function issuesHtml(){
  if (!ISSUES.length) return '';
  var h = '<div class="issues"><span class="lbl">⚠ ' + ISSUES.length + ' content problem' + (ISSUES.length > 1 ? 's' : '') + ' found</span>';
  ISSUES.forEach(function(msg){ h += '<div>• ' + esc(msg) + '</div>'; });
  return h + '</div>';
}

/* ═══════════ STATE & NAVIGATION ═══════════ */
var cur = { lect: 0, mode: 'learn' };   // current lecture index + mode

function lecture(){ return EXAM.lectures[cur.lect]; }
function objByFolder(folder){ return lecture().objectives.find(function(o){ return o.folder === folder; }); }
function container(){ return document.getElementById('main-container'); }

function buildTabs(){
  var bar = document.getElementById('tabbar');
  EXAM.lectures.forEach(function(lect, i){
    var b = document.createElement('button');
    b.className = 'tab-item' + (i === cur.lect ? ' active' : '');
    b.innerHTML = '<span class="ico">' + esc(lect.icon) + '</span>';
    b.appendChild(document.createTextNode(lect.name));
    b.addEventListener('click', function(){ showLecture(i); });
    bar.appendChild(b);
  });
}

function showLecture(i){
  cur.lect = i;
  document.querySelectorAll('.tab-item').forEach(function(t, ti){ t.classList.toggle('active', ti === i); });
  renderHome();
}

function showMode(mode){
  cur.mode = mode;
  renderHome();
}

/* ═══════════ LECTURE HOME (objective list per mode) ═══════════ */

/* ═══════════ LEARN ═══════════ */
var learnState = { obj: null, idx: 0, known: {} };

function startLearn(folder){
  var o = objByFolder(folder);
  if (!o || !o.cards.length) return;
  cur.mode = 'learn';
  learnState = { obj: o, idx: 0, known: {} };
  renderLearnCard();
}

function renderLearnCard(){
  var t = learnState.obj, i = learnState.idx;
  if (i >= t.cards.length) { renderLearnDone(); return; }
  var card = t.cards[i];
  var pct = (i / t.cards.length) * 100;
  var html = '<button class="back-btn" onclick="renderHome()">← All objectives</button>';
  html += '<div class="learn-progress-track"><div class="learn-progress-fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="learn-counter">' + (i+1) + ' of ' + t.cards.length + ' · ' + esc(t.name) + '</div>';
  html += '<div class="learn-card">';
  html += '<div class="learn-kicker">' + esc(t.name) + (card.hy ? ' &nbsp;·&nbsp; <span style="color:var(--accent)">★ high yield</span>' : '') + '</div>';
  html += '<div class="learn-concept-title">' + esc(card.title) + '</div>';
  html += '<div class="learn-body">' + card.html + '</div>';
  html += '</div>';
  html += '<div class="learn-actions">' +
    '<button class="learn-btn learn-btn-dunno" onclick="learnNext(false)">Not yet</button>' +
    '<button class="learn-btn learn-btn-know" onclick="learnNext(true)">I know this</button></div>';
  html += '<div class="learn-nav"><button onclick="learnPrev()" ' + (i === 0 ? 'disabled' : '') + '>← back</button>' +
    '<button onclick="renderLearnDone()">skip to end →</button></div>';
  container().innerHTML = html;
  document.getElementById('view').scrollTop = 0;
}
function learnNext(known){ learnState.known[learnState.idx] = known; learnState.idx++; renderLearnCard(); }
function learnPrev(){ if (learnState.idx > 0) { learnState.idx--; renderLearnCard(); } }

function renderLearnDone(){
  var t = learnState.obj;
  var known = Object.values(learnState.known).filter(Boolean).length;
  var total = t.cards.length;
  var html = '<div class="learn-done"><div class="learn-done-badge">📖</div>' +
    '<h3>' + esc(t.name) + ' complete</h3>' +
    '<p>You marked ' + known + ' of ' + total + ' cards as known. Ready to test yourself?</p>' +
    '<div class="learn-done-stats">' +
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">' + known + '</span><span class="stat-lbl">Known</span></div>' +
      '<div class="stat-box"><span class="stat-val" style="color:var(--text2)">' + (total - known) + '</span><span class="stat-lbl">Review</span></div>' +
    '</div>' +
    '<div class="cta-btns">';
  if (t.test.length) html += '<button class="btn-pri" onclick="startQuiz(\'test\',\'' + t.folder + '\')">Test this objective →</button>';
  html += '<button class="btn-sec" onclick="startLearn(\'' + t.folder + '\')">Restudy</button>' +
      '<button class="btn-sec" onclick="renderHome()">All objectives</button>' +
    '</div></div>';
  container().innerHTML = html;
}

/* ═══════════ QUIZ (shared Test + Apply) ═══════════ */
var quizState = { mode: null, obj: null, queue: [], idx: 0, score: 0, answered: 0, missed: [], isRetry: false };

function startQuiz(mode, folder){
  var o = objByFolder(folder);
  if (!o || !o[mode].length) { cur.mode = mode; renderHome(); return; }
  cur.mode = mode;
  quizState = { mode: mode, obj: o, queue: o[mode].slice(), idx: 0, score: 0, answered: 0, missed: [], isRetry: false };
  renderQuizQuestion();
}

function retryMissed(){
  var s = quizState;
  if (!s.missed.length) return;
  quizState = { mode: s.mode, obj: s.obj, queue: s.missed.slice(), idx: 0, score: 0, answered: 0, missed: [], isRetry: true };
  renderQuizQuestion();
}

function renderQuizQuestion(){
  var s = quizState;
  if (s.idx >= s.queue.length) { renderQuizComplete(); return; }
  var q = s.queue[s.idx];
  var pct = (s.idx / s.queue.length) * 100;
  var isApply = s.mode === 'apply';
  var html = '<button class="back-btn" onclick="renderHome()">← All objectives</button>';
  html += '<div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="quiz-counter">' + (s.idx+1) + ' / ' + s.queue.length + ' · ' + esc(s.obj.name) + '</div>';
  html += '<div class="q-meta">' + (isApply ? 'Vignette' : 'Recall') + ' ' + (s.idx+1) + '</div>';
  html += '<div class="q-card"><div class="q-text' + (isApply ? ' vignette' : '') + '">' + esc(q.q) + '</div>';
  var letters = ['A','B','C','D','E','F'];
  html += '<ul class="choices-list" id="choices">';
  q.choices.forEach(function(ch, ci){
    html += '<li><button class="choice-btn" data-ci="' + ci + '"><span class="choice-letter">' + letters[ci] + '</span><span>' + esc(ch) + '</span></button></li>';
  });
  html += '</ul></div>';
  html += '<div class="explanation-box" id="exp"><span class="explanation-label">Explanation</span>' + esc(q.explain) + '</div>';
  html += '<div class="next-row" id="nextrow"><button class="next-btn" id="nextbtn">' + (s.idx + 1 >= s.queue.length ? 'See Results' : 'Next →') + '</button></div>';
  container().innerHTML = html;
  document.getElementById('view').scrollTop = 0;

  document.querySelectorAll('#choices .choice-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ chooseAnswer(parseInt(btn.dataset.ci), q); });
  });
  document.getElementById('nextbtn').addEventListener('click', function(){ quizState.idx++; renderQuizQuestion(); });
}

function chooseAnswer(ci, q){
  document.querySelectorAll('#choices .choice-btn').forEach(function(btn, bi){
    btn.disabled = true;
    if (bi === q.correct) btn.classList.add('correct');
    else if (bi === ci) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  quizState.answered++;
  if (ci === q.correct) quizState.score++;
  else quizState.missed.push(q);
  document.getElementById('exp').classList.add('show');
  document.getElementById('nextrow').classList.add('show');
  setTimeout(function(){ document.getElementById('exp').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 80);
}

function renderQuizComplete(){
  var s = quizState;
  var pct = s.answered > 0 ? Math.round((s.score / s.answered) * 100) : 0;
  var circ = 276.46;
  var missedCount = s.missed.length;
  var titleTxt = s.isRetry ? (pct >= 80 ? 'Nailed the review!' : 'Keep at it') : (pct >= 80 ? 'Strong!' : pct >= 60 ? 'Getting there' : 'Keep going');
  var subTxt = (s.isRetry ? 'Review round · ' : '') + esc(s.obj.name) + ' — ' + s.score + ' of ' + s.answered + ' correct.';
  var html = '<div class="complete-wrap"><span class="complete-badge">' + (pct >= 80 ? '🎯' : pct >= 60 ? '💪' : '📚') + '</span>' +
    '<h2 class="complete-title">' + titleTxt + '</h2>' +
    '<p class="complete-sub">' + subTxt + '</p>' +
    '<div class="score-ring"><svg viewBox="0 0 100 100"><circle class="score-ring-bg" cx="50" cy="50" r="44"/>' +
    '<circle class="score-ring-fill" id="ringfill" cx="50" cy="50" r="44" stroke-dasharray="' + circ + '" stroke-dashoffset="' + circ + '"/></svg>' +
    '<span class="score-pct">' + pct + '%</span></div>' +
    '<div class="stats-row">' +
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">' + s.score + '</span><span class="stat-lbl">Correct</span></div>' +
      '<div class="stat-box"><span class="stat-val" style="color:var(--red)">' + (s.answered - s.score) + '</span><span class="stat-lbl">Wrong</span></div>' +
      '<div class="stat-box"><span class="stat-val" style="color:var(--accent)">' + s.answered + '</span><span class="stat-lbl">Total</span></div>' +
    '</div><div class="cta-btns">';
  if (missedCount > 0) {
    html += '<button class="btn-pri" onclick="retryMissed()">Redo ' + missedCount + ' missed →</button>';
  }
  if (s.mode === 'test' && s.obj.apply.length) {
    html += '<button class="' + (missedCount > 0 ? 'btn-sec' : 'btn-pri') + '" onclick="startQuiz(\'apply\',\'' + s.obj.folder + '\')">Apply this objective 🩺</button>';
  }
  html += '<button class="btn-sec" onclick="startQuiz(\'' + s.mode + '\',\'' + s.obj.folder + '\')">Restart</button>' +
      '<button class="btn-sec" onclick="renderHome()">All objectives</button>' +
    '</div></div>';
  container().innerHTML = html;
  setTimeout(function(){ document.getElementById('ringfill').style.strokeDashoffset = circ - (pct / 100) * circ; }, 90);
}

/* ═══════════════════════════════════════════════════════════════
   PERSISTENCE — saves progress to localStorage so the app resumes
   where you left off (per device/browser). Degrades gracefully to
   in-memory if storage is unavailable (e.g. private browsing).
   ═══════════════════════════════════════════════════════════════ */
var Store = (function(){
  var ok = true;
  try { var k = '__study_test__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); }
  catch(e){ ok = false; }
  return {
    ok: ok,
    get: function(key, fallback){
      if (!ok) return fallback;
      try { var v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
      catch(e){ return fallback; }
    },
    set: function(key, val){ if (!ok) return; try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }
  };
})();
function lastKey(){ return 'study:' + EXAM.id + ':last'; }
function recallKey(folder){ return 'study:' + EXAM.id + ':recall:' + folder; }

function saveLast(){ if (EXAM.id) Store.set(lastKey(), { lect: cur.lect, mode: cur.mode }); }
function restoreLast(){
  var last = Store.get(lastKey(), null);
  if (!last) return;
  if (typeof last.lect === 'number' && last.lect >= 0 && last.lect < EXAM.lectures.length) cur.lect = last.lect;
  if (last.mode && MODE_HEAD[last.mode]) cur.mode = last.mode;
}

/* ═══════════════════════════════════════════════════════════════
   CARD LINKING — every question is tied to the learn card it tests.
   Authors can set an explicit 0-based `card` index on a question;
   otherwise we infer the best match by keyword overlap between the
   question (text + correct choice + explanation) and each card
   (title weighted heavily, then body). Result is cached per question.
   ═══════════════════════════════════════════════════════════════ */
var STOPWORDS = { the:1,and:1,for:1,are:1,with:1,that:1,this:1,from:1,which:1,what:1,when:1,where:1,
  have:1,has:1,had:1,not:1,but:1,can:1,will:1,would:1,should:1,could:1,into:1,than:1,then:1,they:1,
  them:1,their:1,there:1,been:1,being:1,does:1,doing:1,most:1,more:1,less:1,some:1,such:1,also:1,
  these:1,those:1,each:1,about:1,after:1,before:1,during:1,over:1,under:1,because:1,following:1,
  patient:1,presents:1,year:1,years:1,old:1,history:1,exam:1,following:1,best:1,likely:1,which:1 };
function tokenize(s){
  return String(s).toLowerCase().replace(/<[^>]*>/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/)
    .filter(function(w){ return w.length >= 4 && !STOPWORDS[w]; });
}
function cardIndexFor(obj, q){
  if (typeof q.card === 'number' && q.card >= 0 && q.card < obj.cards.length) return q.card;
  if (q._cardIdx != null) return q._cardIdx;
  if (!obj.cards.length) { q._cardIdx = -1; return -1; }
  var qToks = tokenize(q.q + ' ' + (q.choices[q.correct] || '') + ' ' + (q.explain || ''));
  var best = 0, bestScore = -1;
  obj.cards.forEach(function(c, ci){
    var weight = {};
    tokenize(c.title).forEach(function(w){ weight[w] = (weight[w] || 0) + 4; });
    tokenize(c.html).forEach(function(w){ weight[w] = (weight[w] || 0) + 1; });
    var score = 0;
    qToks.forEach(function(w){ if (weight[w]) score += weight[w]; });
    if (score > bestScore) { bestScore = score; best = ci; }
  });
  q._cardIdx = best;
  return best;
}

/* ═══════════════════════════════════════════════════════════════
   RECALL MODE — teach a card, recall it, retire it when correct.
   Misses re-show the card and come back later (spaced repetition).
   Runs a whole lecture, objective by objective, and persists.
   ═══════════════════════════════════════════════════════════════ */
var RECALL_GAP = 3;          // how many steps later a missed item returns
var recallState = null;

function qid(folder, kind, idx){ return folder + '|' + kind + '|' + idx; }
function cid(folder, ci){ return folder + '|c|' + ci; }
function toSet(arr){ var o = {}; (arr || []).forEach(function(k){ o[k] = true; }); return o; }
function recallObjectives(lect){
  return lect.objectives.filter(function(o){ return o.cards.length || o.test.length || o.apply.length; });
}
function recallCounts(lect){
  var objs = recallObjectives(lect), total = 0, mastered = 0;
  var saved = Store.get(recallKey(lect.folder), null);
  var mset = saved && saved.mastered ? toSet(saved.mastered) : {};
  objs.forEach(function(o){
    o.test.forEach(function(q, i){ total++; if (mset[qid(o.folder,'test',i)]) mastered++; });
    o.apply.forEach(function(q, i){ total++; if (mset[qid(o.folder,'apply',i)]) mastered++; });
  });
  return { total: total, mastered: mastered };
}
function liveCounts(){
  var s = recallState, total = 0, m = 0;
  s.objs.forEach(function(o){
    o.test.forEach(function(q, i){ total++; if (s.mastered[qid(o.folder,'test',i)]) m++; });
    o.apply.forEach(function(q, i){ total++; if (s.mastered[qid(o.folder,'apply',i)]) m++; });
  });
  return { total: total, mastered: m };
}
function firstUnmasteredObj(s){
  for (var i = 0; i < s.objs.length; i++){
    var o = s.objs[i], any = false;
    o.test.forEach(function(q, idx){ if (!s.mastered[qid(o.folder,'test',idx)]) any = true; });
    o.apply.forEach(function(q, idx){ if (!s.mastered[qid(o.folder,'apply',idx)]) any = true; });
    if (any) return i;
  }
  return s.objs.length;
}
function saveRecall(){
  var s = recallState; if (!s) return;
  Store.set(recallKey(s.lect.folder), {
    objPtr: s.objPtr,
    mastered: Object.keys(s.mastered),
    taught: Object.keys(s.taught),
    updated: Date.now()
  });
}

function renderRecallHome(){
  saveLast();
  var lect = lecture(), mh = MODE_HEAD.recall;
  var html = issuesHtml();
  html += '<div class="view-head"><div class="view-eyebrow">' + esc(EXAM.title) + ' · ' + esc(lect.name) + '</div>' +
    '<div class="view-title">' + mh.title + '</div><div class="view-desc">' + esc(mh.desc) + '</div></div>';
  html += subtabsHtml();
  var objs = recallObjectives(lect);
  if (!objs.length){
    html += '<div class="topic-card empty"><div class="topic-info"><div class="topic-name">Nothing to recall yet</div>' +
      '<div class="topic-meta">Add learn cards and questions to this lecture first.</div></div></div>';
    container().innerHTML = html; document.getElementById('view').scrollTop = 0; return;
  }
  var c = recallCounts(lect);
  var pct = c.total ? Math.round(c.mastered / c.total * 100) : 0;
  var inProgress = c.mastered > 0;
  var done = c.total > 0 && c.mastered >= c.total;
  html += '<div class="learn-card">';
  html += '<div class="learn-kicker">🔁 Spaced recall · ' + objs.length + ' objective' + (objs.length > 1 ? 's' : '') + '</div>';
  html += '<div class="learn-concept-title">' + (done ? 'Lecture mastered' : inProgress ? 'Pick up where you left off' : 'Master this lecture') + '</div>';
  html += '<div class="learn-body"><p>' + (done
      ? 'You\'ve recalled every card in this lecture correctly. Restart any time to keep it fresh.'
      : 'Work through every objective in order. See a concept, recall it — the ones you miss come back until they stick.') + '</p></div>';
  html += '<div class="learn-progress-track" style="margin:6px 0 10px"><div class="learn-progress-fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="quiz-counter" style="text-align:left;margin-bottom:18px">' + c.mastered + ' of ' + c.total + ' recalled · ' + pct + '%</div>';
  html += '<div class="cta-btns" style="justify-content:flex-start">';
  if (done){
    html += '<button class="btn-pri" onclick="restartRecall()">Restart lecture →</button>';
  } else {
    html += '<button class="btn-pri" onclick="startRecall()">' + (inProgress ? 'Resume →' : 'Start recall →') + '</button>';
    if (inProgress) html += '<button class="btn-sec" onclick="restartRecall()">Restart</button>';
  }
  html += '</div></div>';
  container().innerHTML = html;
  document.getElementById('view').scrollTop = 0;
}

function startRecall(){
  var lect = lecture();
  var saved = Store.get(recallKey(lect.folder), null);
  recallState = {
    lect: lect,
    objs: recallObjectives(lect),
    objPtr: 0, queue: [], pos: 0,
    mastered: saved && saved.mastered ? toSet(saved.mastered) : {},
    taught: saved && saved.taught ? toSet(saved.taught) : {}
  };
  recallState.objPtr = firstUnmasteredObj(recallState);
  if (recallState.objPtr < recallState.objs.length) buildObjectiveQueue();
  renderRecallStep();
}
function restartRecall(){
  if (!confirm('Restart this lecture? Your recall progress for it will be cleared.')) return;
  Store.set(recallKey(lecture().folder), { objPtr: 0, mastered: [], taught: [], updated: Date.now() });
  recallState = null;
  startRecall();
}
function exitRecall(){ saveRecall(); recallState = null; renderRecallHome(); }

function buildObjectiveQueue(){
  var s = recallState, o = s.objs[s.objPtr];
  var steps = [], pendingByCard = {}, noCard = [];
  function consider(kind, q, i){
    var id = qid(o.folder, kind, i);
    if (s.mastered[id]) return;
    var ci = cardIndexFor(o, q);
    var item = { kind: kind, idx: i, q: q, cardIdx: ci, id: id };
    if (ci >= 0 && ci < o.cards.length) (pendingByCard[ci] = pendingByCard[ci] || []).push(item);
    else noCard.push(item);
  }
  o.test.forEach(function(q, i){ consider('test', q, i); });
  o.apply.forEach(function(q, i){ consider('apply', q, i); });
  for (var ci = 0; ci < o.cards.length; ci++){
    var qs = pendingByCard[ci] || [];
    var cidStr = cid(o.folder, ci);
    if (!s.taught[cidStr]) steps.push({ kind: 'teach', cardIdx: ci, cid: cidStr });
    qs.forEach(function(it){ steps.push({ kind: 'quiz', it: it }); });
  }
  noCard.forEach(function(it){ steps.push({ kind: 'quiz', it: it }); });
  s.queue = steps; s.pos = 0;
}

function renderRecallStep(){
  var s = recallState;
  if (!s || !s.objs.length) { renderRecallHome(); return; }
  while (s.objPtr < s.objs.length && s.pos >= s.queue.length){
    s.objPtr++;
    if (s.objPtr < s.objs.length) buildObjectiveQueue();
  }
  if (s.objPtr >= s.objs.length){ saveRecall(); renderRecallComplete(); return; }
  var step = s.queue[s.pos];
  if (step.kind === 'teach') renderRecallTeach(step);
  else renderRecallQuiz(step);
}

function recallHeader(){
  var s = recallState, c = liveCounts(), o = s.objs[s.objPtr];
  var pct = c.total ? Math.round(c.mastered / c.total * 100) : 0;
  return '<button class="back-btn" onclick="exitRecall()">← Recall overview</button>' +
    '<div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="quiz-counter">Objective ' + (s.objPtr + 1) + ' / ' + s.objs.length + ' · ' + esc(o.name) +
      ' · ' + c.mastered + '/' + c.total + ' recalled</div>';
}

function renderRecallTeach(step){
  var s = recallState, o = s.objs[s.objPtr], card = o.cards[step.cardIdx];
  var html = recallHeader();
  html += '<div class="q-meta">New concept</div>';
  html += '<div class="learn-card"><div class="learn-kicker">' + esc(o.name) +
    (card.hy ? ' &nbsp;·&nbsp; <span style="color:var(--accent)">★ high yield</span>' : '') + '</div>' +
    '<div class="learn-concept-title">' + esc(card.title) + '</div>' +
    '<div class="learn-body">' + card.html + '</div></div>';
  html += '<div class="learn-actions"><button class="learn-btn learn-btn-know" onclick="recallTaught()">Got it — continue →</button></div>';
  container().innerHTML = html;
  document.getElementById('view').scrollTop = 0;
}
function recallTaught(){
  var s = recallState, step = s.queue[s.pos];
  if (step && step.cid) s.taught[step.cid] = true;
  saveRecall();
  s.pos++;
  renderRecallStep();
}

function renderRecallQuiz(step){
  var s = recallState, o = s.objs[s.objPtr], it = step.it, q = it.q;
  var isApply = it.kind === 'apply';
  var html = recallHeader();
  html += '<div class="q-meta">' + (isApply ? 'Recall · vignette' : 'Recall') + '</div>';
  html += '<div class="q-card"><div class="q-text' + (isApply ? ' vignette' : '') + '">' + esc(q.q) + '</div>';
  var letters = ['A','B','C','D','E','F'];
  html += '<ul class="choices-list" id="choices">';
  q.choices.forEach(function(ch, ci){
    html += '<li><button class="choice-btn" data-ci="' + ci + '"><span class="choice-letter">' + letters[ci] + '</span><span>' + esc(ch) + '</span></button></li>';
  });
  html += '</ul></div>';
  html += '<div class="explanation-box" id="exp"><span class="explanation-label">Explanation</span>' + esc(q.explain) + '</div>';
  html += '<div id="recardslot"></div>';
  html += '<div class="next-row" id="nextrow"><button class="next-btn" id="nextbtn">Continue →</button></div>';
  container().innerHTML = html;
  document.getElementById('view').scrollTop = 0;
  document.querySelectorAll('#choices .choice-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ recallAnswer(parseInt(btn.dataset.ci), step); });
  });
  document.getElementById('nextbtn').addEventListener('click', function(){ recallAdvance(); });
}

function recallAnswer(ci, step){
  var s = recallState, o = s.objs[s.objPtr], it = step.it, q = it.q;
  document.querySelectorAll('#choices .choice-btn').forEach(function(btn, bi){
    btn.disabled = true;
    if (bi === q.correct) btn.classList.add('correct');
    else if (bi === ci) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  document.getElementById('exp').classList.add('show');
  if (ci === q.correct){
    s.mastered[it.id] = true;
  } else {
    if (it.cardIdx >= 0 && it.cardIdx < o.cards.length){
      s.taught[cid(o.folder, it.cardIdx)] = true;
      var card = o.cards[it.cardIdx];
      document.getElementById('recardslot').innerHTML =
        '<div class="learn-card" style="margin-top:14px"><div class="learn-kicker">↩ Review this card</div>' +
        '<div class="learn-concept-title">' + esc(card.title) + '</div>' +
        '<div class="learn-body">' + card.html + '</div></div>';
    }
    var insertAt = Math.min(s.pos + 1 + RECALL_GAP, s.queue.length);
    s.queue.splice(insertAt, 0, { kind: 'quiz', it: it });
  }
  saveRecall();
  document.getElementById('nextrow').classList.add('show');
  setTimeout(function(){ document.getElementById('exp').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 80);
}
function recallAdvance(){ recallState.pos++; renderRecallStep(); }

function renderRecallComplete(){
  var lect = recallState.lect;
  var html = '<div class="complete-wrap"><span class="complete-badge">🏅</span>' +
    '<h2 class="complete-title">Lecture mastered</h2>' +
    '<p class="complete-sub">You recalled every card in ' + esc(lect.name) + '. Come back later to keep it sharp.</p>' +
    '<div class="cta-btns">' +
    '<button class="btn-pri" onclick="restartRecall()">Restart lecture</button>' +
    '<button class="btn-sec" onclick="exitRecall()">Recall overview</button>' +
    '<button class="btn-sec" onclick="cur.mode=\'learn\';renderHome()">Back to objectives</button>' +
    '</div></div>';
  container().innerHTML = html;
  document.getElementById('view').scrollTop = 0;
}

boot();
</script>

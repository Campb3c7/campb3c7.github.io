<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PA Study App — Pick an Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0e0c;
  --surface: #1a1916;
  --surface2: #222018;
  --border: #2e2b26;
  --border2: #3a3730;
  --text: #f0ece3;
  --text2: #a09a8e;
  --text3: #6b6560;
  --accent: #e8c27a;
  --accent-dim: rgba(232,194,122,.12);
  --radius: 14px;
}
html, body { min-height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
.wrap { max-width: 640px; margin: 0 auto; padding: 48px 20px 80px; }
.home { display: inline-block; color: var(--text3); text-decoration: none; font-size: 13px; margin-bottom: 32px; }
.home:hover { color: var(--accent); }
header .eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
header h1 { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 900; letter-spacing: -.02em; }
header p { margin-top: 8px; color: var(--text2); font-size: 14px; line-height: 1.6; }
#exams { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
.exam-card {
  display: flex; align-items: center; gap: 16px;
  text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  transition: border-color .15s, background .15s, transform .12s;
}
.exam-card:hover { border-color: var(--accent); background: var(--surface2); transform: translateX(3px); }
.exam-card .icon { font-size: 28px; line-height: 1; }
.exam-card .info { flex: 1; }
.exam-card h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.exam-card p { margin-top: 4px; font-size: 13px; color: var(--text2); line-height: 1.5; }
.exam-card .arrow { color: var(--text3); font-size: 18px; }
.badge { font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; background: var(--accent-dim); color: var(--accent); padding: 2px 7px; border-radius: 20px; border: 1px solid rgba(232,194,122,.25); }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../../">← Home</a>
  <header>
    <div class="eyebrow">PA Study App</div>
    <h1>Pick an exam</h1>
    <p>Each exam has its own Learn, Test, and Apply sets.</p>
  </header>
  <div id="exams"></div>
</div>

<!-- The list of exams lives in exams/manifest.js. To add an exam, edit that file — never this one. -->
<script src="exams/manifest.js"></script>
<script>
const list = document.getElementById('exams');
for (const exam of (window.EXAMS || [])) {
  const a = document.createElement('a');
  a.className = 'exam-card';
  a.href = exam.legacy ? 'exams/' + exam.folder + '/' : 'app.html?exam=' + encodeURIComponent(exam.folder);
  a.innerHTML = `<span class="icon">${exam.icon || '📘'}</span>
    <span class="info"><h2></h2><p></p></span>
    <span class="arrow">›</span>`;
  a.querySelector('h2').textContent = exam.title;
  if (exam.badge) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = exam.badge;
    a.querySelector('h2').appendChild(b);
  }
  a.querySelector('p').textContent = exam.description || '';
  list.appendChild(a);
}
</script>
</body>
</html>

oncentrated urine. Which hormone state is most likely?", "choices": ["ADH excess", "ADH deficiency", "Insulin deficiency", "PTH deficiency"], "correct": 0, "exp": "This is SIADH/ADH excess."}]}, {"id": "e08", "name": "8. Endocrine Pharmacology", "hy": true, "cards": [{"title": "Adrenal and thyroid pharmacology", "html": "<p><strong>Hydrocortisone:</strong> glucocorticoid replacement for Addison disease. It is the most bioequivalent steroid and behaves most like cortisol. Dose: 2/3 total daily dose in AM and 1/3 in evening to mimic cortisol awakening response.</p><p><strong>Fludrocortisone:</strong> mineralocorticoid replacement. Dose adequate when patient is not dizzy/presyncopal with usual activities. Both meds are lifelong; patient should not stop them.</p><p><strong>Propranolol/beta blockers:</strong> symptom control in hyperthyroidism; reduce tremor, palpitations, anxiety.</p><p><strong>Methimazole:</strong> preferred antithyroid drug to decrease thyroid hormone production.</p><p><strong>PTU:</strong> antithyroid drug preferred in pregnancy or thyroid storm.</p><p><strong>Levothyroxine:</strong> synthetic T4 replacement. Dose adjusted by TSH. Start low in elderly/cardiac patients. Monitor for over-replacement causing atrial fibrillation/osteoporosis. Take on empty stomach and avoid calcium/iron within 4 hours.</p>", "hy": true}, {"title": "Diabetes pharmacology", "html": "<p><strong>Metformin:</strong> biguanide. MOA: decreases hepatic glucose production and improves insulin sensitivity. Benefits: weight-neutral or mild weight loss, low hypoglycemia risk. Common side effects: GI upset, diarrhea.</p><p><strong>Semaglutide:</strong> GLP-1 receptor agonist. MOA: enhances glucose-dependent insulin secretion, slows gastric emptying, promotes satiety. Benefits: weight loss, cardiovascular benefit, low hypoglycemia risk. Common side effects: nausea, vomiting.</p><p><strong>Empagliflozin:</strong> SGLT2 inhibitor. MOA: increases urinary glucose excretion by blocking kidney reabsorption. Benefits: weight loss, BP lowering, cardiovascular/kidney benefits. Common side effects: dehydration, hypotension.</p><p><strong>Insulin lispro:</strong> replaces or supplements endogenous insulin. Universally effective. Common side effects: hypoglycemia, weight gain.</p>", "hy": true}], "test": [{"q": "Which drug is glucocorticoid replacement for Addison disease?", "choices": ["Hydrocortisone", "Fludrocortisone", "Propranolol", "Metformin"], "correct": 0, "exp": "Hydrocortisone replaces cortisol."}, {"q": "Which drug is mineralocorticoid replacement?", "choices": ["Fludrocortisone", "Hydrocortisone", "Methimazole", "Levothyroxine"], "correct": 0, "exp": "Fludrocortisone replaces mineralocorticoid effect."}, {"q": "What is the hydrocortisone dosing pattern from slides?", "choices": ["2/3 AM, 1/3 evening", "All at night", "Once yearly", "Only PRN"], "correct": 0, "exp": "Slides state 2/3 AM and 1/3 evening."}, {"q": "Which drug reduces tremor, palpitations, and anxiety in hyperthyroidism?", "choices": ["Propranolol", "Levothyroxine", "Insulin", "Acyclovir"], "correct": 0, "exp": "Beta blockers reduce hyperthyroid symptoms."}, {"q": "Which antithyroid drug is preferred generally?", "choices": ["Methimazole", "PTU", "Levothyroxine", "Semaglutide"], "correct": 0, "exp": "Slides state methimazole preferred."}, {"q": "Which antithyroid drug is preferred in pregnancy or thyroid storm?", "choices": ["PTU", "Methimazole", "Fludrocortisone", "Insulin"], "correct": 0, "exp": "Slides state PTU preferred in pregnancy or thyroid storm."}, {"q": "Which medication is synthetic T4?", "choices": ["Levothyroxine", "Methimazole", "Propranolol", "Empagliflozin"], "correct": 0, "exp": "Levothyroxine is synthetic T4."}, {"q": "Which diabetes drug decreases hepatic glucose production and improves insulin sensitivity?", "choices": ["Metformin", "Semaglutide", "Empagliflozin", "Insulin"], "correct": 0, "exp": "This is metformin."}, {"q": "Which diabetes drug slows gastric emptying and promotes satiety?", "choices": ["Semaglutide", "Metformin", "Empagliflozin", "Hydrocortisone"], "correct": 0, "exp": "Semaglutide is a GLP-1 receptor agonist."}, {"q": "Which diabetes drug increases urinary glucose excretion?", "choices": ["Empagliflozin", "Semaglutide", "Metformin", "Levothyroxine"], "correct": 0, "exp": "Empagliflozin blocks renal glucose reabsorption."}, {"q": "Which drug commonly causes hypoglycemia and weight gain?", "choices": ["Insulin", "Metformin", "Semaglutide", "Empagliflozin"], "correct": 0, "exp": "Insulin can cause hypoglycemia and weight gain."}], "apply": [{"q": "A patient with Addison disease takes hydrocortisone but remains dizzy during usual activity. Which medication targets that problem?", "choices": ["Fludrocortisone", "Methimazole", "Levothyroxine", "Semaglutide"], "correct": 0, "exp": "Fludrocortisone treats mineralocorticoid deficiency; adequacy is judged by lack of dizziness/presyncope."}, {"q": "A patient with hyperthyroidism has tremor, palpitations, and anxiety. Which medication provides symptom control?", "choices": ["Propranolol", "Levothyroxine", "Hydrocortisone", "Insulin"], "correct": 0, "exp": "Beta blockers reduce tremor, palpitations, and anxiety."}, {"q": "A pregnant patient has hyperthyroidism requiring antithyroid medication. Which drug is preferred in the slides?", "choices": ["PTU", "Methimazole", "Levothyroxine", "Empagliflozin"], "correct": 0, "exp": "PTU is preferred in pregnancy or thyroid storm."}, {"q": "An elderly patient with cardiac disease starts hypothyroidism treatment. What approach is emphasized?", "choices": ["Start levothyroxine low and monitor TSH", "Start maximum levothyroxine dose", "Take levothyroxine with iron", "Avoid monitoring"], "correct": 0, "exp": "Slides: start low in elderly/cardiac patients and adjust by TSH."}, {"q": "A patient with T2DM wants a medication with weight loss and cardiovascular benefit that causes nausea/vomiting. Which one matches?", "choices": ["Semaglutide", "Insulin", "Hydrocortisone", "Fludrocortisone"], "correct": 0, "exp": "Semaglutide has weight loss/CV benefit and nausea/vomiting."}, {"q": "A patient starts empagliflozin and develops dehydration/hypotension. Which mechanism explains this risk?", "choices": ["Urinary glucose excretion through kidney glucose reabsorption blockade", "Increased cortisol", "Increased T4", "PTH activation"], "correct": 0, "exp": "SGLT2 blockade increases urinary glucose excretion and can cause dehydration/hypotension."}]}, {"id": "e09", "name": "9. Untreated Endocrine Disease Complications", "hy": true, "cards": [{"title": "Thyroid and diabetes complications", "html": "<p><strong>Pregnancy:</strong> thyroid hormone is required for normal fetal growth and nervous system development. The immature fetal thyroid cannot produce T4, so the mother transfers T4 to fetus through placenta. Prenatal monitoring prevents congenital hypothyroidism.</p><p><strong>Thyroid emergencies:</strong> severe prolonged untreated hypothyroidism can cause myxedema coma. Severe hyperthyroidism can cause thyroid storm after long-standing disease or suddenly.</p><p><strong>DKA:</strong> severe insulin deficiency → fat breakdown → ketone buildup → metabolic acidosis. Symptoms: nausea, vomiting, abdominal pain, fruity breath, confusion, rapid breathing.</p><p><strong>HHS:</strong> severe hyperglycemia without ketosis because there is barely enough insulin; causes dehydration and altered mental status.</p><p><strong>Severe hypoglycemia:</strong> often from overtreatment/too much insulin; can cause seizures and coma.</p><p><strong>Chronic diabetes complications:</strong> microvascular = neuropathy, nephropathy, retinopathy. Macrovascular = cardiovascular disease/heart attack/stroke and PAD causing poor circulation, limb ischemia, amputation.</p>", "hy": true}], "test": [{"q": "What severe complication can untreated hypothyroidism cause?", "choices": ["Myxedema coma", "Thyroid storm", "DKA", "HHS"], "correct": 0, "exp": "Slides state severe untreated hypothyroidism can cause myxedema coma."}, {"q": "What severe complication can untreated hyperthyroidism cause?", "choices": ["Thyroid storm", "Myxedema coma", "GBS", "SIADH"], "correct": 0, "exp": "Slides state severe hyperthyroidism can cause thyroid storm."}, {"q": "What is the main pathophysiology of DKA?", "choices": ["Severe insulin deficiency → fat breakdown → ketone buildup → metabolic acidosis", "Excess ADH → hyponatremia", "High T4 → tachycardia", "Low PTH → hypocalcemia"], "correct": 0, "exp": "Slides define DKA this way."}, {"q": "Which complication is severe hyperglycemia without ketosis?", "choices": ["HHS", "DKA", "Myxedema coma", "Thyroid storm"], "correct": 0, "exp": "HHS has severe hyperglycemia without ketosis."}, {"q": "What can severe hypoglycemia cause?", "choices": ["Seizures and coma", "Hyperreflexia only", "Goiter", "Moon face"], "correct": 0, "exp": "Slides state severe hypoglycemia can lead to seizures/coma."}, {"q": "Which diabetic complication causes numbness, burning pain, and foot ulcers?", "choices": ["Neuropathy", "Nephropathy", "Retinopathy", "CVD"], "correct": 0, "exp": "Slides list these for neuropathy."}, {"q": "Which diabetic complication causes kidney damage, proteinuria, and ESRD progression?", "choices": ["Nephropathy", "Neuropathy", "Retinopathy", "PAD"], "correct": 0, "exp": "Slides list nephropathy."}, {"q": "Which diabetic complication causes vision loss/blindness?", "choices": ["Retinopathy", "Neuropathy", "Nephropathy", "HHS"], "correct": 0, "exp": "Slides list retinopathy."}], "apply": [{"q": "A patient with untreated severe hypothyroidism becomes critically ill. Which emergency is the concern?", "choices": ["Myxedema coma", "Thyroid storm", "DKA", "SAH"], "correct": 0, "exp": "Untreated hypothyroidism can cause myxedema coma."}, {"q": "A patient with long-standing untreated hyperthyroidism suddenly worsens. Which emergency is the concern?", "choices": ["Thyroid storm", "Myxedema coma", "HHS only", "SIADH"], "correct": 0, "exp": "Severe hyperthyroidism can cause thyroid storm."}, {"q": "A T1DM patient stops insulin and develops abdominal pain, fruity breath, confusion, and rapid breathing. What complication fits?", "choices": ["DKA", "HHS", "SIADH", "Cushing"], "correct": 0, "exp": "These are DKA symptoms from slides."}, {"q": "A T2DM patient has severe hyperglycemia, dehydration, altered mental status, and no ketosis. What complication fits?", "choices": ["HHS", "DKA", "Myxedema coma", "Addison disease"], "correct": 0, "exp": "HHS features severe hyperglycemia without ketosis."}, {"q": "A diabetic patient develops numbness, burning pain, and foot ulcers. What chronic complication is this?", "choices": ["Neuropathy", "Retinopathy", "Nephropathy", "PAD"], "correct": 0, "exp": "These findings match neuropathy."}, {"q": "A diabetic patient develops poor circulation, limb ischemia, and amputation risk. What macrovascular complication is this?", "choices": ["Peripheral arterial disease", "Retinopathy", "Nephropathy", "Hypoglycemia"], "correct": 0, "exp": "PAD causes poor circulation, limb ischemia, amputation risk."}]}, {"id": "e10", "name": "10. Integrated Endocrine Clinical Reasoning", "hy": true, "cards": [{"title": "How to reason through endocrine cases", "html": "<p>Step 1: Identify the hormone system from symptoms.</p><p>Step 2: Decide excess versus deficiency.</p><p>Step 3: Use paired labs: gland hormone plus trophic hormone.</p><p>Step 4: Localize primary, secondary, or tertiary dysfunction.</p><p>Step 5: Match treatment to pathophysiology: replace missing hormones, block excessive hormone effects/production, or manage complications.</p><p>Step 6: Always consider medication effects first, especially steroids, thyroid medications, amiodarone, lithium, antithyroid drugs, SSRIs, lithium, insulin, or other antihyperglycemics.</p>", "hy": true}], "test": [{"q": "What two hormone levels should be checked to localize many endocrine disorders?", "choices": ["Gland hormone and trophic hormone", "Only sodium", "Only glucose", "Only CBC"], "correct": 0, "exp": "Slides emphasize checking gland hormone + trophic hormone."}, {"q": "What should be considered first in endocrine dysfunction?", "choices": ["Medication effects", "Only rare genetic disease", "Only infection", "Only surgery"], "correct": 0, "exp": "Slides: always consider medication effects first."}, {"q": "Why do secondary/tertiary causes often produce broader patterns?", "choices": ["They may affect multiple axes", "They only affect one target gland", "They never affect hormones", "They only affect CSF"], "correct": 0, "exp": "Pituitary/hypothalamic problems often affect multiple axes."}, {"q": "What does patient-centered endocrine management require?", "choices": ["Connecting symptoms, labs, pathophysiology, meds, and complications", "Memorizing one symptom only", "Avoiding medications", "Ignoring labs"], "correct": 0, "exp": "Integrated reasoning requires symptoms/labs/pathophysiology/meds/complications."}], "apply": [{"q": "A patient has low cortisol and high ACTH with fatigue, hypoglycemia, hypotension, and syncope tendency. What is the most likely level and treatment direction?", "choices": ["Primary adrenal failure; glucocorticoid and mineralocorticoid replacement", "Pituitary hyperfunction; beta blocker only", "Primary thyroid failure; levothyroxine only", "SIADH; insulin"], "correct": 0, "exp": "This is Addison disease: low cortisol/high ACTH with replacement therapy."}, {"q": "A patient has high thyroid hormone with tremor, palpitations, and anxiety. What is a patient-centered early medication choice for symptom relief?", "choices": ["Propranolol", "Fludrocortisone", "Insulin", "Desmopressin"], "correct": 0, "exp": "Beta blockers reduce tremor, palpitations, and anxiety in hyperthyroidism."}, {"q": "A patient has polyuria and hypernatremia after pituitary surgery. Which treatment matches central DI?", "choices": ["Desmopressin", "Fluid restriction", "Methimazole", "Hydrocortisone"], "correct": 0, "exp": "Central DI is treated with desmopressin."}, {"q": "A diabetic patient has blurred vision and poor wound healing. Which disease mechanism is most consistent?", "choices": ["T2DM insulin resistance with relative insulin deficiency", "ADH excess", "Cortisol deficiency", "T3/T4 excess only"], "correct": 0, "exp": "T2DM symptoms include blurred vision and poor wound healing."}]}]}, "id": {"title": "Infectious Disease", "desc": "14 sections mapped to the Microbiology & Immunology objectives. Learn is complete slide-grounded review; Test is direct recall with no vignettes; Apply is PANCE-style practice.", "topics": [{"id": "i01", "name": "1. Pathogen Classification: Cellular vs Acellular", "hy": true, "cards": [{"title": "Big picture classification", "html": "<p><strong>Cellular/living pathogens</strong> have cytoplasm, generate energy metabolism, perform protein synthesis, contain both DNA and RNA, and replicate independently. These include <strong>helminths, protozoa, fungi, and bacteria</strong>.</p><p><strong>Acellular/non-living pathogens</strong> do not function as cells and do not independently replicate. These include <strong>viruses</strong> and <strong>prions</strong>.</p>", "hy": true}, {"title": "Nucleic acid by pathogen type", "html": "<ul><li><strong>Helminths:</strong> eukaryotic cellular organisms; contain DNA and RNA.</li><li><strong>Protozoa:</strong> eukaryotic cellular organisms; contain DNA and RNA.</li><li><strong>Fungi:</strong> eukaryotic cellular organisms; contain DNA and RNA.</li><li><strong>Bacteria:</strong> prokaryotic cellular organisms; contain DNA and RNA.</li><li><strong>Viruses:</strong> acellular; contain <strong>either DNA or RNA</strong>, not both.</li><li><strong>Prions:</strong> acellular protein; contain <strong>neither DNA nor RNA</strong>.</li></ul>", "hy": true}], "test": [{"q": "Which pathogens are cellular/living?", "choices": ["Helminths, protozoa, fungi, bacteria", "Viruses and prions", "Viruses only", "Prions only"], "correct": 0, "exp": "Cellular pathogens include helminths, protozoa, fungi, and bacteria."}, {"q": "Which pathogens are acellular/non-living?", "choices": ["Bacteria and fungi", "Protozoa and helminths", "Viruses and prions", "Fungi and viruses"], "correct": 2, "exp": "Viruses and prions are acellular."}, {"q": "Which pathogen contains either DNA or RNA, but not both?", "choices": ["Bacteria", "Virus", "Prion", "Fungus"], "correct": 1, "exp": "Viruses contain either DNA or RNA."}, {"q": "Which pathogen contains neither DNA nor RNA?", "choices": ["Prion", "Virus", "Bacterium", "Protozoan"], "correct": 0, "exp": "Prions are protein-only and contain no nucleic acid."}, {"q": "Which cellular pathogen is prokaryotic?", "choices": ["Bacteria", "Fungi", "Protozoa", "Helminths"], "correct": 0, "exp": "Bacteria are prokaryotic cellular organisms."}, {"q": "Which cellular pathogens are eukaryotic?", "choices": ["Helminths, protozoa, fungi", "Bacteria only", "Viruses and prions", "Bacteria and viruses"], "correct": 0, "exp": "Helminths, protozoa, and fungi are eukaryotic."}], "apply": [{"q": "A pathogen has cytoplasm, performs protein synthesis, contains both DNA and RNA, and replicates independently. Which category best fits?", "choices": ["Cellular pathogen", "Acellular pathogen", "Prion", "Virus only"], "correct": 0, "exp": "Those are cellular/living pathogen features."}, {"q": "A pathogen is acellular and requires a host for replication, but contains nucleic acid. What is it?", "choices": ["Virus", "Prion", "Bacterium", "Helminth"], "correct": 0, "exp": "Viruses are acellular and contain either DNA or RNA."}, {"q": "An infectious agent is a misfolded protein with no nucleic acid. What is it?", "choices": ["Prion", "Virus", "Fungus", "Protozoan"], "correct": 0, "exp": "Prions are acellular protein infectious agents with no nucleic acid."}]}, {"id": "i02", "name": "2. Prions", "hy": true, "cards": [{"title": "Prion pathophysiology", "html": "<p><strong>Prion</strong> means protein + infection. Prions are misfolded protein material that cause disease through accumulation. They have no nucleic material and no metabolic processes.</p><p>When abnormal prion protein (<strong>PrPsc</strong>) enters normal tissue, it induces healthy proteins (<strong>PrPc</strong>) to convert into irregular prion proteins. This causes accumulating prions until disease and death occur.</p>", "hy": true}, {"title": "Clinical course and outcome", "html": "<p>All currently known mammalian prion diseases affect <strong>neural tissue</strong>. They form vacuoles giving a <strong>spongy</strong> appearance and amyloid plaques.</p><p>Prion diseases have <strong>long incubation periods</strong>, are <strong>untreatable</strong>, and are <strong>fatal</strong>.</p><p>Examples of transmissible spongiform encephalopathies include scrapie, bovine spongiform encephalopathy, chronic wasting disease, Kuru-Kuru, Creutzfeldt-Jakob disease, Gerstmann-Straussler-Scheinker syndrome, and familial fatal insomnia.</p>", "hy": true}, {"title": "Why prions are hard to destroy", "html": "<p>Prions are extremely stable and resist denaturation. They are heat resistant, radiation resistant, and resistant to proteases.</p><p>Because prions do not have nucleic acid, they cannot simply be sterilized and denatured in the standard fashion. Partially denatured prions may renature and become infectious again.</p>", "hy": true}], "test": [{"q": "What are prions made of?", "choices": ["Misfolded protein", "DNA virus", "RNA virus", "Peptidoglycan"], "correct": 0, "exp": "Prions are misfolded infectious protein material."}, {"q": "Do prions contain nucleic acid?", "choices": ["Yes, DNA only", "Yes, RNA only", "Yes, both DNA and RNA", "No"], "correct": 3, "exp": "Prions contain no nucleic acid."}, {"q": "What tissue is affected by known mammalian prion diseases?", "choices": ["Neural tissue", "Skin only", "Red blood cells", "Bone marrow only"], "correct": 0, "exp": "Known mammalian prion diseases affect neural tissue."}, {"q": "What appearance do prions create in affected tissue?", "choices": ["Spongy appearance with vacuoles and amyloid plaques", "Gram-positive purple rods", "Pseudohyphae", "Kidney-bean diplococci"], "correct": 0, "exp": "Prions form vacuoles giving spongy appearance and amyloid plaques."}, {"q": "What is the clinical outcome of prion disease?", "choices": ["Fatal", "Always self-limited", "Curable with antibiotics", "Only latent"], "correct": 0, "exp": "Prion diseases are untreatable and fatal."}, {"q": "Which methods do prions resist?", "choices": ["Heat, radiation, proteases", "Only cold temperature", "Only oxygen", "Only Gram stain"], "correct": 0, "exp": "Prions resist heat, radiation, and proteases."}, {"q": "Why are standard sterilization methods inadequate for prions?", "choices": ["Prions lack nucleic acid and resist denaturation", "Prions are Gram negative", "Prions are obligate anaerobes", "Prions contain chitin"], "correct": 0, "exp": "They have no nucleic acid and resist standard denaturation."}], "apply": [{"q": "A patient has a long incubation neurodegenerative disease with spongiform neural tissue changes and no effective treatment. Which pathogen type is most likely?", "choices": ["Prion", "Protozoan", "Fungus", "Helminth"], "correct": 0, "exp": "Long incubation, spongiform neural tissue, fatal course = prion disease."}, {"q": "A lab attempts standard heat sterilization on infectious protein material, but infectivity persists. Which feature explains this?", "choices": ["Prion resistance to heat and denaturation", "Viral envelope fragility", "Bacterial peptidoglycan", "Fungal ergosterol"], "correct": 0, "exp": "Prions are extremely stable and heat resistant."}, {"q": "An infectious protein converts normal PrPc into abnormal PrPsc, leading to accumulation and death. What disease mechanism is this?", "choices": ["Prion disease pathophysiology", "Viral productive infection", "Bacterial binary fission", "Protozoal cyst transmission"], "correct": 0, "exp": "This is the core prion mechanism."}]}, {"id": "i03", "name": "3. Viruses: Structure, Entry, Infection, Disease, Evasion", "hy": true, "cards": [{"title": "Core viral characteristics", "html": "<p>Viruses can infect all life forms, from bacteria to humans. They are extremely small, about 1/100th the size of a bacterium, and are the most abundant pathogen.</p><p>Viruses are <strong>obligate intracellular parasites</strong>. They rely on host cells for replication and protein synthesis, have no self metabolic processes, and assemble within host cells. Some require another virus; for example, hepatitis D relies on hepatitis B for replication in a host.</p>", "hy": true}, {"title": "Viral structure and stability", "html": "<p>Basic viral structure consists of nucleic acid, either DNA or RNA, wrapped in a protein capsid. This is the <strong>nucleocapsid</strong>.</p><p>The nucleocapsid may be covered by an outer lipid envelope.</p><p><strong>Non-enveloped viruses</strong> are generally more environmentally stable and are often fecal-oral.</p><p><strong>Enveloped viruses</strong> are generally less stable in the environment and are often transmitted through respiratory, genital, or parenteral routes.</p>", "hy": true}, {"title": "Viral entry mechanisms", "html": "<p>Viruses enter cells by <strong>endocytosis</strong>, <strong>fusion</strong>, or <strong>direct penetration</strong>.</p><ul><li><strong>Endocytosis:</strong> receptor-mediated endocytosis or pinocytosis. Used by non-enveloped viruses. Examples from slides: hepatitis C and polio.</li><li><strong>Fusion:</strong> enveloped viruses fuse with the host membrane. Examples: HIV and HSV.</li><li><strong>Direct penetration:</strong> less common, no envelope. Examples: myovirus/bacteriophages and RNA viruses.</li></ul>", "hy": true}, {"title": "Inside the cell: productive vs latent", "html": "<p>Inside the host cell, the virus releases its nucleic acid.</p><p><strong>Productive infection:</strong> virus immediately uses host cellular machinery to replicate.</p><p><strong>Latent infection:</strong> virus integrates into host cell and lies dormant.</p>", "hy": true}, {"title": "How viruses cause disease and evade host", "html": "<p>Viruses cause disease in different ways:</p><ul><li>Lyse host cells, such as influenza.</li><li>Cause host immune response that leads to disease, such as hepatitis B.</li><li>Cause neoplastic transformation of host cells, such as HPV; these are oncogenic.</li></ul><p>Viruses evade the host by multiplying inside host cells to hide from extracellular immune defenses, infecting adjacent cells through intercellular bridges, persisting inactive for prolonged periods such as herpes, and using gene rearrangements to create new strains such as influenza.</p>", "hy": true}], "test": [{"q": "Viruses are obligate what?", "choices": ["Intracellular parasites", "Free-living cells", "Eukaryotic worms", "Proteins only"], "correct": 0, "exp": "Viruses are obligate intracellular parasites."}, {"q": "Do viruses have self metabolic processes?", "choices": ["Yes", "No", "Only enveloped viruses", "Only DNA viruses"], "correct": 1, "exp": "Viruses have no self metabolic processes."}, {"q": "What is the nucleocapsid?", "choices": ["Nucleic acid plus protein capsid", "Peptidoglycan plus LPS", "Chitin plus ergosterol", "Protein without nucleic acid"], "correct": 0, "exp": "Nucleocapsid is viral nucleic acid wrapped in capsid."}, {"q": "Which viral type is generally more environmentally stable?", "choices": ["Non-enveloped", "Enveloped", "Latent only", "Oncogenic only"], "correct": 0, "exp": "Non-enveloped viruses are generally more stable."}, {"q": "Which route is often associated with non-enveloped viruses?", "choices": ["Fecal-oral", "Genital only", "Parenteral only", "Vector only"], "correct": 0, "exp": "Non-enveloped viruses are often fecal-oral."}, {"q": "Which entry mechanism is used by enveloped viruses?", "choices": ["Fusion", "Direct penetration only", "Gram stain", "Binary fission"], "correct": 0, "exp": "Enveloped viruses can enter by fusion."}, {"q": "Which entry mechanism is less common and non-enveloped?", "choices": ["Direct penetration", "Fusion", "Budding", "Hyphae extension"], "correct": 0, "exp": "Slides list direct penetration as less common and non-enveloped."}, {"q": "What is productive viral infection?", "choices": ["Immediate replication using host machinery", "Dormancy in host cell", "No host cell entry", "Protein-only conversion"], "correct": 0, "exp": "Productive infection immediately uses host machinery for replication."}, {"q": "What is latent viral infection?", "choices": ["Integration/dormancy in host cell", "Immediate lysis only", "Binary fission", "No nucleic acid"], "correct": 0, "exp": "Latent infection lies dormant after integration."}, {"q": "Which virus example causes disease by host cell lysis?", "choices": ["Influenza", "Hepatitis B", "HPV", "CJD"], "correct": 0, "exp": "Slides use influenza for host cell lysis."}, {"q": "Which virus example can cause disease through immune response?", "choices": ["Hepatitis B", "Polio", "Myovirus", "Rabies IgG"], "correct": 0, "exp": "Slides use hepatitis B for host immune response-mediated disease."}, {"q": "Which virus example is oncogenic?", "choices": ["HPV", "Influenza", "HSV only", "Hepatitis D only"], "correct": 0, "exp": "HPV can cause neoplastic transformation."}, {"q": "Which virus evasion example involves gene rearrangements producing new strains?", "choices": ["Influenza", "Herpes", "HPV", "Polio"], "correct": 0, "exp": "Slides use influenza for gene rearrangements/new strains."}], "apply": [{"q": "A non-enveloped fecal-oral virus enters a cell through receptor-mediated endocytosis. Which slide example fits?", "choices": ["Polio", "HIV", "HSV", "Prion"], "correct": 0, "exp": "Polio is a non-enveloped virus listed under endocytosis."}, {"q": "An enveloped virus enters by fusion with the host cell membrane. Which example fits?", "choices": ["HIV", "Polio", "Myovirus", "Prion"], "correct": 0, "exp": "HIV and HSV are enveloped fusion examples."}, {"q": "A virus integrates into host cells and remains dormant for years. Which infection type is this?", "choices": ["Latent infection", "Productive infection", "Bacterial colonization", "Prion conversion"], "correct": 0, "exp": "Latent infection lies dormant in host cells."}, {"q": "A virus immediately uses host machinery to make new viral particles. Which infection type is this?", "choices": ["Productive infection", "Latent infection", "Cyst stage", "Trophozoite stage"], "correct": 0, "exp": "Productive infection immediately replicates using host machinery."}, {"q": "A virus causes cervical cancer through neoplastic transformation. Which slide example fits?", "choices": ["HPV", "Influenza", "Polio", "Hepatitis D"], "correct": 0, "exp": "HPV is the slide example for neoplastic transformation/oncogenic virus."}, {"q": "A virus persists inactive for prolonged periods and later reactivates. Which slide example fits?", "choices": ["Herpes", "Influenza", "Bacteriophage", "Prion"], "correct": 0, "exp": "Herpes is the slide example for inactive persistence."}]}, {"id": "i04", "name": "4. Protozoa", "hy": true, "cards": [{"title": "Four protozoan groups", "html": "<p>Protozoans are classified by locomotion.</p><ul><li><strong>Amoebas:</strong> foot-like movement. Example: <em>Entamoeba histolytica</em> → amoebic dysentery.</li><li><strong>Sporozoans/apicomplexans:</strong> glide-like movement. Example: <em>Plasmodium falciparum</em> → malaria.</li><li><strong>Flagellates:</strong> tail-like movement. Example: <em>Giardia lamblia</em> → giardiasis.</li><li><strong>Ciliates:</strong> hair-like movement. Example: <em>Balantidium coli</em> → balantidial dysentery.</li></ul>", "hy": true}, {"title": "Protozoan life-cycle forms", "html": "<p>Understanding the protozoan life-cycle helps predict clinical presentation, transmission, diagnosis, and treatment.</p><p><strong>Trophozoite:</strong> active form; motile, feeding, reproducing; surrounded by flexible cell membrane.</p><p><strong>Cyst:</strong> dormant form; nonmotile, nonmetabolizing, nonreproducing; surrounded by thick protective wall. Cysts survive well outside the host and are often implicated in transmission.</p>", "hy": true}], "test": [{"q": "Which protozoan group moves by foot-like movement?", "choices": ["Amoebas", "Sporozoans", "Flagellates", "Ciliates"], "correct": 0, "exp": "Amoebas use foot-like movement."}, {"q": "Which protozoan group moves by glide-like movement?", "choices": ["Sporozoans/apicomplexans", "Amoebas", "Flagellates", "Ciliates"], "correct": 0, "exp": "Sporozoans/apicomplexans use glide-like movement."}, {"q": "Which protozoan group moves by tail-like movement?", "choices": ["Flagellates", "Ciliates", "Sporozoans", "Amoebas"], "correct": 0, "exp": "Flagellates use tail-like movement."}, {"q": "Which protozoan group moves by hair-like movement?", "choices": ["Ciliates", "Flagellates", "Amoebas", "Sporozoans"], "correct": 0, "exp": "Ciliates use hair-like movement."}, {"q": "Which protozoan causes amoebic dysentery?", "choices": ["Entamoeba histolytica", "Giardia lamblia", "Balantidium coli", "Plasmodium falciparum"], "correct": 0, "exp": "Entamoeba histolytica causes amoebic dysentery."}, {"q": "Which protozoan causes malaria?", "choices": ["Plasmodium falciparum", "Giardia lamblia", "Balantidium coli", "Entamoeba histolytica"], "correct": 0, "exp": "Plasmodium falciparum causes malaria."}, {"q": "Which protozoan causes giardiasis?", "choices": ["Giardia lamblia", "Balantidium coli", "Plasmodium falciparum", "Taenia solium"], "correct": 0, "exp": "Giardia lamblia causes giardiasis."}, {"q": "Which protozoan causes balantidial dysentery?", "choices": ["Balantidium coli", "Giardia lamblia", "Entamoeba histolytica", "Schistosoma"], "correct": 0, "exp": "Balantidium coli causes balantidial dysentery."}, {"q": "Which protozoan form is active, motile, feeding, and reproducing?", "choices": ["Trophozoite", "Cyst", "Egg", "Larva"], "correct": 0, "exp": "Trophozoite is the active form."}, {"q": "Which protozoan form survives well in the environment and is often involved in transmission?", "choices": ["Cyst", "Trophozoite", "Adult worm", "Viral envelope"], "correct": 0, "exp": "Cyst is dormant and environmentally stable."}], "apply": [{"q": "A stool O&P identifies motile, feeding protozoal forms. What form is being seen?", "choices": ["Trophozoites", "Cysts", "Larvae", "Ova only"], "correct": 0, "exp": "Trophozoites are active/motile/feeding."}, {"q": "A protozoan survives outside the host due to a thick protective wall. What form is this?", "choices": ["Cyst", "Trophozoite", "Adult helminth", "Viral capsid"], "correct": 0, "exp": "Cysts have thick protective walls and survive in the environment."}, {"q": "A patient has giardiasis. Which protozoan group and locomotion apply?", "choices": ["Flagellate, tail-like", "Amoeba, foot-like", "Ciliate, hair-like", "Sporozoan, glide-like"], "correct": 0, "exp": "Giardia lamblia is a flagellate with tail-like movement."}, {"q": "A patient has malaria. Which protozoan group and example fit?", "choices": ["Sporozoan/apicomplexan; Plasmodium falciparum", "Ciliate; Balantidium coli", "Flagellate; Giardia", "Amoeba; Entamoeba"], "correct": 0, "exp": "Plasmodium falciparum is a sporozoan/apicomplexan causing malaria."}]}, {"id": "i05", "name": "5. Helminths", "hy": true, "cards": [{"title": "Helminth basics and life-cycle", "html": "<p>Helminths are multicellular organisms. They are a common cause of disease in the developing world and less common in the United States.</p><p>Many involve a <strong>definitive host</strong> and an <strong>intermediary host</strong>.</p><p>General life-cycle: <strong>egg → larva → adult</strong>.</p><p>Two broad groupings: <strong>flatworms</strong> (tapeworms and flukes) and <strong>nematodes/roundworms</strong>.</p>", "hy": true}, {"title": "Tapeworms, flukes, nematodes", "html": "<p><strong>Tapeworms</strong> such as <em>Taenia solium</em>: scolex/head plus flat body with multiple <strong>proglottids</strong> (segments). Attach to intestines with suckers on the head. New proglottids grow near the scolex. Distal proglottids produce eggs that are shed in feces.</p><p><strong>Flukes</strong> such as <em>Schistosoma</em> species/blood flukes: no pathogenic flukes are endemic in the United States. Common in tropical areas such as Southeast Asia.</p><p><strong>Nematodes/roundworms</strong>: cylindrical, unsegmented body with complete digestive tract from mouth to anus. Separate sexes; female usually larger than male. Intestinal examples: <em>Enterobius, Ascaris, Ancylostoma, Strongyloides</em>. Tissue nematode/filarial worm example: <em>Onchocerca</em>.</p>", "hy": true}], "test": [{"q": "What is the general helminth life-cycle?", "choices": ["Egg → larva → adult", "Trophozoite → cyst", "Capsid → envelope", "Gram stain → culture"], "correct": 0, "exp": "Slides list egg, larva, adult."}, {"q": "Which helminths are flatworms?", "choices": ["Tapeworms and flukes", "Nematodes only", "Protozoa and fungi", "Viruses and prions"], "correct": 0, "exp": "Flatworms include tapeworms and flukes."}, {"q": "Which helminths are roundworms?", "choices": ["Nematodes", "Tapeworms", "Flukes", "Amoebas"], "correct": 0, "exp": "Nematodes are roundworms."}, {"q": "What is the head of a tapeworm called?", "choices": ["Scolex", "Proglottid", "Hypha", "Cyst"], "correct": 0, "exp": "Tapeworm head = scolex."}, {"q": "What are tapeworm segments called?", "choices": ["Proglottids", "Cilia", "Flagella", "Conidia"], "correct": 0, "exp": "Tapeworm body has multiple proglottids."}, {"q": "Which example is a tapeworm?", "choices": ["Taenia solium", "Schistosoma", "Ascaris", "Giardia"], "correct": 0, "exp": "Taenia solium is a tapeworm."}, {"q": "Which example is a fluke?", "choices": ["Schistosoma", "Taenia", "Ascaris", "Enterobius"], "correct": 0, "exp": "Schistosoma species are blood flukes."}, {"q": "Which helminth group has a cylindrical unsegmented body and complete digestive tract?", "choices": ["Nematodes", "Tapeworms", "Flukes", "Ciliates"], "correct": 0, "exp": "Nematodes have cylindrical unsegmented bodies with mouth-to-anus digestive tract."}, {"q": "Which is an intestinal nematode example?", "choices": ["Ascaris", "Taenia", "Schistosoma", "Balantidium"], "correct": 0, "exp": "Ascaris is an intestinal nematode."}, {"q": "Which is a tissue nematode/filarial worm example?", "choices": ["Onchocerca", "Taenia", "Schistosoma", "Giardia"], "correct": 0, "exp": "Onchocerca is a tissue nematode/filarial worm."}], "apply": [{"q": "A parasite has a scolex with suckers and proglottids that release eggs into feces. Which helminth type is this?", "choices": ["Tapeworm", "Fluke", "Nematode", "Protozoan cyst"], "correct": 0, "exp": "Scolex + proglottids = tapeworm."}, {"q": "A parasite is a blood fluke and is common in tropical areas such as Southeast Asia. Which example fits?", "choices": ["Schistosoma", "Taenia solium", "Ascaris", "Enterobius"], "correct": 0, "exp": "Schistosoma species are flukes and common in tropical areas."}, {"q": "A worm is cylindrical, unsegmented, has separate sexes, and a complete digestive tract. Which group is it?", "choices": ["Nematode", "Tapeworm", "Fluke", "Amoeba"], "correct": 0, "exp": "This describes nematodes/roundworms."}, {"q": "A child has an intestinal roundworm infection. Which example belongs to that group?", "choices": ["Enterobius", "Taenia solium", "Schistosoma", "Cryptococcus"], "correct": 0, "exp": "Enterobius is an intestinal nematode."}]}, {"id": "i06", "name": "6. Ova and Parasite Testing", "hy": true, "cards": [{"title": "Clinical test for protozoa and helminths", "html": "<p>The clinical test used to identify protozoans and helminths is <strong>O&P</strong>, meaning <strong>ova and parasites</strong>.</p><p>It is typically performed on <strong>stool specimens</strong>.</p><p>O&P looks for <strong>ova/eggs</strong>, <strong>cysts/trophozoites</strong>, <strong>larvae</strong>, and <strong>adult parasites</strong>.</p>", "hy": true}], "test": [{"q": "What clinical test identifies protozoans and helminths?", "choices": ["O&P", "Gram stain", "KOH prep", "Acid-fast stain"], "correct": 0, "exp": "O&P stands for ova and parasites."}, {"q": "What specimen is O&P typically performed on?", "choices": ["Stool", "Blood only", "CSF only", "Sputum only"], "correct": 0, "exp": "Slides state O&P is typically performed on stool specimens."}, {"q": "What does O&P look for?", "choices": ["Ova, cysts/trophozoites, larvae, adult parasites", "Only bacteria", "Only viral envelopes", "Only prions"], "correct": 0, "exp": "O&P looks for ova, cysts/trophozoites, larvae, adult parasites."}, {"q": "What does ova mean in O&P?", "choices": ["Eggs", "Hyphae", "Capsids", "Antibodies"], "correct": 0, "exp": "Ova are eggs."}], "apply": [{"q": "A patient with suspected Giardia infection has stool sent for ova and parasites. Which forms might the test detect?", "choices": ["Cysts/trophozoites", "Gram-positive cocci", "Viral envelopes", "PrPsc only"], "correct": 0, "exp": "O&P can identify cysts/trophozoites for protozoa."}, {"q": "A stool test identifies eggs and larvae. Which category of infection is being evaluated?", "choices": ["Helminth/protozoal parasite infection", "Prion disease", "Viral latency", "Fungal mold only"], "correct": 0, "exp": "O&P detects parasite ova/eggs, larvae, adult parasites, and cysts/trophozoites."}]}, {"id": "i07", "name": "7. Fungi", "hy": true, "cards": [{"title": "Fungal cell wall and antifungal relevance", "html": "<p>Fungi have rigid cell walls containing <strong>chitin</strong> and polysaccharides. Their membranes contain <strong>ergosterol</strong>.</p><p>These structures matter because antifungal medications can target fungal cell wall or membrane components while avoiding human cell targets as much as possible.</p><p>Fungi are visualized on optical microscopy and are resistant to KOH, so <strong>KOH prep</strong> is used clinically.</p>", "hy": true}, {"title": "Growth, oxygen, and nutrition", "html": "<p>Fungi proliferate by <strong>budding</strong>, <strong>hyphae</strong>, and/or <strong>spore formation</strong>.</p><p>Most medically important fungi reproduce asexually.</p><p>Most fungi are <strong>obligate aerobes</strong>. Some are <strong>facultative anaerobes</strong>. <strong>None are obligate anaerobes</strong>.</p><p>All fungi need an organic carbon source, such as decaying matter. Their natural habitat is the environment.</p>", "hy": true}, {"title": "Forms and examples", "html": "<ul><li><strong>Yeast form:</strong> round/ovoid single cells that reproduce by budding. Examples: <em>Candida</em>, <em>Cryptococcus</em>.</li><li><strong>Mold form:</strong> tubular hyphae that grow by extension. Examples: <em>Aspergillus</em>, zygomycetes.</li><li><strong>Dimorphic fungi:</strong> <em>Histoplasma</em>, <em>Coccidioides</em>, <em>Blastomyces</em>. Rule: mold in the cold, yeast in the heat.</li></ul>", "hy": true}, {"title": "Asexual spores", "html": "<p><strong>Conidia</strong> are asexual spores.</p><ul><li><strong>Arthrospores:</strong> fragmentation of hyphae.</li><li><strong>Chlamydospores:</strong> rounded and thick-walled.</li><li><strong>Blastospores:</strong> formed by budding of yeasts; multiple buds that do not detach can form pseudohyphae.</li><li><strong>Sporangiospores:</strong> formed within a sac on a stalk by molds.</li></ul>", "hy": false}], "test": [{"q": "What fungal cell wall component is listed in the slides?", "choices": ["Chitin", "Peptidoglycan", "LPS", "PrPsc"], "correct": 0, "exp": "Fungal cell walls contain chitin and polysaccharides."}, {"q": "What fungal membrane component is important for antifungal medications?", "choices": ["Ergosterol", "Peptidoglycan", "Endotoxin", "Teichoic acid"], "correct": 0, "exp": "Fungal membranes contain ergosterol."}, {"q": "Which test is used because fungi resist KOH?", "choices": ["KOH prep", "Gram stain only", "Acid-fast stain", "Dark-field microscopy"], "correct": 0, "exp": "KOH prep is used for fungi."}, {"q": "How do fungi proliferate?", "choices": ["Budding, hyphae, and/or spore formation", "Binary fission only", "PrPsc conversion", "Viral assembly only"], "correct": 0, "exp": "Slides list budding, hyphae, and/or spore formation."}, {"q": "Most fungi are what with respect to oxygen?", "choices": ["Obligate aerobes", "Obligate anaerobes", "No oxygen category", "Only microaerophiles"], "correct": 0, "exp": "Most fungi are obligate aerobes."}, {"q": "How many fungi are obligate anaerobes?", "choices": ["None", "Most", "All", "Only Candida"], "correct": 0, "exp": "Slides state none are obligate anaerobes."}, {"q": "Which fungal form is round/ovoid and reproduces by budding?", "choices": ["Yeast", "Mold", "Nematode", "Fluke"], "correct": 0, "exp": "Yeasts are round/ovoid budding cells."}, {"q": "Which fungal form grows as tubular hyphae?", "choices": ["Mold", "Yeast", "Cyst", "Trophozoite"], "correct": 0, "exp": "Molds have hyphae."}, {"q": "Which phrase describes dimorphic fungi?", "choices": ["Mold in the cold, yeast in the heat", "Yeast in the cold, mold in the heat", "Always obligate anaerobe", "No cell wall"], "correct": 0, "exp": "Slides use mold in the cold, yeast in the heat."}, {"q": "Which is a yeast example?", "choices": ["Candida", "Aspergillus", "Zygomycetes", "Taenia"], "correct": 0, "exp": "Candida and Cryptococcus are yeast examples."}, {"q": "Which is a mold example?", "choices": ["Aspergillus", "Candida", "Cryptococcus", "Giardia"], "correct": 0, "exp": "Aspergillus and zygomycetes are mold examples."}, {"q": "Which is a dimorphic fungi example?", "choices": ["Histoplasma", "Candida", "Cryptococcus", "Ascaris"], "correct": 0, "exp": "Histoplasma, Coccidioides, and Blastomyces are dimorphic."}], "apply": [{"q": "A KOH prep shows budding yeast and pseudohyphae. Which fungal form does this suggest?", "choices": ["Yeast form such as Candida", "Mold form such as Aspergillus only", "Prion disease", "Nematode"], "correct": 0, "exp": "Candida yeast can produce blastospores and pseudohyphae."}, {"q": "A fungus appears as mold at environmental temperature and yeast in human tissue temperature. Which category is this?", "choices": ["Dimorphic fungus", "Obligate anaerobe", "Protozoan", "Prion"], "correct": 0, "exp": "Dimorphic fungi follow mold in cold, yeast in heat."}, {"q": "An antifungal medication targets ergosterol. What pathogen type is being targeted?", "choices": ["Fungus", "Bacterium", "Virus", "Helminth"], "correct": 0, "exp": "Fungal membranes contain ergosterol."}, {"q": "A clinician suspects fungal infection and uses a prep that leaves fungal elements visible because they resist the reagent. What test is this?", "choices": ["KOH prep", "Gram stain", "O&P", "Dark-field microscopy"], "correct": 0, "exp": "KOH prep is used to visualize fungi."}]}, {"id": "i08", "name": "8. Bacteria: Survival, Oxygen, Morphology, Disease", "hy": true, "cards": [{"title": "Bacterial basics", "html": "<p>Most bacteria have a single circular chromosome in the nucleoid. They reproduce by <strong>binary fission</strong>: one parent cell divides into two progeny cells. Growth can be exponential; after 4 generations, 1 bacterium can become 16 bacteria.</p><p><strong>Generation time</strong> depends on the bacterium: about 20 minutes for <em>E. coli</em> and up to 18 hours for <em>Mycobacterium tuberculosis</em>.</p><p>Iron is required for growth because it is essential for cytochromes and other enzymes.</p><p>Some important bacterial pathogens ferment sugars such as <strong>glucose</strong> and maltose into lactate or pyruvic acid; this is useful for identification.</p>", "hy": true}, {"title": "Disease ability and oxygen classification", "html": "<p>Bacteria may cause disease by production of <strong>toxins</strong> (exotoxins/endotoxins) and induction of <strong>inflammation</strong>.</p><p>Most bacterial diseases are communicable, but some are not, such as botulism.</p><p>Bacteria can be classified by response to oxygen:</p><ul><li><strong>Obligate aerobes:</strong> example <em>M. tuberculosis</em>.</li><li><strong>Facultative anaerobes:</strong> example <em>E. coli</em>.</li><li><strong>Obligate anaerobes:</strong> example <em>Clostridium tetani</em>.</li></ul>", "hy": true}, {"title": "Morphology and arrangements", "html": "<p>Morphology:</p><ul><li><strong>Cocci:</strong> spherical.</li><li><strong>Bacilli:</strong> rods.</li><li><strong>Spirochetes:</strong> spiral.</li><li><strong>Pleomorphic:</strong> variable/many shaped.</li></ul><p>Arrangements:</p><ul><li><strong>Streptococci:</strong> chains of cocci.</li><li><strong>Staphylococci:</strong> grape-like clusters.</li><li><strong>Diplococci:</strong> pairs of cocci.</li></ul>", "hy": true}], "test": [{"q": "How do bacteria reproduce?", "choices": ["Binary fission", "Budding only", "Viral assembly", "Prion conversion"], "correct": 0, "exp": "Bacteria reproduce by binary fission."}, {"q": "What is bacterial generation time?", "choices": ["Time required for growth/division", "Time to form a cyst", "Duration of prodrome", "Time to induce antibody memory"], "correct": 0, "exp": "Generation time depends on the bacterium."}, {"q": "What nutrient is required for bacterial growth because it is essential for cytochromes and other enzymes?", "choices": ["Iron", "Calcium only", "Chitin", "Ergosterol"], "correct": 0, "exp": "Iron is required for bacterial growth."}, {"q": "Which sugar fermentation example is listed?", "choices": ["Glucose and maltose fermentation to lactate or pyruvic acid", "DNA fermentation to protein", "Chitin fermentation to ergosterol", "Prion fermentation"], "correct": 0, "exp": "Slides list glucose/maltose fermentation into lactate/pyruvic acid."}, {"q": "How can bacteria cause disease?", "choices": ["Toxins and inflammation", "Only prion conversion", "Only no immune response", "Only cyst formation"], "correct": 0, "exp": "Bacteria may produce exotoxins/endotoxins and induce inflammation."}, {"q": "Which bacterium is an obligate aerobe example?", "choices": ["M. tuberculosis", "E. coli", "Clostridium tetani", "Candida"], "correct": 0, "exp": "Slides list M. tuberculosis as obligate aerobe."}, {"q": "Which bacterium is a facultative anaerobe example?", "choices": ["E. coli", "M. tuberculosis", "Clostridium tetani", "Schistosoma"], "correct": 0, "exp": "Slides list E. coli as facultative anaerobe."}, {"q": "Which bacterium is an obligate anaerobe example?", "choices": ["Clostridium tetani", "E. coli", "M. tuberculosis", "Plasmodium"], "correct": 0, "exp": "Slides list Clostridium tetani as obligate anaerobe."}, {"q": "What shape are cocci?", "choices": ["Spherical", "Rod", "Spiral", "Variable only"], "correct": 0, "exp": "Cocci are spherical."}, {"q": "What shape are bacilli?", "choices": ["Rods", "Spheres", "Spirals", "Hair-like"], "correct": 0, "exp": "Bacilli are rods."}, {"q": "What arrangement is grape-like clusters?", "choices": ["Staphylococci", "Streptococci", "Diplococci", "Spirochetes"], "correct": 0, "exp": "Staphylococci form grape-like clusters."}, {"q": "What arrangement is chains of cocci?", "choices": ["Streptococci", "Staphylococci", "Diplococci", "Bacilli"], "correct": 0, "exp": "Streptococci are chains."}], "apply": [{"q": "A bacterium grows only in oxygen and is identified as M. tuberculosis. What oxygen category is it?", "choices": ["Obligate aerobe", "Facultative anaerobe", "Obligate anaerobe", "Acellular"], "correct": 0, "exp": "M. tuberculosis is the slide example of obligate aerobe."}, {"q": "A bacterium can grow with or without oxygen and is identified as E. coli. What oxygen category is it?", "choices": ["Facultative anaerobe", "Obligate aerobe", "Obligate anaerobe", "Prion"], "correct": 0, "exp": "E. coli is the slide example of facultative anaerobe."}, {"q": "A bacterium is spherical and arranged in grape-like clusters. Which morphology/arrangement is this?", "choices": ["Staphylococci", "Streptococci", "Diplococci", "Spirochete"], "correct": 0, "exp": "Staphylococci are clusters of cocci."}, {"q": "A bacterium is spherical and arranged in chains. Which morphology/arrangement is this?", "choices": ["Streptococci", "Staphylococci", "Diplococci", "Bacilli"], "correct": 0, "exp": "Streptococci are chains of cocci."}, {"q": "A bacterium is spiral-shaped. Which morphology is this?", "choices": ["Spirochete", "Coccus", "Bacillus", "Pleomorphic"], "correct": 0, "exp": "Spirochetes are spiral-shaped."}]}, {"id": "i09", "name": "9. Bacterial Cell Walls, Gram Stain, and Non-Gram Stainers", "hy": true, "cards": [{"title": "Peptidoglycan and beta-lactams", "html": "<p>Bacteria have a cell wall made of <strong>peptidoglycan</strong>, except <em>Mycoplasma</em>, which is surrounded only by a cell membrane.</p><p>Peptidoglycan is found only in bacterial cells. It covers the bacterium and gives the organism its shape.</p><p>Peptidoglycan has a sugar backbone (glycan) and peptide side chains. Side chains are cross-linked by <strong>transpeptidase</strong>, the enzyme inhibited by penicillins and cephalosporins.</p>", "hy": true}, {"title": "Gram positive vs Gram negative", "html": "<p><strong>Gram positive:</strong> much thicker peptidoglycan layer and teichoic acid fibers extending outward.</p><p><strong>Gram negative:</strong> thinner peptidoglycan layer plus complex <strong>LPS</strong> outer layer/endotoxin. Gram negative bacteria also have a <strong>periplasmic space</strong> between inner and outer membranes containing beta-lactamases that degrade penicillin and other beta-lactam drugs.</p>", "hy": true}, {"title": "Gram stain method and role", "html": "<p>Gram stain separates most bacteria into two groups and helps identify pathogens and direct treatment.</p><p>Gram positive bacteria stain <strong>blue/purple</strong>. Gram negative bacteria stain <strong>red/pink</strong>.</p><p>Method: crystal violet stains all bacteria blue/purple; iodine traps dye; alcohol/decolorizer wash; gram positive retains dye due to thick peptidoglycan; gram negative loses dye; safranin counterstain makes gram negative red/pink while gram positive stays blue/purple.</p>", "hy": true}, {"title": "Bacteria that do not show well on Gram stain", "html": "<ul><li><strong>Mycobacterium:</strong> high lipid/mycolic acid in cell wall prevents dye penetration. Alternative: acid-fast stain.</li><li><strong>Treponema pallidum:</strong> too thin to see. Alternative: dark-field microscopy.</li><li><strong>Mycoplasma pneumoniae:</strong> no cell wall and very small.</li><li><strong>Legionella pneumophila:</strong> poor uptake/retention of stain.</li><li><strong>Chlamydiae/Rickettsiae:</strong> intracellular and very small. Alternative: Giemsa stain.</li></ul>", "hy": true}], "test": [{"q": "What is the bacterial cell wall made of?", "choices": ["Peptidoglycan", "Chitin", "Ergosterol", "Amyloid"], "correct": 0, "exp": "Bacterial cell walls are made of peptidoglycan except Mycoplasma."}, {"q": "Which bacterium lacks a cell wall?", "choices": ["Mycoplasma", "Mycobacterium", "E. coli", "Clostridium"], "correct": 0, "exp": "Mycoplasma has no cell wall."}, {"q": "What enzyme cross-links peptidoglycan side chains?", "choices": ["Transpeptidase", "DNA polymerase", "COX-1", "Protease"], "correct": 0, "exp": "Transpeptidase cross-links peptide side chains."}, {"q": "Which drugs inhibit transpeptidase?", "choices": ["Penicillins and cephalosporins", "Triptans", "Opioids", "Antifungals only"], "correct": 0, "exp": "Penicillins and cephalosporins inhibit transpeptidase."}, {"q": "Which Gram group has thick peptidoglycan?", "choices": ["Gram positive", "Gram negative", "Both equally", "Neither"], "correct": 0, "exp": "Gram positive has much thicker peptidoglycan."}, {"q": "Which Gram group has LPS endotoxin?", "choices": ["Gram negative", "Gram positive", "Mycoplasma only", "Prions"], "correct": 0, "exp": "Gram negative has LPS endotoxin."}, {"q": "Where are beta-lactamases found in Gram negative bacteria?", "choices": ["Periplasmic space", "Nucleus", "Capsid", "Chitin wall"], "correct": 0, "exp": "The periplasmic space contains beta-lactamases."}, {"q": "What color do Gram positive bacteria stain?", "choices": ["Blue/purple", "Red/pink", "Green", "No stain ever"], "correct": 0, "exp": "Gram positive stain blue/purple."}, {"q": "What color do Gram negative bacteria stain?", "choices": ["Red/pink", "Blue/purple", "Black", "No stain ever"], "correct": 0, "exp": "Gram negative stain red/pink after safranin."}, {"q": "Why does Mycobacterium not stain well with Gram stain?", "choices": ["High lipid/mycolic acid cell wall", "Too thin to see", "No cell wall", "Intracellular only"], "correct": 0, "exp": "Mycobacterium has high lipid/mycolic acid wall preventing dye penetration."}, {"q": "What alternative stain is used for Mycobacterium?", "choices": ["Acid-fast stain", "Dark-field microscopy", "Giemsa stain", "O&P"], "correct": 0, "exp": "Mycobacterium is evaluated with acid-fast stain."}, {"q": "Why does Treponema pallidum not show well on Gram stain?", "choices": ["Too thin to see", "No cell wall", "High lipid wall", "Poor oxygen growth"], "correct": 0, "exp": "Treponema pallidum is too thin to see."}, {"q": "What alternative test is used for Treponema pallidum?", "choices": ["Dark-field microscopy", "Acid-fast stain", "KOH prep", "O&P"], "correct": 0, "exp": "Treponema pallidum can be visualized by dark-field microscopy."}, {"q": "What alternative stain is used for Chlamydiae/Rickettsiae?", "choices": ["Giemsa stain", "Acid-fast stain", "KOH prep", "Crystal violet only"], "correct": 0, "exp": "Chlamydiae/Rickettsiae are intracellular/very small; Giemsa stain is listed."}], "apply": [{"q": "A bacterium stains blue/purple due to retention of crystal violet after decolorizer. What cell wall feature explains this?", "choices": ["Thick peptidoglycan", "LPS only", "No cell wall", "Capsid"], "correct": 0, "exp": "Gram positive bacteria retain dye due to thick peptidoglycan."}, {"q": "A bacterium stains red/pink and has endotoxin. Which wall type is this?", "choices": ["Gram negative", "Gram positive", "Fungal", "Prion"], "correct": 0, "exp": "Gram negative bacteria stain red/pink and have LPS endotoxin."}, {"q": "A pathogen does not show on Gram stain because it has no cell wall and is very small. Which organism is this?", "choices": ["Mycoplasma pneumoniae", "Mycobacterium", "Treponema pallidum", "Legionella"], "correct": 0, "exp": "Mycoplasma pneumoniae lacks a cell wall and is very small."}, {"q": "A suspected pathogen has high mycolic acid/lipid in its cell wall. Which test should be used?", "choices": ["Acid-fast stain", "KOH prep", "O&P", "Standard Gram stain only"], "correct": 0, "exp": "Mycobacterium uses acid-fast staining."}, {"q": "A suspected syphilis organism is too thin to see on Gram stain. Which test is listed?", "choices": ["Dark-field microscopy", "Acid-fast stain", "KOH prep", "O&P"], "correct": 0, "exp": "Treponema pallidum can be evaluated with dark-field microscopy."}]}, {"id": "i10", "name": "10. General Infectious Disease Concepts", "hy": true, "cards": [{"title": "Normal flora and colonization terms", "html": "<p><strong>Normal flora/human microbiota:</strong> normal microorganism residents, only bacteria and yeast. Found on skin, oropharynx/GI tract, urethra, and vagina. Low-virulence/non-pathogenic in normal site but may cause disease elsewhere. Contributes to homeostasis and may be disrupted by antibiotics or antifungals.</p><p><strong>Colonized:</strong> formation of a population/colony of microorganisms.</p><p><strong>Carriers:</strong> asymptomatic individuals who harbor pathogens that can be transmitted to others.</p><p><strong>Opportunistic pathogens:</strong> usually cause disease only in immunocompromised states.</p>", "hy": true}, {"title": "Virulence and epidemiology", "html": "<p><strong>Virulence:</strong> microbe’s ability to cause disease.</p><p><strong>ID50:</strong> number of organisms required to cause disease in 50% of the population. <strong>Low ID50</strong> correlates with high virulence.</p><p><strong>Infection:</strong> invasion and multiplication of microorganisms within the body; may be symptomatic or asymptomatic.</p><p><strong>Subclinical infection:</strong> pathogen is actively present but does not produce significant signs/symptoms.</p><p><strong>Endemic:</strong> persistent infections, usually low level, in a specified geographic area.</p><p><strong>Epidemic:</strong> infections occurring at much higher rate than usual in a specified region.</p><p><strong>Pandemic:</strong> infections spreading across large areas of the globe.</p>", "hy": true}, {"title": "Transmission terms", "html": "<p><strong>Vertical transmission:</strong> mother to child during pregnancy or delivery; example Zika virus.</p><p><strong>Horizontal transmission:</strong> between individuals in a population. Main entry points: respiratory tract, GI tract, skin, genital tract, eyes; example Zika virus.</p><p><strong>Zoonotic:</strong> animal reservoir causes human disease; example rabies.</p><p><strong>Environmental:</strong> soil/water reservoirs; example tetanus.</p><p><strong>Vector-borne:</strong> living organisms spread pathogen between hosts; example malaria.</p>", "hy": true}], "test": [{"q": "What organisms make up normal flora according to the slides?", "choices": ["Bacteria and yeast", "Viruses and prions", "Helminths only", "Protozoa only"], "correct": 0, "exp": "Slides state normal flora are only bacteria and yeast."}, {"q": "What does colonized mean?", "choices": ["Formation of a population of microorganisms", "Symptomatic infection only", "Immunity after vaccination", "Fungal spore formation"], "correct": 0, "exp": "Colonized = formation of a population/colony of microorganisms."}, {"q": "What is a carrier?", "choices": ["Asymptomatic person harboring transmissible pathogen", "Person with no pathogen", "Only a mosquito", "A toxoid vaccine"], "correct": 0, "exp": "Carriers harbor pathogens and can transmit them while asymptomatic."}, {"q": "What is an opportunistic pathogen?", "choices": ["Usually causes disease only in immunocompromised states", "Always causes disease in healthy people", "Cannot cause disease", "Only a prion"], "correct": 0, "exp": "Opportunistic pathogens often cause disease in immunocompromised states."}, {"q": "What is virulence?", "choices": ["Microbe’s ability to cause disease", "Vaccine memory", "Oxygen use", "Cell shape"], "correct": 0, "exp": "Virulence = ability to cause disease."}, {"q": "What ID50 correlates with high virulence?", "choices": ["Low ID50", "High ID50", "No ID50", "Equal ID50"], "correct": 0, "exp": "Low ID50 means fewer organisms needed to cause disease and higher virulence."}, {"q": "What is infection?", "choices": ["Invasion and multiplication of microorganisms within the body", "Colonization only outside body", "Vaccine adverse event only", "Oxygen use"], "correct": 0, "exp": "Infection is invasion and multiplication within the body."}, {"q": "What is endemic?", "choices": ["Persistent low-level infection in a specified geographic area", "Global spread", "Higher than usual in a region", "Mother-to-child transmission"], "correct": 0, "exp": "Endemic means persistent usually low-level infection in a specified area."}, {"q": "What is epidemic?", "choices": ["Higher than usual rate in a specified region", "Global spread", "Low-level persistent only", "Animal reservoir only"], "correct": 0, "exp": "Epidemic = much higher rate than usual in a region."}, {"q": "What is pandemic?", "choices": ["Spread across large areas of globe", "Low-level geographic persistence", "Animal reservoir", "Mother-to-child transmission"], "correct": 0, "exp": "Pandemic = spread across large areas of the globe."}, {"q": "What is zoonotic transmission?", "choices": ["Animal reservoir causing human disease", "Mother-to-child", "Soil reservoir only", "Person-to-person only"], "correct": 0, "exp": "Zoonotic pathogens use animal reservoirs to cause human disease."}, {"q": "What is vector-borne transmission?", "choices": ["Living organism spreads pathogen between hosts", "Mother-to-child", "Only soil/water", "Only normal flora"], "correct": 0, "exp": "Vector-borne spread uses living organisms such as mosquitoes."}], "apply": [{"q": "An asymptomatic food handler harbors a pathogen and transmits it to others. What term applies?", "choices": ["Carrier", "Endemic", "Trophozoite", "Prion"], "correct": 0, "exp": "A carrier is asymptomatic but harbors transmissible pathogens."}, {"q": "A low number of organisms causes disease in 50% of exposed people. What does this imply?", "choices": ["High virulence", "Low virulence", "No infection", "Fungal dimorphism"], "correct": 0, "exp": "Low ID50 correlates with high virulence."}, {"q": "Rabies is transmitted from an animal reservoir to humans. What transmission term applies?", "choices": ["Zoonotic", "Vertical", "Endemic", "Subclinical"], "correct": 0, "exp": "Rabies is the slide example of zoonotic disease."}, {"q": "Malaria is spread by a living organism between hosts. What transmission category is this?", "choices": ["Vector-borne", "Vertical", "Normal flora", "Subclinical"], "correct": 0, "exp": "Malaria is the vector-borne example."}]}, {"id": "i11", "name": "11. Stages of Infectious Illness", "hy": true, "cards": [{"title": "Stages", "html": "<p><strong>Incubation:</strong> time from exposure to appearance of symptoms.</p><p><strong>Prodrome:</strong> optional stage where nonspecific symptoms occur.</p><p><strong>Illness/specific stage:</strong> characteristic features of disease occur.</p><p><strong>Recovery/convalescence:</strong> symptoms resolve and health returns.</p>", "hy": true}], "test": [{"q": "What stage is exposure to appearance of symptoms?", "choices": ["Incubation", "Prodrome", "Illness", "Convalescence"], "correct": 0, "exp": "Incubation is exposure to symptom appearance."}, {"q": "What stage has nonspecific symptoms?", "choices": ["Prodrome", "Incubation", "Specific illness", "Recovery"], "correct": 0, "exp": "Prodrome contains nonspecific symptoms and may or may not occur."}, {"q": "What stage has characteristic disease features?", "choices": ["Illness/specific stage", "Incubation", "Convalescence", "Colonization only"], "correct": 0, "exp": "Illness/specific stage has characteristic disease features."}, {"q": "What stage is symptom resolution and return of health?", "choices": ["Recovery/convalescence", "Prodrome", "Incubation", "Endemic"], "correct": 0, "exp": "Recovery/convalescence is symptoms resolving and health returning."}], "apply": [{"q": "A patient was exposed to influenza yesterday but has no symptoms yet. Which stage is this?", "choices": ["Incubation", "Prodrome", "Specific illness", "Convalescence"], "correct": 0, "exp": "Incubation occurs after exposure before symptoms."}, {"q": "A patient has malaise, low-grade fever, and nonspecific aches before classic disease findings. Which stage is this?", "choices": ["Prodrome", "Convalescence", "Endemic", "Carrier"], "correct": 0, "exp": "Prodrome is nonspecific symptoms."}, {"q": "A patient’s rash and disease-specific symptoms are now present. Which stage is this?", "choices": ["Illness/specific stage", "Incubation", "Prodrome", "Recovery"], "correct": 0, "exp": "Illness stage contains characteristic features."}, {"q": "A patient’s symptoms are resolving and health is returning. Which stage is this?", "choices": ["Convalescence/recovery", "Incubation", "Prodrome", "Epidemic"], "correct": 0, "exp": "Convalescence is recovery."}]}, {"id": "i12", "name": "12. Innate and Adaptive Immunity", "hy": true, "cards": [{"title": "Main immune function and immunodeficiency", "html": "<p>The main function of the immune system is to prevent or limit the severity of infection. A healthy immune system distinguishes self from non-self.</p><p><strong>Immunodeficiency</strong> occurs when a part of the immune system is weakened, allowing pathogens, especially opportunistic pathogens, to proliferate.</p>", "hy": true}, {"title": "Innate immune system", "html": "<p>The innate immune system is fully formed and exists <strong>prior to exposure</strong>. It responds quickly and generically/nonspecifically and does not retain immunologic memory.</p><p><strong>First line defenses:</strong> skin and mucous membranes, coughing/sneezing, gastric acid, and secretions such as tears, saliva, mucus, and urine.</p><p><strong>Second line defenses:</strong> inflammatory response, complement cascade, leukocytes and NK cells, interferons, and antigen presentation to adaptive immune system.</p>", "hy": true}, {"title": "Adaptive immune system", "html": "<p>The adaptive/acquired immune system is the third line of defense. It is specific to pathogen antigen, takes several days to become fully functional, and has the ability to <strong>remember</strong> pathogens.</p><p><strong>B cells:</strong> when activated by antigen, differentiate into plasma cells that produce large amounts of specific antibodies. Antibodies circulate and bind pathogenic antigens to tag them for elimination.</p><p><strong>Memory B cells:</strong> remain after infection and remember specific antigen. Future exposure produces a faster, stronger antibody response and shortens time between antibody generation and production.</p><p><strong>Helper T cells:</strong> non-cytotoxic facilitators that coordinate other cells to manage pathogens.</p><p><strong>Killer/cytotoxic T cells:</strong> recognize infected host cells and induce apoptosis.</p>", "hy": true}, {"title": "Immune response summary example", "html": "<p>Influenza example from slides: mucus and cilia trap and clear many viral particles. Some virus infects respiratory cells. Infected cells release interferons and inflammation recruits immune cells. Helper T cells coordinate adaptive response. B cells produce antibodies that bind virus. Cytotoxic T cells kill infected host cells. Memory B cells remain for faster future response.</p>", "hy": false}], "test": [{"q": "What is the main immune system function?", "choices": ["Prevent or limit severity of infection", "Produce all hormones", "Digest food", "Generate prions"], "correct": 0, "exp": "Slides state main function is preventing/limiting infection severity."}, {"q": "What does a healthy immune system distinguish?", "choices": ["Self from non-self", "Gram positive from Gram negative only", "Trophozoite from cyst only", "Cocci from bacilli only"], "correct": 0, "exp": "Healthy immunity distinguishes self from non-self."}, {"q": "What happens in immunodeficiency?", "choices": ["A weakened immune part allows pathogens to proliferate", "All immunity becomes stronger", "No pathogens can grow", "Only prions occur"], "correct": 0, "exp": "Immunodeficiency weakens defense, allowing pathogens especially opportunists to proliferate."}, {"q": "When does innate immunity exist?", "choices": ["Prior to exposure", "Only weeks after exposure", "Only after vaccination", "Never"], "correct": 0, "exp": "Innate immunity exists prior to exposure."}, {"q": "Does innate immunity retain immunologic memory?", "choices": ["No", "Yes", "Only for viruses", "Only for fungi"], "correct": 0, "exp": "Innate immunity does not retain memory."}, {"q": "Which is first-line innate defense?", "choices": ["Skin and mucous membranes", "Plasma cells", "Memory B cells", "Killer T cells"], "correct": 0, "exp": "Skin/mucous membranes are first-line innate defenses."}, {"q": "Which is second-line innate defense?", "choices": ["Complement cascade", "Memory B cells", "Antibody plasma cells only", "Toxoids"], "correct": 0, "exp": "Complement cascade is second-line innate defense."}, {"q": "Which immune system is antigen-specific and takes several days?", "choices": ["Adaptive immune system", "Innate immune system", "Normal flora", "Prion system"], "correct": 0, "exp": "Adaptive immunity is specific and slower to become fully functional."}, {"q": "What do activated B cells differentiate into?", "choices": ["Plasma cells", "Killer T cells", "Schwann cells", "Oligodendrocytes"], "correct": 0, "exp": "Activated B cells differentiate into plasma cells."}, {"q": "What do plasma cells produce?", "choices": ["Antibodies", "CSF", "Ergosterol", "Peptidoglycan"], "correct": 0, "exp": "Plasma cells produce antibodies."}, {"q": "What do memory B cells provide?", "choices": ["Faster, stronger response on re-exposure", "No future response", "Only inflammation", "Only complement"], "correct": 0, "exp": "Memory B cells allow faster/stronger antibody response."}, {"q": "What do helper T cells do?", "choices": ["Facilitate other immune cells", "Directly produce antibodies", "Make chitin", "Release ADH"], "correct": 0, "exp": "Helper T cells coordinate/facilitate immune responses."}, {"q": "What do killer T cells induce?", "choices": ["Apoptosis of infected host cells", "Antibody secretion only", "Spore formation", "Cyst formation"], "correct": 0, "exp": "Killer T cells induce apoptosis."}], "apply": [{"q": "A patient with immunodeficiency develops disease from organisms that usually cause disease only in weakened hosts. What pathogen type is this?", "choices": ["Opportunistic pathogen", "Normal flora only", "Prion only", "Toxoid"], "correct": 0, "exp": "Opportunistic pathogens usually cause disease in immunocompromised states."}, {"q": "Influenza particles are trapped by mucus and cleared by cilia before infection. Which line of defense is this?", "choices": ["First-line innate defense", "Adaptive antibody response", "Memory B cell response", "Passive immunization"], "correct": 0, "exp": "Mucus/cilia are first-line innate defenses."}, {"q": "Infected respiratory cells release interferons and recruit immune cells. Which immune category is this?", "choices": ["Second-line innate defense", "Passive antibody transfer", "Toxoid response", "Gram stain"], "correct": 0, "exp": "Interferons/inflammation/leukocyte recruitment are second-line innate defenses."}, {"q": "After influenza exposure, B cells produce antibodies and memory B cells remain. Which immune system is involved?", "choices": ["Adaptive immune system", "Innate only", "Prion system", "Normal flora"], "correct": 0, "exp": "B cell antibodies and memory are adaptive immunity."}, {"q": "A cytotoxic T cell recognizes an infected host cell and kills it. What process is induced?", "choices": ["Apoptosis", "Binary fission", "Budding", "Fermentation"], "correct": 0, "exp": "Killer T cells induce apoptosis of infected host cells."}]}, {"id": "i13", "name": "13. Active and Passive Immunization", "hy": true, "cards": [{"title": "Active immunization goals", "html": "<p><strong>Active immunization</strong> exposes the immune system to pathogen material so the host produces its own immune response and immunologic memory.</p><p>Active immunizations may be derived from whole killed bacteria, live attenuated bacteria or viruses, or antigenic subunits of organisms.</p><p>If later exposed to the pathogen, the exposure triggers a quicker response with increased B-cell proliferation and antibody formation. The secondary response protects against disease. Goal is longer-term protection, although some require boosters.</p>", "hy": true}, {"title": "Passive immunization goals", "html": "<p><strong>Passive immunization</strong> gives pre-formed antibodies to the patient. The patient’s immune system does not generate antibodies.</p><p>It results in short-term immunity lasting weeks to months and provides immediate protection for patients who have been or likely will be exposed to a specific pathogen.</p><p>Typical form: immune globulins such as IgG.</p>", "hy": true}], "test": [{"q": "What is the goal of active immunization?", "choices": ["Host produces own immune response and memory", "Give preformed antibodies only", "Treat active bacterial infection", "Destroy prions"], "correct": 0, "exp": "Active immunization stimulates host immunity and memory."}, {"q": "What is the goal of passive immunization?", "choices": ["Give preformed antibodies for immediate short-term protection", "Make host produce memory", "Use live attenuated virus only", "Cause infection"], "correct": 0, "exp": "Passive immunization provides preformed antibodies."}, {"q": "Which immunization type gives longer-term protection and memory?", "choices": ["Active", "Passive", "Both equally no memory", "Neither"], "correct": 0, "exp": "Active immunization produces immunologic memory."}, {"q": "Which immunization type gives immediate short-term protection?", "choices": ["Passive", "Active", "Toxoid only", "Conjugate only"], "correct": 0, "exp": "Passive immunization provides immediate short-term protection."}, {"q": "What is the typical form of passive immunization?", "choices": ["Immune globulins such as IgG", "Live attenuated virus only", "KOH prep", "Gram stain"], "correct": 0, "exp": "Passive immunization typically uses immune globulins."}, {"q": "Why are passive immunizations not routinely recommended for healthy adults?", "choices": ["Most adults can produce durable immunity via active immunization", "They always cause prion disease", "They are live vaccines", "They contain no antibodies"], "correct": 0, "exp": "Slides state healthy adults can usually produce durable response through active immunization."}], "apply": [{"q": "A person exposed to rabies needs immediate antibody protection. Which immunization type is this?", "choices": ["Passive immunization", "Active immunization only", "Toxoid only", "Subunit only"], "correct": 0, "exp": "Rabies IgG is a passive immunization example."}, {"q": "A vaccine causes the host to produce memory B cells for future faster response. Which immunization type is this?", "choices": ["Active immunization", "Passive immunization", "Antibiotic therapy", "O&P testing"], "correct": 0, "exp": "Active immunization produces host immune response and memory."}, {"q": "A newborn receives IgG from the mother through the placenta and IgA through breastmilk. Which immunization type is this?", "choices": ["Passive", "Active", "Live attenuated", "Toxoid"], "correct": 0, "exp": "Maternal antibody transfer is passive immunization."}]}, {"id": "i14", "name": "14. Vaccine Types, Contraindications, Examples, VAERS, Schedules", "hy": true, "cards": [{"title": "Non-live active vaccines", "html": "<p><strong>Non-live active immunizations</strong> include inactivated, recombinant, polysaccharide, conjugate, and subunit vaccines. These are the most common vaccine type.</p><p>They provide killed organisms or selected antigenic components to stimulate immunity.</p><p>Examples from slides: pertussis, influenza except intranasal, hepatitis A, injectable polio, Hib, meningococcal, pneumococcal, injectable typhoid.</p>", "hy": true}, {"title": "Live attenuated vaccines and contraindications", "html": "<p><strong>Live attenuated vaccines</strong> are weakened but living versions of bacteria or viruses.</p><p>Examples: MMR, intranasal influenza, oral typhoid, yellow fever, rotavirus, varicella.</p><p>They are safe for healthy individuals but have theoretical risks for special populations. They are contraindicated in <strong>pregnancy</strong> and <strong>immunocompromised patients</strong>.</p>", "hy": true}, {"title": "Toxoids and passive examples", "html": "<p><strong>Toxoids</strong> are bacterial toxins modified to make them nontoxic. Toxoids induce antitoxin antibody formation. If exposed later, antitoxin antibody binds toxin and prevents toxin-mediated disease.</p><p>Toxoid examples: tetanus and diphtheria toxoid, as Td or Tdap.</p><p><strong>Passive examples:</strong> newborn antibodies from mother via placenta (IgG) and breastmilk (IgA); RSV IgG, botulism IgG, rabies IgG, tetanus IgG.</p>", "hy": true}, {"title": "Contraindications, VAERS, schedules, resources", "html": "<p><strong>True contraindications:</strong> severe allergic reaction/anaphylaxis to a prior dose or vaccine component; live-virus vaccines in immunocompromised or pregnant patients.</p><p><strong>Precautions:</strong> moderate/severe acute illness; severe neurologic impairment after previous vaccine such as Guillain-Barré syndrome or encephalopathy. Specific vaccines may have specific contraindications/precautions and age requirements.</p><p><strong>VAERS:</strong> Vaccine Adverse Events Reporting System through HHS. Anyone may report. Health care providers must report certain serious/listed events, including anaphylaxis or anaphylactic shock within 7 days of any vaccine; encephalopathy, encephalitis, or seizures; and other serious/unusual events.</p><p><strong>Resources:</strong> CDC vaccine guidance, current immunization schedules, catch-up schedules, and immunization registries/EMR or state-based portals. Recommendations change, so clinicians should consult current schedules rather than rely on memory.</p><p><strong>Documentation:</strong> date administered, manufacturer, lot number, and name/address/title of person administering vaccine. CDC also notes route, dosage, site as best practice and VIS documentation is required for covered vaccines.</p>", "hy": true}, {"title": "Routine vaccine examples", "html": "<p><strong>Routine childhood examples:</strong> Hib, HepA, HepB, HPV, IPV (&lt;18 years), influenza, MMR, meningococcal, pneumococcal conjugate, rotavirus, varicella, DTaP (&lt;7 years), Tdap (&gt;7 years).</p><p><strong>Routine adult examples:</strong> influenza, Td/Tdap, zoster, pneumococcal.</p>", "hy": true}], "test": [{"q": "Which vaccine types are non-live?", "choices": ["Inactivated, recombinant, polysaccharide, conjugate, subunit", "MMR, rotavirus, varicella only", "Only toxoids", "Only immune globulins"], "correct": 0, "exp": "Slides list these as non-live active vaccines."}

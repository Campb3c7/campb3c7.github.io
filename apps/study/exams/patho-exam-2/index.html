, {"q": "Which vaccine is live attenuated?", "choices": ["MMR", "Injectable polio", "Hepatitis A", "Pneumococcal"], "correct": 0, "exp": "MMR is live attenuated."}, {"q": "Which influenza vaccine example is live attenuated?", "choices": ["Intranasal influenza", "Injectable influenza", "Hepatitis A", "Tdap"], "correct": 0, "exp": "Intranasal influenza is live attenuated."}, {"q": "Which patients should not receive live attenuated vaccines?", "choices": ["Pregnant and immunocompromised patients", "All healthy adults", "All children", "People needing boosters"], "correct": 0, "exp": "Live attenuated vaccines are contraindicated in pregnancy and immunocompromised patients."}, {"q": "What is a toxoid?", "choices": ["Modified bacterial toxin rendered nontoxic", "Live attenuated virus", "Preformed antibody", "Fungal cell wall"], "correct": 0, "exp": "Toxoids are modified bacterial toxins made nontoxic."}, {"q": "Which vaccines are toxoid examples?", "choices": ["Tetanus and diphtheria", "MMR and varicella", "Rabies IgG and RSV IgG", "HepA and IPV only"], "correct": 0, "exp": "Tetanus and diphtheria toxoid are examples."}, {"q": "Which is a passive immunization example?", "choices": ["Rabies IgG", "MMR", "Varicella vaccine", "Injectable polio"], "correct": 0, "exp": "Rabies IgG is passive immunization."}, {"q": "What system reports adverse events of immunization?", "choices": ["VAERS", "O&P", "KOH prep", "Gram stain"], "correct": 0, "exp": "VAERS is the vaccine adverse event reporting system."}, {"q": "Who may report to VAERS?", "choices": ["Anyone", "Only physicians", "Only the CDC", "Only pharmacists"], "correct": 0, "exp": "Slides state anyone may report."}, {"q": "Which adverse event must be reported if within 7 days of any vaccine?", "choices": ["Anaphylaxis/anaphylactic shock", "Mild soreness only", "Normal fatigue only", "Expected low-grade fever only"], "correct": 0, "exp": "Slides list anaphylaxis/anaphylactic shock within 7 days."}, {"q": "Which is a routine childhood vaccine example?", "choices": ["MMR", "Zoster only", "Tetanus IgG", "Botulism IgG"], "correct": 0, "exp": "MMR is routine childhood vaccine example."}, {"q": "Which is a routine adult vaccine example?", "choices": ["Zoster", "Rotavirus only", "DTaP under 7 only", "Hib only"], "correct": 0, "exp": "Adult examples include zoster."}, {"q": "Which resource should clinicians consult because recommendations change?", "choices": ["Current CDC schedule", "Memory only", "Old textbook only", "No schedule"], "correct": 0, "exp": "Slides emphasize using current CDC schedules."}, {"q": "Which items are required documentation after vaccination?", "choices": ["Date, manufacturer, lot number, name/address/title of administrator", "Only patient weight", "Only temperature", "Only chief complaint"], "correct": 0, "exp": "Slides list these required documentation elements."}], "apply": [{"q": "A pregnant patient asks for MMR. What is the correct principle?", "choices": ["Avoid because live-virus vaccines are contraindicated in pregnancy", "Give because all live vaccines are safe", "Use VAERS instead of counseling", "Give rabies IgG only"], "correct": 0, "exp": "MMR is live attenuated and live-virus vaccines are contraindicated in pregnancy."}, {"q": "An immunocompromised patient asks for intranasal influenza vaccine. What is the issue?", "choices": ["It is live attenuated and contraindicated", "It is a toxoid and mandatory", "It is passive IgG", "It is O&P testing"], "correct": 0, "exp": "Intranasal influenza is live attenuated and contraindicated in immunocompromised patients."}, {"q": "A patient is exposed to tetanus toxin risk and needs immediate antibody protection. Which type of immunization fits?", "choices": ["Passive tetanus IgG", "Live attenuated MMR", "Subunit vaccine only", "KOH prep"], "correct": 0, "exp": "Tetanus IgG is a passive immunization example."}, {"q": "A patient has anaphylaxis within 7 days of vaccination. What reporting system applies?", "choices": ["VAERS", "O&P", "CDC catch-up only", "KOH prep"], "correct": 0, "exp": "VAERS receives adverse event reports; providers must report certain serious events."}, {"q": "A PA is unsure which vaccines a 6-year-old needs after missing several visits. What resource should be used?", "choices": ["CDC catch-up schedule and immunization registry", "Memory only", "Gram stain", "O&P"], "correct": 0, "exp": "Slides point to CDC schedules/catch-up schedules and registries."}, {"q": "A clinic gives a vaccine. Which documentation is required?", "choices": ["Date, manufacturer, lot number, and name/address/title of administrator", "Only route", "Only patient height", "Only chief complaint"], "correct": 0, "exp": "Slides list those required documentation elements."}]}]}};

    '<div class="view-desc">'+esc(info.desc)+'</div></div>';
  html += '<div style="display:flex;gap:10px;margin-bottom:24px;">';
  modes.forEach(function(m){
    var active = state.mode===m;
    html += '<button onclick="showSubjectMode(\''+subject+'\',this.dataset.mode)" data-mode="'+m+'" style="flex:1;padding:12px 8px;border-radius:9px;border:1.5px solid '+(active?'var(--accent)':'var(--border)')+';background:'+(active?'var(--accent-dim)':'var(--surface)')+';color:'+(active?'var(--accent)':'var(--text2)')+';font-family:DM Sans,sans-serif;font-size:13px;font-weight:700;cursor:pointer;">'+labels[m]+'</button>';
  });
  html += '</div>';
  html += '<div class="topic-list">';
  subjectTopics(subject).forEach(function(t,i){
    var meta = state.mode==='learn' ? t.cards.length+' cards' : t[state.mode].length+' questions';
    html += '<div class="topic-card" data-id="'+t.id+'" onclick="startSubjectTopic(\''+subject+'\',this.dataset.id)">'+
      '<span class="topic-num">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div class="topic-info"><div class="topic-name">'+esc(t.name)+(t.hy?' <span class="hy-flag">high yield</span>':'')+'</div>'+
      '<div class="topic-meta">'+meta+'</div></div>'+
      '<span class="topic-arrow">›</span></div>';
  });
  html += '</div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;
}

function showSubjectMode(subject, mode){
  subjectState[subject].mode = mode;
  renderSubjectHome(subject);
}

function getSubjectTopic(subject,id){ return subjectTopics(subject).find(function(t){return t.id===id;}); }

function startSubjectTopic(subject,id){
  var state = subjectState[subject];
  var t = getSubjectTopic(subject,id);
  if(!t) return;
  if(state.mode === 'learn'){
    state.learn = {topic:t, idx:0, known:{}};
    renderSubjectLearn(subject);
  } else {
    state.quiz = {topic:t, mode:state.mode, queue:t[state.mode].slice(), idx:0, score:0, answered:0, missed:[], isRetry:false};
    renderSubjectQuestion(subject);
  }
}

function renderSubjectLearn(subject){
  var state = subjectState[subject].learn;
  var t = state.topic;
  var i = state.idx;
  var c = subjectContainer(subject);
  if(i >= t.cards.length){ renderSubjectLearnDone(subject); return; }
  var card = t.cards[i];
  var pct = (i / t.cards.length) * 100;
  var html = '<button class="back-btn" onclick="renderSubjectHome(\''+subject+'\')">← All topics</button>';
  html += '<div class="learn-progress-track"><div class="learn-progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="learn-counter">'+(i+1)+' of '+t.cards.length+' · '+esc(t.name)+'</div>';
  html += '<div class="learn-card">';
  html += '<div class="learn-kicker">'+esc(t.name)+(card.hy?' &nbsp;·&nbsp; <span style="color:var(--accent)">★ high yield</span>':'')+'</div>';
  html += '<div class="learn-concept-title">'+esc(card.title)+'</div>';
  html += '<div class="learn-body">'+card.html+'</div>';
  html += '</div>';
  html += '<div class="learn-actions">'+
    '<button class="learn-btn learn-btn-dunno" onclick="subjectLearnNext(\''+subject+'\',false)">Not yet</button>'+
    '<button class="learn-btn learn-btn-know" onclick="subjectLearnNext(\''+subject+'\',true)">I know this</button></div>';
  html += '<div class="learn-nav"><button onclick="subjectLearnPrev(\''+subject+'\')" '+(i===0?'disabled':'')+'>← back</button>'+
    '<button onclick="renderSubjectLearnDone(\''+subject+'\')">skip to end →</button></div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;
}

function subjectLearnNext(subject,known){
  var s = subjectState[subject].learn;
  s.known[s.idx] = known;
  s.idx++;
  renderSubjectLearn(subject);
}
function subjectLearnPrev(subject){
  var s = subjectState[subject].learn;
  if(s.idx>0){ s.idx--; renderSubjectLearn(subject); }
}
function renderSubjectLearnDone(subject){
  var s = subjectState[subject].learn;
  var t = s.topic;
  var known = Object.values(s.known).filter(Boolean).length;
  var c = subjectContainer(subject);
  var html = '<div class="learn-done"><div class="learn-done-badge">📖</div>'+
    '<h3>'+esc(t.name)+'</h3>'+
    '<p>You marked '+known+' of '+t.cards.length+' cards as known.</p>'+
    '<div class="learn-done-stats">'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">'+known+'</span><span class="stat-lbl">Known</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--text2)">'+(t.cards.length-known)+'</span><span class="stat-lbl">Review</span></div>'+
    '</div>'+
    '<div class="cta-btns">'+
      '<button class="btn-pri" onclick="subjectState[\''+subject+'\'].mode=\'test\'; startSubjectTopic(\''+subject+'\',\''+t.id+'\')">Test this topic →</button>'+
      '<button class="btn-sec" onclick="startSubjectTopic(\''+subject+'\',\''+t.id+'\')">Restudy</button>'+
      '<button class="btn-sec" onclick="renderSubjectHome(\''+subject+'\')">All topics</button>'+
    '</div></div>';
  c.innerHTML = html;
}

function renderSubjectQuestion(subject){
  var s = subjectState[subject].quiz;
  var c = subjectContainer(subject);
  if(s.idx >= s.queue.length){ renderSubjectQuizDone(subject); return; }
  var q = s.queue[s.idx];
  var pct = (s.idx / s.queue.length) * 100;
  var letters = ['A','B','C','D','E'];
  var html = '<button class="back-btn" onclick="renderSubjectHome(\''+subject+'\')">← All topics</button>';
  html += '<div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="quiz-counter">'+(s.idx+1)+' / '+s.queue.length+' · '+esc(s.topic.name)+'</div>';
  html += '<div class="q-meta">'+(s.mode==='apply'?'Vignette':'Recall')+' '+(s.idx+1)+'</div>';
  html += '<div class="q-card"><div class="q-text'+(s.mode==='apply'?' vignette':'')+'">'+esc(q.q)+'</div>';
  html += '<ul class="choices-list" id="'+subject+'choices">';
  q.choices.forEach(function(ch,ci){
    html += '<li><button class="choice-btn" data-ci="'+ci+'"><span class="choice-letter">'+letters[ci]+'</span><span>'+esc(ch)+'</span></button></li>';
  });
  html += '</ul></div>';
  html += '<div class="explanation-box" id="'+subject+'exp"><span class="explanation-label">Explanation</span>'+esc(q.exp)+'</div>';
  html += '<div class="next-row" id="'+subject+'nextrow"><button class="next-btn" id="'+subject+'nextbtn">'+(s.idx+1>=s.queue.length?'See Results':'Next →')+'</button></div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;
  document.querySelectorAll('#'+subject+'choices .choice-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ subjectChoose(subject, parseInt(btn.dataset.ci), q); });
  });
  document.getElementById(subject+'nextbtn').addEventListener('click', function(){ s.idx++; renderSubjectQuestion(subject); });
}

function subjectChoose(subject, ci, q){
  var s = subjectState[subject].quiz;
  var btns = document.querySelectorAll('#'+subject+'choices .choice-btn');
  btns.forEach(function(btn,bi){
    btn.disabled = true;
    if(bi === q.correct) btn.classList.add('correct');
    else if(bi === ci) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  s.answered++;
  if(ci === q.correct) s.score++; else s.missed.push(q);
  document.getElementById(subject+'exp').style.display = 'block';
  document.getElementById(subject+'nextrow').style.display = 'block';
}

function subjectRetryMissed(subject){
  var old = subjectState[subject].quiz;
  subjectState[subject].quiz = {topic:old.topic, mode:old.mode, queue:old.missed.slice(), idx:0, score:0, answered:0, missed:[], isRetry:true};
  renderSubjectQuestion(subject);
}

function renderSubjectQuizDone(subject){
  var s = subjectState[subject].quiz;
  var c = subjectContainer(subject);
  var pct = Math.round((s.score / s.queue.length) * 100);
  var circ = 283;
  var ringId = subject+'ring';
  var html = '<div class="quiz-done">'+
    '<div class="quiz-score-ring"><svg width="120" height="120"><circle id="'+ringId+'" stroke="var(--accent)" stroke-width="8" fill="transparent" r="45" cx="60" cy="60" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'"></circle></svg><div class="ring-label">'+s.score+' / '+s.queue.length+'</div></div>'+
    '<h3>'+esc(s.topic.name)+'</h3>'+
    '<p>You scored '+s.score+' out of '+s.queue.length+' correct ('+pct+'%).</p>'+
    '<div class="cta-btns">';
  if(!s.isRetry && s.missed.length) html += '<button class="btn-pri" onclick="subjectRetryMissed(\''+subject+'\')">Redo '+s.missed.length+' missed →</button>';
  if(s.mode==='test') html += '<button class="btn-sec" onclick="subjectState[\''+subject+'\'].mode=\'apply\'; startSubjectTopic(\''+subject+'\',\''+s.topic.id+'\')">Apply this topic 🩺</button>';
  html += '<button class="btn-sec" onclick="startSubjectTopic(\''+subject+'\',\''+s.topic.id+'\')">Restart</button>'+
    '<button class="btn-sec" onclick="renderSubjectHome(\''+subject+'\')">All topics</button>'+
    '</div></div>';
  c.innerHTML = html;
  setTimeout(function(){ var r=document.getElementById(ringId); if(r) r.style.strokeDashoffset = circ-(pct/100)*circ; },90);
}

renderRenalHome();
</script>
</body>
</html>

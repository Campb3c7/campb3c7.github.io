"Chloride"], "correct": 0, "exp": "Depolarization occurs from sodium influx."}, {"q": "Which ion efflux is central to repolarization?", "choices": ["Sodium", "Potassium", "Iodine", "Glucose"], "correct": 1, "exp": "Repolarization occurs when potassium exits after sodium channels close."}, {"q": "Which neurotransmitter mediates most synaptic inhibition?", "choices": ["GABA", "Glutamate", "Epinephrine", "Dopamine"], "correct": 0, "exp": "GABA mediates most synaptic inhibition."}, {"q": "Which neurotransmitter mediates most synaptic excitation?", "choices": ["GABA", "Glutamate", "Serotonin", "Norepinephrine"], "correct": 1, "exp": "Glutamate mediates most synaptic excitation."}, {"q": "Which drug classes affect GABA synapses according to the slides?", "choices": ["Benzodiazepines and barbiturates", "Beta blockers and statins", "NSAIDs and acetaminophen", "Triptans and ergotamines"], "correct": 0, "exp": "Slides list benzodiazepines and barbiturates."}], "apply": [{"q": "A medication enhances inhibitory synaptic signaling in the CNS. Which neurotransmitter system is most likely involved?", "choices": ["GABA", "Glutamate", "PTH", "Oxytocin"], "correct": 0, "exp": "GABA mediates most synaptic inhibition."}, {"q": "A seizure medication is designed to suppress excitatory communication. Which neurotransmitter is the main target conceptually?", "choices": ["Glutamate", "GABA", "Dopamine", "Epinephrine"], "correct": 0, "exp": "Glutamate mediates most synaptic excitation."}, {"q": "A neuron rapidly transmits an impulse through gap junctions to an adjacent neuron. What synapse type is this?", "choices": ["Electrical", "Chemical", "Endocrine", "Trophic"], "correct": 0, "exp": "Electrical synapses use gap junctions."}]}, {"id": "n04", "name": "4. Brain Energy + Core Neuro Function", "hy": false, "cards": [{"title": "Brain energy and perfusion", "html": "<p>The brain is about 2% of total body weight but receives 14-15% of resting cardiac output and consumes about 20% of oxygen content at rest.</p><p>The brain has <strong>obligate aerobic metabolism</strong> and relies on continuous, narrow-ranged cerebral perfusion from well-oxygenated blood.</p><p><strong>Glucose is the main source of energy.</strong> Neurons are unable to store glucose.</p>", "hy": true}, {"title": "Function of the nervous system", "html": "<p>The nervous system coordinates cell function into a surviving organism, controls skeletal muscle movement, helps regulate smooth muscle activity, receives/integrates/perceives sensory information, provides intelligence/anticipation/judgment, and facilitates behavior/adaptation to changing environments.</p>", "hy": false}, {"title": "CNS/PNS and somatic/ANS organization", "html": "<p><strong>CNS:</strong> brain and spinal cord, housed by axial skeleton; main control center.</p><p><strong>PNS:</strong> nerves outside CNS; relays information to and from CNS and endpoints.</p><p><strong>Somatic nervous system:</strong> sensory and motor innervation excluding viscera, smooth muscle, and glands.</p><p><strong>Autonomic nervous system:</strong> motor innervation to smooth muscle, conduction system of heart, and glands; divided into sympathetic and parasympathetic.</p>", "hy": false}], "test": [{"q": "What is the brain’s main source of energy?", "choices": ["Glucose", "Fatty acids", "Protein", "PTH"], "correct": 0, "exp": "Slides state glucose is the main source of energy."}, {"q": "Are neurons able to store glucose?", "choices": ["Yes", "No", "Only during sleep", "Only in the PNS"], "correct": 1, "exp": "Slides state neurons cannot store glucose."}, {"q": "What percent of resting cardiac output does the brain receive?", "choices": ["1-2%", "14-15%", "50%", "80%"], "correct": 1, "exp": "Slides state 14-15% of resting cardiac output."}, {"q": "What percent of oxygen content does the brain consume at rest?", "choices": ["2%", "5%", "20%", "90%"], "correct": 2, "exp": "Slides state 20% of oxygen content at rest."}, {"q": "Which system contains the brain and spinal cord?", "choices": ["PNS", "CNS", "ANS only", "Somatic only"], "correct": 1, "exp": "CNS = brain and spinal cord."}, {"q": "Which functional division innervates smooth muscle, the heart conduction system, and glands?", "choices": ["Somatic nervous system", "Autonomic nervous system", "Dorsal column", "Corticospinal tract"], "correct": 1, "exp": "ANS provides motor innervation to smooth muscle, heart conduction system, and glands."}], "apply": [{"q": "A hypoglycemic patient becomes confused because neurons cannot store which main fuel?", "choices": ["Glucose", "Calcium", "PTH", "TSH"], "correct": 0, "exp": "The brain relies on glucose and neurons cannot store it."}, {"q": "A patient with severe hypoxemia rapidly develops neurologic symptoms. Which slide concept explains this?", "choices": ["Obligate aerobic metabolism", "High prolactin", "Peripheral demyelination", "PTH feedback"], "correct": 0, "exp": "The brain uses obligate aerobic metabolism and requires well-oxygenated perfusion."}, {"q": "A spinal cord injury disrupts the main control center of the nervous system. Which division is injured?", "choices": ["CNS", "PNS", "Only ANS", "Only somatic"], "correct": 0, "exp": "The spinal cord is part of the CNS."}]}, {"id": "n05", "name": "5. UMN vs LMN + Facial Nerve Deficits", "hy": true, "cards": [{"title": "Upper motor neurons", "html": "<p><strong>UMNs</strong> originate in the cerebral cortex and extend to the spinal cord and brainstem. They carry information down to activate interneurons and LMNs. UMNs in the cerebral cortex are the main source of voluntary movement.</p><p>Glutamate is excitatory and transmits nerve impulses from UMN to LMN.</p><p><strong>UMN lesion findings:</strong> slow/clumsy rapid alternating movements, increased muscle tone, hyperreflexia, clonus, Babinski sign present, central signs like aphasia or visual field cut.</p>", "hy": true}, {"title": "Lower motor neurons", "html": "<p><strong>LMNs</strong> receive signals from UMNs and are the final common pathway for all voluntary movement. They tell muscle to start contracting.</p><p><strong>Location:</strong> LMN cell bodies are in the anterior horn of the spinal cord or cranial nerve nuclei in the brainstem. Axons exit via efferent/anterior/ventral roots to spinal nerves/peripheral nerves and terminate at skeletal muscle.</p><p><strong>LMN lesion findings:</strong> variable weakness, impairment mostly due to weakness, decreased tone, hyporeflexia, absent Babinski, muscle atrophy.</p>", "hy": true}, {"title": "Facial nerve UMN vs LMN logic", "html": "<p>The slides show facial nerve deficit patterns for right UMN versus right LMN lesions. The practical rule: UMN facial weakness involves the lower face more than forehead because forehead motor control receives bilateral cortical input. LMN facial weakness affects the ipsilateral entire face, including forehead.</p>", "hy": true}], "test": [{"q": "Where do UMNs originate?", "choices": ["Cerebral cortex", "Posterior pituitary", "Pancreatic islets", "Parathyroid"], "correct": 0, "exp": "UMNs originate in the cerebral cortex."}, {"q": "Which neurotransmitter transmits impulses from UMN to LMN?", "choices": ["Glutamate", "GABA", "Oxytocin", "PTH"], "correct": 0, "exp": "Slides state glutamate transmits impulses from UMN to LMN."}, {"q": "Where are LMN cell bodies in the spinal cord?", "choices": ["Posterior columns", "Anterior horn", "Subarachnoid space", "Dura"], "correct": 1, "exp": "LMN somas are in the anterior horn."}, {"q": "Which is an UMN lesion sign?", "choices": ["Hyperreflexia", "Hyporeflexia", "Absent Babinski", "Decreased tone"], "correct": 0, "exp": "UMN lesions cause hyperreflexia."}, {"q": "Which is an LMN lesion sign?", "choices": ["Clonus", "Babinski present", "Muscle atrophy", "Aphasia"], "correct": 2, "exp": "LMN lesions cause muscle atrophy."}, {"q": "Which lesion type causes increased muscle tone?", "choices": ["UMN", "LMN", "Both", "Neither"], "correct": 0, "exp": "UMN lesions cause increased tone."}, {"q": "Which lesion type causes decreased tone?", "choices": ["UMN", "LMN", "Both", "Neither"], "correct": 1, "exp": "LMN lesions cause decreased tone."}], "apply": [{"q": "A patient has weakness with hyperreflexia, clonus, and Babinski sign. What lesion type fits?", "choices": ["UMN lesion", "LMN lesion", "SIADH", "GBS only"], "correct": 0, "exp": "Hyperreflexia/clonus/Babinski are UMN signs."}, {"q": "A patient has flaccid weakness, decreased tone, hyporeflexia, and muscle atrophy. What lesion type fits?", "choices": ["UMN lesion", "LMN lesion", "Migraine", "Meningitis"], "correct": 1, "exp": "Decreased tone, hyporeflexia, and atrophy are LMN signs."}, {"q": "A stroke patient has facial weakness sparing the forehead. Which lesion pattern best explains this?", "choices": ["UMN facial nerve pattern", "LMN facial nerve pattern", "Peripheral neuropathy only", "Cauda equina"], "correct": 0, "exp": "UMN facial weakness classically spares the forehead."}, {"q": "A patient cannot wrinkle the forehead or move the mouth on the same side. Which facial nerve lesion pattern fits?", "choices": ["UMN", "LMN", "Dorsal column", "Spinothalamic"], "correct": 1, "exp": "LMN facial nerve lesions affect the whole ipsilateral face, including forehead."}]}, {"id": "n06", "name": "6. Spinal Cord, Tracts, Diaphragm + Cauda Equina", "hy": true, "cards": [{"title": "Gray and white matter", "html": "<p><strong>Gray matter</strong> is the butterfly-shaped central region containing LMN cell bodies.</p><p><strong>Dorsal/posterior horn:</strong> entry point of sensory information into CNS; modulates pain transmission through spinal and supraspinal circuits.</p><p><strong>Ventral/anterior horn:</strong> contains motor nuclei and interneurons from extrapyramidal and pyramidal systems; sends axons through ventral roots to striated muscle.</p><p><strong>White matter:</strong> contains tracts. The corticospinal tract begins in the cerebral cortex, terminates on LMNs and interneurons in the spinal cord, and controls limb and trunk movement.</p>", "hy": true}, {"title": "Sensory examples and corticospinal importance", "html": "<p><strong>Dorsal column clinical example:</strong> vibration/proprioception/fine positional input such as sensing foot position while walking.</p><p><strong>Spinothalamic clinical example:</strong> pain and temperature such as feeling a pinprick or heat.</p><p><strong>Corticospinal tract importance:</strong> voluntary control of limb and trunk movement.</p>", "hy": true}, {"title": "Spinal cord termination and innervation", "html": "<p>The spinal cord ends at the <strong>conus medullaris around L1</strong>. Slides list 32 pairs of spinal nerves: 8 cervical, 12 thoracic, 5 lumbar, 5 sacral, and 2+ coccygeal.</p><p><strong>C1-C5:</strong> diaphragm. <strong>C4, C6-T1:</strong> upper extremity. <strong>Thoracic cord:</strong> rib margins/intercostal/abdominal muscles and sympathetic nerves of heart/abdominal organs. <strong>Lumbar nerves:</strong> lower extremity. <strong>Sacral nerves:</strong> pelvic and abdominal organs. <strong>Cauda equina:</strong> pelvic organs and lower limbs.</p>", "hy": true}, {"title": "Cauda equina syndrome", "html": "<p>Cauda equina syndrome occurs when two or more nerve roots from L1 and below are affected.</p><p><strong>Causes:</strong> trauma, disc herniation, lesions such as abscess/tumor/hematoma, lumbar spinal stenosis.</p><p><strong>Signs/symptoms:</strong> asymmetric radicular pain, leg weakness, sensory loss, bladder/bowel dysfunction, saddle anesthesia, decreased lower-extremity DTRs, back pain, loss of sphincter tone.</p><p><strong>Diagnosis:</strong> MRI. <strong>Management:</strong> emergent; typically surgical decompression.</p>", "hy": true}], "test": [{"q": "Which horn is the entry point for sensory information?", "choices": ["Dorsal/posterior horn", "Ventral/anterior horn", "Anterior pituitary", "Dura"], "correct": 0, "exp": "Dorsal/posterior horn is the sensory entry point."}, {"q": "Which horn contains motor nuclei and sends axons through ventral roots?", "choices": ["Dorsal horn", "Ventral/anterior horn", "Arachnoid", "Posterior pituitary"], "correct": 1, "exp": "Ventral horn contains motor nuclei and sends axons via ventral roots."}, {"q": "What does the corticospinal tract control?", "choices": ["Limb and trunk movements", "Water balance", "Calcium absorption", "Milk production"], "correct": 0, "exp": "Slides state corticospinal tract controls limb and trunk movement."}, {"q": "At what level does the spinal cord end?", "choices": ["C1", "T6", "L1", "S5"], "correct": 2, "exp": "Slides state conus medullaris approximately L1."}, {"q": "Which nerve roots innervate the diaphragm in the slides?", "choices": ["C1-C5", "T1-T12", "L1-L5", "S2-S4"], "correct": 0, "exp": "Slides list C1-C5 for diaphragm."}, {"q": "Which syndrome includes saddle anesthesia and bowel/bladder dysfunction?", "choices": ["Cauda equina syndrome", "Tension headache", "SIADH", "Alzheimer disease"], "correct": 0, "exp": "Cauda equina causes saddle anesthesia and bladder/bowel dysfunction."}, {"q": "What imaging study is listed for cauda equina diagnosis?", "choices": ["MRI", "EEG", "Lumbar puncture only", "Non-contrast CT head"], "correct": 0, "exp": "Slides list MRI."}], "apply": [{"q": "A patient after lumbar disc herniation has saddle anesthesia, urinary retention, decreased lower extremity DTRs, and loss of sphincter tone. What diagnosis is most likely?", "choices": ["Cauda equina syndrome", "SAH", "Migraine", "MS"], "correct": 0, "exp": "This matches cauda equina syndrome signs."}, {"q": "A patient with cauda equina syndrome is diagnosed by MRI. What management category is appropriate?", "choices": ["Emergent surgical decompression is typically involved", "Discharge with acetaminophen only", "Treat with methimazole", "No treatment needed"], "correct": 0, "exp": "Slides state emergent management usually involves surgical decompression."}, {"q": "A high cervical injury affecting C1-C5 puts what function at risk?", "choices": ["Diaphragm function", "Pancreatic insulin release", "Thyroid hormone synthesis", "Visual field only"], "correct": 0, "exp": "C1-C5 innervates the diaphragm."}]}, {"id": "n07", "name": "7. Cerebral Circulation, TIA, CVA", "hy": true, "cards": [{"title": "Cerebral circulation", "html": "<p><strong>Internal carotid arteries</strong> supply oxygenated blood to anterior cerebrum and form part of the Circle of Willis. They give rise to anterior cerebral arteries and middle cerebral arteries.</p><p><strong>MCA:</strong> emboli from ICA most frequently lodge here. MCA supplies frontal cortex for fine manipulative skills of face/upper limbs and is a vascular source for language.</p><p><strong>Vertebral arteries</strong> supply posterior cerebrum, arise from subclavian arteries, form the basilar artery, and diverge into posterior cerebral arteries. They supply brainstem/cerebellum, occipital lobes, temporal lobes, and thalamus.</p><p><strong>Circle of Willis:</strong> connects anterior and posterior circulation through communicating arteries to allow collateral blood flow and minimize ischemic damage if collateral flow can maintain oxygenation.</p>", "hy": true}, {"title": "TIA, ischemic CVA, hemorrhagic CVA", "html": "<p><strong>CVA/stroke:</strong> acute focal loss of oxygenated blood to brain causing neuronal death.</p><p><strong>TIA:</strong> self-limited neurologic dysfunction without acute infarction; symptoms resolve within 24 hours.</p><p><strong>Ischemic stroke:</strong> most common type; blocked cerebral blood flow due to thrombi or emboli. Internal carotid and MCA most common. Causes include atrial fibrillation, cerebral arteriosclerosis, carotid stenosis. Risk factor: HTN. May occur over hours to days. Treatment goal: restore perfusion to penumbra, minimize sequelae, emphasize TIME, thrombolytic, neurovascular intervention.</p><p><strong>Hemorrhagic stroke:</strong> less common but higher mortality; spontaneous intracerebral hemorrhage usually from rupture of blood vessel or aneurysm. Risks: HTN, anticoagulation.</p>", "hy": true}], "test": [{"q": "Where do emboli from the ICA most frequently lodge?", "choices": ["MCA", "PCA", "Basilar artery", "Vertebral artery"], "correct": 0, "exp": "Slides state ICA emboli most often lodge in the MCA."}, {"q": "What does the MCA supply?", "choices": ["Face/upper limb fine manipulation and language vascular territory", "Only diaphragm", "Only lower limb", "Only posterior pituitary"], "correct": 0, "exp": "Slides list frontal cortex for fine manipulative face/upper limb skills and language."}, {"q": "What is the function of the Circle of Willis?", "choices": ["Collateral blood flow", "CSF production", "Myelin production", "Insulin secretion"], "correct": 0, "exp": "Circle of Willis provides collateral circulation."}, {"q": "What is a TIA?", "choices": ["Self-limited neurologic dysfunction without acute infarction", "Hemorrhage into subarachnoid space", "Progressive dementia", "Peripheral neuropathy"], "correct": 0, "exp": "Slides define TIA this way."}, {"q": "Which stroke type is most common?", "choices": ["Ischemic", "Hemorrhagic", "Subarachnoid", "Spinal"], "correct": 0, "exp": "Slides state ischemic stroke is most common."}, {"q": "What is the emphasized ischemic stroke treatment goal?", "choices": ["Save the penumbra", "Decrease prolactin", "Increase PTH", "Block COX"], "correct": 0, "exp": "Slides emphasize restoring perfusion to penumbra."}, {"q": "Which stroke type is less common but has higher mortality?", "choices": ["Hemorrhagic", "Ischemic", "TIA", "Migraine"], "correct": 0, "exp": "Slides state hemorrhagic is less common but higher mortality."}], "apply": [{"q": "A patient with atrial fibrillation develops aphasia and face/upper-limb deficits. Which artery is most likely affected?", "choices": ["MCA", "PCA", "Basilar", "Vertebral"], "correct": 0, "exp": "A-fib emboli commonly involve MCA territory."}, {"q": "A patient has focal neurologic symptoms that resolve within 24 hours and no acute infarction. What is the diagnosis?", "choices": ["TIA", "Hemorrhagic stroke", "SAH", "ALS"], "correct": 0, "exp": "TIA resolves within 24 hours without infarction."}, {"q": "A patient presents several hours after focal neurologic deficit from thromboembolism. What treatment principle is emphasized?", "choices": ["Save the penumbra through quick recognition and reperfusion strategies", "Delay intervention for 1 week", "Give levothyroxine", "Treat with fluid restriction only"], "correct": 0, "exp": "Slides emphasize time and saving the penumbra."}, {"q": "A patient on anticoagulation has a spontaneous intracerebral hemorrhage. Which stroke type is this?", "choices": ["Hemorrhagic", "Ischemic", "TIA", "Migraine"], "correct": 0, "exp": "Hemorrhagic stroke involves bleeding and is associated with anticoagulation."}]}, {"id": "n08", "name": "8. Headache Disorders + Sumatriptan", "hy": true, "cards": [{"title": "Tension headache", "html": "<p><strong>Tension headache:</strong> mild-moderate, bilateral, band-like, associated with pericranial muscle tenderness and cervical muscle tension.</p><p>Pathophysiology is not well understood; thought to involve overstimulation of nociceptive receptors from sustained tension in scalp/neck muscles and some neurologic disturbance similar to migraine.</p><p><strong>Features:</strong> stable pattern, family history, normal physical exam, triggers such as menstrual cycle, foods, odors, stress.</p><p><strong>Treatment:</strong> ibuprofen and/or acetaminophen.</p>", "hy": true}, {"title": "Migraine headache", "html": "<p><strong>Migraine:</strong> recurrent unilateral throbbing headache with associated symptoms; may be preceded by aura.</p><p><strong>Leading theory:</strong> cortical spreading depression, a self-initiating wave of neuronal activity across the cerebral cortex that activates trigeminal afferent neurons, causing inflammatory changes in meninges that generate headache.</p><p><strong>Stages:</strong> prodrome, aura, pain, postdrome.</p><p><strong>Triggers:</strong> stress, menstruation, weather changes, nitrates, fasting, red wine.</p>", "hy": true}, {"title": "Cluster headache", "html": "<p><strong>Cluster headache:</strong> usually unilateral, severe orbital/supraorbital/temporal pain. Pain is constant and non-throbbing. Patient is often pacing/restless and unable to sit still. Most common at night, waking the patient from sleep.</p><p>Occurs daily in same location/type/distribution for several weeks, then remits for weeks to years. Stuffy nose, rhinorrhea, or lacrimation may accompany. Lasts 15-180 minutes.</p><p><strong>Diagnosis:</strong> clinical. <strong>Treatment:</strong> oxygen, triptans, ergotamines.</p>", "hy": true}, {"title": "Sumatriptan", "html": "<p><strong>Sumatriptan (Imitrex)</strong> is a <strong>triptan</strong>.</p><p><strong>Indication:</strong> abortive for moderate to severe migraine headaches.</p><p><strong>MOA:</strong> selective serotonin agonist on intracranial blood vessels and sensory nerves of the trigeminal system. It causes vasoconstriction and reduces neurogenic inflammation associated with neuronal transmission, correlating with relief of migraine.</p><p><strong>Adverse effects:</strong> not listed in the uploaded slide text, so this app does not add outside adverse effects.</p>", "hy": true}], "test": [{"q": "Which headache is bilateral and band-like?", "choices": ["Tension", "Migraine", "Cluster", "SAH"], "correct": 0, "exp": "Tension headache is bilateral band-like pressure."}, {"q": "Which headache has cortical spreading depression as a leading theory?", "choices": ["Tension", "Migraine", "Cluster", "Cauda equina"], "correct": 1, "exp": "Slides list cortical spreading depression for migraine."}, {"q": "Which headache has unilateral severe orbital pain with pacing/restlessness?", "choices": ["Cluster", "Tension", "Myxedema", "HHS"], "correct": 0, "exp": "Cluster headache causes severe unilateral orbital/supraorbital/temporal pain and restlessness."}, {"q": "How long do cluster headaches last according to the slides?", "choices": ["15-180 minutes", "5 seconds", "3 days exactly", "Several months continuously"], "correct": 0, "exp": "Slides list 15-180 minutes."}, {"q": "What treats cluster headache according to the slides?", "choices": ["Oxygen, triptans, ergotamines", "Hydrocortisone only", "Levothyroxine", "Acyclovir"], "correct": 0, "exp": "Slides list oxygen, triptans, ergotamines."}, {"q": "What is sumatriptan’s class?", "choices": ["Triptan", "NSAID", "Opioid", "Antiviral"], "correct": 0, "exp": "Sumatriptan is a triptan."}, {"q": "What is sumatriptan’s indication in the slides?", "choices": ["Abortive treatment for moderate-severe migraine", "Maintenance treatment for Alzheimer disease", "First-line for status epilepticus", "Treatment for SIADH"], "correct": 0, "exp": "Slides identify sumatriptan as abortive for moderate to severe migraine."}], "apply": [{"q": "A patient has stable bilateral band-like headache with normal exam and cervical muscle tension. What treatment fits the slides?", "choices": ["Ibuprofen and/or acetaminophen", "Acyclovir", "Insulin", "Fludrocortisone"], "correct": 0, "exp": "Tension headache treatment is ibuprofen/acetaminophen."}, {"q": "A patient has unilateral throbbing headache with aura and photophobia after fasting and red wine. What diagnosis fits best?", "choices": ["Migraine", "Cluster", "Tension", "SAH"], "correct": 0, "exp": "Migraine is unilateral throbbing, may have aura, and triggers include fasting/red wine."}, {"q": "A patient wakes at night with severe unilateral orbital pain, rhinorrhea, lacrimation, and pacing. What is the best diagnosis?", "choices": ["Cluster headache", "Tension headache", "Migraine", "Meningitis"], "correct": 0, "exp": "Cluster headache classically has severe unilateral orbital pain, autonomic symptoms, and restlessness."}, {"q": "A patient is given sumatriptan for migraine. Which mechanism explains its benefit?", "choices": ["Selective serotonin agonism causing vasoconstriction and reduced trigeminal neurogenic inflammation", "COX inhibition", "Opioid receptor activation", "Inhibition of viral DNA polymerase"], "correct": 0, "exp": "This is the slide MOA for sumatriptan."}]}, {"id": "n09", "name": "9. Brain Tumors, ICP, CSF, BBB, Meningitis, Encephalitis", "hy": true, "cards": [{"title": "Brain tumors and ICP", "html": "<p><strong>Brain malignancy:</strong> primary brain tumors can be benign or malignant, but most brain malignancy is due to metastases from distant sites to the brain.</p><p>The intracranial cavity is fixed. Increased cerebral volume increases ICP. If slow, ventricles can compensate by displacing CSF and decreasing CSF production. If rapid or beyond compensation, signs/symptoms of ICP occur: headache, vision changes, nausea/vomiting, seizures, papilledema, altered mental status.</p><p>Brain parenchyma is pain-insensitive. Large tumors can be relatively pain-free until they compress/distort pain-sensitive dural or vascular structures. Early tumor headache may be mild and morning, improving with head elevation. Later headache becomes constant and worse with coughing, bending, sudden head movement, or lying supine.</p>", "hy": true}, {"title": "CSF and BBB", "html": "<p><strong>CSF:</strong> clear, virtually sterile fluid circulating through subarachnoid space of brain/spinal cord. Produced by choroid plexus in lateral, 3rd, and 4th ventricles. 500-650 mL/day produced; about 150 mL circulates at a time. Choroid is made of ependymal cells.</p><p><strong>BBB:</strong> separates CNS from circulating blood and controls brain interstitial fluid. Tight junctions prevent simple diffusion of fluids/electrolytes/others; lipid-soluble small molecules move readily through.</p>", "hy": false}, {"title": "Meningitis", "html": "<p><strong>Pathophysiology:</strong> pathogen virulence overcomes host defenses, colonizes mucosal epithelium, invades/survives in bloodstream, crosses BBB, and multiplies to high concentrations in CSF because immunity in CSF is inadequate.</p><p>Cytokine release in CSF causes much of the damage. BBB endothelial injury leads to brain edema, loss of cerebrovascular autoregulation, increased ICP, localized ischemia, cytotoxic injury, and neuronal apoptosis. Inflammation also allows WBCs and medications to cross BBB.</p><p><strong>Signs:</strong> triad is altered mental status, fever, nuchal rigidity. May also see headache, seizures, petechiae, purpura, papilledema, cranial nerve palsies.</p><p><strong>Etiologies:</strong> bacterial, aseptic/commonly viral (potential HSV), fungal. Streptococcus pneumoniae is the most common bacterial etiology of community-acquired meningitis in adults of all ages.</p><p><strong>Treatment:</strong> directed at LP results and most likely etiology. Dexamethasone may help when inflammatory reaction is significant enough that increased ICP worsens outcome.</p>", "hy": true}, {"title": "Encephalitis + acyclovir", "html": "<p><strong>Encephalitis:</strong> infection and inflammation of brain parenchyma. It can co-occur with meningitis as meningoencephalitis. Most often viral: HSV, West Nile, HIV, arbovirus, poliovirus, rabies.</p><p><strong>Pathophysiology:</strong> local necrotizing hemorrhage, prominent cerebral edema, progressive degeneration of neuronal bodies.</p><p><strong>Treatment:</strong> empiric IV antiviral acyclovir. Because it can be difficult to distinguish from meningitis clinically, antibiotics are usually initiated as well.</p><p><strong>Acyclovir:</strong> antiviral indicated for HSV, herpes zoster, varicella, and encephalitis. MOA: inhibits DNA synthesis and viral replication by competing with deoxyguanosine triphosphate for viral DNA polymerase and incorporation into viral DNA.</p>", "hy": true}], "test": [{"q": "What is the most common reason for malignancy in the brain according to the slides?", "choices": ["Metastases from distant sites", "Primary benign tumor only", "Acyclovir toxicity", "GBS"], "correct": 0, "exp": "Slides state most brain malignancy is due to metastases from distant sites."}, {"q": "Which signs suggest increased ICP from a brain tumor?", "choices": ["Headache, vision changes, nausea/vomiting, seizures, papilledema, AMS", "Polyuria only", "Hyperreflexia only", "Band-like headache only"], "correct": 0, "exp": "Slides list these ICP signs."}, {"q": "What produces CSF?", "choices": ["Choroid plexus", "Anterior horn", "Adrenal cortex", "Parathyroid"], "correct": 0, "exp": "CSF is produced by choroid plexus."}, {"q": "What cells make up the choroid plexus?", "choices": ["Ependymal cells", "Schwann cells", "β-cells", "Adrenal cells"], "correct": 0, "exp": "Slides state choroid is made of ependymal cells."}, {"q": "What is the meningitis triad?", "choices": ["AMS, fever, nuchal rigidity", "Bradykinesia, tremor, rigidity", "Polyuria, polydipsia, hypernatremia", "Weight gain, cold intolerance, constipation"], "correct": 0, "exp": "Slides list AMS, fever, nuchal rigidity."}, {"q": "What is the most common bacterial cause of community-acquired meningitis in adults of all ages?", "choices": ["Streptococcus pneumoniae", "Campylobacter jejuni", "HSV", "Candida"], "correct": 0, "exp": "Slides identify Streptococcus pneumoniae."}, {"q": "What is encephalitis?", "choices": ["Infection/inflammation of brain parenchyma", "Peripheral demyelination", "Bleeding into subarachnoid space", "Endocrine disorder"], "correct": 0, "exp": "Slides define encephalitis as infection/inflammation of brain parenchyma."}, {"q": "What empiric antiviral is used for encephalitis?", "choices": ["Acyclovir", "Metformin", "Donepezil", "Hydrocodone"], "correct": 0, "exp": "Slides state empiric IV acyclovir."}, {"q": "What is acyclovir’s mechanism?", "choices": ["Inhibits viral DNA synthesis/replication via viral DNA polymerase", "Blocks COX-1/2", "Activates opioid receptors", "Replaces dopamine"], "correct": 0, "exp": "Acyclovir inhibits DNA synthesis and viral replication by competing for viral DNA polymerase and incorporation into viral DNA."}], "apply": [{"q": "A patient with brain metastasis develops morning headaches, vomiting, papilledema, and seizures. What pathophysiology explains these findings?", "choices": ["Increased ICP from increased cerebral volume in fixed intracranial cavity", "Peripheral nerve demyelination", "Low ADH", "ACh receptor antibodies"], "correct": 0, "exp": "Tumor volume raises ICP once compensation is exceeded."}, {"q": "A patient has fever, altered mental status, nuchal rigidity, petechiae, and papilledema. What condition fits best?", "choices": ["Meningitis", "Cluster headache", "ALS", "T2DM"], "correct": 0, "exp": "The triad plus additional signs fits meningitis."}, {"q": "A patient has viral brain parenchymal inflammation with cerebral edema. Empiric therapy is started with IV acyclovir and antibiotics. What diagnosis is being treated?", "choices": ["Encephalitis/meningoencephalitis", "Cauda equina", "HHS", "Parkinson disease"], "correct": 0, "exp": "Slides state encephalitis is often treated empirically with IV acyclovir and often antibiotics too."}, {"q": "A patient with suspected adult community-acquired bacterial meningitis likely has which most common bacterial pathogen from slides?", "choices": ["Streptococcus pneumoniae", "Campylobacter jejuni", "CMV", "EBV"], "correct": 0, "exp": "Slides list Streptococcus pneumoniae as most common bacterial adult community-acquired meningitis etiology."}]}, {"id": "n10", "name": "10. Seizures + AEDs", "hy": true, "cards": [{"title": "Seizure basics", "html": "<p><strong>Seizure:</strong> abrupt, paroxysmal alteration in electrical activity of neurons in the cerebral cortex; a finite episode of brain dysfunction from abnormal discharge of cerebral neurons.</p><p>Manifestations depend on the site of electrical activity and how far abnormal neural activity spreads. Manifestations may be sensory, motor, autonomic, or psychic. A convulsion is a motor seizure involving the entire body.</p><p><strong>Epilepsy:</strong> disorder characterized by recurrent seizures.</p><p>Seizures can be symptoms of underlying CNS dysfunction: injury, metabolic, infection, tumor/lesion, toxicology, vascular pathology, genetic.</p>", "hy": true}, {"title": "Seizure types", "html": "<p><strong>Focal/partial seizure:</strong> originates in a small collection of neurons in one hemisphere, with potential secondary spread.</p><p><strong>Focal aware/simple partial:</strong> confined to one hemisphere and does <strong>not</strong> involve loss of consciousness.</p><p><strong>Focal impaired/complex partial:</strong> begins in a localized area and involves impaired consciousness.</p><p><strong>Generalized seizure:</strong> widespread electrical activity across both hemispheres, impairs consciousness, may or may not be convulsive, motor manifestations are bilateral. Types include absence, myoclonic, tonic-clonic, tonic, atonic.</p>", "hy": true}, {"title": "Workup and AEDs", "html": "<p><strong>Workup:</strong> labs and imaging to search for etiology. EEG evaluates brain electrical activity; normal EEG does not rule out epilepsy.</p><p><strong>AEDs:</strong> treat seizures/epilepsy. Designed to enhance inhibitory communication and suppress excitatory communication.</p><p><strong>Main categories:</strong> GABA enhancers, glutamate blockers, sodium channel blockers, calcium current inhibitors, carbonic anhydrase inhibitors, hormones, unknown MOA.</p><p><strong>Mechanisms:</strong> modify ion conduction through Na+ or Ca++ channels, enhance GABA inhibitory transmission, reduce glutamate excitatory transmission.</p><p><strong>Status epilepticus:</strong> life-threatening. Drug of choice is IV/IM/rectal benzodiazepine such as diazepam or lorazepam.</p>", "hy": true}], "test": [{"q": "Where does a focal seizure originate?", "choices": ["One hemisphere", "Both hemispheres from onset", "Posterior pituitary", "Peripheral nerve only"], "correct": 0, "exp": "Focal seizures originate in a small collection of neurons in one hemisphere."}, {"q": "Does focal aware/simple partial seizure involve loss of consciousness?", "choices": ["Yes", "No", "Always convulsive", "Only in sleep"], "correct": 1, "exp": "Focal aware/simple partial does not involve LOC."}, {"q": "Which seizure type begins locally and impairs consciousness?", "choices": ["Focal impaired/complex partial", "Focal aware/simple partial", "Tension headache", "TIA"], "correct": 0, "exp": "Complex partial/focal impaired begins in a localized area and impairs consciousness."}, {"q": "Which seizure type involves both hemispheres from onset and impairs consciousness?", "choices": ["Focal aware", "Generalized", "Simple partial", "Radiculopathy"], "correct": 1, "exp": "Generalized seizures involve widespread activity across both hemispheres and impair consciousness."}, {"q": "Does a normal EEG rule out epilepsy?", "choices": ["Yes", "No", "Only in children", "Only if MRI is normal"], "correct": 1, "exp": "Slides state normal EEG does not rule out epilepsy."}, {"q": "What is the DOC for status epilepticus in the slides?", "choices": ["IV/IM/rectal benzodiazepine such as diazepam or lorazepam", "Donepezil", "Sumatriptan", "Ibuprofen"], "correct": 0, "exp": "Slides list benzodiazepine as DOC for status epilepticus."}, {"q": "Which AED mechanism reduces excitation?", "choices": ["Reduction of glutamate transmission", "Increased glutamate transmission", "Blocking ADH", "Increasing PTH"], "correct": 0, "exp": "AEDs may reduce glutamate excitatory transmission."}], "apply": [{"q": "A patient has a focal seizure with no loss of consciousness. What type is this?", "choices": ["Focal aware/simple partial", "Focal impaired/complex partial", "Generalized tonic-clonic", "Absence only"], "correct": 0, "exp": "Focal aware/simple partial seizures do not involve LOC."}, {"q": "A patient has a seizure that starts in one area and impairs consciousness. What type is this?", "choices": ["Focal impaired/complex partial", "Focal aware/simple partial", "Atonic generalized only", "TIA"], "correct": 0, "exp": "Focal impaired/complex partial seizures have impaired consciousness."}, {"q": "A patient has bilateral motor manifestations and impaired consciousness from onset. What seizure class is this?", "choices": ["Generalized", "Simple partial", "Radiculopathy", "Peripheral neuropathy"], "correct": 0, "exp": "Generalized seizures involve both hemispheres and impair consciousness."}, {"q": "A patient has ongoing life-threatening seizure activity. What is the drug class of choice from the slides?", "choices": ["Benzodiazepine", "NSAID", "Triptan", "Cholinesterase inhibitor"], "correct": 0, "exp": "Status epilepticus DOC is diazepam or lorazepam by IV/IM/rectal route."}]}, {"id": "n11", "name": "11. Dementia, Alzheimer, Parkinson, MS, MG, ALS, GBS", "hy": true, "cards": [{"title": "Dementia + Alzheimer", "html": "<p><strong>Dementia:</strong> progressive deterioration in cognitive function significant enough to interfere with social performance. Etiologies vary: neurodegenerative, B12 deficiency, hypothyroidism, etc.</p><p><strong>Types listed:</strong> Alzheimer disease (most common), vascular dementia from ischemic or hemorrhagic damage, frontotemporal dementia, CJD, Wernicke-Korsakoff syndrome, Huntington disease.</p><p><strong>Alzheimer pathology:</strong> amyloid beta overproduction/decreased clearance forms senile plaques. Tau proteins change form and form helical proteins, a major component of neurofibrillary tangles. Plaques and tangles are neurotoxic and replace normal neural tissue.</p><p>Atrophy/gliosis begin in hippocampus. Less acetylcholine synthesis affects memory and learning. Course is insidious/progressive, beginning with memory impairment.</p><p><strong>Med goal:</strong> slow progression. Cholinesterase inhibitors for mild disease potentiate available ACh. Donepezil increases cholinergic transmission by inhibiting cholinesterase. Memantine for moderate-severe Alzheimer symptoms is an NMDA glutamate receptor antagonist. It is symptomatic and does not prevent/slow neurodegeneration.</p>", "hy": true}, {"title": "Parkinson disease", "html": "<p><strong>Parkinson disease:</strong> slow progressive disorder from degeneration of dopamine-producing cells in the substantia nigra of the basal ganglia. Basal ganglia modulates movement.</p><p>Alpha-synuclein accumulates in Lewy bodies in brainstem, spinal cord, and cortex and contributes to neurodegeneration/cell death.</p><p>Loss of dopaminergic neurons leads to too little excitatory input from thalamus to cerebral cortex and too much inhibitory input to cortex from basal ganglia nuclei.</p><p><strong>Triad:</strong> bradykinesia, resting pill-rolling tremor (most common first symptom), muscle rigidity/mask-like facies.</p><p><strong>Levodopa/carbidopa:</strong> indicated for Parkinson disease (moderate to severe symptoms) and restless leg. Levodopa crosses BBB and is converted by striatal enzymes to dopamine. Carbidopa inhibits peripheral plasma breakdown/decarboxylation of levodopa, increasing available levodopa at BBB.</p>", "hy": true}, {"title": "MS, MG, ALS, GBS", "html": "<p><strong>MS:</strong> chronic CNS demyelinating disorder with inflammation and myelin damage. Progressive disability occurs. Characterized by remission/exacerbations. Cause unknown; theory is inflammatory immune-mediated disorder with autoreactive lymphocytes. Mechanisms: inflammation, demyelination, axonal degeneration. T cells attack myelin and oligodendroglial cells; sensory and motor neurons can be affected. Types: RRMS most common, SPMS, PPMS.</p><p><strong>MG:</strong> autoimmune neuromuscular disorder with antibodies against nicotinic ACh receptors at postsynaptic NMJ. Enough ACh exists but fewer receptors cause weak/non-existent contractions. Skeletal muscle only. Repeated stimulation causes temporary ACh depletion/presynaptic rundown. CD4 T cells stimulate B cells; ~70% have thymic hyperplasia. Extraocular muscles often first: ptosis, diplopia, fluctuating weakness; can cause respiratory failure.</p><p><strong>ALS:</strong> progressive neurodegenerative loss of UMN and LMN; eventually respiratory failure/death. Affects corticospinal UMNs in precentral gyrus and later LMNs in anterior horn and brainstem. UMNs and LMNs become sclerotic and die.</p><p><strong>GBS:</strong> acute peripheral neuropathy with progressive symmetric limb weakness. Usually post URI or gastroenteritis; common pathogens C. jejuni, Mycoplasma pneumoniae, CMV, EBV; can occur after select immunizations. Autoimmune response attacks normal myelin sheaths. Conduction defect can lead to flaccid paralysis; remyelination may allow recovery, but severe inflammation can cause axonal destruction.</p>", "hy": true}], "test": [{"q": "What is the most common dementia type listed?", "choices": ["Alzheimer disease", "CJD", "Huntington disease", "Wernicke-Korsakoff"], "correct": 0, "exp": "Slides identify Alzheimer as most common dementia."}, {"q": "Vascular dementia is due to what type of damage?", "choices": ["Ischemic or hemorrhagic damage", "ADH excess", "ACh receptor antibodies", "PTH excess"], "correct": 0, "exp": "Slides define vascular dementia this way."}, {"q": "Amyloid beta forms what in Alzheimer disease?", "choices": ["Senile plaques", "Lewy bodies", "Myelin sheaths", "Cortisol"], "correct": 0, "exp": "Amyloid beta forms senile plaques."}, {"q": "Tau protein abnormalities form what?", "choices": ["Neurofibrillary tangles", "Peripheral myelin", "PTH receptors", "CSF"], "correct": 0, "exp": "Tau changes form and contributes to neurofibrillary tangles."}, {"q": "Which Alzheimer medication class potentiates acetylcholine?", "choices": ["Cholinesterase inhibitors", "Triptans", "NSAIDs", "Opioids"], "correct": 0, "exp": "Cholinesterase inhibitors potentiate available ACh."}, {"q": "Which medication is an NMDA glutamate receptor antagonist?", "choices": ["Memantine", "Donepezil", "Levodopa", "Carbidopa"], "correct": 0, "exp": "Memantine antagonizes NMDA glutamate receptors."}, {"q": "Which neurotransmitter is associated with Parkinson disease?", "choices": ["Dopamine", "GABA", "PTH", "ADH"], "correct": 0, "exp": "Parkinson involves dopamine-producing cells."}, {"q": "Which Parkinson sign is often the most common first symptom?", "choices": ["Resting pill-rolling tremor", "Saddle anesthesia", "Low serum sodium", "GI bleeding"], "correct": 0, "exp": "Slides identify resting tremor as most common first symptom."}, {"q": "What is carbidopa’s role?", "choices": ["Inhibits peripheral breakdown/decarboxylation of levodopa", "Replaces cortisol", "Blocks viral DNA polymerase", "Inhibits COX"], "correct": 0, "exp": "Carbidopa increases available levodopa at BBB."}, {"q": "Which MS type is most common?", "choices": ["Relapsing-remitting MS", "Primary progressive MS", "Secondary progressive MS", "Myxedema MS"], "correct": 0, "exp": "RRMS is most common."}, {"q": "What receptor is targeted in myasthenia gravis?", "choices": ["Nicotinic acetylcholine receptor", "Dopamine receptor", "NMDA receptor", "ADH receptor"], "correct": 0, "exp": "MG antibodies target nicotinic ACh receptors at NMJ."}, {"q": "Which muscles are commonly first affected in MG?", "choices": ["Extraocular muscles", "Intercostal muscles only", "Lower limb only", "Smooth muscle"], "correct": 0, "exp": "Extraocular muscles are commonly first affected."}, {"q": "ALS affects which neuron types?", "choices": ["Both UMN and LMN", "Only sensory neurons", "Only autonomic neurons", "Only Schwann cells"], "correct": 0, "exp": "ALS is loss of UMN and LMN."}, {"q": "GBS usually occurs after what?", "choices": ["URI or gastroenteritis", "High calcium", "Low TSH", "Red wine"], "correct": 0, "exp": "Slides state GBS usually occurs post-infection such as URI/gastroenteritis."}], "apply": [{"q": "An older patient has insidious progressive memory impairment. Pathology shows amyloid beta plaques and tau tangles beginning in the hippocampus. What diagnosis fits?", "choices": ["Alzheimer disease", "GBS", "MG", "Cluster headache"], "correct": 0, "exp": "This is classic Alzheimer disease from slides."}, {"q": "A patient with mild Alzheimer disease is started on donepezil. What is the intended mechanism?", "choices": ["Increase cholinergic transmission by inhibiting cholinesterase", "Block COX enzymes", "Replace dopamine", "Inhibit viral DNA polymerase"], "correct": 0, "exp": "Donepezil inhibits cholinesterase to increase cholinergic transmission."}, {"q": "A patient with moderate to severe Alzheimer symptoms is prescribed memantine. What receptor does it antagonize?", "choices": ["NMDA glutamate receptor", "Nicotinic ACh receptor", "Opioid receptor", "TSH receptor"], "correct": 0, "exp": "Memantine is an NMDA glutamate receptor antagonist."}, {"q": "A patient has bradykinesia, pill-rolling tremor, rigidity, and mask-like facies. Which pathway is deficient?", "choices": ["Dopamine-producing neurons in substantia nigra", "PNS Schwann cells", "Posterior pituitary ADH", "Parathyroid calcium sensing"], "correct": 0, "exp": "Parkinson involves degeneration of dopamine-producing cells in substantia nigra."}, {"q": "A patient with Parkinson takes levodopa/carbidopa. Why is carbidopa included?", "choices": ["To inhibit peripheral levodopa breakdown and increase levodopa at BBB", "To suppress immune cells", "To block COX-1/2", "To bind opioids"], "correct": 0, "exp": "Carbidopa inhibits peripheral decarboxylation of levodopa."}, {"q": "A young adult has relapsing CNS neurologic deficits from T-cell attack on myelin and oligodendroglial cells. What disease fits?", "choices": ["Multiple sclerosis", "GBS", "ALS", "MG"], "correct": 0, "exp": "MS is immune-mediated CNS demyelination."}, {"q": "A patient has ptosis and diplopia that worsen with repeated use. What pathophysiology fits?", "choices": ["Antibodies against nicotinic ACh receptors at NMJ", "Loss of dopamine cells", "Amyloid plaques", "ICA embolus"], "correct": 0, "exp": "MG causes antibodies to postsynaptic nicotinic ACh receptors."}, {"q": "A patient has progressive loss of UMN and LMN and ultimately respiratory failure. What diagnosis fits?", "choices": ["ALS", "MG", "MS", "Alzheimer"], "correct": 0, "exp": "ALS causes UMN and LMN degeneration."}, {"q": "A patient develops flaccid paralysis after postinfectious attack on peripheral myelin. What diagnosis fits?", "choices": ["Guillain-Barré syndrome", "Parkinson disease", "Alzheimer disease", "Migraine"], "correct": 0, "exp": "GBS causes conduction defect and flaccid paralysis."}]}, {"id": "n12", "name": "12. Pain Medications + Opioids", "hy": true, "cards": [{"title": "Acetaminophen", "html": "<p><strong>Acetaminophen</strong> (Tylenol, Ofirmev) is indicated for mild to moderate musculoskeletal pain and fever.</p><p><strong>MOA:</strong> antipyretic and analgesic; believed to inhibit prostaglandin synthesis in CNS and work peripherally to block pain impulse generation. Antipyresis occurs through inhibition of the hypothalamic heat-regulating center.</p><p><strong>Adverse effect:</strong> increased liver enzymes.</p><p><strong>Box warning:</strong> hepatotoxicity.</p>", "hy": true}, {"title": "Ibuprofen", "html": "<p><strong>Ibuprofen</strong> (Advil, Motrin) is indicated for mild to moderate pain, antipyretic, and anti-inflammatory effects.</p><p><strong>MOA:</strong> reversibly inhibits COX-1 and COX-2 enzymes, decreasing formation of prostaglandin precursors.</p><p><strong>Adverse effects:</strong> GI upset, anemia, prolonged bleeding time.</p><p><strong>Black box warnings:</strong> increased risk of MI/stroke (risk increases with continued use); increased risk of GI bleed/ulceration/perforation, especially in patients with prior peptic ulcer disease and elderly.</p><p><strong>Contraindication:</strong> not used during CABG. <strong>Special feature:</strong> avoid in advanced renal disease.</p>", "hy": true}, {"title": "Opioids", "html": "<p><strong>Opioid MOA:</strong> bind opioid receptors in CNS, altering perception of pain and response to pain by inhibition of ascending pathways, producing CNS depression.</p><p><strong>Hydrocodone/APAP</strong> (Norco, Vicodin, Lorcet, Lortab): indicated for moderate to severe pain, C-II. MOA: binds opiate receptors in CNS, alters pain perception/response, suppresses cough in medullary center, causes generalized CNS depression. AE: CNS/respiratory depression, dependence, constipation. Contains APAP → hepatotoxicity risk.</p><p><strong>Morphine</strong> (Morphine, MS Contin ER): C-II, severe pain/chronic pain, available PO/SQ/IV. MOA: opioid receptor binding causing inhibition of ascending pain pathways; may cause general CNS depression. AE: drowsiness, constipation, CNS depression.</p><p><strong>Opioid black box warnings:</strong> opioid REMS, addiction risk, respiratory depression, accidental ingestion, neonatal withdrawal syndrome, CYP3A4 inhibitor interaction increasing hydrocodone levels, APAP hepatotoxicity, opioids with benzodiazepines/CNS depressants causing sedation/respiratory depression/coma/death, neuraxial risks, alcohol increasing plasma levels.</p>", "hy": true}], "test": [{"q": "What is acetaminophen indicated for?", "choices": ["Mild-moderate musculoskeletal pain and fever", "Status epilepticus", "Central DI", "MS"], "correct": 0, "exp": "Slides list mild-moderate musculoskeletal pain and fever."}, {"q": "What is acetaminophen’s box warning?", "choices": ["Hepatotoxicity", "MI/stroke", "Respiratory depression", "GI perforation"], "correct": 0, "exp": "Slides list hepatotoxicity."}, {"q": "What enzymes does ibuprofen inhibit?", "choices": ["COX-1 and COX-2", "Viral DNA polymerase", "Cholinesterase", "DOPA decarboxylase"], "correct": 0, "exp": "Ibuprofen reversibly inhibits COX-1 and COX-2."}, {"q": "Which ibuprofen black box warning is listed?", "choices": ["MI/stroke and GI bleed/ulcer/perforation", "Hepatotoxicity only", "Neonatal withdrawal", "Adrenal suppression"], "correct": 0, "exp": "Slides list MI/stroke and GI bleed/ulcer/perforation."}, {"q": "When is ibuprofen contraindicated?", "choices": ["CABG", "Mild headache", "Fever", "Stable muscle pain"], "correct": 0, "exp": "Slides state not used during CABG."}, {"q": "Which opioid example contains acetaminophen?", "choices": ["Hydrocodone/APAP", "Morphine", "Ibuprofen", "Acyclovir"], "correct": 0, "exp": "Hydrocodone/APAP contains APAP."}, {"q": "Which opioid is available PO, SQ, and IV in the slides?", "choices": ["Morphine", "Ibuprofen", "Acetaminophen", "Sumatriptan"], "correct": 0, "exp": "Slides list morphine as PO/SQ/IV."}, {"q": "What is a major opioid black box warning?", "choices": ["Respiratory depression and addiction risk", "Hypothyroidism", "Low PTH", "Hypercalcemia"], "correct": 0, "exp": "Slides list addiction risk and respiratory depression."}], "apply": [{"q": "A patient takes excessive acetaminophen and develops elevated liver enzymes. Which warning is most important?", "choices": ["Hepatotoxicity", "CVA risk only", "Hyponatremia", "Hyperthyroidism"], "correct": 0, "exp": "Acetaminophen box warning is hepatotoxicity."}, {"q": "An elderly patient with prior peptic ulcer disease wants chronic ibuprofen. Which risk from the slides matters most?", "choices": ["GI bleed/ulceration/perforation", "Acyclovir resistance", "Dopamine excess", "Hypoglycemia"], "correct": 0, "exp": "Ibuprofen increases GI bleeding/ulcer/perforation risk, especially elderly/PUD."}, {"q": "A patient with advanced renal disease asks for ibuprofen. What slide special feature applies?", "choices": ["Avoid use in advanced renal disease", "Use as first-line daily therapy", "Use during CABG", "Combine with alcohol"], "correct": 0, "exp": "Slides say avoid ibuprofen in advanced renal disease."}, {"q": "A patient combines opioids with benzodiazepines and develops severe sedation and slow breathing. Which black box warning explains this?", "choices": ["Opioids with BZD/CNS depressants can cause sedation, respiratory depression, coma, and death", "Ibuprofen causes GI upset", "Acetaminophen increases liver enzymes", "Sumatriptan causes vasoconstriction"], "correct": 0, "exp": "Slides warn about opioids with benzodiazepines/CNS depressants."}]}]}, "endo": {"title": "Endocrine", "desc": "10 sections mapped to the Endocrine learning objectives. Learn is complete slide-grounded review; Test is direct recall; Apply is PANCE-style practice.", "topics": [{"id": "e01", "name": "1. Negative Feedback", "hy": true, "cards": [{"title": "Negative feedback in endocrine regulation", "html": "<p>Hormone synthesis and release are regulated by the hormone level itself or by other peptides under the hormone’s control. Most endocrine regulation occurs by <strong>negative feedback</strong>.</p><p>Negative feedback prevents overproduction: when the effector hormone is high, upstream releasing/trophic hormones are suppressed. When the effector hormone is low, upstream stimulation increases.</p><p>Examples from slides: cortisol inhibits CRH and ACTH; T3/T4 inhibit TRH and TSH; sex hormones inhibit GnRH, LH, FSH; high calcium decreases PTH.</p>", "hy": true}], "test": [{"q": "What type of feedback regulates most endocrine hormone secretion?", "choices": ["Negative feedback", "Random release", "No feedback", "Always positive feedback"], "correct": 0, "exp": "Slides say most hormone secretion is regulated by negative feedback."}, {"q": "What happens to upstream hormones when effector hormone levels are high?", "choices": ["They are usually inhibited", "They always rise", "They become unrelated", "They are replaced by CSF"], "correct": 0, "exp": "High effector hormone suppresses upstream releasing/trophic hormones."}, {"q": "Which hormone suppresses CRH and ACTH?", "choices": ["Cortisol", "Insulin", "PTH", "Oxytocin"], "correct": 0, "exp": "Cortisol negatively feeds back on CRH and ACTH."}, {"q": "Which hormones suppress TRH and TSH?", "choices": ["T3/T4", "Cortisol", "PTH", "Glucagon"], "correct": 0, "exp": "T3/T4 inhibit TRH and TSH."}], "apply": [{"q": "A patient has very low cortisol from primary adrenal failure. What happens to ACTH?", "choices": ["Increases", "Decreases", "Becomes zero due to calcium", "No change"], "correct": 0, "exp": "Loss of cortisol negative feedback increases ACTH."}, {"q": "A patient has high T3/T4 from Graves disease. What should happen to TSH?", "choices": ["Decrease", "Increase", "Convert to ACTH", "No change"], "correct": 0, "exp": "High thyroid hormone suppresses TSH."}, {"q": "A patient has low calcium. What happens to PTH?", "choices": ["Increases", "Decreases", "Converts to insulin", "No effect"], "correct": 0, "exp": "Low calcium stimulates PTH release."}]}, {"id": "e02", "name": "2. Major Hormonal Pathways", "hy": true, "cards": [{"title": "Hypothalamus and anterior pituitary products", "html": "<p><strong>Hypothalamus products:</strong> CRH, GnRH, GHRH, somatostatin, TRH, PIF/dopamine.</p><p><strong>Anterior pituitary products:</strong> ACTH, FSH, LH, GH, TSH, prolactin.</p>", "hy": true}, {"title": "HPA, HPT, HPG, GH, prolactin", "html": "<p><strong>HPA:</strong> CRH → ACTH → cortisol. Cortisol regulates metabolism, immune response, stress response.</p><p><strong>HPT:</strong> TRH → TSH → T4 then T3. T3/T4 regulate metabolism, energy use, growth.</p><p><strong>HPG:</strong> GnRH → LH/FSH → estrogen, progesterone, testosterone. Regulates reproduction, menstrual cycle, spermatogenesis.</p><p><strong>GH axis:</strong> GHRH stimulates GH; somatostatin inhibits GH. GH stimulates IGF-1 from liver/tissues. IGF-1 promotes growth, cell repair, metabolism.</p><p><strong>Prolactin:</strong> dopamine inhibits prolactin; prolactin supports milk production. High prolactin inhibits FSH/LH and causes anovulatory cycles.</p>", "hy": true}, {"title": "Posterior pituitary, pancreas, PTH", "html": "<p><strong>ADH:</strong> hypothalamus makes it, posterior pituitary releases it; kidneys retain water and BP increases. Maintains water balance/BP.</p><p><strong>Oxytocin:</strong> hypothalamus makes it, posterior pituitary releases it; uterine contractions and milk let-down; labor, milk ejection, bonding.</p><p><strong>Pancreas:</strong> direct nutrient sensing, independent of hypothalamic-pituitary axis. β-cells release insulin to decrease glucose; α-cells release glucagon to increase glucose; δ-cells release somatostatin to inhibit insulin/glucagon; PP cells regulate GI/pancreatic secretions.</p><p><strong>PTH:</strong> from four glands on posterior thyroid. Low calcium increases PTH. PTH raises calcium through bone resorption, kidney calcium reabsorption, and vitamin D activation increasing gut absorption.</p>", "hy": true}], "test": [{"q": "What is the HPA axis sequence?", "choices": ["CRH → ACTH → cortisol", "TRH → TSH → T4/T3", "GnRH → LH/FSH → sex hormones", "GHRH → GH → IGF-1"], "correct": 0, "exp": "HPA is CRH → ACTH → cortisol."}, {"q": "What is the HPT axis sequence?", "choices": ["CRH → ACTH → cortisol", "TRH → TSH → T4/T3", "GnRH → LH/FSH → sex hormones", "Dopamine → prolactin"], "correct": 1, "exp": "HPT is TRH → TSH → thyroid hormone."}, {"q": "What is the HPG axis sequence?", "choices": ["GnRH → LH/FSH → sex hormones", "TRH → TSH → T4/T3", "CRH → ACTH → cortisol", "ADH → kidney"], "correct": 0, "exp": "HPG is GnRH → LH/FSH → sex hormones."}, {"q": "Which hypothalamic hormone inhibits GH?", "choices": ["Somatostatin", "TRH", "CRH", "GnRH"], "correct": 0, "exp": "Somatostatin inhibits GH."}, {"q": "Which hypothalamic factor inhibits prolactin?", "choices": ["Dopamine/PIF", "CRH", "GHRH", "GnRH"], "correct": 0, "exp": "Dopamine/PIF inhibits prolactin."}, {"q": "Which pancreatic cell secretes insulin?", "choices": ["β-cell", "α-cell", "δ-cell", "PP cell"], "correct": 0, "exp": "Beta cells secrete insulin."}, {"q": "Which pancreatic cell secretes glucagon?", "choices": ["β-cell", "α-cell", "δ-cell", "PP cell"], "correct": 1, "exp": "Alpha cells secrete glucagon."}, {"q": "What is the primary stimulus for PTH release?", "choices": ["Low blood calcium", "High cortisol", "High T4", "High glucose"], "correct": 0, "exp": "Low calcium increases PTH."}], "apply": [{"q": "A patient has high prolactin during breastfeeding and anovulatory cycles. Which pituitary hormones are inhibited?", "choices": ["FSH and LH", "ACTH and TSH", "ADH and oxytocin", "PTH and insulin"], "correct": 0, "exp": "Slides state high prolactin inhibits FSH and LH."}, {"q": "A patient has low calcium and increased PTH. Which action helps raise calcium?", "choices": ["Bone resorption and renal calcium reabsorption", "Decreased vitamin D activation", "Decreased gut absorption", "Increased renal calcium loss"], "correct": 0, "exp": "PTH increases bone resorption, renal calcium reabsorption, and vitamin D activation."}, {"q": "A patient has excess cortisol from adrenal cortex. Which axis is involved?", "choices": ["HPA", "HPT", "HPG", "Pancreatic nutrient sensing"], "correct": 0, "exp": "Cortisol is the effector hormone in the HPA axis."}, {"q": "A patient has low T4 with high TSH. Which pathway should you think of first?", "choices": ["HPT axis", "HPA axis", "HPG axis", "Prolactin axis"], "correct": 0, "exp": "T4/TSH are HPT axis components."}]}, {"id": "e03", "name": "3. Anterior vs Posterior Pituitary", "hy": true, "cards": [{"title": "Anterior pituitary", "html": "<p>The hypothalamus releases regulatory releasing/inhibiting hormones into the <strong>hypophyseal portal system</strong>, which directly connects hypothalamus to anterior pituitary.</p><p>The anterior pituitary responds by <strong>making and releasing its own hormones</strong> into systemic circulation. These act on peripheral target organs such as thyroid, adrenal glands, gonads, liver, breast.</p>", "hy": true}, {"title": "Posterior pituitary", "html": "<p>The hypothalamus makes <strong>ADH and oxytocin</strong> in the supraoptic and paraventricular nuclei. These hormones are transported down axons in the hypothalamo-hypophyseal tract directly into the posterior pituitary.</p><p>The posterior pituitary does <strong>not</strong> synthesize its own hormones. It stores and releases ADH and oxytocin when signaled.</p>", "hy": true}], "test": [{"q": "Which pituitary lobe makes its own hormones?", "choices": ["Anterior pituitary", "Posterior pituitary", "Both", "Neither"], "correct": 0, "exp": "Anterior pituitary makes and releases its own hormones."}, {"q": "Which pituitary lobe stores and releases hormones made in the hypothalamus?", "choices": ["Anterior pituitary", "Posterior pituitary", "Both", "Neither"], "correct": 1, "exp": "Posterior pituitary stores/releases hypothalamic ADH/oxytocin."}, {"q": "What system carries hypothalamic hormones to the anterior pituitary?", "choices": ["Hypophyseal portal system", "Circle of Willis", "Subarachnoid space", "Corticospinal tract"], "correct": 0, "exp": "Hypophyseal portal system connects hypothalamus to anterior pituitary."}, {"q": "Where are ADH and oxytocin made?", "choices": ["Hypothalamus", "Anterior pituitary", "Thyroid", "Pancreas"], "correct": 0, "exp": "ADH and oxytocin are made in hypothalamic nuclei."}, {"q": "Which posterior pituitary hormone causes kidney water retention?", "choices": ["ADH", "Oxytocin", "ACTH", "TSH"], "correct": 0, "exp": "ADH causes kidneys to retain water."}, {"q": "Which posterior pituitary hormone causes uterine contractions and milk let-down?", "choices": ["Oxytocin", "ADH", "Prolactin", "GH"], "correct": 0, "exp": "Oxytocin causes uterine contractions and milk let-down."}], "apply": [{"q": "A patient has posterior pituitary damage after trauma and develops polyuria, polydipsia, hypernatremia, and dilute urine. What hormone is deficient?", "choices": ["ADH", "ACTH", "TSH", "PTH"], "correct": 0, "exp": "Central DI is low ADH production/release."}, {"q": "A patient has a lesion that disrupts the hypophyseal portal system. Which pituitary lobe’s releasing hormone regulation is most directly affected?", "choices": ["Anterior pituitary", "Posterior pituitary", "Parathyroid", "Pancreas"], "correct": 0, "exp": "Hypothalamic releasing/inhibiting hormones regulate anterior pituitary via portal circulation."}, {"q": "A patient has failure of posterior pituitary release. Which paired hormones are most directly affected?", "choices": ["ADH and oxytocin", "ACTH and TSH", "Insulin and glucagon", "PTH and calcitriol"], "correct": 0, "exp": "Posterior pituitary releases ADH and oxytocin."}]}, {"id": "e04", "name": "4. Primary, Secondary, Tertiary Endocrine Dysfunction", "hy": true, "cards": [{"title": "Levels of endocrine dysfunction", "html": "<p>Malfunction can occur at three levels: <strong>target organ</strong>, <strong>pituitary</strong>, or <strong>hypothalamus</strong>. Diagnostic workup helps localize the problem.</p><p><strong>Primary disorder:</strong> problem in target organ (thyroid, adrenal, gonads). Most common.</p><p><strong>Secondary disorder:</strong> problem in pituitary. Rare and often affects multiple axes.</p><p><strong>Tertiary disorder:</strong> problem in hypothalamus. Rare and often affects multiple axes.</p>", "hy": true}, {"title": "Lab logic", "html": "<p>For a deficiency disorder, target gland failure usually causes a <strong>low effector hormone</strong> with <strong>high trophic hormone</strong> because the pituitary is trying to stimulate the gland.</p><p>Pituitary failure usually causes <strong>low trophic hormone</strong> and <strong>low effector hormone</strong>. Hypothalamic failure can also cause low releasing hormone, low pituitary hormone, and low effector hormone.</p>", "hy": true}], "test": [{"q": "A target organ disorder is classified as:", "choices": ["Primary", "Secondary", "Tertiary", "Autonomic"], "correct": 0, "exp": "Primary = target organ problem."}, {"q": "A pituitary disorder is classified as:", "choices": ["Primary", "Secondary", "Tertiary", "Peripheral"], "correct": 1, "exp": "Secondary = pituitary problem."}, {"q": "A hypothalamic disorder is classified as:", "choices": ["Primary", "Secondary", "Tertiary", "Iatrogenic only"], "correct": 2, "exp": "Tertiary = hypothalamus problem."}, {"q": "Low cortisol with high ACTH suggests which level?", "choices": ["Primary adrenal", "Secondary pituitary", "Tertiary hypothalamic", "Posterior pituitary"], "correct": 0, "exp": "Adrenal gland is failing; pituitary ACTH rises."}, {"q": "Low T4 with high TSH suggests which level?", "choices": ["Primary thyroid", "Secondary pituitary", "Tertiary hypothalamic", "Pancreatic"], "correct": 0, "exp": "Thyroid gland fails despite high TSH."}, {"q": "Low cortisol with low ACTH suggests which level?", "choices": ["Primary adrenal", "Pituitary secondary dysfunction", "Target organ hyperfunction", "PTH excess"], "correct": 1, "exp": "Pituitary ACTH is low, causing low cortisol."}], "apply": [{"q": "A patient has low thyroid hormone and high TSH. How is this classified?", "choices": ["Primary hypothyroidism", "Secondary hypothyroidism", "Tertiary hypothyroidism", "Hyperthyroidism"], "correct": 0, "exp": "High TSH with low T4 = primary thyroid failure."}, {"q": "A patient has low cortisol because ACTH is low from pituitary malfunction. How is this classified?", "choices": ["Primary adrenal insufficiency", "Secondary adrenal insufficiency", "Tertiary adrenal insufficiency", "Cushing disease"], "correct": 1, "exp": "Pituitary malfunction = secondary."}, {"q": "A patient has failure of hypothalamic TRH secretion causing low TSH and low T4. How is this classified?", "choices": ["Primary", "Secondary", "Tertiary", "Ectopic"], "correct": 2, "exp": "Hypothalamic dysfunction = tertiary."}]}, {"id": "e05", "name": "5. Patterns + Diagnostics", "hy": true, "cards": [{"title": "Hyperfunction and hypofunction", "html": "<p><strong>Hyperfunction</strong> = overproduction or oversecretion. Causes include tumors, autoimmune stimulation, and excessive medications. Symptoms can include hypermetabolism, hypertension, and weight loss/gain depending on system.</p><p><strong>Hypofunction</strong> = underproduction or undersecretion. Causes include autoimmune destruction, gland atrophy, surgery/radiation, and genetic defects. Symptoms can include fatigue, weight change, hypotension, poor stress response.</p><p>The effect depends on degree of dysfunction, target organ expression, and critical timing/age of onset.</p>", "hy": true}, {"title": "Diagnostic approach and pearls", "html": "<p><strong>Hormone levels:</strong> check gland hormone plus trophic hormone (e.g., cortisol + ACTH, T4 + TSH).</p><p><strong>Stimulation/suppression tests:</strong> evaluate gland reserve or feedback response.</p><p><strong>Imaging:</strong> MRI/CT for suspected tumors, especially pituitary, adrenal, thyroid.</p><p><strong>Pearls:</strong> consider medication effects first, look for patterns rather than isolated symptoms, consider multiple systems if secondary/tertiary causes suspected, and endocrine workup often requires specialist referral.</p>", "hy": true}], "test": [{"q": "What does endocrine hyperfunction mean?", "choices": ["Overproduction/oversecretion", "Underproduction", "No hormone receptors", "Only low calcium"], "correct": 0, "exp": "Slides define hyperfunction as overproduction/oversecretion."}, {"q": "What does endocrine hypofunction mean?", "choices": ["Overproduction", "Underproduction/undersecretion", "Always pituitary tumor", "Always infection"], "correct": 1, "exp": "Slides define hypofunction as underproduction/undersecretion."}, {"q": "Which is a listed cause of hormone excess?", "choices": ["Tumors", "Low magnesium only", "Saddle anesthesia", "Low CSF"], "correct": 0, "exp": "Slides list tumors, autoimmune stimulation, excessive meds."}, {"q": "Which is a listed cause of hormone deficiency?", "choices": ["Autoimmune destruction", "Increased cardiac output only", "Atrial fibrillation only", "Red wine"], "correct": 0, "exp": "Slides list autoimmune destruction, gland atrophy, surgery/radiation, genetic defects."}, {"q": "What should be checked to localize endocrine dysfunction?", "choices": ["Gland hormone plus trophic hormone", "Only CBC", "Only EKG", "Only urine color"], "correct": 0, "exp": "Slides emphasize paired gland + trophic hormone."}, {"q": "What imaging is used for suspected endocrine tumors?", "choices": ["MRI/CT", "EEG", "Non-contrast head CT only", "Chest X-ray only"], "correct": 0, "exp": "Slides list MRI/CT."}], "apply": [{"q": "A patient has symptoms of hormone excess after taking high-dose steroids. What general pearl applies?", "choices": ["Consider medication effects first", "Assume congenital disease", "Ignore symptoms", "Diagnose T1DM"], "correct": 0, "exp": "Slides: always consider medication effects first."}, {"q": "A patient has hyperpigmentation and hypotension. Which pattern should you suspect?", "choices": ["Adrenal issue", "Migraine", "Cluster headache", "PTH excess only"], "correct": 0, "exp": "Slides use hyperpigmentation + hypotension as adrenal pattern."}, {"q": "A patient has multiple hormonal axes affected. Which level should be considered?", "choices": ["Secondary or tertiary dysfunction", "Only primary target organ", "Only PNS disease", "Only pancreatic nutrient sensing"], "correct": 0, "exp": "Slides state secondary/tertiary causes often affect multiple systems."}]}, {"id": "e06", "name": "6. Selected Endocrine Disorders", "hy": true, "cards": [{"title": "Adrenal disorders: Addison and Cushing", "html": "<p><strong>Adrenal cortex:</strong> glucocorticoids, mineralocorticoids, adrenal androgens. Cortisol is the stress hormone. Aldosterone maintains fluid/sodium balance and blood pressure. DHEA/DHEAS contribute to female sexual health. Adrenal medulla produces epinephrine/norepinephrine.</p><p><strong>Addison disease:</strong> primary adrenal failure → low cortisol, high ACTH. Symptoms: fatigue, hypoglycemia, hypotension, prone to syncope. Etiologies: autoimmune disease most common in US; TB/fungal infection; metastatic carcinoma. Treatment: glucocorticoid + mineralocorticoid replacement.</p><p><strong>Cushing syndrome:</strong> cortisol excess. Etiologies: ACTH-producing pituitary adenoma (Cushing disease), adrenal adenoma/hyperplasia, ACTH-producing tumor/paraneoplastic syndrome, iatrogenic steroid exposure. Symptoms: central weight gain, moon face, skin thinning, hypertension, diabetes. Treatment: remove tumor or taper steroids.</p>", "hy": true}, {"title": "Thyroid disorders", "html": "<p><strong>Hyperthyroidism symptoms:</strong> heat intolerance, weight loss, poor appetite, brittle fine hair, soft nails, oily/moist/flushed skin, diarrhea, scant/no menses, infertility, tachycardia >100, high cardiac output, high-output heart failure risk, fine tremor, hyperreflexia, emotionally labile/irritable mood, restless yet apathetic.</p><p><strong>Hyperthyroidism etiologies:</strong> Graves disease most common; autoantibodies mimic TSH and overstimulate thyroid → ↑T3/↑T4. Goiter/autonomous thyroid activity, thyroiditis release of stored hormone, iodine exposure such as contrast/amiodarone, rare nodules/cancer.</p><p><strong>Hypothyroidism symptoms:</strong> weight gain/edema, cold intolerance, dry flaky skin, coarse dry hair/hair loss, brittle nails, constipation, heavy periods, infertility, bradycardia <60, poor exercise tolerance, hyporeflexia, slowed movement, lethargic/placid/depressed mood.</p><p><strong>Hypothyroidism etiologies:</strong> Hashimoto thyroiditis most common; post-thyroidectomy; radioiodine ablation; neck radiation; iodine deficiency; amiodarone, lithium, antithyroid drugs; rare secondary/tertiary hypothyroidism.</p>", "hy": true}, {"title": "ADH disorders and diabetes mellitus", "html": "<p><strong>SIADH:</strong> excess ADH → water retention → dilutional hyponatremia. Causes: CNS disorders (stroke, trauma), pulmonary disorders (pneumonia), medications (SSRIs), tumors with ADH secretion. Findings: low serum sodium, low serum osmolality, concentrated urine; may cause confusion and seizures. Treatment: fluid restriction, salt tablets, sometimes ADH antagonists.</p><p><strong>Diabetes insipidus:</strong> decreased ADH production (central DI from pituitary/hypothalamic trauma/surgery/tumors/ischemia/autoimmune) or decreased renal response (nephrogenic DI from genetic defects, lithium, CKD, hypercalcemia). Findings: polyuria, polydipsia, dilute urine, hypernatremia. Treatment: central DI → desmopressin; nephrogenic DI → treat cause, thiazide diuretics, NSAIDs.</p><p><strong>T1DM:</strong> autoimmune destruction of pancreatic β-cells → absolute insulin deficiency. Symptoms: polyuria, polydipsia, weight loss, fatigue, DKA risk. Treatment: lifelong insulin.</p><p><strong>T2DM:</strong> insulin resistance + relative insulin deficiency. Often asymptomatic first; later polyuria, polydipsia, blurred vision, poor wound healing. Treatment: lifestyle modification and antihyperglycemic medications.</p>", "hy": true}], "test": [{"q": "What hormone pattern defines primary adrenal failure?", "choices": ["Low cortisol, high ACTH", "High cortisol, low ACTH", "Low T4, high TSH", "High ADH, low sodium"], "correct": 0, "exp": "Addison: primary adrenal failure = low cortisol, high ACTH."}, {"q": "What is the most common cause of primary adrenal insufficiency in the US?", "choices": ["Autoimmune disease", "TB", "Lithium", "Graves"], "correct": 0, "exp": "Slides list autoimmune disease as most common in US."}, {"q": "Which Cushing etiology is called Cushing disease?", "choices": ["ACTH-producing pituitary adenoma", "Iodine deficiency", "Autoimmune adrenal destruction", "Lithium use"], "correct": 0, "exp": "Cushing disease = ACTH-producing pituitary adenoma."}, {"q": "Which hyperthyroidism cause is most common?", "choices": ["Graves disease", "Hashimoto thyroiditis", "Iodine deficiency", "Post-thyroidectomy"], "correct": 0, "exp": "Slides list Graves disease as most common hyperthyroidism cause."}, {"q": "Which hypothyroidism cause is most common?", "choices": ["Hashimoto thyroiditis", "Graves disease", "Iodine-induced hyperthyroidism", "Thyroiditis release"], "correct": 0, "exp": "Slides list Hashimoto thyroiditis as most common hypothyroidism cause."}, {"q": "Which disorder has low sodium, low serum osmolality, concentrated urine?", "choices": ["SIADH", "DI", "T1DM", "Cushing"], "correct": 0, "exp": "SIADH causes dilutional hyponatremia with concentrated urine."}, {"q": "Which disorder has polyuria, polydipsia, dilute urine, hypernatremia?", "choices": ["DI", "SIADH", "Cushing", "Hypothyroidism"], "correct": 0, "exp": "DI causes polyuria/polydipsia/dilute urine/hypernatremia."}, {"q": "What causes T1DM?", "choices": ["Autoimmune β-cell destruction", "Insulin resistance only", "Excess ADH", "Cortisol excess"], "correct": 0, "exp": "T1DM is autoimmune β-cell destruction."}, {"q": "What causes T2DM?", "choices": ["Insulin resistance plus relative insulin deficiency", "Absolute ADH loss", "Autoimmune adrenal destruction", "Pituitary ACTH excess"], "correct": 0, "exp": "T2DM = insulin resistance + relative insulin deficiency."}], "apply": [{"q": "A patient has fatigue, hypoglycemia, hypotension, syncope tendency, low cortisol, and high ACTH. What disorder is most likely?", "choices": ["Addison disease", "Cushing syndrome", "Hyperthyroidism", "SIADH"], "correct": 0, "exp": "This is primary adrenal failure/Addison disease."}, {"q": "A patient has central weight gain, moon face, skin thinning, hypertension, and diabetes. Which disorder is most likely?", "choices": ["Cushing syndrome", "Addison disease", "DI", "Hypothyroidism"], "correct": 0, "exp": "These are cortisol excess/Cushing features."}, {"q": "A patient has heat intolerance, tachycardia, fine tremor, hyperreflexia, diarrhea, and weight loss. Which disorder fits?", "choices": ["Hyperthyroidism", "Hypothyroidism", "Addison disease", "DI"], "correct": 0, "exp": "These are hyperthyroidism signs."}, {"q": "A patient has cold intolerance, bradycardia, constipation, hyporeflexia, dry skin, and weight gain. Which disorder fits?", "choices": ["Hypothyroidism", "Hyperthyroidism", "SIADH", "T1DM"], "correct": 0, "exp": "These are hypothyroidism signs."}, {"q": "A patient with pneumonia develops confusion, seizures, low sodium, low osmolality, and concentrated urine. Which disorder fits?", "choices": ["SIADH", "DI", "T2DM", "Cushing"], "correct": 0, "exp": "Pulmonary disorders like pneumonia can cause SIADH."}, {"q": "A patient after pituitary surgery develops polyuria, polydipsia, dilute urine, and hypernatremia. Which disorder fits?", "choices": ["Central DI", "SIADH", "T2DM", "Hypothyroidism"], "correct": 0, "exp": "Pituitary damage can cause central DI."}, {"q": "A young patient with polyuria, polydipsia, weight loss, fatigue, and DKA risk has which diabetes type?", "choices": ["T1DM", "T2DM", "SIADH", "Cushing"], "correct": 0, "exp": "T1DM causes absolute insulin deficiency and DKA risk."}]}, {"id": "e07", "name": "7. Excess vs Deficiency Presentations", "hy": true, "cards": [{"title": "Pattern recognition", "html": "<p><strong>Thyroid excess:</strong> hot, weight loss, tachycardia, tremor, hyperreflexia, diarrhea.</p><p><strong>Thyroid deficiency:</strong> cold, weight gain/edema, bradycardia, hyporeflexia, constipation, dry skin, depressed/lethargic mood.</p><p><strong>Cortisol excess:</strong> central weight gain, moon face, skin thinning, hypertension, diabetes.</p><p><strong>Cortisol deficiency:</strong> fatigue, hypoglycemia, hypotension, syncope prone.</p><p><strong>ADH excess:</strong> water retention, dilutional hyponatremia, low serum osmolality, concentrated urine.</p><p><strong>ADH deficiency/resistance:</strong> polyuria, polydipsia, dilute urine, hypernatremia.</p><p><strong>Insulin deficiency:</strong> polyuria, polydipsia, weight loss, fatigue, DKA risk. <strong>Insulin resistance:</strong> often asymptomatic first; later polyuria, polydipsia, blurred vision, poor wound healing.</p>", "hy": true}], "test": [{"q": "Heat intolerance, tachycardia, tremor, and hyperreflexia indicate:", "choices": ["Thyroid hormone excess", "Thyroid hormone deficiency", "ADH excess", "Cortisol deficiency"], "correct": 0, "exp": "These are hyperthyroid signs."}, {"q": "Cold intolerance, bradycardia, constipation, and hyporeflexia indicate:", "choices": ["Thyroid hormone deficiency", "Thyroid hormone excess", "ADH deficiency", "Insulin excess"], "correct": 0, "exp": "These are hypothyroid signs."}, {"q": "Central weight gain and moon face indicate:", "choices": ["Cortisol excess", "Cortisol deficiency", "ADH deficiency", "T4 deficiency"], "correct": 0, "exp": "These are Cushing signs."}, {"q": "Hypotension, hypoglycemia, and syncope tendency indicate:", "choices": ["Adrenal insufficiency", "Cushing syndrome", "Hyperthyroidism", "T2DM"], "correct": 0, "exp": "These are Addison/adrenal insufficiency signs."}, {"q": "Low sodium and concentrated urine indicate:", "choices": ["SIADH", "DI", "T1DM", "Hypothyroidism"], "correct": 0, "exp": "SIADH causes hyponatremia with concentrated urine."}, {"q": "Hypernatremia and dilute urine indicate:", "choices": ["DI", "SIADH", "Cushing", "Hypothyroidism"], "correct": 0, "exp": "DI causes hypernatremia and dilute urine."}], "apply": [{"q": "A patient feels hot all the time, has diarrhea, tachycardia, tremor, and emotional lability. Which hormone state is most likely?", "choices": ["Thyroid hormone excess", "Thyroid hormone deficiency", "Cortisol deficiency", "ADH deficiency"], "correct": 0, "exp": "This is hyperthyroidism."}, {"q": "A patient feels cold all the time, has dry skin, constipation, bradycardia, and hyporeflexia. Which hormone state is most likely?", "choices": ["Thyroid hormone deficiency", "Thyroid hormone excess", "Cortisol excess", "ADH excess"], "correct": 0, "exp": "This is hypothyroidism."}, {"q": "A patient has low sodium, confusion, seizures, and c

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PA Study App — Master Study</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0e0c;
  --surface: #1a1916;
  --surface2: #222018;
  --surface3: #28251f;
  --border: #2e2b26;
  --border2: #3a3730;
  --text: #f0ece3;
  --text2: #a09a8e;
  --text3: #6b6560;
  --accent: #e8c27a;
  --accent2: #7cc4a0;
  --accent-dim: rgba(232,194,122,.12);
  --blue: #6fa8dc;
  --blue-dim: rgba(111,168,220,.12);
  --purple: #b09ae0;
  --red: #e05c5c;
  --red-dim: rgba(224,92,92,.12);
  --green: #5cb87a;
  --green-dim: rgba(92,184,122,.12);
  --radius: 14px;
  --radius-sm: 9px;
}

html, body {
  height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
}
body { overflow: hidden; }

/* ─── TAB BAR ─── */
#tabbar {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: rgba(15,14,12,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: stretch;
  z-index: 100;
}
.tab-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  cursor: pointer; border: none; background: none;
  color: var(--text3); font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 600; transition: color .15s;
  position: relative;
}
.tab-item .ico { font-size: 17px; line-height: 1; }
.tab-item.active { color: var(--accent); }
.tab-item.active::after {
  content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
  height: 2px; background: var(--accent); border-radius: 2px;
}

/* ─── VIEWS ─── */
.view { display: none; position: fixed; top: 56px; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.view.active { display: block; }
.container { max-width: 640px; margin: 0 auto; padding: 24px 18px 80px; }

.view-head { margin-bottom: 20px; }
.view-eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.view-title { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
.view-desc { font-size: 13.5px; color: var(--text2); margin-top: 6px; line-height: 1.6; }

/* ─── TOPIC PICKER (shared by Learn/Test/Apply) ─── */
.topic-list { display: flex; flex-direction: column; gap: 9px; }
.topic-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 15px 17px; cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  transition: border-color .15s, background .15s, transform .12s;
}
.topic-card:hover { border-color: var(--accent); background: var(--surface2); transform: translateX(3px); }
.topic-num { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--accent); opacity: .45; min-width: 30px; }
.topic-info { flex: 1; }
.topic-name { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.topic-meta { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--text3); }
.topic-arrow { color: var(--text3); font-size: 18px; }
.hy-flag { font-family: 'DM Mono', monospace; font-size: 8.5px; font-weight: 500; letter-spacing: .08em; background: var(--accent-dim); color: var(--accent); padding: 2px 6px; border-radius: 20px; border: 1px solid rgba(232,194,122,.25); text-transform: uppercase; }

/* ─── BACK BTN ─── */
.back-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text3); cursor: pointer; margin-bottom: 20px; border: none; background: none; font-family: 'DM Sans', sans-serif; padding: 0; transition: color .15s; }
.back-btn:hover { color: var(--text2); }

/* ════════ TREES (VIEW tab) ════════ */
.subtab-bar { display: flex; gap: 8px; margin-bottom: 20px; }
.subtab { padding: 7px 16px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text3); font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; transition: all .15s; }
.subtab.active { background: var(--accent); border-color: var(--accent); color: #0f0e0c; }
.tree-panel { display: none; } .tree-panel.active { display: block; }
.insight-box { background: var(--surface2); border-left: 3px solid var(--accent2); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 12.5px; color: #9dc8be; font-family: 'DM Mono', monospace; margin-bottom: 16px; line-height: 1.6; }
.tree-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.tree-root { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tree-root .pill { font-size: 10px; font-family: 'DM Mono', monospace; padding: 3px 9px; border-radius: 20px; background: var(--accent); color: #0f0e0c; }
ul.tree, ul.subtree { list-style: none; padding-left: 0; margin: 0; }
ul.tree li, ul.subtree li { position: relative; padding-left: 1.3rem; margin-bottom: .15rem; }
ul.tree li::before, ul.subtree li::before { content:''; position:absolute; left:0; top:.65em; width:.75rem; height:1px; background:var(--border2); }
ul.tree li::after, ul.subtree li::after { content:''; position:absolute; left:0; top:0; width:1px; height:100%; background:var(--border2); }
ul.tree li:last-child::after, ul.subtree li:last-child::after { height:.65em; }
.node { display:inline-flex; align-items:flex-start; gap:.4rem; cursor:pointer; padding:.2rem .4rem; border-radius:4px; transition:background .1s; font-size:.82rem; line-height:1.4; max-width:100%; white-space:normal; word-break:break-word; }
.node:hover { background: var(--surface2); }
.node .toggle { font-family:'DM Mono',monospace; font-size:.7rem; color:var(--text3); width:14px; min-width:14px; display:inline-block; flex-shrink:0; margin-top:.15em; }
.node.l1 { font-weight:700; font-size:.9rem; color:var(--text); }
.node.l2 { font-weight:600; color:#c5c8d8; }
.node.l3 { font-weight:400; color:#9098b0; font-size:.78rem; cursor:default; }
.node.l4 { font-weight:400; color:var(--text3); font-size:.73rem; font-family:'DM Mono',monospace; cursor:default; }
.node .tag { font-family:'DM Mono',monospace; font-size:.58rem; padding:.1rem .35rem; border-radius:3px; color:#fff; flex-shrink:0; margin-top:.2em; }
.tag-mem { background:#c0392b; } .tag-con { background:#2980b9; } .tag-both { background:#7c5fd3; } .tag-ctx { background:#555; }
.subtree { display:none; padding-left:.6rem; margin-top:.1rem; border-left:1px solid var(--border); margin-left:.5rem; }
.subtree.open { display:block; }
.expand-all { font-family:'DM Mono',monospace; font-size:11px; color:var(--accent); cursor:pointer; border:none; background:none; text-decoration:underline; margin-bottom:14px; display:block; }
.legend { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; font-family:'DM Mono',monospace; font-size:11px; color:var(--text3); }
.legend-item { display:flex; align-items:center; gap:5px; }
.legend-dot { width:8px; height:8px; border-radius:2px; }

/* ════════ LEARN ════════ */
.learn-progress-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.learn-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #f5d89a); border-radius: 99px; transition: width .4s; width: 0%; }
.learn-counter { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text3); text-align: center; margin-bottom: 14px; }
.learn-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 26px 22px; margin-bottom: 16px;
  animation: cardIn .28s cubic-bezier(.4,0,.2,1);
}
@keyframes cardIn { from { opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
.learn-kicker { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); opacity:.8; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.learn-concept-title { font-family:'Playfair Display',serif; font-size:23px; font-weight:700; line-height:1.25; margin-bottom:14px; }
.learn-body { font-size:14.5px; line-height:1.72; color:#d8d3c8; }
.learn-body p { margin-bottom: 12px; }
.learn-body strong { color: var(--text); font-weight: 600; }
.learn-body .hl { color: var(--accent); font-weight: 500; }
.learn-body ul { margin: 10px 0 14px; padding-left: 4px; list-style: none; }
.learn-body li { position: relative; padding-left: 20px; margin-bottom: 8px; }
.learn-body li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }

/* mini table inside learn */
.learn-table { width:100%; border-collapse:collapse; margin:14px 0; font-size:12.5px; }
.learn-table th { background:var(--surface3); color:var(--accent); font-family:'DM Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; text-align:left; border:1px solid var(--border2); font-weight:500; }
.learn-table td { padding:8px 10px; border:1px solid var(--border); color:#cfc9bd; vertical-align:top; }
.learn-table tr:nth-child(even) td { background: rgba(255,255,255,.015); }

.box-mnemonic { background: var(--blue-dim); border:1px solid rgba(111,168,220,.3); border-radius:9px; padding:13px 15px; margin:14px 0; }
.box-mnemonic .lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--blue); margin-bottom:6px; display:block; }
.box-hy { background: var(--accent-dim); border:1px solid rgba(232,194,122,.3); border-radius:9px; padding:13px 15px; margin:14px 0; }
.box-hy .lbl { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; display:block; }

.learn-actions { display:flex; gap:10px; }
.learn-btn { flex:1; border:none; border-radius:var(--radius-sm); padding:15px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .15s, transform .1s; }
.learn-btn:active { transform: scale(.98); }
.learn-btn-know { background: var(--green-dim); color: var(--green); border:1.5px solid rgba(92,184,122,.4); }
.learn-btn-dunno { background: var(--surface2); color: var(--text2); border:1.5px solid var(--border2); }
.learn-nav { display:flex; justify-content:space-between; margin-top:14px; }
.learn-nav button { background:none; border:none; color:var(--text3); font-size:12.5px; cursor:pointer; font-family:'DM Mono',monospace; padding:6px; transition:color .15s; }
.learn-nav button:hover { color:var(--text); }
.learn-nav button:disabled { opacity:.3; cursor:default; }

/* learn complete */
.learn-done { text-align:center; padding:30px 10px; animation: cardIn .3s; }
.learn-done-badge { font-size:42px; margin-bottom:14px; }
.learn-done h3 { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; margin-bottom:8px; }
.learn-done p { font-size:13.5px; color:var(--text2); margin-bottom:22px; line-height:1.6; }
.learn-done-stats { display:flex; gap:10px; justify-content:center; margin-bottom:24px; }

/* ════════ TEST / APPLY (quiz) ════════ */
.quiz-progress-track { height:4px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:8px; }
.quiz-progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),#f5d89a); border-radius:99px; transition:width .4s; width:0%; }
.quiz-counter { font-family:'DM Mono',monospace; font-size:11px; color:var(--text3); text-align:center; margin-bottom:16px; }
.q-meta { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); opacity:.75; margin-bottom:10px; }
.q-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 20px; margin-bottom:12px; animation:cardIn .25s; }
.q-text { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; line-height:1.4; }
.q-text.vignette { font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500; line-height:1.6; }
.choices-list { list-style:none; display:flex; flex-direction:column; gap:9px; margin-top:14px; }
.choice-btn { width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:13px 16px; text-align:left; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text); display:flex; gap:12px; align-items:flex-start; transition:border-color .13s, background .13s; line-height:1.5; }
.choice-btn:hover:not(:disabled) { border-color:var(--border2); background:var(--surface3); }
.choice-btn:disabled { cursor:default; }
.choice-btn.correct { border-color:var(--green); background:var(--green-dim); }
.choice-btn.wrong { border-color:var(--red); background:var(--red-dim); color:var(--text2); }
.choice-btn.dimmed { opacity:.4; }
.choice-letter { font-family:'DM Mono',monospace; font-size:11px; font-weight:500; color:var(--text3); min-width:18px; padding-top:1px; flex-shrink:0; }
.choice-btn.correct .choice-letter { color:var(--green); }
.choice-btn.wrong .choice-letter { color:var(--red); }
.explanation-box { background:var(--surface2); border:1px solid var(--border2); border-radius:var(--radius-sm); padding:14px 16px; margin-top:4px; font-size:13.5px; line-height:1.7; color:var(--text2); display:none; }
.explanation-box.show { display:block; animation:fadeSlide .2s ease; }
@keyframes fadeSlide { from {opacity:0; transform:translateY(-6px);} to {opacity:1; transform:translateY(0);} }
.explanation-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; display:block; }
.next-row { display:none; justify-content:flex-end; margin-top:10px; }
.next-row.show { display:flex; }
.next-btn { background:var(--accent); color:#0f0e0c; border:none; border-radius:var(--radius-sm); padding:11px 24px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .15s; }
.next-btn:hover { opacity:.88; }

/* complete (quiz) */
.complete-wrap { text-align:center; padding:24px 10px; animation:cardIn .3s; }
.complete-badge { font-size:46px; display:block; margin-bottom:16px; }
.complete-title { font-family:'Playfair Display',serif; font-size:30px; font-weight:900; margin-bottom:8px; background:linear-gradient(135deg,#f0ece3 30%,#e8c27a 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.complete-sub { font-size:14px; color:var(--text2); margin-bottom:26px; line-height:1.6; }
.score-ring { margin:0 auto 26px; width:100px; height:100px; position:relative; display:flex; align-items:center; justify-content:center; }
.score-ring svg { position:absolute; inset:0; transform:rotate(-90deg); }
.score-ring-bg { fill:none; stroke:var(--border); stroke-width:6; }
.score-ring-fill { fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1); }
.score-pct { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; color:var(--accent); position:relative; z-index:1; }
.stats-row { display:flex; gap:10px; justify-content:center; margin-bottom:26px; }
.stat-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 18px; min-width:84px; }
.stat-val { display:block; font-family:'Playfair Display',serif; font-size:24px; font-weight:700; line-height:1; margin-bottom:4px; }
.stat-lbl { font-family:'DM Mono',monospace; font-size:10px; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; }
.cta-btns { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }
.btn-pri { background:var(--accent); color:#0f0e0c; border:none; border-radius:var(--radius-sm); padding:12px 20px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700; cursor:pointer; }
.btn-sec { background:var(--surface); color:var(--text2); border:1px solid var(--border2); border-radius:var(--radius-sm); padding:12px 20px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; }
.btn-sec:hover { border-color:var(--text3); color:var(--text); }

@media (max-width:400px){ .stats-row{gap:8px;} .stat-box{min-width:74px; padding:12px 14px;} }
</style>
</head>

<script>

/* ╔══════════════════════════════════════════════╗
   ║  CONTENT DATA — injected topic by topic below  ║
   ╚══════════════════════════════════════════════╝ */

// LEARN: each topic = { id, name, hy, cards:[{title, html, hy}] }
var LEARN = [];
// TEST: each topic = { id, name, hy, questions:[{q, choices, correct, exp}] }
var TEST = [];
// APPLY: each topic = { id, name, hy, questions:[{q, choices, correct, exp}] }
var APPLY = [];

var TREE_OBJ = '';   // injected
var TREE_SLIDE = ''; // injected

/* ════════ INJECTED CONTENT ════════ */
/* ═══════════ TREES ═══════════ */
TREE_OBJ = `
<div class="tree-wrap">
  <div class="tree-root">Exam Objectives <span class="pill">testable units</span></div>
  <ul class="tree">
    <li><span class="node l1" onclick="tog(this)"><span class="toggle">▶</span> Antimicrobial Use Strategy <span class="tag tag-con">concept</span></span>
      <ul class="subtree">
        <li><span class="node l2">Prophylaxis / Empiric / Targeted therapy</span></li>
        <li><span class="node l2">Broad vs narrow spectrum</span></li>
        <li><span class="node l2">Escalation & de-escalation logic</span></li>

LEARN.push({
  id:'use-strategy', name:'1. Antimicrobial Use Strategy', hy:true,
  cards:[
    { title:'The one question every antibiotic decision answers', hy:true, html:`
      <p>Before any drug name matters, every antimicrobial decision is really answering one chain of questions:</p>
      <ul>
        <li><strong>What is the site of infection?</strong> (lung, urine, blood, skin…)</li>
        <li><strong>What organisms live there / cause infection there?</strong></li>
        <li><strong>What drug reaches that site AND kills those organisms?</strong></li>
      </ul>
      <p>Hold onto this. Almost everything in this unit is just detail hanging off these three questions. When a drug seems random, ask: <span class="hl">what bug, what site?</span></p>` },
    { title:'Three intents: prophylaxis, empiric, targeted', hy:true, html:`
      <p>Antibiotics are given with one of three <strong>intents</strong>, and knowing which one you're in tells you how broad to go:</p>
      <table class="learn-table">
        <tr><th>Intent</th><th>When</th><th>Spectrum</th></tr>
        <tr><td><strong>Prophylaxis</strong></td><td>Before infection exists (pre-op, exposure)</td><td>Targeted to likely threat</td></tr>
        <tr><td><strong>Empiric</strong></td><td>Infection suspected, cultures not back yet</td><td><span class="hl">Broad</span> — cover the likely culprits</td></tr>
        <tr><td><strong>Targeted (definitive)</strong></td><td>Cultures + sensitivities back</td><td><span class="hl">Narrow</span> — hit the known bug</td></tr>
      </table>
      <p>The progression <strong>empiric → targeted</strong> is the whole rhythm of inpatient antibiotics: start broad to not miss, then narrow once you know.</p>` },
    { title:'Broad vs narrow — and why narrow is the goal', html:`
      <p><strong>Broad-spectrum</strong> = covers multiple organism groups or resistant bugs (MRSA, Pseudomonas, ESBL). <strong>Narrow-spectrum</strong> = limited, focused coverage.</p>
      <p>It's tempting to think broad = better. It's not. Broad-spectrum drugs:</p>
      <ul>
        <li>Kill protective normal flora → <span class="hl">C. diff</span></li>
        <li>Drive <span class="hl">resistance</span></li>
        <li>Carry more side effects</li>
      </ul>
      <p>So the principle is: <strong>broad when you must (empiric), narrow as soon as you can (targeted).</strong></p>` },
    { title:'Escalation & de-escalation', html:`
      <p>These are the two moves you make after starting therapy:</p>
      <ul>
        <li><strong>De-escalation</strong> — the goal. Narrow the regimen once cultures identify the organism. Stop drugs you no longer need.</li>
        <li><strong>Escalation</strong> — broaden if the patient isn't improving in <span class="hl">48–72 hours</span> or is clinically worsening.</li>
      </ul>
      <div class="box-hy"><span class="lbl">★ High yield</span>The 48–72 hour mark is when you reassess empiric therapy. Cultures typically finalize around then, which is also when de-escalation happens.</div>` },
  ]
});

LEARN.push({
  id:'stewardship', name:'2. Stewardship & Dangers', hy:false,
  cards:[
    { title:'Why stewardship exists', html:`
      <p><strong>Antimicrobial stewardship</strong> = using antibiotics only when needed, as narrowly as possible, for as short as possible. It exists because antibiotic overuse causes real, measurable harm.</p>
      <p>Roughly <span class="hl">30% of hospital antibiotic prescribing</span> is unnecessary or suboptimal — and every unnecessary course carries downstream risk.</p>` },
    { title:'The three big dangers', hy:true, html:`
      <p>Memorize these as the "why" behind stewardship:</p>
      <ul>
        <li><strong>C. difficile</strong> — antibiotics wipe out protective gut flora. <span class="hl">~85% of C. diff cases</span> had antibiotics in the prior 28 days.</li>
        <li><strong>Resistance</strong> — ~2.8M resistant infections/year in the US; ~35,000 deaths.</li>
        <li><strong>Adverse events</strong> — about <span class="hl">20% of hospitalized patients</span> on antibiotics have an adverse drug event.</li>
      </ul>` },
    { title:'When NOT to prescribe', hy:true, html:`
      <p>Classic exam scenarios where the right answer is <strong>"no antibiotic"</strong>:</p>
      <ul>
        <li>Viral illness (most URIs, bronchitis)</li>
        <li>Asymptomatic bacteriuria (positive urine culture, no symptoms) — except pregnancy/urologic procedures</li>
        <li>CHF exacerbation or dehydration mistaken for infection</li>
        <li>A positive flu test in an otherwise healthy outpatient</li>
      </ul>
      <div class="box-hy"><span class="lbl">★ High yield</span>Asymptomatic bacteriuria is a favorite trap — a positive culture alone does NOT justify antibiotics without symptoms.</div>` },
  ]
});

LEARN.push({
  id:'pharm-concepts', name:'3. Pharmacology Concepts', hy:true,
  cards:[
    { title:'Bioavailability — the key to IV vs PO', hy:true, html:`
      <p><strong>Bioavailability</strong> = the fraction of an oral dose that reaches systemic circulation. If a drug is ~100% bioavailable, oral works as well as IV.</p>
      <p>This matters because <span class="hl">PO is cheaper, safer, and lets patients go home</span> — so high-bioavailability drugs should be switched from IV to PO once the patient is stable.</p>` },
    { title:'The high-bioavailability drug list', hy:true, html:`
      <p>These drugs are SO well absorbed that PO ≈ IV. Worth memorizing — they're the ones you can step down early:</p>
      <ul>
        <li>Fluoroquinolones (cipro, levo, moxi)</li>
        <li>Doxycycline</li>
        <li>Metronidazole</li>
        <li>Linezolid</li>
        <li>Clindamycin</li>
        <li>Fluconazole</li>
        <li>TMP-SMX (Bactrim)</li>
      </ul>
      <div class="box-mnemonic"><span class="lbl">Memory hook</span>The "go-home" drugs — if a stable patient is on one of these IV, ask why they aren't on the pill.</div>` },
    { title:'Distribution — why location dictates use', hy:true, html:`
      <p>A drug can only treat an infection it physically <strong>reaches</strong>. This single idea explains most "only used for X" rules:</p>
      <table class="learn-table">
        <tr><th>Drug</th><th>Where it goes</th><th>So it's used for</th></tr>
        <tr><td>Nitrofurantoin</td><td>Concentrates in urine only</td><td>Uncomplicated cystitis only</td></tr>
        <tr><td>Fluoroquinolones</td><td>Penetrate bone well</td><td>Osteomyelitis</td></tr>
        <tr><td>Many drugs</td><td>Don't cross blood-brain barrier</td><td>Can't treat meningitis</td></tr>
      </table>
      <p>When you see "only for X," ask where the drug concentrates — that's usually the reason.</p>` },
    { title:'Why beta-lactams are the default', html:`
      <p>Beta-lactams (penicillins, cephalosporins, carbapenems) are the backbone of antibiotic therapy because they're:</p>
      <ul>
        <li><strong>Rapidly bactericidal</strong> — they rupture the cell wall</li>
        <li><strong>Safe and well-tolerated</strong> with extensive data</li>
        <li><strong>Widely distributed</strong> with many IV and PO forms</li>
      </ul>
      <p>Everything else (FQs, macrolides, vanco) tends to be used <span class="hl">because of an allergy, a resistance problem, or a coverage gap</span> beta-lactams can't fill.</p>` },
    { title:'Patient factors that change dosing', html:`
      <p>Same bug, same drug — but the dose changes based on the patient:</p>
      <ul>
        <li><strong>Renal function</strong> — most antibiotics are renally cleared. Use CrCl (Cockcroft-Gault) to adjust.</li>
        <li><strong>Elderly</strong> — muscle wasting means low CrCl even when serum creatinine looks normal; higher adverse-event risk.</li>
        <li><strong>Weight/BMI</strong> — matters for weight-based dosing (vancomycin).</li>
      </ul>
      <div class="box-hy"><span class="lbl">★ High yield</span>An elderly patient with "normal" creatinine can still have poor kidney function — don't be fooled into full dosing.</div>` },
  ]
});

LEARN.push({
  id:'micro', name:'4. Microbiology Foundation', hy:false,
  cards:[
    { title:'Why a little micro makes the drugs make sense', html:`
      <p>This section is <strong>context, not heavy memorization</strong> for this exam — but you need the bug groups to reason about drug choice. Think of organisms in five buckets:</p>
      <ul>
        <li>Gram-positive cocci</li>
        <li>Gram-negative bacilli</li>
        <li>Anaerobes</li>
        <li>Atypicals</li>
        <li>Resistant organisms (MRSA, Pseudomonas, ESBL)</li>
      </ul>
      <p>"Spectrum" just means which of these buckets a drug covers.</p>` },
    { title:'Gram-positive cocci — the big players', html:`
      <ul>
        <li><strong>Staph aureus</strong> — MSSA vs MRSA; highly pathogenic. Purulent skin infections, abscesses.</li>
        <li><strong>Streptococcus</strong> — Group A (pharyngitis, cellulitis, nec fasc), Strep pneumoniae (#1 CAP + meningitis).</li>
        <li><strong>Enterococcus</strong> — UTI, intra-abdominal; E. faecium can be VRE (resistant).</li>
      </ul>
      <p>When you hear "purulent cellulitis," think Staph. "Non-purulent cellulitis," think Strep.</p>` },
    { title:'Gram-negatives, anaerobes, atypicals', html:`
      <ul>
        <li><strong>Enteric gram-negatives</strong> (E. coli, Klebsiella, Proteus) — E. coli is #1 UTI. Can make ESBLs.</li>
        <li><strong>Pseudomonas</strong> — nosocomial, water-associated, hard to treat (only certain drugs cover it).</li>
        <li><strong>Anaerobes</strong> — "covers anaerobes" basically means covers <span class="hl">B. fragilis</span>; think gut, foul-smelling, necrotic infections.</li>
        <li><strong>Atypicals</strong> (Legionella, Mycoplasma, Chlamydia) — intracellular, no cell wall → beta-lactams DON'T work, need macrolides/doxy/FQ.</li>
      </ul>
      <div class="box-hy"><span class="lbl">★ High yield</span>Atypicals have no cell wall, so cell-wall drugs (beta-lactams) fail. That's why CAP coverage adds a macrolide or doxycycline.</div>` },
  ]
});

LEARN.push({
  id:'penicillins', name:'5. Beta-Lactams: Penicillins', hy:true,
  cards:[
    { title:'The penicillin ladder — narrow to broad', hy:true, html:`
      <p>Penicillins come in four tiers that <strong>climb the spectrum ladder</strong>. Learn them as a progression, not four random drugs:</p>
      <table class="learn-table">
        <tr><th>Subgroup</th><th>Example</th><th>Adds coverage of</th></tr>
        <tr><td>Natural PCN</td><td>Penicillin G/VK</td><td>Narrow: Strep, syphilis, dental</td></tr>
        <tr><td>Anti-staph PCN</td><td>Nafcillin, oxacillin, dicloxacillin</td><td><span class="hl">MSSA</span></td></tr>
        <tr><td>Aminopenicillins</td><td>Amoxicillin, ampicillin</td><td>Some gram-neg, <span class="hl">Enterococcus</span></td></tr>
        <tr><td>Extended/anti-pseudomonal</td><td>Piperacillin (in Zosyn)</td><td><span class="hl">Pseudomonas</span> + anaerobes</td></tr>
      </table>` },
    { title:'Drug-of-choice anchors for penicillins', hy:true, html:`
      <p>Each tier owns a few "drug of choice" facts worth memorizing:</p>
      <ul>
        <li><strong>Penicillin G</strong> → DOC for <span class="hl">syphilis</span></li>
        <li><strong>Anti-staph PCN (nafcillin)</strong> → DOC for <span class="hl">MSSA</span></li>
        <li><strong>Aminopenicillin (ampicillin)</strong> → DOC for <span class="hl">Enterococcus faecalis</span></li>
      </ul>
      <div class="box-hy"><span class="lbl">★ High yield</span>None of the plain penicillins cover MRSA. Anti-staph penicillins cover MSSA only — the "M" in their use is methicillin-SENSITIVE.</div>` },
    { title:'Beta-lactamase inhibitors — restoring coverage', hy:true, html:`
      <p>Many bacteria make <strong>beta-lactamase</strong> enzymes that chew up penicillins. The fix: add a <strong>beta-lactamase inhibitor (BLI)</strong> that blocks the enzyme, restoring and broadening coverage.</p>
      <table class="learn-table">
        <tr><th>Combo</th><th>Brand</th><th>Key added coverage</th></tr>
        <tr><td>Amoxicillin/clavulanate</td><td>Augmentin</td><td>MSSA, anaerobes, more gram-neg</td></tr>
        <tr><td>Ampicillin/sulbactam</td><td>Unasyn</td><td>IV version of above</td></tr>
        <tr><td>Piperacillin/tazobactam</td><td>Zosyn</td><td><span class="hl">Pseudomonas</span> + anaerobes (broadest)</td></tr>
      </table>
      <div class="box-hy"><span class="lbl">★ High yield</span>Augmentin is DOC for human/animal bite wounds. Zosyn is your broad workhorse that adds Pseudomonas.</div>` },

LEARN.push({
  id:'ceph-carb', name:'6. Cephalosporins & Carbapenems', hy:true,
  cards:[
    { title:'Cephalosporin generations — climbing the ladder', hy:true, html:`
      <p>Cephalosporins go from 1st to 5th generation, and the pattern is: <span class="hl">as generations rise, gram-negative coverage increases</span> (gram-positive coverage is strongest early and shifts as you climb).</p>
      <table class="learn-table">
        <tr><th>Gen</th><th>Example</th><th>Known for</th></tr>
        <tr><td>1st</td><td>Cefazolin, cephalexin</td><td>MSSA, surgical prophylaxis</td></tr>
        <tr><td>2nd</td><td>Cefuroxime, cefoxitin</td><td>+gram-neg; cefoxitin adds anaerobes</td></tr>
        <tr><td>3rd</td><td>Ceftriaxone; ceftazidime</td><td>Strep pneumo, gonorrhea; ceftazidime=Pseudomonas</td></tr>
        <tr><td>4th</td><td>Cefepime</td><td>Broad +Pseudomonas, no anaerobes</td></tr>
        <tr><td>5th</td><td>Ceftaroline</td><td>The cephalosporin that covers MRSA</td></tr>
      </table>` },
    { title:'Two cephalosporin facts that win points', hy:true, html:`
      <ul>
        <li><strong>Ceftriaxone</strong> (3rd gen) → DOC for <span class="hl">Strep pneumoniae</span> and gonorrhea.</li>
        <li><strong>Cefazolin</strong> (1st gen) → workhorse for <span class="hl">surgical prophylaxis</span> and MSSA.</li>
        <li><strong>No cephalosporin covers Enterococcus</strong> (except ceftaroline's limited activity) — a classic gap.</li>
        <li>Only <strong>ceftaroline (5th gen)</strong> covers MRSA.</li>
      </ul>
      <div class="box-hy"><span class="lbl">★ High yield</span>"Cephalosporins don't cover Enterococcus" is a frequently tested gap. If the bug is Enterococcus, reach for a aminopenicillin or vancomycin, not a cephalosporin.</div>` },
    { title:'Carbapenems — the broadest class', hy:true, html:`
      <p><strong>Carbapenems</strong> (meropenem, imipenem, ertapenem) are the <span class="hl">broadest antibiotic class</span>: gram-positive, gram-negative, anaerobes, AND ESBL producers.</p>
      <ul>
        <li><strong>Do NOT cover MRSA</strong> (still need vanco for that)</li>
        <li><strong>Ertapenem exception</strong>: no Pseudomonas, no Enterococcus</li>
        <li>DOC for <span class="hl">ESBL-producing gram-negatives</span></li>
      </ul>
      <p>Because they're so broad, they're reserved for serious/resistant infections — using them casually accelerates resistance.</p>
      <div class="box-mnemonic"><span class="lbl">Memory hook</span>Carbapenems cover almost everything EXCEPT MRSA. Ertapenem is the "lazy" carbapenem — it skips Pseudomonas and Enterococcus.</div>` },
  ]
});

LEARN.push({
  id:'bl-allergy', name:'7. Beta-Lactam Allergy', hy:true,
  cards:[
    { title:'Most "penicillin allergies" aren\u2019t real', hy:true, html:`
      <p>Around <span class="hl">90% of reported penicillin allergies are not true IgE-mediated allergies</span> — only about 10–15% are. Many are mislabeled side effects (nausea) or childhood rashes.</p>
      <p>This matters because falsely avoiding beta-lactams pushes patients to broader, more toxic, less effective alternatives.</p>` },
    { title:'Cross-reactivity is about the side chain', hy:true, html:`
      <p>The old teaching that penicillins and cephalosporins cross-react ~10% of the time is outdated. True cross-reactivity is driven by <strong>similar R-group side chains</strong>, <span class="hl">not the shared beta-lactam ring</span>.</p>
      <p>So a patient allergic to one beta-lactam can often safely take another with a dissimilar side chain — a side-chain chart guides this.</p>` },
    { title:'The three tiers of reaction', hy:true, html:`
      <p>How you respond depends on the <strong>type</strong> of prior reaction:</p>
      <table class="learn-table">
        <tr><th>Reaction</th><th>Meaning</th><th>Action</th></tr>
        <tr><td>Intolerance (nausea, GI)</td><td>Not an allergy</td><td>Any beta-lactam OK</td></tr>
        <tr><td>Rash / hives</td><td>Possible mild allergy</td><td>Avoid similar side chains; can often use dissimilar beta-lactam</td></tr>
        <tr><td>Anaphylaxis</td><td>True severe IgE reaction</td><td>Weigh risk/benefit; may avoid all beta-lactams</td></tr>
      </table>
      <div class="box-hy"><span class="lbl">★ High yield</span>"Nausea with penicillin" is an intolerance, NOT an allergy — these patients can receive beta-lactams.</div>` },
  ]
});

LEARN.push({
  id:'other-abx', name:'8. Other Antibiotics', hy:true,
  cards:[
    { title:'Fluoroquinolones — powerful but black-boxed', hy:true, html:`
      <p>FQs (cipro, levo, moxi) stop bacterial DNA replication (DNA gyrase/topoisomerase) and have excellent oral bioavailability. But they carry serious black box warnings.</p>
      <table class="learn-table">
        <tr><th>Drug</th><th>Best for</th><th>Gap</th></tr>
        <tr><td>Ciprofloxacin</td><td>UTI, Pseudomonas</td><td>Poor Strep pneumo</td></tr>
        <tr><td>Levofloxacin</td><td>CAP + Pseudomonas ("respiratory")</td><td>—</td></tr>
        <tr><td>Moxifloxacin</td><td>CAP + anaerobes</td><td>No Pseudomonas, no UTI</td></tr>
      </table>
      <div class="box-hy"><span class="lbl">★ High yield</span>Moxifloxacin does NOT cover Pseudomonas and is NOT used for UTI (doesn't concentrate in urine). Cipro is the UTI/Pseudomonas FQ.</div>` },
    { title:'Macrolides & tetracyclines', html:`
      <ul>
        <li><strong>Azithromycin</strong> (macrolide) — atypical coverage, added to CAP regimens, Chlamydia. Anti-inflammatory benefit in COPD. QT prolongation risk.</li>
        <li><strong>Doxycycline</strong> (tetracycline) — SSTIs incl. <span class="hl">MRSA</span> (outpatient), CAP, COPD, <span class="hl">first-line Chlamydia</span>. Not for UTI.</li>
      </ul>
      <p>Both reach atypicals (no cell wall problem) — that's why they show up in respiratory infections.</p>` },
    { title:'The gram-positive heavy hitters: vanco & linezolid', hy:true, html:`
      <ul>
        <li><strong>Vancomycin</strong> — IV is <span class="hl">DOC for MRSA</span>; broad gram-positive. Nephrotoxic, weight-based dosing, needs level monitoring. <span class="hl">PO vanco is NOT absorbed → used ONLY for C. diff.</span></li>
        <li><strong>Linezolid</strong> — covers gram-positives including <span class="hl">VRE</span>; excellent bioavailability. Watch: bone marrow suppression if >14 days, and serotonin syndrome with serotonergic/psych meds.</li>
      </ul>
      <div class="box-hy"><span class="lbl">★ High yield</span>IV vanco treats systemic MRSA. ORAL vanco stays in the gut and only treats C. diff. Same drug, opposite logic by route.</div>` },
    { title:'TMP-SMX, clindamycin, metronidazole, nitrofurantoin, fidaxomicin', hy:true, html:`
      <table class="learn-table">
        <tr><th>Drug</th><th>Owns</th><th>Watch</th></tr>
        <tr><td>TMP-SMX (Bactrim)</td><td>Outpatient MRSA, UTI, PCP prophylaxis</td><td>Folate inhibition, ↑K+</td></tr>
        <tr><td>Clindamycin</td><td>SSTI, dental, anaerobes above diaphragm</td><td><span class="hl">BBW: C. diff</span></td></tr>
        <tr><td>Metronidazole</td><td>Anaerobes + protozoa, C. diff combo, Trichomonas</td><td>Disulfiram rxn with alcohol</td></tr>
        <tr><td>Nitrofurantoin</td><td>Uncomplicated cystitis ONLY</td><td>Avoid CrCl &lt;30</td></tr>
        <tr><td>Fidaxomicin</td><td>C. diff first-line</td><td>Expensive, not GI-absorbed</td></tr>
      </table>` },
  ]
});

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ─── TREES ─── */
function injectTrees(){
  document.getElementById('tree-obj').innerHTML = TREE_OBJ;
  document.getElementById('tree-slide').innerHTML = TREE_SLIDE;
}
function switchTree(which){
  document.querySelectorAll('.subtab').forEach(function(s){s.classList.remove('active');});
  event.target.classList.add('active');
  document.getElementById('tree-obj').classList.toggle('active', which==='obj');
  document.getElementById('tree-slide').classList.toggle('active', which==='slide');
}
function tog(el){
  var li = el.closest('li'); if(!li) return;
  var sub = Array.from(li.children).find(function(c){return c.classList && c.classList.contains('subtree');});
  if(!sub) return;
  sub.classList.toggle('open');
  var tg = el.querySelector('.toggle'); if(tg) tg.textContent = sub.classList.contains('open') ? '▼' : '▶';
}
function expandAllTrees(){
  document.querySelectorAll('.tree-panel.active .subtree').forEach(function(s){s.classList.add('open');});
  document.querySelectorAll('.tree-panel.active .toggle').forEach(function(t){t.textContent='▼';});
}

/* ─── LEARN ENGINE ─── */
var learnState = { topic:null, idx:0, known:{}, };

function renderLearnHome(){
  var c = document.getElementById('learn-container');
  var html = '<div class="view-head"><div class="view-eyebrow">Understand before you memorize</div><div class="view-title">Learn</div><div class="view-desc">Concept-first walkthroughs. Tap “I know this” or “Not yet” to move through each card. Memorization facts are woven in where they belong.</div></div>';
  html += '<div class="topic-list">';
  LEARN.forEach(function(t,i){
    html += '<div class="topic-card" onclick="startLearn(\''+t.id+'\')">'+
      '<span class="topic-num">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div class="topic-info"><div class="topic-name">'+esc(t.name)+ (t.hy?' <span class="hy-flag">high yield</span>':'') +'</div>'+
      '<div class="topic-meta">'+t.cards.length+' cards</div></div>'+
      '<span class="topic-arrow">›</span></div>';
  });
  html += '</div>';
  c.innerHTML = html;
}

function startLearn(id){
  learnState.topic = LEARN.find(function(t){return t.id===id;});
  learnState.idx = 0; learnState.known = {};
  renderLearnCard();
}

function renderLearnCard(){
  var t = learnState.topic, i = learnState.idx;
  var c = document.getElementById('learn-container');
  if(i >= t.cards.length){ renderLearnDone(); return; }
  var card = t.cards[i];
  var pct = (i / t.cards.length) * 100;
  var html = '<button class="back-btn" onclick="renderLearnHome()">← All topics</button>';
  html += '<div class="learn-progress-track"><div class="learn-progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="learn-counter">'+(i+1)+' of '+t.cards.length+' · '+esc(t.name)+'</div>';
  html += '<div class="learn-card">';
  html += '<div class="learn-kicker">'+esc(t.name)+(card.hy?' &nbsp;·&nbsp; <span style="color:var(--accent)">★ high yield</span>':'')+'</div>';
  html += '<div class="learn-concept-title">'+esc(card.title)+'</div>';
  html += '<div class="learn-body">'+card.html+'</div>';
  html += '</div>';
  html += '<div class="learn-actions">'+
    '<button class="learn-btn learn-btn-dunno" onclick="learnNext(false)">Not yet</button>'+
    '<button class="learn-btn learn-btn-know" onclick="learnNext(true)">I know this</button></div>';
  html += '<div class="learn-nav"><button onclick="learnPrev()" '+(i===0?'disabled':'')+'>← back</button>'+
    '<button onclick="renderLearnDone()">skip to end →</button></div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;
}
function learnNext(known){ learnState.known[learnState.idx] = known; learnState.idx++; renderLearnCard(); }
function learnPrev(){ if(learnState.idx>0){ learnState.idx--; renderLearnCard(); } }

function renderLearnDone(){
  var t = learnState.topic;
  var known = Object.values(learnState.known).filter(Boolean).length;
  var total = t.cards.length;
  var c = document.getElementById('learn-container');
  var html = '<div class="learn-done"><div class="learn-done-badge">📖</div>'+
    '<h3>'+esc(t.name)+' complete</h3>'+
    '<p>You marked '+known+' of '+total+' cards as known. Ready to test yourself?</p>'+
    '<div class="learn-done-stats">'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">'+known+'</span><span class="stat-lbl">Known</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--text2)">'+(total-known)+'</span><span class="stat-lbl">Review</span></div>'+
    '</div>'+
    '<div class="cta-btns">'+
      '<button class="btn-pri" onclick="goTest(\''+t.id+'\')">Test this topic →</button>'+
      '<button class="btn-sec" onclick="startLearn(\''+t.id+'\')">Restudy</button>'+
      '<button class="btn-sec" onclick="renderLearnHome()">All topics</button>'+
    '</div></div>';
  c.innerHTML = html;
}

function goTest(id){
  document.querySelectorAll('.tab-item').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active');});
  document.querySelector('.tab-item[data-tab="test"]').classList.add('active');
  document.getElementById('view-test').classList.add('active');
  if(TEST.find(function(t){return t.id===id;})) startQuiz('test', id);
  else renderQuizHome('test');
}

  var html = '<div class="view-head">'+head+'</div><div class="topic-list">';
  quizData(mode).forEach(function(t,i){
    html += '<div class="topic-card" onclick="startQuiz(\''+mode+'\',\''+t.id+'\')">'+
      '<span class="topic-num">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div class="topic-info"><div class="topic-name">'+esc(t.name)+(t.hy?' <span class="hy-flag">high yield</span>':'')+'</div>'+
      '<div class="topic-meta">'+t.questions.length+' questions</div></div>'+
      '<span class="topic-arrow">›</span></div>';
  });
  html += '</div>';
  c.innerHTML = html;
}

function startQuiz(mode, id){
  var t = quizData(mode).find(function(x){return x.id===id;});
  if(!t){ renderQuizHome(mode); return; }
  quizState = { mode:mode, topic:t, queue:t.questions.slice(), idx:0, score:0, answered:0, missed:[], isRetry:false };
  renderQuizQuestion();
}

function retryMissed(){
  var s = quizState;
  if(!s.missed.length) return;
  quizState = { mode:s.mode, topic:s.topic, queue:s.missed.slice(), idx:0, score:0, answered:0, missed:[], isRetry:true };
  renderQuizQuestion();
}

function renderQuizQuestion(){
  var s = quizState, c = quizContainer(s.mode);
  if(s.idx >= s.queue.length){ renderQuizComplete(); return; }
  var q = s.queue[s.idx];
  var pct = (s.idx / s.queue.length) * 100;
  var isApply = s.mode==='apply';
  var html = '<button class="back-btn" onclick="renderQuizHome(\''+s.mode+'\')">← All topics</button>';
  html += '<div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="quiz-counter">'+(s.idx+1)+' / '+s.queue.length+' · '+esc(s.topic.name)+'</div>';
  html += '<div class="q-meta">'+(isApply?'Vignette':'Recall')+' '+(s.idx+1)+'</div>';
  html += '<div class="q-card"><div class="q-text'+(isApply?' vignette':'')+'">'+esc(q.q)+'</div>';
  var letters = ['A','B','C','D','E','F'];
  html += '<ul class="choices-list" id="choices">';
  q.choices.forEach(function(ch,ci){
    html += '<li><button class="choice-btn" data-ci="'+ci+'"><span class="choice-letter">'+letters[ci]+'</span><span>'+esc(ch)+'</span></button></li>';
  });
  html += '</ul></div>';
  html += '<div class="explanation-box" id="exp"><span class="explanation-label">Explanation</span>'+esc(q.exp)+'</div>';
  html += '<div class="next-row" id="nextrow"><button class="next-btn" id="nextbtn">'+(s.idx+1>=s.queue.length?'See Results':'Next →')+'</button></div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;

  document.querySelectorAll('#choices .choice-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ chooseAnswer(parseInt(btn.dataset.ci), q); });
  });
  document.getElementById('nextbtn').addEventListener('click', function(){ quizState.idx++; renderQuizQuestion(); });
}

function chooseAnswer(ci, q){
  var btns = document.querySelectorAll('#choices .choice-btn');
  btns.forEach(function(btn,bi){
    btn.disabled = true;
    if(bi===q.correct) btn.classList.add('correct');
    else if(bi===ci) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  quizState.answered++;
  if(ci===q.correct) quizState.score++;
  else quizState.missed.push(q);
  document.getElementById('exp').classList.add('show');
  document.getElementById('nextrow').classList.add('show');
  setTimeout(function(){ document.getElementById('exp').scrollIntoView({behavior:'smooth',block:'nearest'}); }, 80);
}

function renderQuizComplete(){
  var s = quizState, c = quizContainer(s.mode);
  var pct = s.answered>0 ? Math.round((s.score/s.answered)*100) : 0;
  var circ = 276.46;
  var missedCount = s.missed.length;
  var titleTxt = s.isRetry ? (pct>=80?'Nailed the review!':'Keep at it') : (pct>=80?'Strong!':pct>=60?'Getting there':'Keep going');
  var subTxt = (s.isRetry?'Review round · ':'')+esc(s.topic.name)+' — '+s.score+' of '+s.answered+' correct.';
  var html = '<div class="complete-wrap"><span class="complete-badge">'+(pct>=80?'🎯':pct>=60?'💪':'📚')+'</span>'+
    '<h2 class="complete-title">'+titleTxt+'</h2>'+
    '<p class="complete-sub">'+subTxt+'</p>'+
    '<div class="score-ring"><svg viewBox="0 0 100 100"><circle class="score-ring-bg" cx="50" cy="50" r="44"/>'+
    '<circle class="score-ring-fill" id="ringfill" cx="50" cy="50" r="44" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'"/></svg>'+
    '<span class="score-pct">'+pct+'%</span></div>'+
    '<div class="stats-row">'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">'+s.score+'</span><span class="stat-lbl">Correct</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--red)">'+(s.answered-s.score)+'</span><span class="stat-lbl">Wrong</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--accent)">'+s.answered+'</span><span class="stat-lbl">Total</span></div>'+
    '</div><div class="cta-btns">';
  // Retry missed — only if there are missed questions
  if(missedCount>0){
    html += '<button class="btn-pri" onclick="retryMissed()">Redo '+missedCount+' missed →</button>';
  }
  // Test mode → offer Apply for this topic (if it exists)
  if(s.mode==='test' && APPLY.find(function(t){return t.id===s.topic.id;})){
    html += '<button class="'+(missedCount>0?'btn-sec':'btn-pri')+'" onclick="goApply(\''+s.topic.id+'\')">Apply this topic 🩺</button>';
  }
  html += '<button class="btn-sec" onclick="startQuiz(\''+s.mode+'\',\''+s.topic.id+'\')">Restart</button>'+
      '<button class="btn-sec" onclick="renderQuizHome(\''+s.mode+'\')">All topics</button>'+
    '</div></div>';
  c.innerHTML = html;
  setTimeout(function(){ document.getElementById('ringfill').style.strokeDashoffset = circ-(pct/100)*circ; }, 90);
}

function goApply(id){
  document.querySelectorAll('.tab-item').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active');});
  document.querySelector('.tab-item[data-tab="apply"]').classList.add('active');
  document.getElementById('view-apply').classList.add('active');
  if(APPLY.find(function(t){return t.id===id;})) startQuiz('apply', id);
  else renderQuizHome('apply');
}

function abxSlidesQuizData(mode){ return mode==='test' ? TEST : APPLY; }
function abxSlidesStartQuiz(mode, id){
  var data = abxSlidesQuizData(mode);
  var t = data.find(function(x){return x.id===id;});
  if(!t){ abxSlidesMode = mode; renderAbxSlidesHome(); return; }
  abxSlidesQuizState = { mode:mode, topic:t, queue:t.questions.slice(), idx:0, score:0, answered:0, missed:[], isRetry:false };
  abxSlidesRenderQuestion();
}
function abxSlidesRetryMissed(){
  var s = abxSlidesQuizState;
  if(!s.missed.length) return;
  abxSlidesQuizState = { mode:s.mode, topic:s.topic, queue:s.missed.slice(), idx:0, score:0, answered:0, missed:[], isRetry:true };
  abxSlidesRenderQuestion();
}
function abxSlidesRenderQuestion(){
  var s = abxSlidesQuizState;
  var c = document.getElementById('abxslides-container');
  if(s.idx >= s.queue.length){ abxSlidesQuizComplete(); return; }
  var q = s.queue[s.idx];
  var pct = (s.idx/s.queue.length)*100;
  var html = '<button class="back-btn" data-mode="'+s.mode+'" onclick="abxSlidesBackMode(this.dataset.mode)">← All topics</button>';
  html += '<div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="quiz-counter">'+(s.idx+1)+' / '+s.queue.length+' · '+esc(s.topic.name)+'</div>';
  html += '<div class="q-meta">'+(s.mode==='apply'?'Vignette':'Recall')+' '+(s.idx+1)+'</div>';
  html += '<div class="q-card"><div class="q-text'+(s.mode==='apply'?' vignette':'')+'">'+esc(q.q)+'</div>';
  var letters = ['A','B','C','D','E'];
  html += '<ul class="choices-list" id="abxslides-choices">';
  q.choices.forEach(function(ch,ci){
    html += '<li><button class="choice-btn" data-ci="'+ci+'"><span class="choice-letter">'+letters[ci]+'</span><span>'+esc(ch)+'</span></button></li>';
  });
  html += '</ul></div>';
  html += '<div class="explanation-box" id="abxslides-exp"><span class="explanation-label">Explanation</span>'+esc(q.exp)+'</div>';
  html += '<div class="next-row" id="abxslides-nextrow"><button class="next-btn" id="abxslides-nextbtn">'+(s.idx+1>=s.queue.length?'See Results':'Next →')+'</button></div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;
  document.querySelectorAll('#abxslides-choices .choice-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ abxSlidesChoose(parseInt(btn.dataset.ci), q); });
  });
  document.getElementById('abxslides-nextbtn').addEventListener('click', function(){ abxSlidesQuizState.idx++; abxSlidesRenderQuestion(); });
}
function abxSlidesChoose(ci, q){
  var btns = document.querySelectorAll('#abxslides-choices .choice-btn');
  btns.forEach(function(btn,bi){
    btn.disabled = true;
    if(bi===q.correct) btn.classList.add('correct');
    else if(bi===ci) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  abxSlidesQuizState.answered++;
  if(ci===q.correct) abxSlidesQuizState.score++;
  else abxSlidesQuizState.missed.push(q);
  document.getElementById('abxslides-exp').classList.add('show');
  document.getElementById('abxslides-nextrow').classList.add('show');
  setTimeout(function(){document.getElementById('abxslides-exp').scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}
function abxSlidesQuizComplete(){
  var s = abxSlidesQuizState;
  var c = document.getElementById('abxslides-container');
  var pct = s.answered>0 ? Math.round((s.score/s.answered)*100) : 0;
  var circ = 276.46;
  var html = '<div class="complete-wrap"><span class="complete-badge">'+(pct>=80?'🎯':pct>=60?'💪':'📚')+'</span>'+ 
    '<h2 class="complete-title">'+(s.isRetry?(pct>=80?'Nailed it!':'Keep going'):(pct>=80?'Strong!':pct>=60?'Getting there':'Keep going'))+'</h2>'+ 
    '<p class="complete-sub">'+(s.isRetry?'Review · ':'')+esc(s.topic.name)+' — '+s.score+' of '+s.answered+' correct.</p>'+ 
    '<div class="score-ring"><svg viewBox="0 0 100 100"><circle class="score-ring-bg" cx="50" cy="50" r="44"/>'+ 
    '<circle class="score-ring-fill" id="abxslides-ring" cx="50" cy="50" r="44" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'"/></svg>'+ 
    '<span class="score-pct">'+pct+'%</span></div>'+ 
    '<div class="stats-row">'+ 
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">'+s.score+'</span><span class="stat-lbl">Correct</span></div>'+ 
      '<div class="stat-box"><span class="stat-val" style="color:var(--red)">'+(s.answered-s.score)+'</span><span class="stat-lbl">Wrong</span></div>'+ 
      '<div class="stat-box"><span class="stat-val" style="color:var(--accent)">'+s.answered+'</span><span class="stat-lbl">Total</span></div>'+ 
    '</div><div class="cta-btns">';
  if(s.missed.length) html += '<button class="btn-pri" onclick="abxSlidesRetryMissed()">Redo '+s.missed.length+' missed →</button>';
  if(s.mode==='test' && APPLY.find(function(t){return t.id===s.topic.id;}))
    html += '<button class="'+(s.missed.length?'btn-sec':'btn-pri')+'" data-id="'+s.topic.id+'" onclick="abxSlidesStartQuiz(\'apply\',this.dataset.id)">Apply 🩺</button>';
  html += '<button class="btn-sec" data-mode="'+s.mode+'" data-id="'+s.topic.id+'" onclick="abxSlidesStartQuiz(this.dataset.mode,this.dataset.id)">Restart</button>'+ 
    '<button class="btn-sec" data-mode="'+s.mode+'" onclick="abxSlidesBackMode(this.dataset.mode)">All topics</button></div></div>';
  c.innerHTML = html;
  setTimeout(function(){document.getElementById('abxslides-ring').style.strokeDashoffset=circ-(pct/100)*circ;},90);
}

  html += '<div class="explanation-box" id="abx2exp"><span class="explanation-label">Explanation</span>'+esc(q.exp)+'</div>';
  html += '<div class="next-row" id="abx2nextrow"><button class="next-btn" id="abx2nextbtn">'+(s.idx+1>=s.queue.length?'See Results':'Next →')+'</button></div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;
  document.querySelectorAll('#abx2choices .choice-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ abx2Choose(parseInt(btn.dataset.ci), q); });
  });
  document.getElementById('abx2nextbtn').addEventListener('click', function(){ abx2QuizState.idx++; abx2RenderQuestion(); });
}
function abx2Choose(ci, q){
  var btns = document.querySelectorAll('#abx2choices .choice-btn');
  btns.forEach(function(btn,bi){
    btn.disabled=true;
    if(bi===q.correct) btn.classList.add('correct');
    else if(bi===ci) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  abx2QuizState.answered++;
  if(ci===q.correct) abx2QuizState.score++;
  else abx2QuizState.missed.push(q);
  document.getElementById('abx2exp').classList.add('show');
  document.getElementById('abx2nextrow').classList.add('show');
  setTimeout(function(){document.getElementById('abx2exp').scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}
function abx2QuizComplete(){
  var s = abx2QuizState;
  var c = document.getElementById('abx2-learn-container');
  var pct = s.answered>0?Math.round((s.score/s.answered)*100):0;
  var circ=276.46;
  var html = '<div class="complete-wrap"><span class="complete-badge">'+(pct>=80?'🎯':pct>=60?'💪':'📚')+'</span>'+
    '<h2 class="complete-title">'+(s.isRetry?(pct>=80?'Nailed it!':'Keep going'):(pct>=80?'Strong!':pct>=60?'Getting there':'Keep going'))+'</h2>'+
    '<p class="complete-sub">'+(s.isRetry?'Review · ':'')+esc(s.topic.name)+' — '+s.score+' of '+s.answered+' correct.</p>'+
    '<div class="score-ring"><svg viewBox="0 0 100 100"><circle class="score-ring-bg" cx="50" cy="50" r="44"/>'+
    '<circle class="score-ring-fill" id="abx2ring" cx="50" cy="50" r="44" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'"/></svg>'+
    '<span class="score-pct">'+pct+'%</span></div>'+
    '<div class="stats-row">'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">'+s.score+'</span><span class="stat-lbl">Correct</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--red)">'+(s.answered-s.score)+'</span><span class="stat-lbl">Wrong</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--accent)">'+s.answered+'</span><span class="stat-lbl">Total</span></div>'+
    '</div><div class="cta-btns">';
  if(s.missed.length) html += '<button class="btn-pri" onclick="abx2RetryMissed()">Redo '+s.missed.length+' missed →</button>';
  if(s.mode==='test' && ABX2_APPLY.find(function(t){return t.id===s.topic.id;}))
    html += '<button class="'+(s.missed.length?'btn-sec':'btn-pri')+'" data-id="'+s.topic.id+'" onclick="abx2StartQuiz(\'apply\',this.dataset.id)">Apply 🩺</button>';
  html += '<button class="btn-sec" data-mode="'+s.mode+'" data-id="'+s.topic.id+'" onclick="abx2StartQuiz(this.dataset.mode,this.dataset.id)">Restart</button>'+
    '<button class="btn-sec" data-mode="'+s.mode+'" onclick="abx2BackMode(this.dataset.mode)">All topics</button></div></div>';
  c.innerHTML = html;
  setTimeout(function(){document.getElementById('abx2ring').style.strokeDashoffset=circ-(pct/100)*circ;},90);
}

/* ── S01: Prophylaxis / Empiric / Targeted ── */
ABX2_LEARN.push({ id:'s01', name:'1. Prophylaxis, Empiric & Targeted Coverage', hy:true, cards:[
  { title:'Three strategies of antimicrobial use', hy:true, html:`
    <p>Every antibiotic order fits one of three <strong>intents</strong>. Knowing which one you're in tells you how broad to go and what the goal is.</p>
    <table class="learn-table">
      <tr><th>Strategy</th><th>When</th><th>Goal</th></tr>
      <tr><td><strong>Prophylaxis</strong></td><td>Before infection exists</td><td>Prevent infection from occurring</td></tr>
      <tr><td><strong>Empiric</strong></td><td>Infection suspected; cultures not back yet</td><td>Cover most likely pathogens — use broad spectrum</td></tr>
      <tr><td><strong>Targeted / Definitive</strong></td><td>Cultures finalized with organism + sensitivities</td><td>De-escalate to narrow spectrum</td></tr>
    </table>` },
  { title:'Prophylaxis in detail', hy:false, html:`
    <p><strong>Prophylaxis</strong> = prevention of infection before it occurs. Three main scenarios:</p>
    <ul>
      <li><strong>Preoperative:</strong> usually one dose given just prior to incision; re-dose for prolonged surgery; post-op doses rarely required (≤24h if needed)</li>
      <li><strong>Communicable disease prevention:</strong> e.g., influenza in high-risk patients</li>
      <li><strong>Special populations:</strong> immunocompromised, pregnant/peripartum, travelers</li>
    </ul>` },
  { title:'Empiric coverage', hy:true, html:`
    <p><strong>Empiric</strong> = initial therapy before culture results are available.</p>
    <ul>
      <li>Cover the <strong>most likely pathogens</strong> for the suspected infection and site</li>
      <li>Use <span class="hl">broad-spectrum agents</span></li>
      <li>Appropriate initial therapy improves outcomes: increased survival (especially critically ill), decreased hospital length of stay</li>
    </ul>` },
  { title:'Targeted / definitive therapy', hy:true, html:`
    <p><strong>Targeted therapy</strong> = once cultures finalize with organism and sensitivity profiles.</p>
    <ul>
      <li><span class="hl">De-escalate</span> from broad spectrum → narrow spectrum</li>
      <li>Based on what the culture actually grew and what it is sensitive to</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>Empiric = broad → start. Targeted = narrow → after cultures. De-escalation is the transition between them.</div>` },
]});

/* ── S02: Broad vs Narrow Spectrum ── */
ABX2_LEARN.push({ id:'s02', name:'2. Broad vs Narrow Spectrum', hy:true, cards:[
  { title:'What makes an antibiotic "broad spectrum"?', hy:true, html:`
    <p>The slides define broad spectrum in three ways:</p>
    <ul>
      <li>Covers <strong>multiple organisms within one group</strong> (e.g., excellent gram-negative coverage)</li>
      <li>Covers <strong>multiple groups</strong> (e.g., gram-positives, gram-negatives, AND anaerobes)</li>
      <li>Covers <strong>resistant organisms</strong> such as MRSA or Pseudomonas</li>
    </ul>` },
  { title:'Narrow spectrum agents', hy:false, html:`
    <p>Narrow spectrum = <strong>limited pathogen coverage</strong>, either by nature of the drug or because resistance has developed.</p>
    <ul>
      <li>Generally <span class="hl">should NOT be used for empiric therapy</span> (in most cases)</li>
      <li><strong>Exception:</strong> may be OK empirically if the infection is <span class="hl">mild</span> and/or based on local resistance patterns (antibiogram)</li>
      <li>Goal: de-escalate to narrow spectrum once organism and sensitivities are known</li>
    </ul>` },
  { title:'The antibiogram', hy:false, html:`
    <p>An <strong>antibiogram</strong> is a local report showing resistance patterns of organisms in your hospital or community. It helps guide empiric therapy by showing which antibiotics are likely to work against local pathogens.</p>

  { title:'Escalation vs de-escalation', hy:true, html:`

      <tr><td><strong>De-escalation</strong></td><td>Change to reduce spectrum of coverage (broad → narrow)</td><td>Culture results available; patient improving; ready for oral</td></tr>

/* ── S03: Bioavailability + Oral Benefits ── */
ABX2_LEARN.push({ id:'s03', name:'3. Bioavailability & Oral Antibiotics', hy:true, cards:[
  { title:'What is bioavailability?', hy:true, html:`
    <p><strong>Bioavailability</strong> = the <span class="hl">percent of drug absorbed</span> with oral administration.</p>
    <ul>
      <li><strong>100% bioavailability</strong> = totally absorbed; IV and PO dose are equal</li>
      <li><strong>50% bioavailability</strong> = half absorbed → oral dose would need to be twice the IV dose to achieve the same effect</li>
    </ul>
    <p>When a drug has <strong>high bioavailability</strong>, the IV and PO doses are the same or very similar.</p>` },
  { title:'High-bioavailability antibiotics (memorize this list)', hy:true, html:`
    <p>These agents are reliably absorbed when given PO — PO dose ≈ IV dose:</p>
    <ul>
      <li>Fluoroquinolones (ciprofloxacin, moxifloxacin, levofloxacin)</li>
      <li>Doxycycline</li>
      <li>Metronidazole</li>
      <li>Linezolid</li>
      <li>Clindamycin</li>
      <li>Fluconazole (antifungal)</li>
      <li>Trimethoprim/Sulfamethoxazole (TMP-SMX)</li>
    </ul>
    <div class="box-mnemonic"><span class="lbl">Memory hook</span>FluD MoLe ClinT — Fluoroquinolones, Doxycycline, Metronidazole, Linezolid, Clindamycin, TMP-SMX (+ Fluconazole)</div>` },
  { title:'Benefits of oral antibiotics', hy:true, html:`
    <p>PO antibiotics are preferred when feasible because:</p>
    <ul>
      <li>Generally <strong>cost less</strong> than IV formulations; generics are least expensive</li>
      <li><strong>No IV line needed</strong> — avoids risk of line infection, thrombophlebitis</li>
      <li>No pharmacy preparation or nursing administration costs</li>
      <li>Enables patient to go home (reduces hospital stay)</li>
    </ul>
    <p><strong>Key rule:</strong> IV antibiotics are not required for initial therapy <span class="hl">unless</span> the patient cannot tolerate oral intake or has reduced absorption risk. Convert to PO once improved and tolerating oral.</p>
    <div class="box-hy"><span class="lbl">★ High yield</span>IV is NOT superior to PO when bioavailability is high and the patient is stable. Switch IV → PO early!</div>` },
  { title:'When IV is required', hy:false, html:`
    <p>Some infections almost always require IV administration:</p>
    <ul>
      <li><strong>Almost always IV:</strong> endocarditis, Staph aureus bacteremia</li>
      <li><strong>Often IV:</strong> osteomyelitis, meningitis</li>
    </ul>
    <p>Cost does NOT correlate with spectrum of coverage — an expensive drug isn't necessarily broader or better.</p>` },
]});

/* ── S04: Penicillin Allergy Investigation ── */
ABX2_LEARN.push({ id:'s04', name:'4. Investigating Penicillin Allergy', hy:true, cards:[
  { title:'Most reported penicillin allergies are not true allergies', hy:true, html:`
    <p>Penicillin allergy is commonly reported, but:</p>
    <ul>
      <li>Only <span class="hl">10–15% of patients</span> who report an allergy have a true IgE-mediated allergy</li>
      <li>Often side effects are reported as allergies, or the patient doesn't remember the reaction</li>
      <li>Risk of anaphylaxis from penicillin is ~0.01%</li>
    </ul>
    <p><strong>Take home message: You must investigate!</strong> Beta-lactams are excellent antibiotics — do not limit their use without proper evaluation.</p>` },
  { title:'Three tiers of reaction and how to respond', hy:true, html:`
    <table class="learn-table">
      <tr><th>Reaction type</th><th>Meaning</th><th>Response</th></tr>
      <tr><td>Intolerance / side effect (nausea, anxiety)</td><td>Not an allergy</td><td>OK to use ANY beta-lactam if compliance won't be an issue</td></tr>
      <tr><td>True allergy (rash, hives)</td><td>Possible IgE reaction</td><td>Avoid beta-lactams with <span class="hl">similar side chains</span> (use chart reference)</td></tr>
      <tr><td>Severe allergy / anaphylaxis</td><td>True IgE-mediated</td><td>Weigh risks/benefits; consider alternatives; may need to avoid all beta-lactams</td></tr>
    </table>` },
  { title:'Cross-reactivity: it\'s the side chain, not the ring', hy:true, html:`
    <p>Historically it was believed the shared beta-lactam core caused cross-reactions. Now understood to be the <span class="hl">side chain structure</span>.</p>
    <ul>
      <li>Avoid agents with <strong>similar side chains</strong></li>
      <li>Minimal risk of cross-reaction (<1–2%) if using a beta-lactam with a <span class="hl">dissimilar side chain</span></li>
      <li>Other antibiotic classes have no risk of cross-reaction</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>The reference chart from Northwestern Medicine shows which agents to avoid vs. which can be used safely based on side-chain similarity.</div>` },
]});

ABX2_TEST.push({ id:'s04', name:'4. Investigating Penicillin Allergy', hy:true, questions:[

/* ── S05: Beta-Lactamase Inhibitors ── */
ABX2_LEARN.push({ id:'s05', name:'5. Beta-Lactamase Inhibitors', hy:true, cards:[
  { title:'What are beta-lactamases and why do they matter?', hy:true, html:`
    <p><strong>Beta-lactamases</strong> are enzymes produced by bacteria that <span class="hl">degrade beta-lactam antibiotics</span> — a major resistance mechanism.</p>
    <p><strong>Beta-lactamase inhibitors (BLIs)</strong> are drugs that block these enzymes. When combined with a beta-lactam, they <span class="hl">restore and extend the spectrum</span> of that antibiotic.</p>
    <p>BLI drugs: clavulanate, sulbactam, tazobactam</p>
    <p>Formula: <strong>Antibiotic + BLI = increased spectrum compared to the antibiotic alone</strong></p>` },
  { title:'Aminopenicillin + BLI combos', hy:true, html:`
    <table class="learn-table">
      <tr><th>Combo</th><th>Route</th><th>Brand</th><th>Added coverage vs plain aminopenicillin</th></tr>
      <tr><td>Amoxicillin/Clavulanate</td><td>PO</td><td>Augmentin®</td><td>+ MSSA, + anaerobes, + more gram-negatives</td></tr>
      <tr><td>Ampicillin/Sulbactam</td><td>IV</td><td>Unasyn®</td><td>+ MSSA, + anaerobes, + more gram-negatives</td></tr>
    </table>
    <p><strong>Note:</strong> No change in Strep or Enterococcus coverage (already covered by plain aminopenicillin)</p>
    <div class="box-hy"><span class="lbl">★ High yield</span>Amox/Clavulanate (Augmentin) is <strong>drug of choice for bite wound infections</strong>.</div>` },
  { title:'Extended spectrum penicillin + BLI: Piperacillin-Tazobactam (Zosyn)', hy:true, html:`
    <p><strong>Piperacillin-Tazobactam (Pip/Tazo, Zosyn®)</strong> — IV only</p>
    <ul>
      <li><strong>Broad spectrum</strong></li>
      <li>Covers: Enterobacterales, <span class="hl">Pseudomonas</span>, gram-positives (incl. Enterococcus), and anaerobes</li>
      <li>Great for empiric coverage of severe/nosocomial infections, but not routinely used for targeted therapy (overly broad)</li>
    </ul>
    <div class="box-mnemonic"><span class="lbl">Comparison</span>Amox/Clav adds MSSA + anaerobes to an aminopenicillin. Pip/Tazo goes further — adds Pseudomonas + Enterococcus on top of that.</div>` },

/* ── S06: Patient Factors for Dosing ── */
ABX2_LEARN.push({ id:'s06', name:'6. Patient Factors for Antibiotic Dosing', hy:false, cards:[
  { title:'Renal dysfunction and dose adjustment', hy:true, html:`
    <p><strong>Vast majority of antibiotics need dose adjustment</strong> for reduced renal function.</p>
    <ul>
      <li>Doses adjusted based on <span class="hl">CrCl calculated by Cockcroft-Gault equation</span></li>
      <li>Reduced renal function → decreased efficacy, increased toxicity (drug accumulation), or both</li>
    </ul>
    <p>Examples from slides:</p>
    <ul>
      <li><strong>Nitrofurantoin</strong> — reduced efficacy with low CrCl (concentrate less in urine); avoid if CrCl &lt;30</li>
      <li><strong>Fluoroquinolones + cephalosporins</strong> — increased CNS toxicity (confusion, hallucinations) if not dose-reduced</li>
      <li><strong>Vancomycin</strong> — accumulation can cause renal failure</li>
    </ul>` },
  { title:'Special considerations for elderly patients', hy:true, html:`
    <ul>
      <li>Often have <strong>muscle wasting and kidney dysfunction</strong></li>
      <li>Dose adjust based on CrCl — <span class="hl">serum creatinine may look normal</span> despite truly reduced kidney function (low muscle mass → low creatinine production)</li>
      <li>Consider weight and BMI when choosing regimen</li>
      <li><strong>More susceptible to adverse events</strong>, especially if meds not dose-adjusted for renal dysfunction</li>
      <li>Highest rate of outpatient antibiotic prescribing is in patients <span class="hl">over age 65</span> (CDC 2019)</li>
    </ul>` },
  { title:'The 5 patient-specific factors (from regimen selection slides)', hy:false, html:`
    <p>When selecting an antibiotic regimen, consider:</p>
    <ul>
      <li><strong>Severity of illness</strong></li>
      <li><strong>Culture history</strong></li>
      <li><strong>Allergies</strong></li>
      <li><strong>Renal function</strong></li>
      <li><strong>Comorbidities</strong></li>
    </ul>` },
]});

/* ── S07: Antimicrobial Stewardship ── */
ABX2_LEARN.push({ id:'s07', name:'7. Antimicrobial Stewardship', hy:false, cards:[
  { title:'Purpose of antimicrobial stewardship', hy:false, html:`
    <p><strong>Antimicrobial stewardship</strong> = optimizing antimicrobial use. CDC definition: "always use antibiotics appropriately and safely — only when they are needed to treat disease, and to choose the right antibiotics and to administer them in the right way."</p>
    <p>Goals: improved outcomes, fewer adverse events, financial savings, reduced length of stay, <span class="hl">slowed resistance development</span>.</p>` },
  { title:'The scope of the problem', hy:true, html:`
    <ul>
      <li>About <strong>20% of hospitalized patients</strong> receive an antibiotic during admission</li>
      <li>Approximately <span class="hl">30% of antibiotic prescribing</span> in US acute care hospitals is unnecessary or suboptimal</li>
      <li>Misuse ranges from: given when not needed (CHF, viral illness), continued when unnecessary, incorrect dosing, broad spectrum used for susceptible bacteria, drugs that don't cover the pathogen</li>
    </ul>` },
  { title:'Dangers of antibiotic use', hy:true, html:`
    <ul>
      <li><strong>Adverse events</strong> — ~20% of hospitalized patients on antibiotics experience an adverse event (allergy, nephrotoxicity, etc.)</li>
      <li><strong>Resistance</strong> — &gt;2.8 million resistant infections/year in US; &gt;35,000 deaths; $20 billion in excess direct healthcare costs</li>
      <li><strong>C. difficile</strong> — 223,900 cases in 2017 in hospitalized patients; 12,800 deaths; ~35% recurrence; $6.3 billion in annual US costs; up to <span class="hl">85% of C. diff patients</span> had antibiotic exposure in the prior 28 days</li>
    </ul>` },
  { title:'How to become an antimicrobial steward', hy:true, html:`
    <p><strong>When to hold antibiotics (monitor off antibiotics):</strong></p>
    <ul>
      <li>Non-infectious process highly suspected (CHF vs. pneumonia; dementia + dehydration vs. UTI)</li>
      <li>Altered mental status does NOT equal UTI</li>
      <li>Predominantly viral infection (sinusitis, bronchitis, pharyngitis)</li>
      <li>Asymptomatic bacteriuria</li>
      <li>Patients who test positive for influenza (healthy outpatients)</li>
    </ul>
    <p><strong>Stewardship actions:</strong> narrow antibiotics as soon as cultures available; eliminate MRSA coverage ASAP when not needed; change to PO with high bioavailability when stable; use cost-effective/convenient agents.</p>` },
]});

/* ── S08: Steps of Selecting an Antibiotic Regimen ── */
ABX2_LEARN.push({ id:'s08', name:'8. Steps to Select an Antibiotic Regimen', hy:true, cards:[
  { title:'The 5-step framework', hy:true, html:`
    <p>From slides 24–26, the process of managing antimicrobial therapy has five steps:</p>
    <ul>
      <li><strong>1. What (Determine the infection):</strong> identify the site; consider most common organisms; order appropriate workup and cultures</li>
      <li><strong>2. Who (Patient factors):</strong> severity, culture history, allergies, renal function, comorbidities</li>
      <li><strong>3. Design initial regimen:</strong> drug must reach site + cover suspected organisms; use PO if able; avoid redundancy; dose for indication + renal function; be cost-effective</li>
      <li><strong>4. Modify daily:</strong> evaluate daily; stop unnecessary agents ASAP; narrow when sensitivities known; transition to oral</li>
      <li><strong>5. Duration + monitoring:</strong> use treatment guideline ranges; shorter for mild illness or rapid improvement; rarely &gt;7 days; routine labs for prolonged courses (&gt;2 weeks)</li>
    </ul>` },
  { title:'Key design principles for the initial regimen', hy:true, html:`
    <ul>
      <li>Drug <strong>must get to the site</strong> of infection and <strong>cover suspected organisms</strong></li>
      <li><strong>Use PO agents if able</strong></li>
      <li>Avoid redundancy — combination therapy should cover <span class="hl">different organisms</span> and/or have different mechanisms (don't overlap)</li>
      <li>Dose for indication and renal function</li>
      <li>Be cost-effective</li>
    </ul>` },
  { title:'Modify daily', hy:false, html:`
    <ul>
      <li>Evaluate therapy every day</li>
      <li><strong>Stop unnecessary agents ASAP</strong> (e.g., if no Staph aureus found, stop vancomycin)</li>
      <li>Narrow once susceptibilities are known</li>
      <li>Transition to oral therapy when applicable</li>
    </ul>` },
  { title:'Duration and monitoring', hy:false, html:`
    <ul>
      <li>Guidelines suggest a <strong>duration range</strong> — select shorter courses for mild/moderate illness and rapid improvement</li>
      <li>Rarely need more than <span class="hl">7 days</span></li>
      <li>Routine lab monitoring may be needed for <strong>prolonged courses (&gt;2 weeks)</strong></li>
    </ul>` },
]});

/* ── S09: Why Beta-Lactams Preferred ── */
ABX2_LEARN.push({ id:'s09', name:'9. Why Beta-Lactams Are Preferred', hy:true, cards:[
  { title:'The properties that make beta-lactams the backbone', hy:true, html:`
    <p>Beta-lactams (penicillins, cephalosporins, carbapenems) are <strong>preferred over other antibiotics</strong> because:</p>
    <ul>
      <li><strong>Mechanism: cause bacterial cell wall rupture</strong> → potent, cause rapid bacterial cell death</li>
      <li><strong>Generally safe and well tolerated</strong></li>
      <li><strong>Well studied</strong> with extensive clinical use experience</li>
      <li><strong>Excellent options</strong> when bacteria are susceptible</li>
      <li><strong>Distribute widely</strong> throughout body in various tissues and fluids — effective for many types of infections</li>
      <li><strong>Variety of agents</strong> available in IV and/or PO form</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>When an organism is susceptible, beta-lactams are almost always the preferred class. Other classes (FQs, vancomycin, etc.) are used when there is allergy, intolerance, or organism resistance.</div>` },
  { title:'Beta-lactam subgroups', hy:false, html:`
    <p>Subgroups group together agents with similar properties or spectrum of activity:</p>
    <ul>
      <li><strong>Penicillins</strong> (4 subgroups: natural, anti-staph, aminopenicillins, extended)</li>
      <li><strong>Cephalosporins</strong> (categorized by generations)</li>
      <li><strong>Carbapenems</strong></li>
    </ul>
    <p>Most agents require renal dose adjustment.</p>` },
]});

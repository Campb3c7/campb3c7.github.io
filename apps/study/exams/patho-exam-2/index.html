/* ── S10: Black Box Warnings ── */
ABX2_LEARN.push({ id:'s10', name:'10. Black Box Warnings', hy:true, cards:[
  { title:'Fluoroquinolone black box warnings', hy:true, html:`
    <p>Fluoroquinolones (levofloxacin, moxifloxacin, ciprofloxacin) carry multiple black box warnings:</p>
    <ul>
      <li><span class="hl">Tendon rupture and/or inflammation</span></li>
      <li><span class="hl">Exacerbation of myasthenia gravis</span></li>
      <li><span class="hl">Risk of aortic aneurysm or dissection</span> (data mixed)</li>
      <li><strong>CNS side effects</strong> — particularly altered mental status, especially in elderly</li>
      <li><strong>QT prolongation</strong> → risk of arrhythmia (lowest risk with ciprofloxacin, highest with moxifloxacin)</li>
    </ul>` },
  { title:'Clindamycin black box warning', hy:true, html:`
    <p><strong>Clindamycin: Black box warning = high risk for causing C. difficile colitis</strong></p>
    <ul>
      <li>Not a first-line agent due to substantial resistance rates</li>
      <li>Reserve for patients with allergy or intolerance to first-line agents</li>
    </ul>` },
  { title:'Why these matter clinically', hy:false, html:`
    <table class="learn-table">
      <tr><th>Drug</th><th>BBW</th><th>Clinical pearl</th></tr>
      <tr><td>Fluoroquinolones</td><td>Tendon rupture, myasthenia exacerbation, aortic aneurysm/dissection, CNS effects, QT prolongation</td><td>Avoid in patients with myasthenia gravis; use caution in elderly (CNS); check QT</td></tr>
      <tr><td>Clindamycin</td><td>C. difficile colitis</td><td>Reserve for allergy/intolerance to first-line agents; not first-line</td></tr>
    </table>` },
]});

  { title:'Carbapenems: broadest of all antibiotic classes', hy:true, html:`

  { title:'Local vs systemic fungal disease', hy:false, html:`

/* ── S19: Azole Narrow vs Broad Spectrum ── */
ABX2_LEARN.push({ id:'s19', name:'19. Azole Antifungal Spectrum', hy:true, cards:[
  { title:'The azole spectrum ladder', hy:true, html:`
    <p>Azoles are the most frequently used class of systemic antifungals. Their spectrum varies significantly:</p>
    <table class="learn-table">
      <tr><th>Azole</th><th>Susceptible Candida</th><th>Endemic Fungi</th><th>Resistant Candida</th><th>Aspergillus</th><th>Mucorales</th></tr>
      <tr><td><strong>Fluconazole</strong></td><td>DOC</td><td>+</td><td>n/a</td><td>n/a</td><td>n/a</td></tr>
      <tr><td><strong>Itraconazole</strong></td><td>++</td><td>DOC</td><td>n/a</td><td>+</td><td>n/a</td></tr>
      <tr><td><strong>Voriconazole</strong></td><td>++</td><td>++</td><td>DOC</td><td>DOC</td><td>n/a</td></tr>
      <tr><td><strong>Posaconazole / Isavuconazole</strong></td><td>++</td><td>++</td><td>++</td><td>DOC</td><td>DOC</td></tr>
    </table>
    <p><small>n/a = unreliable or zero coverage; + limited; ++ reliable; DOC = drug of choice</small></p>` },
  { title:'Fluconazole — narrowest azole', hy:true, html:`
    <ul>
      <li>Most commonly used systemic azole — most narrow and benign</li>
      <li>Low risk of drug interactions and adverse events</li>
      <li>High bioavailability (IV = PO), crosses BBB, achieves urinary concentrations</li>
      <li>DOC for susceptible Candida infections (C. albicans, C. parapsilosis remain highly susceptible)</li>
      <li><strong>Gaps:</strong> C. krusei and C. glabrata have baseline/increased resistance; NO Aspergillus; NO Mucorales</li>
    </ul>` },
  { title:'Voriconazole and posaconazole/isavuconazole', hy:true, html:`
    <p><strong>Voriconazole:</strong></p>
    <ul>
      <li>Enhanced coverage: Aspergillus and resistant Candida (C. krusei and C. glabrata)</li>
      <li><span class="hl">Drug of choice for Aspergillosis</span></li>
      <li><span class="hl">Lacks activity against Mucorales</span> — this is a critical gap</li>
    </ul>
    <p><strong>Posaconazole and Isavuconazole (broadest):</strong></p>
    <ul>
      <li>Cover yeasts, molds, <span class="hl">AND Mucorales</span></li>

]});

var RENAL_LEARN = [];

function showRenalMode(mode){ renalSubTab=mode; renderRenalHome(); }

function renalStart(mode, id) {
  if(mode === 'learn') {
    var t = RENAL_LEARN.find(function(x){return x.id===id;});
    if(!t) return;
    renalLearnState = { topic:t, idx:0, known:{} };
    renalRenderLearnCard();
  } else {
    renalStartQuiz(mode, id);
  }
}

/* ─── RENAL LEARN ─── */
var renalLearnState = { topic:null, idx:0, known:{} };

function renalRenderLearnCard() {
  var t = renalLearnState.topic, i = renalLearnState.idx;
  var c = document.getElementById('renal-learn-container');
  if(i >= t.cards.length){ renalLearnDone(); return; }
  var card = t.cards[i];
  var pct = (i / t.cards.length) * 100;
  var html = '<button class="back-btn" onclick="renalBackToLearn()">← All topics</button>';
  html += '<div class="learn-progress-track"><div class="learn-progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="learn-counter">'+(i+1)+' of '+t.cards.length+' · '+esc(t.name)+'</div>';
  html += '<div class="learn-card">';
  html += '<div class="learn-kicker">'+esc(t.name)+(card.hy?' &nbsp;·&nbsp; <span style="color:var(--accent)">★ high yield</span>':'')+'</div>';
  html += '<div class="learn-concept-title">'+esc(card.title)+'</div>';
  html += '<div class="learn-body">'+card.html+'</div>';
  html += '</div>';
  html += '<div class="learn-actions">'+
    '<button class="learn-btn learn-btn-dunno" onclick="renalLearnNext(false)">Not yet</button>'+
    '<button class="learn-btn learn-btn-know" onclick="renalLearnNext(true)">I know this</button></div>';
  html += '<div class="learn-nav"><button onclick="renalLearnPrev()" '+(i===0?'disabled':'')+'>← back</button>'+
    '<button onclick="renalLearnDone()">skip to end →</button></div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;
}
function renalLearnNext(known){ renalLearnState.known[renalLearnState.idx]=known; renalLearnState.idx++; renalRenderLearnCard(); }
function renalLearnPrev(){ if(renalLearnState.idx>0){renalLearnState.idx--;renalRenderLearnCard();} }
function renalLearnDone(){
  var t = renalLearnState.topic;
  var known = Object.values(renalLearnState.known).filter(Boolean).length;
  var c = document.getElementById('renal-learn-container');
  var html = '<div class="learn-done"><div class="learn-done-badge">📖</div>'+
    '<h3>'+esc(t.name)+'</h3>'+
    '<p>You marked '+known+' of '+t.cards.length+' cards as known.</p>'+
    '<div class="learn-done-stats">'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">'+known+'</span><span class="stat-lbl">Known</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--text2)">'+(t.cards.length-known)+'</span><span class="stat-lbl">Review</span></div>'+
    '</div>'+
    '<div class="cta-btns">'+
      '<button class="btn-pri" data-id="'+t.id+'" onclick="renalStartQuiz(\'test\',this.dataset.id)">Test this topic →</button>'+
      '<button class="btn-sec" data-id="'+t.id+'" onclick="renalStart(\'learn\',this.dataset.id)">Restudy</button>'+
      '<button class="btn-sec" onclick="renalBackToLearn()">All topics</button>'+
    '</div></div>';
  c.innerHTML = html;
}

/* ─── RENAL QUIZ ─── */
var renalQuizState = { mode:null, topic:null, queue:[], idx:0, score:0, answered:0, missed:[], isRetry:false };

function renalStartQuiz(mode, id){
  var data = mode==='test' ? RENAL_TEST : RENAL_APPLY;
  var t = data.find(function(x){return x.id===id;});
  if(!t){ renalSubTab=mode; renderRenalHome(); return; }
  renalQuizState = {mode:mode,topic:t,queue:t.questions.slice(),idx:0,score:0,answered:0,missed:[],isRetry:false};
  renalRenderQuestion();
}
function renalRetryMissed(){
  var s = renalQuizState;
  if(!s.missed.length) return;
  renalQuizState = {mode:s.mode,topic:s.topic,queue:s.missed.slice(),idx:0,score:0,answered:0,missed:[],isRetry:true};
  renalRenderQuestion();
}
function renalRenderQuestion(){
  var s = renalQuizState;
  var c = document.getElementById('renal-learn-container');
  if(s.idx >= s.queue.length){ renalQuizComplete(); return; }
  var q = s.queue[s.idx];
  var pct = (s.idx/s.queue.length)*100;
  var html = '<button class="back-btn" data-mode="'+s.mode+'" onclick="renalBackMode(this.dataset.mode)">← All topics</button>';
  html += '<div class="quiz-progress-track"><div class="quiz-progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="quiz-counter">'+(s.idx+1)+' / '+s.queue.length+' · '+esc(s.topic.name)+'</div>';
  html += '<div class="q-meta">'+(s.mode==='apply'?'Vignette':'Recall')+' '+(s.idx+1)+'</div>';
  html += '<div class="q-card"><div class="q-text'+(s.mode==='apply'?' vignette':'')+'">'+esc(q.q)+'</div>';
  var letters = ['A','B','C','D','E'];
  html += '<ul class="choices-list" id="renalchoices">';
  q.choices.forEach(function(ch,ci){
    html += '<li><button class="choice-btn" data-ci="'+ci+'"><span class="choice-letter">'+letters[ci]+'</span><span>'+esc(ch)+'</span></button></li>';
  });
  html += '</ul></div>';
  html += '<div class="explanation-box" id="renalexp"><span class="explanation-label">Explanation</span>'+esc(q.exp)+'</div>';
  html += '<div class="next-row" id="renalnextrow"><button class="next-btn" id="renalnextbtn">'+(s.idx+1>=s.queue.length?'See Results':'Next →')+'</button></div>';
  c.innerHTML = html;
  c.parentElement.scrollTop = 0;
  document.querySelectorAll('#renalchoices .choice-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ renalChoose(parseInt(btn.dataset.ci), q); });
  });
  document.getElementById('renalnextbtn').addEventListener('click', function(){ renalQuizState.idx++; renalRenderQuestion(); });
}
function renalChoose(ci, q){
  var btns = document.querySelectorAll('#renalchoices .choice-btn');
  btns.forEach(function(btn,bi){
    btn.disabled=true;
    if(bi===q.correct) btn.classList.add('correct');
    else if(bi===ci) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  renalQuizState.answered++;
  if(ci===q.correct) renalQuizState.score++;
  else renalQuizState.missed.push(q);
  document.getElementById('renalexp').classList.add('show');
  document.getElementById('renalnextrow').classList.add('show');
  setTimeout(function(){document.getElementById('renalexp').scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}
function renalQuizComplete(){
  var s = renalQuizState;
  var c = document.getElementById('renal-learn-container');
  var pct = s.answered>0?Math.round((s.score/s.answered)*100):0;
  var circ=276.46;
  var hasApply = RENAL_APPLY.find(function(t){return t.id===s.topic.id;});
  var html = '<div class="complete-wrap"><span class="complete-badge">'+(pct>=80?'🎯':pct>=60?'💪':'📚')+'</span>'+
    '<h2 class="complete-title">'+(pct>=80?'Strong!':pct>=60?'Getting there':'Keep going')+'</h2>'+
    '<p class="complete-sub">'+(s.isRetry?'Review · ':'')+esc(s.topic.name)+' — '+s.score+' of '+s.answered+' correct.</p>'+
    '<div class="score-ring"><svg viewBox="0 0 100 100"><circle class="score-ring-bg" cx="50" cy="50" r="44"/>'+
    '<circle class="score-ring-fill" id="renalring" cx="50" cy="50" r="44" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'"/></svg>'+
    '<span class="score-pct">'+pct+'%</span></div>'+
    '<div class="stats-row">'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--green)">'+s.score+'</span><span class="stat-lbl">Correct</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--red)">'+(s.answered-s.score)+'</span><span class="stat-lbl">Wrong</span></div>'+
      '<div class="stat-box"><span class="stat-val" style="color:var(--accent)">'+s.answered+'</span><span class="stat-lbl">Total</span></div>'+
    '</div><div class="cta-btns">';
  if(s.missed.length) html += '<button class="btn-pri" onclick="renalRetryMissed()">Redo '+s.missed.length+' missed →</button>';
  if(s.mode==='test' && hasApply)
    html += '<button class="'+(s.missed.length?'btn-sec':'btn-pri')+'" data-id="'+s.topic.id+'" onclick="renalStartQuiz(\'apply\',this.dataset.id)">Apply 🩺</button>';
  html += '<button class="btn-sec" data-mode="'+s.mode+'" data-id="'+s.topic.id+'" onclick="renalStartQuiz(this.dataset.mode,this.dataset.id)">Restart</button>'+
    '<button class="btn-sec" data-mode="'+s.mode+'" onclick="renalBackMode(this.dataset.mode)">All topics</button></div></div>';
  c.innerHTML = html;
  setTimeout(function(){document.getElementById('renalring').style.strokeDashoffset=circ-(pct/100)*circ;},90);
}

  { title:'Gross anatomy', hy:false, html:`

      <li><strong>1. Hormone production:</strong> erythropoietin (RBC production), renin (BP regulation via RAAS), and 1-hydroxylation of vitamin D (calcium absorption/bone health).</li>
      <li><strong>2. Electrolyte and H₂O regulation:</strong> excrete or reabsorb K⁺, Na⁺, Ca²⁺, phosphorus, and water to maintain osmolality.</li>

    <p><strong>GFR:</strong> ~125 mL/min. Normal GFR is regulated by afferent and efferent arteriole tone.</p>
    <div class="box-hy"><span class="lbl">★ High yield</span>PCT reabsorbs 65% of all desired molecules, including 100% of glucose and amino acids. Nephrons lost = accelerated by HTN and hyperglycemia.</div>` },

      <tr><td>Thin descending loop</td><td>Reabsorbs water — concentrates urine</td></tr>
      <tr><td>Thick ascending loop</td><td>Impermeable to water; reabsorbs Na⁺/K⁺/Cl⁻ ← <span class="hl">loop diuretics act here</span></td></tr>

RENAL_LEARN.push({ id:'rs02', name:'2. The Glomerulus: Endothelium, GBM & Mesangial Cells', hy:true, cards:[
  { title:'The three-layered filtration system', hy:true, html:`
    <p>The glomerulus filters blood through three layers:</p>
    <ol>
      <li><strong>Inner: fenestrated capillary endothelium</strong> — large fenestrations allow everything except very large macromolecules (albumin) and blood cells to pass.</li>
      <li><strong>Middle: glomerular basement membrane (GBM)</strong> — acellular meshwork of collagen, glycoproteins, and mucopolysaccharides. Has small pores restricting particle size + aquaporin channels for rapid water filtration.</li>
      <li><strong>Outer: podocytes</strong> (tubular endothelial cells with foot processes and filtration slits) — fluid passes through slits into Bowman's space = glomerular filtrate.</li>
    </ol>` },
  { title:'The GBM in disease', hy:true, html:`
    <p>The GBM is the key structure altered in glomerular disease:</p>
    <ul>
      <li>Normal: only small molecules and water pass; albumin and RBCs are excluded.</li>
      <li>Damaged GBM: allows large proteins and even RBCs through → proteinuria and hematuria.</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>Glomerular disease pathophysiology = damaged GBM → protein and RBC leak → proteinuria + RBC casts in urine.</div>` },
  { title:'Mesangial cells and the juxtaglomerular apparatus', hy:true, html:`
    <p>The <strong>juxtaglomerular apparatus (JGA)</strong> is the control system for GFR and BP:</p>
    <ul>
      <li><strong>Macula densa cells</strong> — sense tubular flow/sodium levels</li>
      <li><strong>Juxtaglomerular (JG) cells</strong> — granular cells that secrete renin in response to low pressure/flow</li>
      <li><strong>Mesangial cells</strong> — contractile cells that regulate glomerular capillary surface area and can be involved in immune complex deposition in glomerulonephritis</li>
    </ul>
    <p>Afferent arteriole diameter > efferent diameter → extremely high hydrostatic pressures in the glomerular capillary bed → drives filtration.</p>` },
]});

    <table class="learn-table">
      <tr><th>Diuretic class</th><th>Site of action</th><th>What they block</th><th>Key effect</th></tr>
      <tr><td><strong>Loop diuretics</strong><br>(e.g., furosemide/Lasix)</td><td>Thick ascending loop of Henle</td><td>Na⁺/K⁺/Cl⁻ cotransporter</td><td>Most potent; also wastes K⁺</td></tr>
      <tr><td><strong>Thiazide diuretics</strong></td><td>Distal convoluted tubule (DCT)</td><td>NaCl reabsorption</td><td>Moderate; also reduces Ca²⁺ excretion</td></tr>
      <tr><td><strong>Aldosterone antagonists</strong><br>(e.g., spironolactone)</td><td>Late DCT / cortical collecting duct</td><td>Aldosterone effect → save K⁺, lose Na⁺</td><td>Potassium-sparing diuretic</td></tr>
    </table>` },
  { title:'Why the site matters clinically', hy:true, html:`
    <p><strong>Loop diuretics (furosemide/Lasix):</strong> most powerful diuretics — used for severe volume overload, heart failure, pulmonary edema. Cause K⁺ and Na⁺ loss → hypokalemia risk.</p>
    <p><strong>Thiazides:</strong> used for hypertension and mild edema. Reduce Ca²⁺ excretion (useful in calcium kidney stones). Cause hypokalemia.</p>
    <p><strong>Aldosterone antagonists (spironolactone):</strong> potassium-sparing — used in heart failure, hyperaldosteronism, and as an add-on to prevent K⁺ depletion from other diuretics. Risk: hyperkalemia.</p>
    <div class="box-hy"><span class="lbl">★ High yield</span>Loop = thick ascending loop. Thiazide = DCT. Aldosterone antagonist = late DCT / collecting duct. Loop and thiazide waste K⁺; aldosterone antagonists spare K⁺.</div>` },
]});

/* ── S04: RAAS ── */
RENAL_LEARN.push({ id:'rs04', name:'4. The Renin-Angiotensin-Aldosterone System (RAAS)', hy:true, cards:[
  { title:'RAAS cascade step by step', hy:true, html:`
    <p>The RAAS is triggered by <span class="hl">low blood volume, low blood pressure, or low sodium</span> sensed at the juxtaglomerular apparatus.</p>
    <ol>
      <li><strong>Renin</strong> released by kidney (JG cells) → cleaves angiotensinogen → <strong>Angiotensin I</strong></li>
      <li>Angiotensin I → lungs → converted by <strong>ACE</strong> → <strong>Angiotensin II</strong></li>
      <li>Angiotensin II: powerful vasoconstrictor (peripheral arteriole constriction → ↑BP) + stimulates <strong>aldosterone</strong> from adrenal cortex</li>
      <li>Aldosterone → late DCT/collecting duct → ↑NaCl and H₂O reabsorption → ↑blood volume → ↑BP → shuts off renin</li>
    </ol>` },
  { title:'RAAS effects on water, potassium, and BP', hy:true, html:`
    <table class="learn-table">
      <tr><th>Effect</th><th>Mechanism</th><th>Net result</th></tr>
      <tr><td>↑ BP</td><td>Angiotensin II vasoconstricts + aldosterone retains Na⁺/H₂O</td><td>Higher perfusion pressure</td></tr>
      <tr><td>↑ Body water</td><td>Aldosterone → Na⁺ retention → water follows</td><td>Expanded intravascular volume</td></tr>
      <tr><td>↓ Potassium</td><td>Aldosterone promotes K⁺ excretion in exchange for Na⁺ reabsorption</td><td>Hypokalemia risk with RAAS activation</td></tr>
    </table>
    <div class="box-hy"><span class="lbl">★ High yield</span>RAAS activation → ↑BP, ↑body water, ↓K⁺. ACE inhibitors and ARBs block this system → lower BP, reduce sodium/water retention, but can cause hyperkalemia and AKI.</div>` },
  { title:'Why constant vasoconstriction is not sustainable', hy:false, html:`
    <p>Angiotensin II is a powerful but short-term BP fix. Constant arteriolar constriction is not a sustainable way to maintain BP — aldosterone's Na⁺/H₂O retention is the durable mechanism.</p>
    <p>The kidney "sees" any decrease in hydrostatic pressure as volume depletion and kicks on the RAAS — even if overall body water is high but intravascular pressure is low (e.g., nephrotic syndrome, HF).</p>` },
]});

/* ── S05: Edema formation & maladaptive kidney response ── */
RENAL_LEARN.push({ id:'rs05', name:'5. Edema Formation & Maladaptive Kidney Response', hy:true, cards:[
  { title:'Oncotic vs hydrostatic pressure', hy:true, html:`
    <p>Body fluid stays in the correct compartment when two pressures are balanced:</p>
    <ul>
      <li><strong>Oncotic pressure:</strong> chemical pressure exerted by proteins (albumin) — proteins are too large to exit normal blood vessels, so they draw water in.</li>
      <li><strong>Hydrostatic pressure:</strong> the physical pressure of fluid within a blood vessel — the "stretch" — pushes fluid out.</li>
    </ul>
    <p>Edema forms when hydrostatic pressure is too high or oncotic pressure is too low → fluid leaves the vascular space into interstitium (third-spacing).</p>` },
  { title:'Mechanisms of edema formation', hy:true, html:`
    <table class="learn-table">
      <tr><th>Mechanism</th><th>Disease example</th></tr>
      <tr><td>High hydrostatic pressure — fluid pushed out of vessels</td><td>Heart failure (blood pools, high venous pressure)</td></tr>
      <tr><td>Low oncotic pressure — fluid not held in vessels</td><td>Nephrotic syndrome (albumin lost in urine), cirrhosis (liver can't make albumin)</td></tr>
    </table>` },
  { title:'The maladaptive kidney response', hy:true, html:`
    <p>In conditions where fluid third-spaces (HFrEF, nephrotic syndrome, cirrhosis), the intravascular volume is low even though total body water is high.</p>
    <p>The kidney <span class="hl">senses low intravascular pressure → activates RAAS → retains more Na⁺ and H₂O</span>.</p>
    <p>This is <strong>maladaptive</strong> because the retained fluid cannot stay in the vessels (due to the same oncotic/hydrostatic problem) → more edema, more ascites, more pleural effusions.</p>
    <div class="box-hy"><span class="lbl">★ High yield</span>The kidney is responding appropriately to what it senses (low intravascular pressure), but the response worsens the patient's overall condition. This happens in HFrEF, nephrotic syndrome, and cirrhosis.</div>` },
]});

  { q:'Which condition causes edema through a LOW oncotic pressure mechanism?', choices:['Renal artery stenosis','Heart failure from impaired pump function','Nephrotic syndrome — massive albumin loss in urine','Portal hypertension from thrombosis'], correct:2, exp:'Nephrotic syndrome causes >3g/day protein loss in urine → albumin falls → low oncotic pressure → fluid leaves vessels → edema/anasarca.' },
  { q:'In heart failure with reduced ejection fraction (HFrEF), edema forms primarily through which mechanism?', choices:['Low oncotic pressure from albumin loss','Low serum protein from malnutrition','High hydrostatic pressure — blood pools in vessels from weak pump function','Excessive RAAS activation causing water intoxication'], correct:2, exp:'In HFrEF, the weak heart cannot pump forward → blood pools → high venous hydrostatic pressure → fluid pushed out of vessels into tissues.' },

  { q:'Which three conditions share the maladaptive kidney response to low effective circulating volume?', choices:['Horseshoe kidney, renal agenesis, polycystic kidney disease','HFrEF, nephrotic syndrome, and cirrhosis','Hypertension, diabetes, glomerulonephritis','UTI, AKI, CKD'], correct:1, exp:'HFrEF, nephrotic syndrome, and cirrhosis all cause low intravascular effective circulating volume (despite high total body water) → kidney activates RAAS → worsens third-spacing.' },
]});

/* ── S06: Congenital kidney disorders ── */
RENAL_LEARN.push({ id:'rs06', name:'6. Congenital Kidney Disorders', hy:false, cards:[
  { title:'Renal agenesis', hy:false, html:`
    <p><strong>Renal agenesis</strong> = failure of one (or both) kidneys to develop.</p>
    <ul>
      <li>Unilateral: common and usually asymptomatic; the one kidney enlarges to compensate (hypertrophy)</li>
      <li>Bilateral: incompatible with life</li>
      <li>Often found incidentally on imaging</li>
      <li><span class="hl">Clinical risk:</span> starting life with half the normal number of nephrons → <strong>accelerated risk of renal disease</strong> with any stressor (HTN, DM)</li>
    </ul>` },
  { title:'Horseshoe kidney', hy:true, html:`
    <p><strong>Horseshoe kidney</strong>: the two kidneys are fused at the lower poles, forming a U-shape. Affects 1:500 live births; twice as common in men.</p>
    <ul>
      <li>Kidney is lower and more anterior than normal → more vulnerable to <strong>traumatic injury</strong></li>
      <li>Predisposes to: <span class="hl">renal calculi, UTI, and renal carcinoma</span></li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>Horseshoe kidney → risk of stones, UTI, and renal CA. Renal agenesis → risk of accelerated renal disease. Both are usually asymptomatic at first.</div>` },
]});

/* ── S07: UTI/cystitis and pyelonephritis ── */
RENAL_LEARN.push({ id:'rs07', name:'7. UTI/Cystitis and Pyelonephritis', hy:true, cards:[
  { title:'UTI pathophysiology and risk factors', hy:true, html:`
    <p>UTI = infection of urethra and bladder only. Most caused by <span class="hl">gram-negative gut bacteria ascending the urethra</span>, most commonly <strong>E. coli</strong>.</p>
    <p><strong>Facilitating factors:</strong></p>
    <ul>
      <li>Stagnation / obstruction of urine flow</li>
      <li>Injury to or degeneration of urethral mucosal surfaces (hormone-sensitive tissue)</li>
      <li>Foreign objects / motion (catheters, sexual activity)</li>
    </ul>
    <p><strong>Who gets UTIs?</strong></p>
    <ul>
      <li>Women > men: shorter urethra; sexual activity ("honeymoon cystitis"); post-menopausal mucosal atrophy</li>
      <li>Men: almost exclusively older men with BPH (incomplete bladder emptying)</li>
      <li>Both sexes: neurogenic bladder, poorly controlled DM (glucosuria feeds bacteria), catheters</li>
    </ul>` },
  { title:'UTI/cystitis clinical presentation', hy:true, html:`
    <p><strong>Classic presentation (young patient):</strong></p>
    <ul>
      <li>Dysuria (burning on urination), frequency, urgency</li>
      <li>No fever, no systemic illness, no leukocytosis on CBC</li>
      <li><span class="hl">Urinalysis: leukocyte esterase and nitrites positive; pyuria (WBCs)</span></li>
    </ul>
    <p><strong>Elderly patients:</strong> may present with minimal urinary symptoms but altered mental status; more likely to have fever and leukocytosis.</p>` },
  { title:'Pyelonephritis: upper tract infection', hy:true, html:`
    <p><strong>Pyelonephritis</strong> = infection of ureters and kidneys — most commonly ascending from untreated cystitis; less often hematogenous.</p>
    <p>Key differences from cystitis:</p>
    <ul>
      <li><span class="hl">CVA (costovertebral angle) tenderness</span> — localized pain over the affected kidney</li>
      <li>High fevers, chills, rigors — patient appears <strong>systemically ill</strong></li>
      <li>Sepsis is often present</li>
      <li>End organ dysfunction: AKI, hypotension, confusion</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>Cystitis = local; no fever; no systemic signs. Pyelonephritis = upper tract; fever, CVA tenderness, systemic illness, possible sepsis. Most common organism for both = E. coli.</div>` },
]});

/* ── S08: BPH ── */
RENAL_LEARN.push({ id:'rs08', name:'8. Benign Prostatic Hypertrophy (BPH)', hy:true, cards:[
  { title:'Pathophysiology and LUTS', hy:true, html:`
    <p><strong>BPH</strong> = common age-related, <strong>non-malignant</strong> nodular enlargement of the prostate, likely due to decreased apoptosis (cell death).</p>
    <p>As the prostate enlarges, it compresses the urethra at the bladder neck → <strong>lower urinary tract symptoms (LUTS):</strong></p>
    <ul>
      <li>Weak urinary stream</li>
      <li>Hesitancy</li>
      <li>Frequency</li>
      <li>Nocturia</li>
      <li>Post-void dribbling</li>
    </ul>
    <p>BPH in older men → incomplete bladder emptying → urinary stasis → increased UTI risk.</p>` },
  { title:'BPH medications: alpha-1 blockers', hy:true, html:`
    <p><strong>Alpha-1 blockers:</strong> tamsulosin (Flomax®)</p>
    <ul>
      <li><strong>MOA:</strong> block alpha-1 adrenergic receptors → relax prostatic smooth muscle → facilitate urine flow</li>
      <li>Act <span class="hl">rapidly</span> — improvement within 1–2 weeks</li>
      <li>Symptoms recur quickly if medication is stopped</li>
    </ul>` },
  { title:'BPH medications: 5-alpha-reductase inhibitors', hy:true, html:`
    <p><strong>5-alpha-reductase inhibitors:</strong> finasteride (Proscar®)</p>
    <ul>
      <li><strong>MOA:</strong> block the effects of androgens on prostate growth (inhibit conversion of testosterone → DHT)</li>
      <li><span class="hl">Slow acting:</span> over 6–12 months causes gradual, durable atrophy of prostate epithelial cells</li>
      <li>Reduces total prostate volume by 20–30%</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>Alpha-1 blockers: tamsulosin (Flomax) — rapid relief, no size change, stops working quickly when held. 5-ARIs: finasteride (Proscar) — slow (6–12 months), durable shrinkage of prostate by 20–30%.</div>` },
]});

/* ── S09: Renal calculi ── */
RENAL_LEARN.push({ id:'rs09', name:'9. Renal Calculi: Mechanism, Colic & Treatment', hy:true, cards:[
  { title:'How kidney stones form', hy:true, html:`
    <p>Renal calculi form when <strong>urinary salts reach saturation and precipitate out</strong> as crystals, which grow into stones.</p>
    <p>Predisposing factors:</p>
    <ul>
      <li><strong>UTI</strong> → reduces solubility of salts in urine → crystals form</li>
      <li><strong>Dehydration</strong> → high concentration of calcium salts in urine</li>
      <li><strong>Gout</strong> → high uric acid in urine</li>
      <li><strong>Urinary stasis/obstruction</strong> → impaired bladder emptying → stasis → stone formation</li>
    </ul>` },
  { title:'Renal colic: the pain', hy:true, html:`
    <p>Stones are not painful while in the kidney. Pain occurs when a stone <span class="hl">obstructs the UPJ or migrates down the ureter</span>.</p>
    <p><strong>Renal colic:</strong> classically described as severe, cramping, <span class="hl">flank pain that radiates to the groin</span>. Often comes in waves as the ureter spasms around the stone. Associated with hematuria and nausea/vomiting.</p>
    <p>Complications: hydronephrosis, hydroureter, AKI.</p>` },
  { title:'Treatment of renal calculi', hy:true, html:`
    <p><strong>Initial treatment:</strong> copious IV hydration, pain medications, anti-emetics.</p>
    <p><strong>If the stone won't pass:</strong></p>
    <ul>
      <li><strong>Cystoscopy</strong> — camera enters urethra/bladder; urologist snares stones in the <span class="hl">distal ureter</span></li>
      <li><strong>Shock wave lithotripsy</strong> — ultrasound breaks stones in the <span class="hl">proximal ureter</span> into fragments; a ureteral stent is placed to keep the ureter open during fragment passage</li>
      <li><strong>Nephrostomy tube</strong> — placed by IR to decompress an obstructed ureter when a stent is contraindicated (e.g., infection) or urgently needed</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>Best imaging: non-contrast CT abdomen/pelvis. Cystoscopy for distal stones. Lithotripsy for proximal stones + stent.</div>` },
]});

/* ── S10: Hydroureter / hydronephrosis ── */
RENAL_LEARN.push({ id:'rs10', name:'10. Hydroureter and Hydronephrosis', hy:true, cards:[
  { title:'Definitions and what causes them', hy:true, html:`
    <p><strong>Blockage of urine outflow</strong> causes progressive dilation of the urinary tract proximal to (above) the obstruction.</p>
    <ul>
      <li><strong>Hydroureter</strong> = dilatation of the ureter</li>
      <li><strong>Hydronephrosis</strong> = dilatation of the renal pelvis and calyces</li>
    </ul>
    <p>Both are readily seen on ultrasound or CT imaging. Urine is toxic to the kidney → prolonged back-pressure causes AKI.</p>` },
  { title:'Etiologies', hy:true, html:`
    <p><strong>Bilateral causes</strong> (affect both ureters/kidneys):</p>
    <ul>
      <li>Enlarged prostate (BPH) obstructing the bladder neck</li>
      <li>Stricture of the urethra</li>
    </ul>
    <p><strong>Unilateral causes</strong> (affect one ureter/kidney):</p>
    <ul>
      <li>Ureteral stricture</li>
      <li>Migrating renal calculus</li>
      <li>Pelvic tumor compressing or growing into the ureter</li>
    </ul>
    <p><strong>Functional causes (no mechanical obstruction):</strong> medications — especially <span class="hl">anti-cholinergic drugs</span> (narcotics, anesthetics) → urinary retention.</p>
    <div class="box-hy"><span class="lbl">★ High yield</span>Anuria (no urine output) is almost always caused by post-renal obstruction. CT is the diagnostic test of choice; ultrasound shows hydronephrosis but usually misses the etiology.</div>` },
  { title:'Treatment', hy:false, html:`
    <ul>
      <li>Remove the obstruction via cystoscopy and ureteral stenting</li>
      <li>Emergently: nephrostomy tube placed by interventional radiology to drain the kidney</li>
    </ul>
    <p>Complications from obstruction: infection, renal calculi formation, AKI.</p>` },
]});

/* ── S11: Glomerulonephritis ── */
RENAL_LEARN.push({ id:'rs11', name:'11. Glomerulonephritis', hy:true, cards:[
  { title:'Pathophysiology: two mechanisms', hy:true, html:`
    <p><strong>Glomerulonephritis (GN)</strong> = inflammation of glomeruli caused by antigen-antibody reactions. Two major mechanisms:</p>
    <ol>
      <li><strong>Anti-GBM GN:</strong> autoantibodies directly attack type IV collagen in the GBM → direct injury to the filtration membrane</li>
      <li><strong>Immune complex GN:</strong> circulating antigen-antibody complexes are filtered and trapped in glomeruli → plugging of capillaries → local inflammation → leukocyte enzyme release → GBM injury</li>
    </ol>
    <p>Triggers for immune complex GN: <span class="hl">connective tissue diseases (especially SLE) and infections</span>.</p>` },
  { title:'Clinical presentation and lab findings', hy:true, html:`
    <p>Classic GN triad:</p>
    <ul>
      <li><strong>Hypertension</strong></li>
      <li><strong>Cola-colored (dark, tea-colored) urine</strong> — from hematuria</li>
      <li><strong>Nephritic range proteinuria</strong> — 500 mg to 3 grams/day</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span><strong>RBC casts in urine sediment are PATHOGNOMONIC for glomerulonephritis.</strong> Cola-colored urine + hypertension + nephritic proteinuria + RBC casts = GN until proven otherwise.</div>
    <p>GN is a common cause of intrinsic AKI — failing nephrons can no longer excrete waste → rising BUN and creatinine.</p>` },
]});

/* ── S12: Proteinuria definitions ── */
RENAL_LEARN.push({ id:'rs12', name:'12. Proteinuria Definitions', hy:true, cards:[
  { title:'The proteinuria ladder', hy:true, html:`
    <p>Spilling protein in the urine is a marker of significant renal damage. The amount tells you the severity:</p>
    <table class="learn-table">
      <tr><th>Range</th><th>Definition</th><th>Significance</th></tr>
      <tr><td><strong>Normal</strong></td><td>&lt;30 mg/24 hr</td><td>Normal — minimal filtration of tiny proteins</td></tr>
      <tr><td><strong>Microalbuminuria</strong></td><td>30–300 mg/24 hr</td><td>Early renal damage — key marker in diabetic nephropathy</td></tr>
      <tr><td><strong>Macroalbuminuria</strong></td><td>&gt;300 mg/24 hr</td><td>More advanced glomerular damage</td></tr>
      <tr><td><strong>Nephritic range</strong></td><td>500 mg – 3 g/24 hr</td><td>Seen in glomerulonephritis</td></tr>
      <tr><td><strong>Nephrotic range</strong></td><td>&gt;3 g/24 hr</td><td>Seen in nephrotic syndrome — massive protein loss</td></tr>
    </table>
    <div class="box-hy"><span class="lbl">★ High yield</span>Nephritic range: 500mg–3g. Nephrotic range: &gt;3g/24hr. Microalbuminuria: 30–300mg. These numbers are commonly tested.</div>` },
]});

/* ── S13: Nephrotic syndrome ── */
RENAL_LEARN.push({ id:'rs13', name:'13. Nephrotic Syndrome', hy:true, cards:[
  { title:'Definition and etiologies', hy:true, html:`
    <p><strong>Nephrotic syndrome</strong> = protein loss in urine <span class="hl">&gt;3 grams per day</span>.</p>
    <p>Causes:</p>
    <ul>
      <li>Idiopathic glomerular diseases</li>
      <li>Systemic diseases: <strong>diabetes, SLE, amyloidosis</strong></li>
    </ul>
    <p>The liver cannot synthesize enough protein to replace what is being lost → serum albumin falls.</p>` },
  { title:'The pathophysiology of anasarca', hy:true, html:`
    <p>The cascade from massive proteinuria to total body edema (anasarca):</p>
    <ol>
      <li>Massive protein loss in urine (&gt;3g/day) → liver can't keep up</li>
      <li>Serum albumin falls → <span class="hl">low vascular oncotic pressure</span></li>
      <li>Fluid leaks out of blood vessels into interstitium (third-spacing)</li>
      <li>→ <strong>Anasarca</strong> (generalized edema)</li>
      <li>Kidney senses low intravascular volume → activates RAAS → retains Na⁺/H₂O → but fluid cannot stay in vessels → worsens edema (maladaptive response)</li>
    </ol>
    <div class="box-hy"><span class="lbl">★ High yield</span>Nephrotic syndrome: >3g/day proteinuria → low albumin → low oncotic pressure → fluid third-spaces → anasarca. RAAS activation is maladaptive and worsens it.</div>` },
  { title:'Symptoms, signs, and UA findings', hy:true, html:`
    <p><strong>Symptoms/signs:</strong></p>
    <ul>
      <li>Anasarca (generalized edema) — periorbital, peripheral, ascites</li>
      <li>Foamy urine (visible proteinuria)</li>
      <li>Hypoalbuminemia on labs</li>
    </ul>
    <p><strong>Urinalysis:</strong></p>
    <ul>
      <li>Massive proteinuria on dipstick</li>
      <li><strong>Fatty casts and oval fat bodies</strong> in urine sediment</li>
      <li>Lipiduria (lipids in urine — liver upregulates lipid synthesis to try to compensate for protein loss)</li>
    </ul>` },
]});

/* ── S14: Diabetic nephropathy ── */
RENAL_LEARN.push({ id:'rs14', name:'14. Diabetic Nephropathy', hy:true, cards:[
  { title:'Mechanism and epidemiology', hy:true, html:`
    <p><strong>Diabetic nephropathy</strong> = the most common reason for dialysis or renal transplant in the US.</p>
    <p>Pathophysiology: <span class="hl">microvascular disease</span> — high glucose damages the small vessels of the glomerular capillaries.</p>
    <ul>
      <li>More common per capita in Type 1 DM (more severe microvascular disease)</li>
      <li>But most dialysis patients have Type 2 DM because T2DM is far more prevalent</li>
    </ul>
    <p>Closely linked with <strong>hypertensive nephropathy</strong> — most patients have both DM and HTN damaging their kidneys simultaneously.</p>` },
  { title:'Progression of diabetic nephropathy', hy:true, html:`
    <ol>
      <li>Chronic hyperglycemia → GBM thickening and damage → albumin leaks → <span class="hl">microalbuminuria</span> (earliest sign)</li>
      <li>Continued damage → macroalbuminuria, then nephrotic range proteinuria</li>
      <li>Nephrons progressively lost → GFR falls → CKD → ESRD</li>
    </ol>
    <p>The process is also worsened by: <span class="hl">hypertension</span> (damages glomerular capillaries), and RAAS activation from low renal perfusion.</p>` },
  { title:'Treatment of diabetic nephropathy', hy:true, html:`
    <ul>
      <li><strong>Control DM</strong> to goal HbA1c — slows progression</li>
      <li><strong>Aggressively control BP</strong> — use an <span class="hl">ACE inhibitor or ARB</span>: reduces intraglomerular pressure and slows protein leak (renoprotective beyond BP effect)</li>
      <li>Correct electrolyte disturbances</li>
      <li>Prepare for renal replacement therapy (dialysis/transplant)</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>First sign = microalbuminuria. ACEi/ARB are preferred for BP in DM + nephropathy — renoprotective. Two biggest causes of CKD/ESRD in US = diabetes and hypertension.</div>` },
]});

/* ── S15: AKI ── */
RENAL_LEARN.push({ id:'rs15', name:'15. Acute Kidney Injury (AKI)', hy:true, cards:[
  { title:'AKI definition and clinical findings', hy:true, html:`
    <p><strong>AKI</strong> = abrupt decline in GFR (previously "acute renal failure"). Marked by rising serum creatinine and BUN. Diagnostic criterion: <span class="hl">SCr rise ≥0.3 mg/dL in 48 hours</span>.</p>
    <p>Clinical manifestations:</p>
    <ul>
      <li>Rising BUN and creatinine, falling eGFR</li>
      <li>Oliguria (&lt;300 cc/24 hr) — ominous; non-oliguric AKI has better prognosis</li>
      <li>Anuria — almost always post-renal obstruction</li>
      <li>Fluid overload → pulmonary edema (lungs most sensitive to fluid overload)</li>
      <li>Hyperkalemia and metabolic acidosis (kidney can no longer excrete acid and K⁺)</li>
    </ul>` },
  { title:'Three categories of AKI', hy:true, html:`
    <table class="learn-table">
      <tr><th>Type</th><th>Mechanism</th><th>Examples</th></tr>
      <tr><td><strong>Pre-renal</strong></td><td>Decreased blood flow to the kidney for filtration — "upstream" problem</td><td>Volume loss (bleeding, dehydration), heart failure, sepsis, renal artery stenosis</td></tr>
      <tr><td><strong>Intrinsic</strong></td><td>Direct damage to kidney cells (acute tubular necrosis) or glomeruli</td><td>Nephrotoxic drugs, contrast dye, myoglobin/hemoglobin, glomerulonephritis</td></tr>
      <tr><td><strong>Post-renal</strong></td><td>Obstruction of urine drainage "downstream" — back-pressure injures kidneys</td><td>BPH, ureteral stricture, pelvic tumor, urethral stricture</td></tr>
    </table>` },
  { title:'The "selfish kidney" and pre-renal AKI', hy:true, html:`
    <p>Renal blood flow = 20% of cardiac output: 15% for filtration, 5% for kidney perfusion.</p>
    <p><span class="hl">The kidney preserves its own perfusion at the expense of filtering waste</span> — this is pre-renal AKI. The kidney is functioning correctly but there is not enough blood flow to filter waste.</p>
    <p>Pre-renal AKI: most common; almost always in seriously ill patients. Reversible if blood flow is restored quickly.</p>
    <div class="box-hy"><span class="lbl">★ High yield</span>Pre-renal = low flow to kidney. Intrinsic = damage to kidney cells (ATN). Post-renal = obstruction after the kidney. Anuria = almost always post-renal.</div>` },
]});

/* ── S16: CKD/ESRD ── */
RENAL_LEARN.push({ id:'rs16', name:'16. CKD, ESRD & Dialysis', hy:true, cards:[
  { title:'CKD: causes and clinical features', hy:true, html:`
    <p><strong>CKD</strong> = progressive, irreversible loss of renal function. Two major causes in the US:</p>
    <ol>
      <li><span class="hl">Diabetes (most common)</span></li>
      <li><span class="hl">Hypertension</span></li>
    </ol>
    <p>Other causes: polycystic kidney disease, glomerulonephritis, nephrotic syndrome.</p>
    <p><strong>Clinical manifestations of ESRD:</strong></p>
    <ul>
      <li>Weakness, anorexia, nausea (uremia)</li>
      <li>Anemia (↓ EPO)</li>
      <li>Edema (Na⁺/water retention)</li>
      <li>Hypertension (volume overload)</li>
      <li>Metabolic acidosis</li>
      <li>Toxic: severe itching, encephalopathy, seizures (uremia) — if non-compliant with dialysis</li>
    </ul>` },
  { title:'Hemodialysis', hy:true, html:`
    <p><strong>Hemodialysis (HD):</strong> blood is removed from the patient, circulated through porous glass capillaries → toxins diffuse into dialysate → cleaned blood returned.</p>
    <ul>
      <li>Done 3× per week, 3–4 hours per session (MWF or TTS)</li>
      <li>The machine must do 48–72 hours of kidney work in 3–4 hours → intensive</li>
      <li>Requires vascular access: tunneled catheter, AV fistula, or AV graft</li>
      <li>Advantages: can be done indefinitely; medical help available in center; HD at home is possible</li>
      <li>Disadvantages: requires surgical access; needlesticks; catheters → infection risk; most expensive; patient loses independence</li>
    </ul>` },
  { title:'Peritoneal dialysis', hy:true, html:`
    <p><strong>Peritoneal dialysis (PD):</strong> patient\'s own peritoneal membrane acts as the dialyzing membrane.</p>
    <ul>
      <li>Patient fills abdomen with dialysate → waits → drains and replaces with fresh</li>
      <li>Done daily over 8+ hours — gentler and more physiologic</li>
      <li>Less severe dietary/fluid restrictions than HD</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ Compare</span>
      <table class="learn-table">
        <tr><th></th><th>HD</th><th>PD</th></tr>
        <tr><td>Frequency</td><td>3×/week, 3–4h</td><td>Daily, 8+ hours</td></tr>
        <tr><td>Gentleness</td><td>Intensive</td><td>More physiologic</td></tr>
        <tr><td>Diet restriction</td><td>More severe</td><td>Less severe</td></tr>
        <tr><td>Independence</td><td>Less (in center)</td><td>More (at home)</td></tr>
        <tr><td>Infection risk</td><td>Catheter/access</td><td>Peritonitis</td></tr>
        <tr><td>Duration</td><td>Indefinite</td><td>Limited period</td></tr>
      </table>
    </div>` },
]});

/* ── S18: Distribution of body water ── */
RENAL_LEARN.push({ id:'rs18', name:'18. Distribution of Body Water', hy:true, cards:[
  { title:'Body water percentages', hy:true, html:`
    <p>A male body is approximately <span class="hl">60% water</span>; a female body is approximately <span class="hl">50% water</span> by weight.</p>
    <p>Distribution:</p>
    <ul>
      <li><strong>Intracellular fluid (ICF):</strong> 2/3 (two-thirds) of total body water</li>
      <li><strong>Extracellular fluid (ECF):</strong> 1/3 (one-third) of total body water</li>
      <li>ECF = 75% interstitial fluid + 25% intravascular fluid</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield — memorize these numbers</span>TBW ratio: ICF 2/3 : ECF 1/3. ECF sub-ratio: 75% interstitial : 25% intravascular. Male 60% / Female 50% water.</div>` },
  { title:'Primary intracellular and extracellular cations', hy:true, html:`
    <table class="learn-table">
      <tr><th>Compartment</th><th>Primary cation</th><th>Why it matters</th></tr>
      <tr><td><strong>Intracellular</strong></td><td><span class="hl">Potassium (K⁺)</span></td><td>Most prevalent intracellular cation; critical for cardiac and nerve conduction; small shifts → lethal arrhythmias</td></tr>
      <tr><td><strong>Extracellular</strong></td><td><span class="hl">Sodium (Na⁺)</span></td><td>Most prevalent extracellular cation; regulates water distribution and blood pressure</td></tr>
    </table>
    <p>Normal osmolality of all fluid compartments = ~300 mOsm/L (equal across compartments).</p>` },
  { title:'Membrane permeability rules', hy:true, html:`
    <table class="learn-table">
      <tr><th>Membrane</th><th>Permeable to</th><th>Implication</th></tr>
      <tr><td>Intravascular ↔ Interstitial (ECF)</td><td>Water AND sodium/salt</td><td>IV saline distributes across ECF (intravascular + interstitial); 1:3 ratio</td></tr>
      <tr><td>ECF ↔ ICF (cell membrane)</td><td>Water ONLY (not Na⁺/K⁺)</td><td>Free water (like D5W or plain water) distributes across all compartments in 1:3:8 ratio</td></tr>
    </table>
    <p>Clinical implication: <strong>isotonic saline stays in ECF</strong> (intravascular + interstitial). <strong>Free water (D5W) distributes everywhere</strong> including inside cells.</p>` },
]});

/* ── S19: Volume overload mechanisms ── */
RENAL_LEARN.push({ id:'rs19', name:'19. Mechanisms of Volume Overload', hy:true, cards:[
  { title:'Third-spacing: when fluid leaves the vascular space', hy:true, html:`
    <p><strong>Volume overload</strong> = fluid accumulates in spaces where it is normally not found. This is termed "third-spacing."</p>
    <p>Examples of third-spacing:</p>
    <ul>
      <li>Dependent edema</li>
      <li>Pleural effusion → dyspnea (lung compression)</li>
      <li>Ascites → abdominal pain, early satiety, dyspnea</li>
      <li>Pericardial effusion → decreased diastolic filling → low cardiac output</li>
    </ul>` },
  { title:'Three major mechanisms of volume overload', hy:true, html:`
    <p><strong>1. Excessive fluid intake / impaired renal excretion:</strong> too much IV fluid or oral intake when the kidney can\'t excrete → volume builds up.</p>
    <p><strong>2. Osmotic pull:</strong> hyperglycemia → osmotically active glucose pulls water from ICF into the intravascular space → dilutes sodium (hypervolemic hyponatremia).</p>
    <p><strong>3. Inability to hold fluid in the vascular compartment (low oncotic pressure):</strong></p>
    <ul>
      <li><strong>HFrEF:</strong> weak pump → blood pools → high hydrostatic pressure → fluid pushed out</li>
      <li><strong>Nephrotic syndrome:</strong> albumin lost in urine → low oncotic pressure → fluid leaks out</li>
      <li><strong>Cirrhosis:</strong> liver cannot make albumin → low oncotic pressure + portal hypertension → ascites + anasarca</li>
    </ul>` },
  { title:'Treatment of hypervolemia', hy:false, html:`
    <ul>
      <li>Fix/optimize underlying disease</li>
      <li>Sodium restriction: <span class="hl">2 grams/day</span></li>
      <li>Fluid restriction: <span class="hl">1200–1800 mL/day</span></li>
      <li><strong>Loop diuretics</strong> (e.g., furosemide/Lasix) — the primary diuretic for volume overload</li>
    </ul>` },
]});

/* ── S20: Volume and electrolyte depletion ── */
RENAL_LEARN.push({ id:'rs20', name:'20. Volume and Electrolyte Depletion', hy:true, cards:[
  { title:'Causes of volume and electrolyte depletion', hy:true, html:`
    <p>Volume depletion = loss of both water AND electrolytes. Major causes:</p>
    <ul>
      <li><strong>GI losses:</strong> vomiting, diarrhea, fever, sweating → lose water + Na⁺ and K⁺</li>
      <li><strong>Osmotic diuresis from hyperglycemia:</strong> poorly controlled DM → glucosuria → osmotic diuresis → large water and electrolyte losses</li>
      <li><strong>Diuretics:</strong> obligatory solute loss; overdiuresis; worse if patient also has GI illness</li>
    </ul>` },
  { title:'Clinical signs of dehydration', hy:false, html:`
    <p>Signs of significant dehydration:</p>
    <ul>
      <li>Dry mouth and dry mucous membranes</li>
      <li>Tachycardia and hypotension (low BP)</li>
      <li>Poor skin turgor</li>
    </ul>
    <p>Infants: sunken fontanelle, crying without tears, few wet diapers.</p>` },
  { title:'Choice of IV fluid and why it matters', hy:true, html:`
    <table class="learn-table">
      <tr><th>Fluid</th><th>Type</th><th>Where does it go?</th></tr>
      <tr><td>0.9% Normal saline / Lactated Ringer\'s</td><td>Isotonic</td><td>ECF only (intravascular + interstitial)</td></tr>

    <div class="box-hy"><span class="lbl">★ High yield</span>D5W = equivalent to drinking water → distributes everywhere. Normal saline stays in ECF → raises BP better. For hypotension/shock: use isotonic saline. For cellular rehydration: hypotonic fluids.</div>` },
]});

/* ── S21: Normal pH range and ABG ── */
RENAL_LEARN.push({ id:'rs21', name:'21. Normal pH Range & the ABG', hy:true, cards:[
  { title:'Normal pH and why it must be maintained', hy:true, html:`
    <p>Normal blood pH: <span class="hl">7.35–7.45</span> (slightly alkaline).</p>
    <p>The body produces large amounts of acid from normal metabolism (protein breakdown, fat oxidation) but must keep pH in this narrow range.</p>
    <p>Three mechanisms:</p>
    <ol>
      <li><strong>Blood buffers</strong> — act instantly (bicarbonate buffering system)</li>
      <li><strong>Lungs</strong> — fast but limited; control CO₂ (carbonic acid)</li>
      <li><strong>Kidneys</strong> — slow but powerful; control HCO₃⁻ concentration</li>
    </ol>` },
  { title:'The ABG: three values', hy:true, html:`
    <p>An <strong>arterial blood gas (ABG)</strong> gives the most information regarding acid-base status. Three values assessed:</p>
    <table class="learn-table">
      <tr><th>Value</th><th>Normal range</th><th>What it reflects</th></tr>
      <tr><td><strong>pH</strong></td><td>7.35–7.45</td><td>Overall acid-base status — is it acidotic or alkalotic?</td></tr>
      <tr><td><strong>pCO₂</strong></td><td>35–45 mmHg</td><td>Respiratory component — CO₂ is the "acid" the lungs control</td></tr>
      <tr><td><strong>HCO₃⁻ (bicarbonate)</strong></td><td>22–26 mEq/L</td><td>Metabolic component — bicarbonate is the kidney's buffer</td></tr>
    </table>
    <div class="box-hy"><span class="lbl">★ High yield</span>pH 7.35–7.45. pCO₂ = respiratory (lungs). HCO₃⁻ = metabolic (kidneys). pH &lt;7.35 = acidosis. pH &gt;7.45 = alkalosis.</div>` },
]});

]});

/* ── S22: How lungs and kidneys regulate pH ── */
RENAL_LEARN.push({ id:'rs22', name:'22. Lung and Kidney pH Regulation', hy:true, cards:[
  { title:'The Henderson-Hasselbalch buffer equation', hy:true, html:`
    <p>The key equation: <code>CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</code></p>
    <p>All parts are in equilibrium. The body constantly removes CO₂ and H₂O (trying to move the reaction left). This is how acid is neutralized.</p>
    <p>Lungs control CO₂; kidneys control HCO₃⁻. Both shifts in the equation affect pH.</p>` },
  { title:'How the lungs regulate pH', hy:true, html:`
    <p><strong>Lungs are fast but limited in capacity:</strong></p>
    <ul>
      <li>Carbonic acid (H₂CO₃) dissociates to CO₂ + H₂O → exhaled at alveolus</li>
      <li><span class="hl">Hyperventilation</span> (faster/deeper breathing) → blows off more CO₂ → lowers H₂CO₃ → <strong>raises pH (alkalosis)</strong></li>
      <li><span class="hl">Hypoventilation</span> (slower/shallower breathing) → retains CO₂ → raises H₂CO₃ → <strong>lowers pH (acidosis)</strong></li>
    </ul>` },
  { title:'How the kidneys regulate pH', hy:true, html:`
    <p><strong>Kidneys are slow but have a broader compensatory range:</strong></p>
    <ul>
      <li>Selectively <strong>reabsorb bicarbonate (HCO₃⁻)</strong> from ultrafiltrate to buffer blood acid</li>
      <li>Can <strong>secrete or reabsorb H⁺</strong> (must be exchanged for K⁺ or Na⁺)</li>
      <li>Can <strong>manufacture new bicarbonate</strong> to replace what is used up buffering acids</li>
    </ul>
    <div class="box-hy"><span class="lbl">★ High yield</span>Lungs: fast, limited (change CO₂). Kidneys: slow, broad range (change HCO₃⁻). Compensation is always by the OPPOSITE system: respiratory problem → kidneys compensate; metabolic problem → lungs compensate.</div>` },
]});

RENAL_TEST.push({ id:'rs22', name:'22. Lung and Kidney pH Regulation', hy:true, questions:[
  { q:'Hyperventilation raises blood pH because:', choices:['It increases bicarbonate production','It blows off CO₂ → carbonic acid falls → pH rises (alkalosis)','It stimulates the RAAS to retain Na⁺ and bicarbonate','It increases alveolar surface area for gas exchange'], correct:1, exp:'Hyperventilation → more CO₂ exhaled → less carbonic acid in blood → pH rises (respiratory alkalosis).' },
  { q:'In the Henderson-Hasselbalch equation, hypoventilation (decreased breathing) causes:', choices:['Respiratory alkalosis by CO₂ buildup','Respiratory acidosis — CO₂ retained → carbonic acid accumulates → pH falls','Metabolic alkalosis','No change in pH'], correct:1, exp:'Hypoventilation → CO₂ retained → more carbonic acid → lower pH = respiratory acidosis.' },
  { q:'How do the kidneys raise blood pH when a patient has respiratory acidosis?', choices:['The kidneys reabsorb more HCO₃⁻ and manufacture new bicarbonate to buffer excess acid','The kidneys excrete CO₂ through the urine','The kidneys increase respiratory rate','The kidneys secrete more aldosterone'], correct:0, exp:'The kidneys compensate for respiratory acidosis by reabsorbing more HCO₃⁻ and manufacturing new bicarbonate — takes time but provides broader compensation.' },
  { q:'Why is the lung\'s ability to compensate for metabolic disorders described as "limited"?', choices:['Lungs are not connected to the acid-base system','Lungs don\'t have access to bicarbonate','Lungs cannot sustain extreme hyperventilation or hypoventilation indefinitely — their compensation has functional limits','Lungs can only change pH by ±0.01 units'], correct:2, exp:'Lungs compensate quickly but cannot sustain extreme breathing changes indefinitely. The kidneys can compensate more broadly but take days to respond.' },
  { q:'What is the relationship between H⁺ excretion by the kidney and electrolyte shifts?', choices:['The kidney can excrete H⁺ freely without exchange','H⁺ must be exchanged for K⁺ or Na⁺ — acidosis leads to K⁺ shifting out of cells','H⁺ is excreted with Cl⁻, not cations','H⁺ excretion is entirely independent of Na⁺/K⁺'], correct:1, exp:'The kidney must exchange H⁺ for K⁺ or Na⁺. In metabolic acidosis: K⁺ shifts out of cells (into serum) as H⁺ is "hidden" inside cells — causes hyperkalemia with acidosis.' },
]});

RENAL_APPLY.push({ id:'rs22', name:'22. Lung and Kidney pH Regulation', hy:true, questions:[
  { q:'A patient with severe metabolic acidosis (pH 7.18) is breathing at 32 breaths/min. ABG: pCO₂ 22 mmHg, HCO₃⁻ 8 mEq/L. What is the lungs\' response called and is it appropriate?', choices:['Respiratory acidosis — lungs are failing to compensate','This represents an additional respiratory disorder','Respiratory alkalosis that is causing the metabolic acidosis','Respiratory compensation — hyperventilation blows off CO₂ to raise pH; this is the expected and appropriate response to metabolic acidosis'], correct:3, exp:'Low pCO₂ (22) in response to metabolic acidosis = Kussmaul respirations. Lungs correctly hyperventilate to blow off CO₂ and partially compensate for the acidosis. This is expected compensation.' },
  { q:'A patient with COPD has chronic CO₂ retention (chronic respiratory acidosis). His bicarbonate is 34 mEq/L. What is the significance of the elevated HCO₃⁻?', choices:['This is a normal finding in COPD','This is a metabolic acidosis compensating for respiratory alkalosis','This is renal compensation — kidneys have manufactured more HCO₃⁻ to buffer the chronically elevated carbonic acid from CO₂ retention','This is a metabolic alkalosis from an unrelated cause'], correct:2, exp:'Chronic respiratory acidosis → kidneys compensate by reabsorbing and manufacturing more HCO₃⁻ to buffer the excess carbonic acid. Elevated HCO₃⁻ = renal compensation for chronic respiratory acidosis.' },
]});

/* ── S23: Acid-base disorders ── */
RENAL_LEARN.push({ id:'rs23', name:'23. Acid-Base Disorders', hy:true, cards:[
  { title:'The four disorders: framework', hy:true, html:`
    <table class="learn-table">
      <tr><th>Disorder</th><th>pH</th><th>Primary change</th><th>Compensation</th></tr>
      <tr><td><strong>Respiratory acidosis</strong></td><td>↓ (&lt;7.35)</td><td>↑ pCO₂ (hypoventilation)</td><td>Kidneys ↑ HCO₃⁻ (slow)</td></tr>
      <tr><td><strong>Respiratory alkalosis</strong></td><td>↑ (&gt;7.45)</td><td>↓ pCO₂ (hyperventilation)</td><td>Kidneys ↓ HCO₃⁻ (slow)</td></tr>
      <tr><td><strong>Metabolic acidosis</strong></td><td>↓ (&lt;7.35)</td><td>↓ HCO₃⁻ (acid produced or base lost)</td><td>Lungs hyperventilate ↓ pCO₂ (Kussmaul respirations, fast)</td></tr>
      <tr><td><strong>Metabolic alkalosis</strong></td><td>↑ (&gt;7.45)</td><td>↑ HCO₃⁻ (acid lost or base gained)</td><td>Lungs hypoventilate ↑ pCO₂ (limited)</td></tr>
    </table>` },
  { title:'Respiratory alkalosis and acidosis: causes', hy:true, html:`
    <p><strong>Respiratory alkalosis</strong> (↑pH, ↓pCO₂): hyperventilation → too much CO₂ exhaled</p>
    <ul><li>High altitude, pregnancy (progesterone), anxiety/panic, early asthma or PE (air hunger)</li></ul>
    <p><strong>Respiratory acidosis</strong> (↓pH, ↑pCO₂): hypoventilation → CO₂ retained</p>
    <ul>
      <li>Lung problems: COPD, pneumonia, pulmonary edema, severe asthma</li>
      <li>Respiratory drive issues: opioids, sedatives, CNS injury</li>
      <li>Chest wall problems: obesity hypoventilation, flail chest, kyphoscoliosis</li>
    </ul>` },
  { title:'Metabolic alkalosis: causes', hy:false, html:`
    <p><strong>Metabolic alkalosis</strong> (↑pH, ↑HCO₃⁻): loss of acid OR gain of bicarbonate</p>
    <ul>
      <li>Loss of acidic gastric juice: NG suctioning or <span class="hl">vomiting</span> (without diarrhea) → net loss of H⁺ without loss of alkaline GI secretions</li>
      <li>Excess mineralocorticoid (hyperaldosteronism) → H⁺ wasted in urine</li>
      <li>Aggressive diuresis → <span class="hl">contraction alkalosis</span>: plasma volume shrinks around a constant amount of HCO₃⁻</li>
    </ul>
    <p>Often coexists with hypokalemia; must correct K⁺ as well as the alkalosis.</p>` },
  { title:'Metabolic acidosis: AGMA vs NAGMA', hy:true, html:`
    <p><strong>Metabolic acidosis</strong> (↓pH, ↓HCO₃⁻): too much acid produced OR too much base (HCO₃⁻) lost</p>
    <p>Classified by the <strong>anion gap (AG)</strong>: normal AG = 12 ±4; elevated AG (&gt;16) = anion gap metabolic acidosis (AGMA)</p>
    <table class="learn-table">
      <tr><th>Type</th><th>Etiologies (from slides)</th></tr>
      <tr><td><strong>AGMA</strong> (AG &gt;16)</td><td>Renal failure (uremic acids), DKA (ketoacids), starvation/alcoholic ketosis, lactic acidosis (seizures, ischemia, sepsis, medications), toxic ingestions</td></tr>
      <tr><td><strong>NAGMA</strong> (normal AG)</td><td>Diarrhea without vomiting (net bicarbonate-rich fluid loss)</td></tr>
    </table>
    <div class="box-hy"><span class="lbl">★ High yield</span>MUDPILES mnemonic for AGMA: Methanol, Uremia, DKA, Propylene glycol, Isoniazid/Iron, Lactic acidosis, Ethylene glycol, Salicylates. Kussmaul respirations = respiratory compensation for metabolic acidosis.</div>` },
]});

RENAL_TEST.push({ id:'rs23', name:'23. Acid-Base Disorders', hy:true, questions:[
  { q:'A patient is hyperventilating. Which acid-base disorder is the most likely PRIMARY result?', choices:['Respiratory acidosis — blowing off CO₂ lowers pH','Respiratory alkalosis — CO₂ falls, carbonic acid falls, pH rises','Metabolic acidosis — hyperventilation causes bicarbonate loss','Metabolic alkalosis — kidneys respond immediately'], correct:1, exp:'Hyperventilation → CO₂ exhaled → less carbonic acid → pH rises = respiratory alkalosis.' },
  { q:'Which of the following is a cause of RESPIRATORY ACIDOSIS?', choices:['Anxiety/panic attack','High altitude','Pregnancy','COPD with CO₂ retention and hypoventilation'], correct:3, exp:'Respiratory acidosis = hypoventilation → CO₂ retention. COPD is a classic cause. High altitude, pregnancy, and anxiety cause respiratory ALKALOSIS.' },
  { q:'Vomiting without diarrhea causes which acid-base disorder?', choices:['Respiratory acidosis — reduced respiratory rate','Metabolic alkalosis — loss of acidic gastric juice','Metabolic acidosis — bicarbonate lost from gut','Respiratory alkalosis — vomiting causes air hunger'], correct:1, exp:'Vomiting → loss of HCl (acidic gastric juice) without loss of alkaline bowel secretions → net acid loss → metabolic alkalosis.' },
  { q:'Diarrhea without vomiting causes which acid-base disorder?', choices:['Respiratory alkalosis','Metabolic alkalosis','Non-anion gap metabolic acidosis (NAGMA) — bicarbonate-rich intestinal fluid lost','Anion gap metabolic acidosis from lactic acid'], correct:2, exp:'Diarrhea → loss of bicarbonate-rich intestinal fluid → NAGMA. No unmeasured anions accumulate; just bicarbonate is lost.' },
  { q:'A patient with DKA (diabetic ketoacidosis) has a pH of 7.15. This is most likely which type of metabolic acidosis?', choices:['Anion gap metabolic acidosis (AGMA) — ketoacids are unmeasured anions','Respiratory acidosis from CO₂ retention','Non-anion gap metabolic acidosis','Metabolic alkalosis with compensation'], correct:0, exp:'DKA produces ketoacids (beta-hydroxybutyrate, acetoacetate) — these are unmeasured anions → elevated anion gap → AGMA.' },
  { q:'Kussmaul respirations (deep, rapid breathing) in a patient with metabolic acidosis represents:', choices:['The primary cause of the acidosis','A sign of respiratory alkalosis','Respiratory compensation — lungs hyperventilate to blow off CO₂ and raise pH','Renal compensation'], correct:2, exp:'Kussmaul respirations = the lungs\' fast compensation for metabolic acidosis — hyperventilate to blow off CO₂, which raises the pH toward normal.' },
  { q:'Lactic acidosis (from sepsis or ischemia) causes which type of metabolic acidosis and why?', choices:['AGMA — lactate accumulates as an unmeasured anion, increasing the anion gap','Respiratory acidosis — sepsis causes hypoventilation','NAGMA — lactate is not an unmeasured anion','Metabolic alkalosis — the body over-compensates'], correct:0, exp:'Lactic acid = unmeasured anion → accumulates in blood → elevated AG → AGMA.' },
  { q:'Contraction alkalosis (from aggressive diuresis) develops because:', choices:['Diuretics block acid secretion','Diuretics directly create bicarbonate','Plasma volume shrinks around a constant amount of bicarbonate — bicarbonate concentration rises as fluid is removed','Diuretics cause K⁺ wasting which raises pH'], correct:2, exp:'Contraction alkalosis: aggressive diuresis → plasma volume shrinks → same amount of HCO₃⁻ in less fluid → HCO₃⁻ concentration rises → alkalosis.' },
  { q:'Which acid-base disorder is associated with causes that include high altitude, pregnancy, and panic attacks?', choices:['Metabolic alkalosis','Respiratory acidosis','Respiratory alkalosis','Metabolic acidosis'], correct:2, exp:'All three cause hyperventilation → respiratory alkalosis: high altitude (need more O₂), pregnancy (progesterone drives faster breathing), panic attacks (anxiety-driven hyperventilation).' },
]});

RENAL_APPLY.push({ id:'rs23', name:'23. Acid-Base Disorders', hy:true, questions:[
  { q:'A 55-year-old with ESRD misses 3 dialysis sessions. ABG: pH 7.20, pCO₂ 28, HCO₃⁻ 10. What is the primary disorder and what is the lung doing?', choices:['Respiratory acidosis with metabolic compensation','Respiratory alkalosis with renal compensation','Metabolic alkalosis with respiratory compensation','Metabolic acidosis (AGMA from uremic acids) with respiratory compensation (hyperventilation reducing pCO₂)'], correct:3, exp:'pH 7.20 (acidosis) + low HCO₃⁻ (10) = metabolic acidosis. ESRD without dialysis → uremic acid buildup = AGMA. pCO₂ 28 (low) = lungs hyperventilating to compensate (Kussmaul breathing).' },
  { q:'A 22-year-old woman presents to the ER hyperventilating after a panic attack. ABG: pH 7.52, pCO₂ 28, HCO₃⁻ 22. What is her primary acid-base disorder?', choices:['Metabolic acidosis from anxiety-induced lactic acid','Metabolic alkalosis — vomiting is suspected','Respiratory alkalosis — hyperventilation blows off CO₂ raising pH; HCO₃⁻ is normal (no metabolic component)','Respiratory acidosis from respiratory muscle fatigue'], correct:2, exp:'pH 7.52 (alkalosis) + low pCO₂ (28) + normal HCO₃⁻ (22) = respiratory alkalosis. Panic attack → hyperventilation → CO₂ exhaled → pH rises. No metabolic component.' },
  { q:'A 65-year-old with COPD has ABG: pH 7.34, pCO₂ 58, HCO₃⁻ 30. What is the primary disorder and is there compensation?', choices:['Metabolic acidosis with respiratory compensation','Respiratory acidosis with renal compensation — high pCO₂ (CO₂ retention) is the primary problem; kidneys compensated by raising HCO₃⁻ to 30 (normal 22–26)','Metabolic alkalosis — HCO₃⁻ is elevated','Respiratory alkalosis from over-breathing'], correct:1, exp:'pH 7.34 (acidosis) + elevated pCO₂ (58) = respiratory acidosis from COPD/CO₂ retention. HCO₃⁻ 30 (elevated above normal 22–26) = renal compensation — kidneys made more bicarbonate to buffer the excess carbonic acid.' },
  { q:'A patient has been vomiting for 5 days. She is also on furosemide. ABG: pH 7.55, pCO₂ 48, HCO₃⁻ 38. What is the primary disorder and why are there two contributing causes?', choices:['Respiratory acidosis from hypoventilation','Respiratory alkalosis — pCO₂ is slightly elevated','Metabolic alkalosis from two sources: vomiting (loss of HCl) + contraction alkalosis from furosemide (plasma volume shrinks, HCO₃⁻ concentrates). Lungs mildly compensate (↑pCO₂) but are limited','Metabolic acidosis from potassium loss'], correct:2, exp:'pH 7.55 (alkalosis) + elevated HCO₃⁻ (38) = metabolic alkalosis. Two causes: vomiting = loss of HCl; furosemide = contraction alkalosis. pCO₂ 48 (slightly high) = mild respiratory compensation (hypoventilate to retain CO₂), but lungs\' ability to compensate is limited.' },
]});

var SUBJECT_DATA = {"neuro": {"title": "Neuro", "desc": "12 sections mapped to the Neuro learning objectives. Learn is complete slide-grounded review; Test is direct recall; Apply is PANCE-style practice.", "topics": [{"id": "n01", "name": "1. Meninges + Subarachnoid Hemorrhage", "hy": true, "cards": [{"title": "Meninges: dura, arachnoid, pia", "html": "<p><strong>Dura mater</strong> is pain-sensitive and has two layers. The endosteal layer attaches to the skull. The meningeal layer mostly lines the endosteal layer but can separate to form the dural venous sinuses.</p><p><strong>Arachnoid mater</strong> is a web of supportive collagen that provides shock support.</p><p><strong>Subarachnoid space</strong> lies between arachnoid and pia. It contains cerebral vasculature and CSF cisterns and houses cerebral arteries and veins.</p><p><strong>Pia mater</strong> is the innermost meningeal layer and contours every surface of the brain.</p>", "hy": true}, {"title": "SAH: pathophysiology, symptoms, workup", "html": "<p><strong>Subarachnoid hemorrhage</strong> is bleeding into the subarachnoid space.</p><p><strong>Traumatic SAH:</strong> one of the most common head injuries; tearing of cerebral and meningeal vessels within the subarachnoid space.</p><p><strong>Aneurysmal SAH:</strong> arterial dilation with thinned/disorganized vessel wall that can rupture under turbulent arterial pressure.</p><p><strong>Typical location:</strong> terminal internal carotid and branching sites on large cerebral arteries in the anterior Circle of Willis.</p><p><strong>Classic symptom:</strong> sudden onset “worst headache of my life.”</p><p><strong>Diagnosis:</strong> non-contrast CT. If CT is negative, proceed to lumbar puncture showing RBCs.</p><p><strong>Treatment consideration emphasized in slides:</strong> urgent recognition because mortality is high if not promptly identified.</p>", "hy": true}], "test": [{"q": "What are the three meningeal layers from superficial to deep?", "choices": ["Dura → arachnoid → pia", "Pia → arachnoid → dura", "Arachnoid → dura → pia", "Dura → pia → arachnoid"], "correct": 0, "exp": "The layers are dura mater, arachnoid mater, and pia mater."}, {"q": "Which meningeal layer is pain-sensitive?", "choices": ["Dura mater", "Arachnoid mater", "Pia mater", "Subarachnoid space"], "correct": 0, "exp": "The slides identify the dura mater as pain-sensitive."}, {"q": "What is found in the subarachnoid space?", "choices": ["Only fat", "CSF cisterns and cerebral vasculature", "Bone marrow", "Anterior pituitary hormones"], "correct": 1, "exp": "The subarachnoid space contains cerebral vasculature and CSF cisterns."}, {"q": "What is the classic presenting symptom of SAH?", "choices": ["Slow progressive memory loss", "Sudden worst headache of life", "Bilateral band-like pressure", "Resting pill-rolling tremor"], "correct": 1, "exp": "Slides list sudden onset “worst HA of my life.”"}, {"q": "What is the first diagnostic test listed for SAH?", "choices": ["EEG", "Non-contrast CT", "TSH", "MRI spine"], "correct": 1, "exp": "Slides list non-contrast CT for SAH diagnosis."}, {"q": "If CT is negative but SAH remains suspected, what is next?", "choices": ["Lumbar puncture showing RBCs", "No further workup", "Acetaminophen trial", "Pulmonary function test"], "correct": 0, "exp": "Slides state CT negative → lumbar puncture demonstrating RBCs."}], "apply": [{"q": "A patient reports sudden onset of the worst headache of life. Which diagnosis should be urgently considered?", "choices": ["Tension headache", "Subarachnoid hemorrhage", "Parkinson disease", "Myasthenia gravis"], "correct": 1, "exp": "Worst headache of life is classic for SAH."}, {"q": "A patient has suspected SAH. Non-contrast CT is negative but suspicion remains high. What should be done next?", "choices": ["Lumbar puncture", "EEG only", "Discharge", "Trial of sumatriptan"], "correct": 0, "exp": "Slides state CT negative → proceed to lumbar puncture showing RBCs."}, {"q": "A ruptured aneurysm causes SAH. Based on the slides, where are these aneurysms usually located?", "choices": ["Terminal ICA and anterior Circle of Willis branch sites", "Posterior pituitary", "Anterior horn of spinal cord", "Cauda equina"], "correct": 0, "exp": "Slides describe aneurysmal SAH at terminal ICA and branching sites on large cerebral arteries in anterior Circle of Willis."}, {"q": "A trauma patient has bleeding from torn cerebral and meningeal vessels within the subarachnoid space. What type of SAH is this?", "choices": ["Aneurysmal", "Traumatic", "Ischemic", "Metabolic"], "correct": 1, "exp": "Traumatic SAH occurs from tearing vessels in the subarachnoid space."}]}, {"id": "n02", "name": "2. Supporting Cells + Demyelination", "hy": false, "cards": [{"title": "Neurons and supporting cells", "html": "<p><strong>Neurons</strong> are functional components of the nervous system. Each neuron has a cell body, dendrites, and axon. Neurons are afferent/sensory or efferent/motor.</p><p><strong>Supporting cells</strong> protect, isolate, and provide metabolic needs to neurons.</p><ul><li><strong>PNS:</strong> Schwann cells.</li><li><strong>CNS:</strong> oligodendrocytes, astrocytes, microglial cells, ependymal cells.</li></ul>", "hy": false}, {"title": "Myelin and disease associations", "html": "<p><strong>Oligodendroglia/oligodendrocytes</strong> in the CNS and <strong>Schwann cells</strong> in the PNS produce myelin sheaths around axons.</p><p>Myelin increases velocity of nerve conduction and insulates the nerve. Destruction of the myelin sheath can lead to death of the axon.</p><p><strong>Multiple sclerosis:</strong> CNS demyelinating disorder involving myelin and oligodendroglial cells.</p><p><strong>Guillain-Barré syndrome:</strong> acute peripheral neuropathy with autoimmune attack on normal myelin sheaths in peripheral nerves after infection.</p>", "hy": true}], "test": [{"q": "Which supporting cell produces myelin in the PNS?", "choices": ["Schwann cell", "Oligodendrocyte", "Astrocyte", "Ependymal cell"], "correct": 0, "exp": "Schwann cells are the PNS myelin cells."}, {"q": "Which supporting cell produces myelin in the CNS?", "choices": ["Schwann cell", "Oligodendrocyte", "PP cell", "Anterior horn cell"], "correct": 1, "exp": "Oligodendrocytes/oligodendroglia are CNS myelin-producing cells."}, {"q": "Which disease is associated with CNS demyelination?", "choices": ["Multiple sclerosis", "Guillain-Barré syndrome", "SIADH", "Tension headache"], "correct": 0, "exp": "MS affects CNS myelin and oligodendroglial cells."}, {"q": "Which disease is an acute peripheral neuropathy after infection?", "choices": ["Multiple sclerosis", "Guillain-Barré syndrome", "Alzheimer disease", "Cushing syndrome"], "correct": 1, "exp": "GBS is an acute peripheral neuropathy often post-infection."}, {"q": "What is one function of myelin?", "choices": ["Slows nerve conduction", "Increases conduction velocity", "Produces cortisol", "Stores CSF"], "correct": 1, "exp": "Myelin increases the velocity of nerve conduction."}], "apply": [{"q": "A patient develops progressive symmetric limb weakness after a recent URI. Which disease best fits the slide description?", "choices": ["Guillain-Barré syndrome", "Multiple sclerosis", "Parkinson disease", "Alzheimer disease"], "correct": 0, "exp": "GBS is acute peripheral neuropathy with progressive symmetric limb weakness, often after URI or gastroenteritis."}, {"q": "A patient has recurrent CNS neurologic deficits with inflammation, demyelination, and axonal degeneration. Which disorder is most likely?", "choices": ["Multiple sclerosis", "GBS", "Cauda equina syndrome", "Cluster headache"], "correct": 0, "exp": "Slides describe MS as a chronic CNS demyelinating disorder with inflammation, demyelination, and axonal degeneration."}, {"q": "A disease attacks Schwann-cell myelin after Campylobacter infection. Which condition is most likely?", "choices": ["GBS", "MS", "MG", "ALS"], "correct": 0, "exp": "GBS can occur after Campylobacter jejuni and involves peripheral myelin."}]}, {"id": "n03", "name": "3. Neurotransmitters + Neuronal Communication", "hy": false, "cards": [{"title": "Electrical and chemical synapses", "html": "<p><strong>Electrical synapse:</strong> gap junctions between adjacent neurons allow action potentials to continue moving rapidly from neuron to neuron.</p><p><strong>Chemical synapse:</strong> neurochemicals are released from a presynaptic structure, cross the synaptic cleft, and interact with postsynaptic receptors on another neuron.</p><p>Synapses may be <strong>inhibitory</strong> or <strong>excitatory</strong>.</p>", "hy": true}, {"title": "Action potential phases", "html": "<p><strong>Resting membrane potential:</strong> polarized state before activity occurs.</p><p><strong>Depolarization:</strong> influx of sodium ions through open channels generates the electrical impulse.</p><p><strong>Repolarization:</strong> sodium channels close and the membrane becomes mainly permeable to potassium, causing potassium efflux.</p>", "hy": true}, {"title": "Neurotransmitters from slides", "html": "<p><strong>GABA</strong> mediates most synaptic inhibition. Drugs that affect GABA synapses include benzodiazepines and barbiturates.</p><p><strong>Glutamate</strong> mediates most synaptic excitation.</p><p>Other listed neurotransmitters: serotonin, dopamine, norepinephrine, epinephrine.</p>", "hy": true}], "test": [{"q": "What type of synapse uses gap junctions?", "choices": ["Electrical synapse", "Chemical synapse", "Hormonal synapse", "Trophic synapse"], "correct": 0, "exp": "Electrical synapses use gap junctions for rapid transmission."}, {"q": "What type of synapse releases neurochemicals into the synaptic cleft?", "choices": ["Electrical", "Chemical", "Portal", "Endocrine"], "correct": 1, "exp": "Chemical synapses use neurotransmitter release across the synaptic cleft."}, {"q": "Which ion influx causes depolarization?", "choices": ["Sodium", "Potassium", "Calcium only",

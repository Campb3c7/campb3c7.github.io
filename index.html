<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0e0c;
  --surface: #1a1916;
  --surface2: #222018;
  --border: #2e2b26;
  --border2: #3a3730;
  --text: #f0ece3;
  --text2: #a09a8e;
  --text3: #6b6560;
  --accent: #e8c27a;
  --accent-dim: rgba(232,194,122,.12);
  --radius: 14px;
}

html, body {
  min-height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 64px 24px 80px;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: -0.5px;
}
header p {
  margin-top: 10px;
  color: var(--text2);
  font-size: 16px;
}

#apps {
  margin-top: 44px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
}

.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  transition: border-color .15s, transform .15s, background .15s;
}
.card:hover {
  border-color: var(--accent);
  background: var(--surface2);
  transform: translateY(-2px);
}
.card .icon {
  font-size: 30px;
  line-height: 1;
}
.card h2 {
  margin-top: 14px;
  font-size: 19px;
  font-weight: 700;
}
.card p {
  margin-top: 7px;
  font-size: 14px;
  color: var(--text2);
  line-height: 1.5;
}
.card .tags {
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.card .tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .4px;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-dim);
  border-radius: 99px;
  padding: 3px 9px;
}

#empty {
  margin-top: 44px;
  color: var(--text3);
  border: 1px dashed var(--border2);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  display: none;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Home</h1>
    <p>Pick an app.</p>
  </header>
  <div id="apps"></div>
  <div id="empty">No apps in the manifest yet. Add one to <code>apps/manifest.js</code>.</div>
</div>

<!-- The manifest defines every app on this site. To add an app, edit apps/manifest.js — never this file. -->
<script src="apps/manifest.js"></script>
<script>
const grid = document.getElementById('apps');
const apps = (window.APPS || []);
if (!apps.length) document.getElementById('empty').style.display = 'block';
for (const app of apps) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = 'apps/' + app.folder + '/';
  a.innerHTML = `
    <div class="icon">${app.icon || '🔹'}</div>
    <h2></h2>
    <p></p>
    <div class="tags"></div>`;
  a.querySelector('h2').textContent = app.title;
  a.querySelector('p').textContent = app.description || '';
  const tags = a.querySelector('.tags');
  for (const t of (app.tags || [])) {
    const span = document.createElement('span');
    span.className = 'tag';
    span.textContent = t;
    tags.appendChild(span);
  }
  grid.appendChild(a);
}
</script>
</body>
</html>

!Cardiology
"A patient's EKG shows no P waves, an irregularly irregular rhythm, and variable ventricular rate. The physician notes that while the patient's ventricles are contracting, there is no organized atrial activity. Which of the following best explains why this patient may still tolerate this arrhythmia without immediate hemodynamic collapse?" : "The atria are contracting in a coordinated fashion at a slower rate", "Most ventricular filling occurs passively during diastole and does not require atrial contraction", "The AV node is firing independently to drive ventricular contractions", "The ventricles compensate by increasing contractility to make up for lost preload", "The SA node takes over to pace the ventricles directly" : 2 : "The slides state that most ventricular filling is passive — the 'atrial kick' only contributes the final 20–30%. In atrial fibrillation, there is loss of organized atrial contraction, but because the bulk of ventricular filling doesn't depend on it, patients can tolerate it as long as the ventricular rate allows adequate stroke volume. Loss of the atrial kick does decrease CO, but not catastrophically unless there is already poor ventricular function or a rapid ventricular response."
"A 67-year-old male with a history of hypertension is found to have a loud systolic murmur heard best between S1 and S2 at the right upper sternal border. Echocardiogram confirms narrowing of the outflow valve. Over time, which of the following best describes the expected structural change and its hemodynamic consequence?" : "The left ventricle dilates due to increased volume workload, leading to decreased contractility", "The right ventricle hypertrophies due to increased pulmonary pressures", "The left ventricle hypertrophies due to increased pressure workload, increasing oxygen demand", "The mitral valve becomes regurgitant due to elevated left atrial pressures", "The aorta dilates to compensate for increased forward flow" : 3 : "Aortic stenosis narrows the outflow tract, increasing resistance the left ventricle must overcome — this is increased afterload. The heart compensates through hypertrophy of the LV wall (pressure overload). However, a hypertrophic LV has increased oxygen demand, and the higher end-diastolic pressure makes the LV more reliant on the atrial kick to maintain stroke volume. This can eventually lead to heart failure."
"Norepinephrine is released from sympathetic nerve fibers innervating the arterioles and binds to alpha-adrenergic receptors on smooth muscle cells. What is the downstream hemodynamic effect of this interaction on mean arterial pressure?" : "MAP decreases because arteriolar dilation reduces peripheral resistance", "MAP increases because arteriolar constriction reduces blood flow and increases resistance", "MAP is unchanged because the heart compensates by reducing heart rate", "MAP decreases due to reduced cardiac output from negative chronotropy", "MAP increases because norepinephrine directly stimulates the SA node to increase heart rate" : 2 : "MAP = CO x Resistance. When norepinephrine binds alpha-adrenergic receptors on arteriolar smooth muscle, vasoconstriction occurs, which increases peripheral vascular resistance. Since MAP is the product of CO and resistance, increased resistance raises MAP. This is separate from the cardiac effects of norepinephrine. The arterioles are the primary resistance vessels in the system."
"A patient in the ICU develops a sudden run of wide-complex tachycardia. The team identifies this as ventricular tachycardia. Which antiarrhythmic is administered, and what is its primary mechanism of action?" : "Adenosine — drives potassium out of cells to hyperpolarize the AV nodal resting membrane potential", "Atropine — blocks muscarinic receptors to increase sympathetic tone and restore sinus rhythm", "Diltiazem — blocks calcium influx into cardiac cells to slow conduction at the SA and AV nodes", "Amiodarone — blocks potassium efflux from myocytes, prolonging the action potential and increasing the time to reset", "Furosemide — blocks sodium reabsorption in the kidney to reduce circulating volume and ventricular irritability" : 4 : "Amiodarone is the drug of choice for ventricular tachycardia. It acts primarily as a potassium channel blocker — it slows the outward movement of potassium, which prolongs the action potential duration and increases the refractory period. This means the myocyte takes longer to reset and fire again, reducing the chance of ectopic ventricular foci sustaining tachycardia. It does not change the resting membrane potential significantly."
"A patient presents with exertional chest pressure that reliably resolves with rest. Workup reveals moderate stenosis of a coronary artery. The clinician prescribes sublingual nitroglycerin for acute episodes. Through which TWO mechanisms does nitroglycerin reduce myocardial oxygen demand?" : "Increased heart rate and arteriolar constriction", "Coronary vasodilation increasing oxygen delivery and systemic venous dilation reducing preload", "Increased preload and increased afterload", "Beta-receptor blockade reducing contractility and diuresis reducing circulating volume", "Alpha-receptor stimulation and increased coronary artery resistance" : 2 : "Nitroglycerin works on two fronts to relieve angina: First, it directly vasodilates the coronary vessels to increase oxygen delivery to the ischemic myocardium. Second, it dilates systemic veins — this reduces venous return (preload) — and dilates systemic arterioles — this reduces arterial resistance (afterload). Both of these lower the oxygen demand the heart muscle must meet, relieving the supply-demand mismatch causing angina."
"The SA node fails to initiate an impulse and the AV node takes over pacing the heart. Which of the following statements best characterizes this situation?" : "This will produce a faster heart rate since the AV node fires at 60–100 bpm", "The resulting pacemaker will fire at 40–70 bpm, which is slower than normal SA nodal rate", "The AV node can produce heart rates equal to the SA node since both have equal automaticity", "Without the SA node, no cardiac pacemaker exists and asystole will immediately occur", "The Purkinje fibers will take over at 60–100 bpm to maintain normal cardiac output" : 2 : "The SA node is the primary pacemaker at 60–100 bpm. The AV node has automaticity but fires at only 40–70 bpm. If the SA node is suppressed or diseased, the AV node can assume pacing at its own intrinsic rate — this is a safety mechanism. While still functional, the slower rate may not be sufficient in patients with high metabolic demand. The Purkinje fibers can also pace but at an even slower rate."
"A 55-year-old woman develops sudden palpitations and near-syncope. EKG shows a narrow complex tachycardia at 185 bpm with no discernible P waves. The mechanism involves two pathways within the AV node with different refractory periods. IV adenosine is given. How does adenosine terminate this arrhythmia?" : "It blocks calcium efflux from AV nodal cells, terminating the reentry circuit by slowing phase 0 depolarization", "It activates potassium channels and inhibits calcium influx at the AV node, extending the refractory period and breaking the reentry circuit", "It stimulates muscarinic receptors on the SA node to override the ectopic pacemaker", "It decreases sodium channel activity in the ventricles to prevent conduction of the abnormal impulse", "It hyperpolarizes the ventricular myocytes to prevent propagation of the reentry impulse below the bundle of His" : 2 : "Adenosine acts at the AV node by activating potassium channels — driving K+ out of the cell hyperpolarizes the resting membrane potential. It also inhibits calcium influx. Together, these prolong the refractory period of AV nodal cells so that the reentry circuit, which requires the AV node to conduct rapidly and repeatedly, cannot sustain itself. This restores sinus rhythm by interrupting the circuit."
"A patient with longstanding poorly controlled hypertension is started on hydrochlorothiazide. What is the primary mechanism by which this medication lowers blood pressure?" : "Blocks alpha-1 adrenergic receptors in vascular smooth muscle to cause arterial dilation", "Acts on the distal convoluted tubule to prevent sodium reabsorption, decreasing total circulating fluid volume", "Inhibits ACE to prevent angiotensin II formation, reducing vasoconstriction and aldosterone secretion", "Blocks calcium channels in vascular smooth muscle to reduce peripheral vascular resistance", "Stimulates the baroreceptors in the aorta to decrease sympathetic outflow" : 2 : "Hydrochlorothiazide is a thiazide diuretic. It acts on the distal convoluted tubule of the nephron to block sodium reabsorption. When sodium isn't reabsorbed, water follows — this is excreted as urine. The result is decreased total circulating fluid volume, which reduces cardiac output and therefore lowers MAP. This is a first-line option for primary hypertension."
"A 42-year-old patient presents with elevated blood pressure. Labs reveal elevated aldosterone levels and a CT shows a unilateral adrenal mass. This represents which form of hypertension, and what is the mechanism by which the aldosterone elevation raises blood pressure?" : "Primary hypertension — aldosterone increases cardiac output by stimulating the SA node", "Secondary hypertension — aldosterone acts on the kidneys to reabsorb sodium and water, increasing circulating volume and blood pressure", "Secondary hypertension — aldosterone stimulates peripheral vasoconstriction by binding alpha receptors", "Primary hypertension — aldosterone increases renin release which promotes angiotensin II formation", "Secondary hypertension — aldosterone promotes diuresis and decreases preload to raise cardiac output" : 2 : "An aldosterone-secreting adrenal tumor is a known cause of secondary hypertension — one of the identifiable, non-essential causes. Aldosterone acts on the kidneys (collecting duct) to reabsorb sodium, and water follows osmotically. This increases total circulating volume, which raises cardiac output, which raises MAP. This is distinct from primary/essential hypertension where the cause is unknown."
"Which of the following correctly describes how the parasympathetic nervous system acts on the heart and which neurotransmitter mediates this effect?" : "Releases norepinephrine onto β1-adrenergic receptors to increase heart rate and conduction velocity", "Releases acetylcholine onto nicotinic receptors to increase contractility of ventricular muscle", "Releases acetylcholine onto muscarinic receptors of the SA and AV nodes to decrease heart rate and conduction velocity", "Releases vasopressin onto adrenergic receptors to reduce heart rate and promote fluid retention", "Releases norepinephrine onto muscarinic receptors in the atria to slow atrial contraction" : 3 : "The parasympathetic nervous system travels via the vagus nerve and releases acetylcholine. It binds to muscarinic (not nicotinic) receptors on the SA node, AV node, and atrial muscle. This decreases heart rate at the SA node and slows conduction velocity at the AV node. It may also reduce atrial contractility but does NOT directly affect ventricular contraction. Overall effect: decreased rate of cardiac pumping."
"A patient is brought in pulseless and unresponsive. The monitor shows totally chaotic ventricular electrical activity with no organized contractions. This is immediately incompatible with life. What is the most likely rhythm and why?" : "Ventricular tachycardia — rapid ventricular rate prevents adequate ventricular filling", "Atrial fibrillation with rapid ventricular response — uncoordinated atrial activity reduces cardiac output", "Ventricular fibrillation — asynchronous ventricular firing produces quivering with no effective cardiac output", "Third-degree AV block — complete dissociation between atria and ventricles eliminates stroke volume", "Sinus bradycardia — excessively slow heart rate is insufficient to maintain cardiac output" : 3 : "Ventricular fibrillation occurs when ventricular myocytes fire asynchronously in a chaotic, uncoordinated manner — instead of a coordinated contraction, the ventricles quiver. There is zero effective cardiac output. It is always incompatible with life without immediate defibrillation. It most commonly occurs in the setting of heart disease and often degenerates from ventricular tachycardia."
"A patient presents with an acute MI. The treating team administers chewable aspirin immediately. What is the mechanism by which aspirin addresses the underlying pathology of an MI?" : "Blocks thromboxane A2 production by irreversibly inhibiting COX-1, thereby reducing platelet aggregation at the site of the ruptured plaque", "Blocks the renin-angiotensin system to reduce vasoconstriction and promote coronary perfusion", "Directly dissolves the thrombus by activating plasminogen in the clot", "Blocks calcium channels to dilate coronary arteries and increase oxygen delivery", "Inhibits norepinephrine release from sympathetic fibers to reduce myocardial oxygen demand" : 1 : "MIs are most commonly caused by thrombotic occlusion at the site of a ruptured atherosclerotic plaque. Platelets aggregate at the rupture site and form a clot. Aspirin irreversibly inhibits COX-1, the enzyme that produces thromboxane A2 — a potent promoter of platelet aggregation. By blocking this pathway, aspirin reduces platelet clumping and limits clot growth. Giving aspirin early in a suspected ACS event is proven to reduce mortality."
"A 48-year-old male is found to have significant aortic regurgitation. Which hemodynamic change is most expected as a direct result of this valvular abnormality?" : "Increased afterload from elevated systemic vascular resistance due to backflow", "High end-diastolic pressure in the left ventricle and increased volume workload due to regurgitant blood", "Elevated pulmonary pressures from reduced left ventricular forward flow causing systemic venous congestion", "Decreased left ventricular diastolic filling due to mitral valve obstruction", "Hypertrophy of the right ventricle due to increased pulmonary vascular resistance" : 2 : "In aortic regurgitation, the aortic valve leaflets fail to seal during diastole, allowing blood to flow back from the aorta into the left ventricle. This increases the volume workload on the LV — it must eject the normal forward stroke volume plus the regurgitant volume each beat. Over time, this leads to LV dilation. It also causes a low diastolic blood pressure (aortic pressure falls during diastole) and widened pulse pressure."
"In the RAAS cascade, where is angiotensin-converting enzyme (ACE) primarily located and what does it convert?" : "In the kidneys, it converts renin to angiotensinogen", "In the liver, it converts angiotensinogen to angiotensin I", "On the surface of endothelial cells primarily in the lungs, it converts angiotensin I to angiotensin II", "In the adrenal cortex, it converts angiotensin II to aldosterone", "In the blood, it converts aldosterone to angiotensin II to promote vasoconstriction" : 3 : "ACE is located on the surface of endothelial cells primarily in the lungs. It catalyzes the conversion of angiotensin I (produced when renin cleaves angiotensinogen from the liver) into angiotensin II. Angiotensin II is the active, potent vasoconstrictor that also stimulates aldosterone release. This is the step blocked by ACE inhibitors like lisinopril, which prevents downstream vasoconstriction and sodium retention."
"A patient with systolic heart failure is started on Lisinopril. Their blood pressure remains above goal despite maximum dose. The provider considers adding a second antihypertensive. Which of the following would be the LEAST appropriate addition, given the patient's mechanism of disease?" : "Amlodipine — calcium channel blocker promoting vascular dilation", "Losartan — ARB that blocks angiotensin II receptor to prevent vasoconstriction", "Hydrochlorothiazide — thiazide diuretic promoting fluid excretion", "Carvedilol — only if patient is stable and without current volume overload", "Furosemide — loop diuretic used for active fluid overload and decompensation" : 4 : "Carvedilol (a beta-blocker/alpha-blocker) is used in heart failure but has an important contraindication: it should only be started in patients who are already stabilized on an ACE inhibitor AND show no evidence of current volume overload. Starting it during decompensated heart failure can worsen cardiac output due to its negative inotropic and chronotropic effects. The other agents are used earlier or independently in heart failure management."
"A 60-year-old woman with a history of emotional stress and no significant CAD presents with acute chest pain and EKG changes. Echo shows apical ballooning of the left ventricle. Which cardiomyopathy is most consistent with this presentation and what is the postulated mechanism?" : "Dilated cardiomyopathy — caused by chronic alcohol toxicity damaging myocytes and causing ventricular remodeling", "Hypertrophic cardiomyopathy — genetic thickening of the LV wall causing diastolic filling impairment", "Takotsubo cardiomyopathy — triggered by catecholamine excess or sympathetic nervous system activation, causing transient regional ventricular dysfunction", "Ischemic cardiomyopathy — caused by thrombotic occlusion of the LAD leading to permanent myocyte necrosis", "Obstructive cardiomyopathy — excess pericardial fluid exerts pressure on the LV, reducing cardiac output" : 3 : "Takotsubo cardiomyopathy (aka stress or broken heart syndrome) presents with transient left ventricular dysfunction — often apical ballooning — in the absence of significant CAD. It is triggered by emotional or physical stress and is postulated to result from catecholamine excess, SNS activation, or microvascular spasm, which causes regional 'stunning' of the cardiomyocytes. It can cause acute heart failure and arrhythmias but is typically reversible."
"Which of the following correctly describes the Frank-Starling mechanism and when it becomes harmful in heart failure?" : "Increased heart rate causes the ventricle to pump harder; this becomes harmful when tachycardia develops", "Increased ventricular volume stretches myocytes and increases contraction force; chronically this leads to ventricular dilation and decreased contractile force", "Reduced afterload allows the ventricle to eject more volume; this becomes harmful when aortic pressure falls too low", "Increased preload reduces myocyte stretch so the heart compensates with a weaker but faster contraction", "Increased ventricular stiffness causes the ventricle to fill with more blood and thus eject more per beat" : 2 : "The Frank-Starling law states that as end-diastolic volume increases (more ventricular filling), myocyte stretch increases, which produces a more forceful contraction. This initially compensates for reduced stroke volume by drawing on increased preload. However, if chronically elevated, this constant stretch leads to ventricular dilation. A dilated ventricle has increased wall tension and over time loses contractile force — worsening heart failure rather than compensating for it."
"A patient with decompensated heart failure presents with leg swelling, dyspnea, and crackles in the lungs. Which medication is most appropriate to address the acute volume overload, and what is its mechanism?" : "Carvedilol — blocks beta receptors to reduce heart rate and myocardial demand", "Amiodarone — prolongs action potential to reduce ectopic ventricular firing causing fluid overload", "Furosemide — blocks sodium, chloride, and water reabsorption in the renal tubules to promote profound diuresis", "Losartan — blocks angiotensin II receptors to reduce vasoconstriction and encourage gentle diuresis", "Lisinopril — inhibits ACE to prevent aldosterone secretion, slowly reducing fluid volume over weeks" : 3 : "In decompensated heart failure, fluid has backed up into the lungs (pulmonary edema) and periphery. Furosemide (Lasix) is a loop diuretic that acts in the loop of Henle to block sodium, chloride, and water reabsorption, causing rapid and profound diuresis. This decreases circulating volume, reduces preload, and relieves pulmonary congestion quickly. It is available both orally and IV and is the cornerstone of acute decompensation management."
"A patient is brought in with hypotension after a motor vehicle accident with suspected internal bleeding. What type of shock is this, and what is the direct hemodynamic cause of the hypotension?" : "Distributive shock — vasodilation has expanded the vascular space beyond available blood volume", "Cardiogenic shock — myocardial injury from trauma reduces cardiac contractility and output", "Obstructive shock — blood accumulates in the pericardium and compresses the heart, reducing cardiac filling", "Hypovolemic shock — inadequate circulating volume leads to decreased cardiac filling and reduced stroke volume, causing hypotension", "Neurogenic shock — spinal cord injury causes loss of vascular tone and venous pooling" : 4 : "Hemorrhage causes hypovolemic shock. With blood loss, there is not enough volume to fill the vascular system. Inadequate preload means the ventricle receives less blood, so stroke volume falls. Decreased stroke volume = decreased cardiac output = hypotension. The body compensates by releasing angiotensin II, epinephrine, norepinephrine, and vasopressin to try to maintain pressure, and ACTH increases aldosterone to retain sodium and water."
"In the setting of shock, anaerobic metabolism occurs at the cellular level. What is the byproduct of this process and what are its systemic consequences?" : "Carbon dioxide — causes respiratory acidosis, bronchoconstriction, and pulmonary edema", "Renin — activates RAAS to cause vasoconstriction, worsening tissue ischemia", "Lactic acid — causes metabolic acidosis that depresses the myocardium, decreases peripheral vascular responsiveness to catecholamines, and can lead to coma and death", "Creatinine — indicates renal failure secondary to decreased renal perfusion in shock states", "Vasopressin — triggers excessive fluid retention and cerebral edema, contributing to end-organ damage" : 3 : "When tissues are underperfused and oxygen delivery fails, cells switch to anaerobic glycolysis to produce ATP. This pathway produces lactic acid as a byproduct. Lactic acidosis has serious systemic consequences: it depresses myocardial function, reduces vascular responsiveness to catecholamines (making pressors less effective), and can cause CNS effects including coma. High lactate levels are independently associated with increased mortality in shock."
"A 35-year-old athlete is found to have a very low resting heart rate of 48 bpm during a routine physical. He is asymptomatic and has excellent exercise tolerance. What is the most likely mechanism of his bradycardia?" : "Blocked conduction at the AV node from age-related degeneration", "Increased vagal tone from athletic conditioning reducing SA node automaticity — physiologic bradycardia", "Degeneration of the sinus node from chronic hypertension causing impaired automaticity", "Triggered activity from hypokalemia causing afterdepolarizations that suppress normal SA firing", "First-degree AV block from medication side effect delaying conduction to the ventricles" : 2 : "Bradycardia in a trained athlete is typically physiologic. The slides describe one mechanism of bradycardia as reduced automaticity of the SA node due to increased vagal (parasympathetic) tone — which is a normal adaptation to athletic conditioning. Since the athlete is asymptomatic and has good exercise tolerance, this is not pathologic. Pathologic causes such as sick sinus syndrome or AV block would present differently."
"A patient has a tension pneumothorax following a stab wound to the chest. His blood pressure is critically low. What type of shock is this and why does it cause decreased cardiac output?" : "Hypovolemic shock — blood loss into the pleural space reduces circulating volume", "Cardiogenic shock — the penetrating injury damaged the myocardium, reducing contractility", "Distributive shock — the pain and injury trigger massive vasodilation reducing vascular resistance", "Obstructive shock — air under positive pressure deviates mediastinal structures and kinks the great veins, reducing diastolic filling and cardiac output", "Neurogenic shock — the injury triggers spinal cord dysfunction reducing sympathetic tone" : 4 : "A tension pneumothorax causes obstructive shock. Air accumulates in the pleural space under positive pressure and pushes the mediastinum toward the opposite side. This kinks and compresses the great veins (superior and inferior vena cava), reducing venous return to the right heart. With impaired diastolic filling, preload drops, stroke volume drops, and cardiac output falls — causing hypotension. It is a mechanical obstruction to cardiac output, not a pump failure."
"Which of the following is a correct pairing of a medication class and its mechanism of action in treating hypertension?" : "Amlodipine (Norvasc) — ACE inhibitor that blocks conversion of angiotensin I to angiotensin II", "Losartan (Cozaar) — loop diuretic that blocks sodium reabsorption in the loop of Henle", "Hydrochlorothiazide (Microzide) — blocks sodium reabsorption in the distal convoluted tubule to reduce fluid volume", "Furosemide (Lasix) — calcium channel blocker that dilates peripheral arteries by reducing smooth muscle contractility", "Lisinopril (Zestril) — ARB that blocks angiotensin II from binding its receptor to prevent vasoconstriction" : 3 : "Hydrochlorothiazide is a thiazide diuretic that acts on the distal convoluted tubule to block sodium reabsorption — water follows, increasing urine output and decreasing total circulating volume. The other pairings are incorrect: Amlodipine is a dihydropyridine calcium channel blocker; Losartan is an ARB; Furosemide is a loop diuretic; and Lisinopril is an ACE inhibitor, not an ARB."
"A patient with symptomatic bradycardia due to excess parasympathetic tone is given IV Atropine. What is the mechanism by which this improves heart rate?" : "It directly stimulates beta-1 adrenergic receptors to increase SA node automaticity", "It blocks muscarinic cholinergic receptors to prevent acetylcholine from contributing to parasympathetic tone, thereby allowing sympathetic tone to increase heart rate", "It increases calcium influx into SA nodal cells to accelerate spontaneous phase 4 depolarization", "It releases norepinephrine from sympathetic nerve terminals to directly stimulate adrenergic receptors", "It activates baroreceptors in the aorta to reflexively increase cardiac output and blood pressure" : 2 : "Atropine is a muscarinic antagonist (anticholinergic). The parasympathetic nervous system releases acetylcholine, which binds to muscarinic receptors on the SA and AV nodes to slow heart rate. Atropine blocks these receptors, preventing ACh from binding. This removes the parasympathetic brake on the heart, allowing sympathetic tone to dominate — increasing heart rate and cardiac output. It is used for symptomatic bradycardia."
"Which of the following correctly describes how atherosclerotic plaques form and how they impair coronary blood flow?" : "Lipoproteins deposit in the adventitia; sympathetic stimulation then causes smooth muscle hypertrophy and vessel dilation", "Endothelial injury triggers platelet aggregation and lipoprotein deposition in the intima; macrophages engulf cholesterol forming foam cells; smooth muscle cells migrate to the intima forming an atheroma that narrows the vessel lumen", "Excess aldosterone causes endothelial proliferation and vessel wall thickening, reducing lumen diameter", "Ruptured capillaries cause bleeding into the vessel wall; clotted blood organizes into a plaque that obstructs flow", "Calcium deposits from hypercalcemia harden the vessel media, reducing elasticity and increasing vascular resistance without narrowing the lumen" : 2 : "Atherosclerosis begins with endothelial injury, which allows lipoproteins to deposit in the intimal layer. Platelets aggregate at the injury site. An inflammatory response recruits macrophages that engulf the cholesterol — these become foam cells. Smooth muscle cells migrate from the media to the intima and proliferate. This forms an atheroma that progressively narrows the lumen, increasing resistance and reducing blood flow to the myocardium downstream."
"A patient with heart failure is experiencing compensatory SNS activation. Which of the following correctly describes what this compensation accomplishes acutely and what harm it causes chronically?" : "Acutely increases heart rate and promotes vasoconstriction to support blood pressure; chronically leads to hypokalemia and arrhythmias from excess catecholamines", "Acutely promotes fluid retention and venous pressure to improve cardiac output; chronically this dilates the ventricle, increases wall tension, and worsens contractile failure", "Acutely causes bradycardia to reduce oxygen demand; chronically causes renal failure from reduced renal blood flow", "Acutely dilates peripheral arterioles to improve organ perfusion; chronically causes systemic hypotension and syncope", "Acutely suppresses the RAAS to prevent vasoconstriction; chronically leads to hyponatremia from aldosterone deficiency" : 2 : "In heart failure, the SNS activates to compensate for low cardiac output by increasing heart rate and promoting fluid retention — this raises circulating volume and improves filling pressure (Frank-Starling). However, fluid retention chronically increases central venous pressure, raises end-diastolic volume, and promotes ventricular dilation. The chronically dilated ventricle has increased wall tension and progressive loss of contractile function, worsening the heart failure over time."
"A patient with AFib is started on diltiazem. The goal is rate control. What is diltiazem's mechanism of action in this setting?" : "Blocks potassium efflux from cardiac cells to prolong the action potential and reduce the rate of atrial firing", "Drives potassium out of AV nodal cells to hyperpolarize the resting membrane potential and interrupt reentry", "Slows calcium influx into cardiac cells, specifically at the SA and AV nodes, slowing conduction and reducing ventricular rate", "Blocks muscarinic receptors to reduce vagal tone and allow the ventricular rate to stabilize", "Inhibits sodium channels in the Purkinje fibers to prevent ventricular ectopy from conducting to the rest of the myocardium" : 3 : "Diltiazem is a non-dihydropyridine calcium channel blocker. In AFib, the goal of diltiazem is rate control — slowing how many atrial impulses get through to the ventricles. It does this by slowing calcium influx into cardiac cells, specifically working on the SA and AV nodes (negative chronotropic and dromotropic effects). Fewer impulses pass through the AV node, slowing ventricular rate and improving diastolic filling time and cardiac output."
"Which of the following accurately describes the difference between stable and unstable angina based on the slide content?" : "Stable angina occurs at rest and is caused by complete occlusion; unstable angina only occurs with exertion", "Stable angina is caused by coronary vasospasm unrelated to plaque; unstable angina is caused by atherosclerosis with exertional triggers", "Stable angina is precipitated by exertion and relieved by rest due to gradual stenosis; unstable angina occurs at rest with plaque fissuring and transient thrombotic occlusion and may progress to MI", "Stable angina is caused by right coronary artery disease; unstable angina is caused by left anterior descending artery disease", "Stable and unstable angina have the same pathophysiology but differ only in duration of symptoms" : 3 : "Stable angina results from gradual progression of stenosis — symptoms are triggered by increased myocardial oxygen demand (exercise, stress) and relieved by rest when demand normalizes. Unstable angina occurs when stenosis progresses beyond 90% OR when the plaque fissures — platelet aggregation and transient thrombotic occlusion cause pain at rest lasting 10–20 minutes. If the occlusion becomes persistent or complete, myocardial infarction occurs with irreversible myocyte necrosis."
"A patient with hypertension develops progressive worsening of renal function and is found to have accelerated atherosclerosis of the renal arteries. How does hypertension contribute to this vascular damage and what does renal artery stenosis then do to blood pressure?" : "Hypertension causes vasodilation of the renal arteries which then reduce renin output and lower blood pressure", "Hypertension increases strain and shear stress on vessel walls, accelerating endothelial injury and atherosclerosis; renal artery stenosis then reduces renal blood flow, triggering renin release and further raising blood pressure via RAAS", "Hypertension causes the kidneys to hyperfiltrate which then causes tubular damage and secondary aldosterone deficiency", "Hypertension directly activates baroreceptors to increase renin output, which immediately corrects the pressure elevation", "Hypertension causes renal cortex hypertrophy which compresses the renal arteries from within, reducing blood flow" : 2 : "Chronic hypertension increases mechanical strain and shear forces on vessel walls — this injures the endothelium and accelerates atherosclerosis, particularly at bifurcations and bending points. When the renal arteries become stenotic from this process, renal perfusion falls. The kidneys interpret this as low blood pressure and release renin, activating RAAS — producing angiotensin II (vasoconstriction) and aldosterone (sodium/water retention), which further elevates blood pressure, creating a self-reinforcing cycle."
"A patient is found unresponsive after a witnessed collapse. The monitor shows ventricular fibrillation. After successful defibrillation, the team identifies the most likely precipitating cause. Which of the following is consistent with the slide content as a common setting in which ventricular myocytes become especially irritable and prone to fibrillation?" : "Hyperkalemia and systemic alkalosis from prolonged vomiting", "Hypoxia and hypokalemia — conditions that make ventricular foci more irritable", "Hypercalcemia from prolonged immobility causing triggered activity in the AV node", "Hypertension and tachycardia increasing myocardial oxygen demand beyond what the coronaries can supply", "Hypernatremia reducing the transmembrane potential gradient and causing spontaneous depolarization" : 2 : "The slides specifically state that ventricular foci become especially irritable during episodes of hypoxia and hypokalemia. Hypoxia makes ischemic myocytes electrically unstable. Hypokalemia reduces outward potassium movement, which prolongs repolarization — this predisposes to triggered activity and reentry arrhythmias. Both conditions can push ventricular tachycardia into fibrillation. Recognizing and correcting these electrolyte and oxygenation abnormalities is critical in managing ventricular arrhythmias."
</script>

<script type="text/plain" data-lecture="Pulmonology" data-set="Pulmonology_hard_set_1">
!Pulmonology
"A 58-year-old male with a long history of heavy smoking presents with progressive dyspnea, pursed-lip breathing, and use of accessory muscles. He is thin and has no peripheral edema. ABG shows minimal hypoxia but significant CO2 retention. Which pathophysiologic mechanism best explains why his CO2 is elevated despite relatively preserved oxygen levels?" : "V/Q mismatch from inflamed, mucus-filled bronchi reduces oxygenation more than ventilation", "Destruction and dilatation of alveolar walls with coalescence of terminal bronchioles reduces air exchange surface area, trapping CO2", "Right ventricular failure causes backpressure into the pulmonary circuit reducing CO2 clearance", "Bronchial smooth muscle hypertrophy narrows the airway lumen and limits expiratory CO2 outflow", "Loss of surfactant causes alveolar collapse and prevents CO2 from reaching the alveoli for exhalation" : 2 : "This patient is a classic pink puffer — emphysema subtype of COPD. The destruction and dilatation of alveolar walls with coalescence of terminal bronchioles reduces the total surface area available for gas exchange. Air gets trapped from loss of elastic recoil, meaning CO2 cannot efficiently exit. Hypoxia is minimal because some alveoli still function, but CO2 builds up due to the reduced exchange surface. Option 1 describes blue bloater pathophysiology, not emphysema. Options 3, 4, and 5 do not reflect emphysema mechanics from the slides."
"A 19-year-old male is intubated and placed on mechanical ventilation after a drug overdose. One hour later, he becomes suddenly hypotensive, tachycardic, and you notice absent breath sounds on the left with tracheal deviation to the right. What is the most likely mechanism behind his current deterioration?" : "The drug overdose suppressed his respiratory drive causing progressive atelectasis bilaterally", "Aspiration of gastric contents caused ARDS with bilateral alveolar flooding", "The mechanical ventilator delivered positive pressure creating a one-way valve effect in a pleural tear, causing trapped air to build pressure and compress the heart", "Fluid overload from IV resuscitation caused cardiogenic pulmonary edema and hypotension", "The endotracheal tube advanced into the right mainstem bronchus, collapsing the left lung" : 3 : "Mechanical ventilation is the most common cause of tension pneumothorax. The positive pressure delivered by the machine can force air through a pleural tear — this acts as a one-way valve, trapping air in the pleural space. As pressure builds, it compresses the heart and great vessels, impairing venous return and causing hypotension and tachycardia. Tracheal deviation away from the affected side (to the right = left-sided tension PTX) confirms this. The other options do not explain tracheal deviation and acute cardiovascular collapse together."
"A 34-year-old woman with rheumatoid arthritis presents with progressive dyspnea and pleuritic chest pain. Thoracentesis yields fluid with high protein, high LDH, and inflammatory cells. Which mechanism of pleural effusion best explains her presentation?" : "Increased hydrostatic pressure from right heart failure pushes fluid into the pleural space", "Low vascular oncotic pressure from hypoalbuminemia allows fluid to seep out of pulmonary blood vessels", "Local inflammation from her autoimmune disease causes a proteinaceous, inflammatory exudative effusion", "Lymphatic drainage obstruction from a mediastinal tumor traps normally produced pleural fluid", "Thickened, viscous secretions block normal pleural fluid production and create a backlog of fluid" : 3 : "Connective tissue diseases like rheumatoid arthritis are a cause of exudative pleural effusions. Exudates are caused by local factors — inflammation from RA causes local pleural inflammation, producing proteinaceous, inflammatory fluid. The fluid is classified by Light's criteria. Options 1 and 2 both describe transudative mechanisms — increased hydrostatic pressure (CHF) and low oncotic pressure (nephrotic syndrome/liver disease). Option 4 could cause an exudate but is not the described mechanism for autoimmune disease. Option 5 does not relate to pleural effusion pathophysiology."
"A patient with nephrotic syndrome develops bilateral pleural effusions. Thoracentesis fluid has minimal protein and is non-inflammatory. Which mechanism drives this effusion?" : "Local pleural inflammation from immune complex deposition increases capillary permeability", "Increased hydrostatic pressure from right-sided heart failure forces fluid into the pleural space", "Loss of plasma proteins reduces vascular oncotic pressure, allowing fluid to seep out of pulmonary blood vessels into the pleural space", "Obstruction of lymphatic drainage prevents normal absorption of pleural fluid", "Pleural metastases from renal malignancy stimulate excess fluid production" : 3 : "Nephrotic syndrome causes massive loss of plasma proteins in the urine, dramatically lowering vascular oncotic pressure. When oncotic pressure falls, the force that keeps fluid in the capillaries is reduced, allowing fluid to leak into third spaces including the pleural cavity. This produces a transudate — minimal protein, non-inflammatory — which is exactly what the thoracentesis shows. This is one of the classic transudate-causing conditions listed on the slides alongside CHF, chronic liver disease, and myxedema."
"A 45-year-old construction worker who worked extensively with insulation materials in the 1990s presents with progressive dyspnea, bibasilar crackles, and clubbing. HRCT shows peripheral, basilar predominant opacities. Lung biopsy is performed. What is the most likely diagnosis given his specific occupational exposure?" : "Silicosis from crystalline silica dust in construction materials", "Idiopathic pulmonary fibrosis with unknown environmental trigger", "Asbestosis, a form of pneumoconiosis from asbestos exposure causing pulmonary fibrosis", "Sarcoidosis triggered by occupational environmental pollutants", "Large cell carcinoma strongly associated with his construction occupation" : 3 : "Asbestosis is a type of pneumoconiosis specifically caused by asbestos exposure — a material widely used in construction and insulation until its hazards were recognized. Like all pneumoconioses, it causes pulmonary fibrosis by damaging lung connective tissues, leading to progressive impairment of gas diffusion and exchange. The HRCT pattern of peripheral, basilar opacities with honeycombing can appear in both asbestosis and IPF, but the key differentiator here is the specific occupational history. Silicosis comes from crystalline silica — mining and coal workers, not insulation installers."
"A 24-year-old asthmatic is brought to the ED with severe bronchospasm unresponsive to repeated albuterol doses. The attending wants to start salmeterol. Why is this the wrong choice for this patient right now?" : "Salmeterol causes tachycardia and hypertension, worsening the current exacerbation", "Salmeterol is only approved for COPD and has no indication in asthma patients", "Salmeterol is contraindicated for treatment of status asthmaticus and acute exacerbations of asthma", "Salmeterol blocks beta-2 receptors and would worsen the bronchospasm", "Salmeterol requires 72 hours to reach therapeutic levels, making it useless in acute settings" : 3 : "Salmeterol (Serevent) is a long-acting beta agonist explicitly contraindicated in the treatment of status asthmaticus and acute asthma exacerbations. It is also contraindicated as monotherapy in asthma without an inhaled corticosteroid. While it is approved for asthma as adjunctive maintenance therapy, its long-acting nature makes it inappropriate as a rescue agent. In a severe acute exacerbation, the correct escalation is to systemic corticosteroids like methylprednisolone (Solumedrol) IV/IM, which suppress the inflammatory cascade driving the edema and bronchospasm."
"A patient with known asthma is being managed with only albuterol (PRN). He is now using his rescue inhaler daily and waking up with symptoms multiple nights per week. The provider decides to add a maintenance medication that addresses the bronchial and bronchiolar edema component of asthma. Which drug is being added?" : "Salmeterol (Serevent) — long-acting beta agonist for bronchospasm control", "Ipratropium (Atrovent) — anticholinergic for rescue bronchodilation", "Methylprednisolone (Solumedrol) — IV systemic corticosteroid for acute inflammation", "Fluticasone (Flovent) — inhaled corticosteroid for potent local anti-inflammatory and vasoconstrictive effect", "Prednisone — oral systemic corticosteroid for chronic maintenance suppression" : 4 : "Asthma has three components that need to be addressed: bronchospasm, mucus plugging, and bronchial/bronchiolar edema. Albuterol handles bronchospasm acutely, but doesn't treat the underlying edema. Fluticasone (Flovent) is an inhaled corticosteroid indicated as monotherapy maintenance for asthma — its potent local anti-inflammatory and vasoconstrictive effect directly reduces the bronchial and bronchiolar edema that is now driving the patient's daily symptoms. Salmeterol cannot be used without an ICS in asthma. Systemic corticosteroids are for exacerbations, not stable maintenance."
"A patient with COPD is started on a daily inhaled corticosteroid. Two weeks later he returns complaining of a white coating on his tongue and throat. What is happening and which drug caused it?" : "Ipratropium caused dry mouth, leading to bacterial overgrowth in the oral cavity", "Albuterol use caused mucosal dryness and a fungal superinfection from reduced mucociliary clearance", "Fluticasone, an inhaled corticosteroid, caused oral candidiasis as a known side effect from local immunosuppression in the oral cavity", "Salmeterol caused headaches and sinus infections that spread to the oral mucosa", "Prednisone suppressed systemic immunity causing disseminated candidiasis starting in the mouth" : 3 : "Oral candidiasis is a well-known side effect of inhaled corticosteroids like fluticasone (Flovent). Because the drug is inhaled through the mouth, it deposits in the oral cavity and causes local immunosuppression that allows Candida (a normal oral commensal) to overgrow. Other side effects of fluticasone include sinus infections, voice changes, fatigue, and arthralgia. This is why patients using inhaled corticosteroids are instructed to rinse their mouth after use. Salmeterol's side effects are headaches and hypertension. Ipratropium causes bronchitis and headaches."
"A 52-year-old immunocompromised patient who has been on long-term corticosteroids develops epiglottitis. His cultures grow an organism not typically expected in a healthy host. Which pathogen is most consistent with his immunocompromised state?" : "Haemophilus influenzae type B, the most common pathogen in children", "Streptococcus pneumoniae, the most common pathogen in healthy adults", "Parainfluenza virus type 1, the typical cause of laryngeal infections", "Pseudomonas aeruginosa, one of the pathogens seen in epiglottitis among immunocompromised patients", "Bordetella pertussis, commonly seen in unvaccinated immunosuppressed adults" : 4 : "Epiglottitis pathogens differ by immune status. In children, Hib is most common but has declined since vaccination. In healthy adults, Streptococcus pneumoniae is the usual culprit. However, in immunocompromised patients, the spectrum broadens to include Pseudomonas aeruginosa, Serratia spp, Enterobacter spp, anaerobic flora, and Candida species. Long-term corticosteroids suppress cellular immunity, making this patient vulnerable to opportunistic organisms. Parainfluenza causes croup, not epiglottitis. Bordetella pertussis causes whooping cough, not epiglottitis."
"A 7-year-old child presents with a barking cough, stridor, and fever that progressed over 24 hours after a runny nose. His symptoms are worst at night. The pediatrician makes a clinical diagnosis without imaging. What feature most distinguishes croup from epiglottitis in this presentation?" : "The presence of fever makes epiglottitis more likely than croup", "Croup presents with a barking cough and stridor arising from laryngeal and subglottic inflammation after a viral prodrome, while epiglottitis presents with the three Ds and does not typically cause a barking cough", "Epiglottitis always requires imaging confirmation before treatment can begin", "Croup requires immediate airway management in all cases", "Both conditions are primarily caused by parainfluenza virus and cannot be distinguished clinically" : 2 : "Croup and epiglottitis can both present with stridor and respiratory distress, making them easy to confuse. The key distinctions are: croup is caused by parainfluenza virus type 1, begins with nasal congestion and progresses to a barking cough and inspiratory stridor, and is self-limited. Epiglottitis presents with the three Ds — distress, drooling, and dysphagia — a muffled voice, tripod or sniffing positioning, and notably does NOT cause a barking cough. Epiglottitis is a medical emergency requiring immediate airway management, while croup is usually managed symptomatically."
"A 6-week-old infant is admitted in winter with fever, wheezing, tachypnea, and apneic episodes. He was born full-term with no complications. The most likely causative organism infects terminal bronchiolar epithelial cells, sparing basal cells, and extends to alveolar pneumocytes. Which organism is responsible?" : "Haemophilus influenzae type B causing acute lower respiratory infection", "Parainfluenza virus type 1 causing subglottic croup-like inflammation", "Respiratory syncytial virus (RSV), an RNA virus that causes severe bronchiolitis in infants", "Bordetella pertussis causing paroxysmal cough and apnea in the unvaccinated", "Mycoplasma pneumoniae causing atypical pneumonia in the neonatal period" : 3 : "RSV (Respiratory Syncytial Virus) is the most common cause of bronchiolitis in infants under 2 years. RSV is an RNA virus in the Pneumoviridae family, with Subtype A causing more severe disease. It infects terminal bronchiolar epithelial cells, sparing basal cells, then spreads to type 1 and type 2 alveolar pneumocytes. In infants, it can cause severe lower respiratory disease, bronchospasm, apnea, and respiratory failure requiring hospitalization. Immunocompromised patients are also at high risk. It is self-limited in healthy adults but dangerous in the very young."
"A 38-year-old woman with a history of IV drug use presents with fever, night sweats, weight loss, and a cough with blood-tinged sputum. CXR reveals apical cavitation with regional lymph node inflammation. PPD induration is 6 mm. How should her PPD be interpreted and what does the CXR pattern indicate?" : "The PPD is negative because 6 mm is below the 10 mm threshold required regardless of risk factors, and the CXR is consistent with latent TB", "The PPD is positive at 5 mm threshold because she is an IV drug user — a high-risk category — and the CXR shows reactivation TB or primary TB with apical cavitation", "The PPD is only valid if the CXR is normal, so imaging must be repeated before interpreting the test", "The PPD is negative, and the CXR apical cavitation is most consistent with a pulmonary carcinoid tumor", "The PPD is indeterminate at 6 mm and requires a repeat test in 8 weeks to confirm" : 2 : "PPD interpretation is risk-stratified. IV drug users (IVDA) fall in the 10 mm positive threshold group — along with those under age 4, high-risk occupations, and high-risk diseases like DM and end-stage renal disease. However, IVDA is specifically listed in the 10 mm category. Wait — at 6 mm, she does not meet the 10 mm threshold for IVDA. BUT, if she is also HIV-positive or immunocompromised (which her history of IVDA raises), the threshold drops to 5 mm. Given IVDA, she could be HIV-positive, making 5 mm positive. The apical cavitation with regional lymph node inflammation is the radiographic pattern of reactivation or primary active TB — distinct from the granuloma of latent TB or the miliary pattern of disseminated TB."
"A patient with latent TB who recently started chemotherapy for lymphoma develops fever, productive cough, and hemoptysis. His TB had been controlled for years. What pathophysiologic event best explains his current symptoms?" : "His chemotherapy caused bronchiectasis, allowing secondary bacterial colonization mimicking TB symptoms", "The cytotoxic chemotherapy caused ARDS by directly damaging pulmonary capillaries and alveoli", "Chemotherapy-induced immunosuppression caused a breakdown in cellular immunity, allowing TB to escape from its granuloma and reactivate", "His lymphoma spread to the mediastinum, compressing airways and causing obstructive atelectasis with secondary infection", "The Mantoux test cross-reacted with his chemotherapy agents, giving a false positive result and misattributing active disease" : 3 : "Latent TB is kept contained by a functioning immune system — specifically macrophages and T cells that seal the mycobacteria inside granulomas. About 10% of latent TB reactivates per year in those with intact immunity, but that rate dramatically increases when cellular immunity breaks down. Chemotherapy suppresses T cells, removing the immune check on the granuloma. TB escapes, replicates, and causes active disease with the hallmark apical cavitation, cough, hemoptysis, fever, and weight loss. The greater the immunocompromise, the higher the risk of dissemination to the liver, kidneys, bone (Pott's disease), spleen, and meninges."
"A patient is found to have a pleural effusion. Thoracentesis is performed and the following is sent: protein level, LDH, gram stain, culture, glucose, and cytology. The cytology returns positive for malignant cells. What classification of effusion is this and what is the causative mechanism?" : "Transudate, caused by decreased oncotic pressure from the malignancy's effect on albumin production", "Transudate, caused by increased hydrostatic pressure from tumor compressing pulmonary vasculature", "Exudate, caused by local factors — malignancy produces inflammation and direct pleural involvement creating a proteinaceous, inflammatory effusion", "Transudate, caused by lymphatic obstruction from mediastinal tumor spread", "Exudate, caused by systemic factors producing excess fluid that cannot be absorbed by lymphatics" : 3 : "Malignancy is a classic cause of an exudative pleural effusion. Exudates are caused by local factors — in this case, the tumor directly involves the pleura or lung, causing local inflammation that makes the pleural fluid proteinaceous and inflammatory. The fluid is classified by Light's criteria comparing protein and LDH levels between the fluid and serum. Cytology positive for malignant cells confirms the local, not systemic, origin. Transudates are from systemic conditions like CHF (increased hydrostatic pressure) or nephrotic syndrome (decreased oncotic pressure). Malignancy is never a transudative cause per the slides."
"A newborn is delivered at 30 weeks gestation and immediately develops severe respiratory distress, grunting, and cyanosis. Chest X-ray shows diffuse bilateral opacities. What is the underlying mechanism of this infant's respiratory failure?" : "Recurrent infections caused by viscous secretions from abnormal chloride transport, as seen in cystic fibrosis", "Lack of surfactant from immature columnar glandular cells increases alveolar surface tension, causing the alveoli to stick together and collapse", "Obstruction of the terminal bronchioles by meconium causes obstructive atelectasis and V/Q mismatch", "Cytokine storm from perinatal infection causes capillary leak and alveolar flooding identical to ARDS", "Absence of intercostal muscle innervation from immature spinal cord prevents generation of negative intrathoracic pressure needed for inspiration" : 2 : "Surfactant is a lipid secreted by the columnar glandular (adenomatous) cells that line the alveoli. It improves alveolar inflation and reduces the tendency of the alveoli to collapse (atelectasis). In premature infants, these cells are immature and do not produce adequate surfactant, causing adhesive atelectasis — where lack of surfactant increases surface tension, making alveoli stick together and collapse. This is neonatal respiratory distress syndrome. Cystic fibrosis presents later in infancy with meconium ileus and productive cough, not immediate neonatal respiratory failure."
"A 67-year-old patient is on a mechanical ventilator after ARDS. He suddenly develops hypotension, tracheal deviation to the left, absent breath sounds on the right, and JVD. Ultrasound shows absence of lung sliding on the right. What is the most appropriate next step?" : "Order a stat CXR to confirm the diagnosis before intervening", "Increase the tidal volume on the ventilator to re-expand the collapsed right lung", "Perform needle aspiration and chest tube or catheter thoracostomy to relieve the tension pneumothorax", "Administer IV fluids aggressively to treat the hypotension from presumed hypovolemia", "Perform immediate bronchoscopy to assess for mucus plug causing right-sided atelectasis" : 3 : "This is a tension pneumothorax — the most common cause of which is mechanical ventilation. The ventilator delivers positive pressure, forcing air through a pleural tear in a one-way valve fashion. As air builds in the right pleural space, intrathoracic pressure rises, collapsing the right lung and pushing the trachea to the left. The compressed great vessels reduce venous return, causing hypotension and JVD. Ultrasound confirms absent lung sliding. In an unstable patient, the diagnosis should be made clinically and treated immediately with needle aspiration and chest tube — waiting for CXR in a crashing patient is the wrong choice."
"A 29-year-old woman has a witnessed aspiration event during a seizure. Three days later she develops worsening hypoxia, bilateral pulmonary infiltrates, tachypnea, and diffuse crackles. She is afebrile. Which mechanism best explains her clinical deterioration?" : "Aspiration seeded her lungs with bacteria causing lobar pneumonia and consolidation", "Gastric aspiration caused a direct insult to pulmonary capillaries and alveoli, triggering a cytokine storm, capillary leak, alveolar flooding, and surfactant washout — consistent with ARDS", "The seizure caused a neurogenic pulmonary edema from elevated intracranial pressure impairing venous return", "Aspiration of a foreign body caused obstructive atelectasis in the right lower lobe with reactive edema", "Aspiration triggered a hypersensitivity reaction causing eosinophilic pneumonia with inflammatory infiltrates" : 2 : "Gastric aspiration is one of the direct causes of ARDS listed on the slides (alongside toxic inhalation and SARS/COVID). Aspirated gastric acid directly injures the pulmonary capillaries and alveoli. This triggers a cytokine storm with massive capillary endothelial leak — the alveoli become boggy, surfactant is washed away, and gas exchange is critically impaired. Alveoli collapse during exhalation as compliance worsens. The fibrinogen-rich fluid that leaks in forms clots in the hyaline membrane, further impairing gas exchange. This is ARDS pathophysiology, presenting days after the inciting event with bilateral infiltrates and progressive hypoxia."
"A 55-year-old male smoker presents with a central lung mass on CT arising from the left mainstem bronchus, accompanied by hemoptysis and weight loss. A second heavy smoker presents with a peripheral lung mass at the alveolar level affecting glandular cells. Which pairing correctly identifies both carcinomas?" : "Both are small cell carcinomas, which are highly malignant and strongly associated with smoking regardless of location", "The central mass is squamous cell carcinoma affecting squamous cells of the bronchi; the peripheral mass is adenocarcinoma affecting glandular cells of the alveoli", "The central mass is large cell carcinoma, an undifferentiated tumor; the peripheral mass is squamous cell carcinoma", "The central mass is adenocarcinoma of the bronchi; the peripheral mass is small cell carcinoma of the alveoli", "Both are large cell carcinomas since they are both strongly associated with smoking" : 2 : "Location and cell type are the key distinguishers between lung carcinoma subtypes. Squamous cell carcinoma arises in the central part of the lung or the right/left main bronchi, affecting squamous cells — exactly what is described in patient 1. Adenocarcinoma arises in the smaller airways (alveoli) and affects glandular cells — matching patient 2. Large cell carcinoma is undifferentiated, strongly associated with smoking, but does not fit either location-cell type pair specifically. Small cell carcinoma is very aggressive and highly malignant but is its own distinct entity, also strongly associated with smoking."
"A 62-year-old male with a 40 pack-year smoking history is found to have a peripheral lung lesion on routine CT that is 25 mm, well-defined, and completely surrounded by pulmonary parenchyma. He is asymptomatic. What is the most appropriate management?" : "Immediate surgical resection given his smoking history and lesion characteristics", "Bronchoscopy with biopsy and lymph node sampling as first-line evaluation for all pulmonary lesions", "Follow-up imaging to monitor size and shape is required, as all pulmonary nodules (≤30 mm) discovered incidentally require monitoring", "Reassure the patient — since the nodule is under 30 mm and well-defined, it requires no further workup", "Begin empiric chemotherapy for presumed non-small cell carcinoma based on smoking history" : 3 : "A pulmonary nodule is defined as a small (≤30 mm), well-defined lesion completely surrounded by pulmonary parenchyma. Most are discovered incidentally on imaging done for another reason — which is exactly this scenario. Per the slides, all pulmonary nodules require follow-up to monitor size and shape. This does not mean immediate resection or biopsy for every nodule, but it does mean the lesion cannot be simply dismissed. The combination of his age and smoking history warrants close surveillance to detect any growth that would change management."
"A 44-year-old woman with scleroderma presents with exertional dyspnea, fatigue, exertional chest pain, and syncope with activity. Exam reveals increased JVP, peripheral edema, and a cardiac murmur. Which condition has she most likely developed as a complication of her underlying disease?" : "Left-sided heart failure from scleroderma-related cardiomyopathy causing pulmonary congestion", "Cor pulmonale from right ventricular failure secondary to scleroderma-related pulmonary hypertension", "Recurrent pulmonary emboli from hypercoagulable state associated with autoimmune disease", "Idiopathic pulmonary fibrosis with secondary hypoxemia causing exertional symptoms", "Cardiac tamponade from scleroderma-related pericarditis causing obstructive shock" : 2 : "Collagen vascular disorders — including scleroderma specifically — are listed as an etiology of pulmonary hypertension. Pulmonary hypertension raises pressure in the pulmonary circuit, forcing the right ventricle to hypertrophy to pump blood through. When the right ventricle fails, it causes cor pulmonale — the complication of pulmonary hypertension that alters right ventricular structure and function. The symptoms of exertional dyspnea, fatigue, exertional chest pain, and syncope with signs of increased JVP, edema, and ascites are all listed on the slides as the signs and symptoms of pulmonary hypertension and cor pulmonale combined."
"A medium-risk PE patient has a D-dimer result that comes back elevated. His vital signs are stable. What is the correct next diagnostic step based on the Wells criteria-based workup algorithm?" : "Rule out PE — an elevated D-dimer with stable vitals indicates low clinical probability and no further workup is needed", "Admit for anticoagulation — elevated D-dimer in a medium-risk patient is sufficient to initiate treatment without imaging", "Order a CTA or V/Q scan of the chest, since an elevated D-dimer in a medium-risk patient requires confirmatory imaging", "Repeat the D-dimer in 48 hours — a single elevated value is insufficient to proceed to imaging", "Perform lower extremity Doppler ultrasound first to confirm DVT before ordering chest imaging" : 3 : "The Wells criteria-based PE workup is stepwise. Medium-risk patients get D-dimer testing first. If D-dimer is low, PE is ruled out. If D-dimer is HIGH — as in this case — the algorithm directs you to order a CTA or V/Q scan of the chest. D-dimer is sensitive but not specific; an elevated result increases suspicion but is not diagnostic. You need imaging to confirm. High-risk patients skip straight to CTA or V/Q scan without D-dimer. A stable patient should still receive confirmatory imaging before anticoagulation is started based on the algorithm."
"A 68-year-old male with a long history of COPD and recurrent pulmonary emboli is now found to have elevated pulmonary artery pressures on echocardiogram. Which of the following best explains the sequence of events leading to his elevated pulmonary pressures?" : "COPD caused left ventricular failure, increasing pulmonary venous backpressure and raising pulmonary artery pressures", "COPD-related chronic hypoxia and recurrent PE both contribute to increased pulmonary artery pressures through vasoconstriction and vascular obstruction, causing pulmonary hypertension", "Recurrent PEs caused cor pulmonale directly by right ventricular dilation without affecting pulmonary artery pressure", "COPD-related mucus hypersecretion physically obstructs the pulmonary arteries, raising luminal pressure", "Recurrent PEs caused pulmonary fibrosis, which reduced lung compliance and secondarily increased pulmonary pressures" : 2 : "Both COPD and recurrent PE are listed as etiologies of pulmonary hypertension on the slides. COPD causes chronic hypoxia — any condition that deoxygenates patients leads to hypertrophy of pulmonary arteries and increased pulmonary pressures. Recurrent PE physically obstructs pulmonary arteries, reducing blood flow and causing vascular remodeling with narrowed vessel openings over time (chronic PE → chronic pulmonary hypertension). Both mechanisms together compound the elevation in pulmonary artery pressures. Left-sided heart failure is the most common cause of pulmonary HTN, but that is not this patient's primary driver."
"A 50-year-old obese male snores loudly and his wife reports witnessed apneic episodes during sleep. He wakes unrefreshed and falls asleep at work. During normal sleep, which physiologic changes increase his vulnerability to complete airway obstruction?" : "Increased thoracic cage dynamics and increased pharyngeal caliber during sleep allow excess airway collapse in obese patients", "During sleep, upper airway muscle activity decreases, pharyngeal caliber decreases, ventilation decreases, and pCO2 increases — creating conditions where complete airway collapse can occur without compensation", "Sleep increases sympathetic tone, causing bronchospasm and airway narrowing in predisposed individuals", "Supine positioning causes the tongue to block the oropharynx only in patients with retrognathia, not obesity", "Sleep reduces respiratory rate while maintaining tidal volume, increasing the risk of CO2 accumulation and central apnea" : 2 : "The slides describe the physiologic changes during normal sleep that predispose to apnea: decreased upper airway muscle activity, decreased pharyngeal caliber, decreased ventilation, decreased thoracic cage dynamics, and increased pCO2. In normal people, snoring compensates for intermediate airway collapse and maintains stable sleep. In obstructive sleep apnea, these normal changes — compounded by obesity narrowing the airway further — lead to complete airway collapse that cannot be compensated, resulting in apnea. Sleep apnea is most common in older, obese males, with risk factors of smoking, family history, and chronic congestion."
"A 14-year-old with cystic fibrosis presents with a severe pulmonary exacerbation. Sputum cultures repeatedly grow the same organism. The care team notes that his thickened airway secretions have created a chronically obstructed environment. Which organism is CF patients specifically and particularly prone to colonization with, and why?" : "Streptococcus pneumoniae, because it thrives in the lower pH environment caused by disrupted chloride transport in CF airways", "Haemophilus influenzae type B, because CF patients were historically unvaccinated due to immune deficiency", "Pseudomonas aeruginosa, which particularly colonizes CF airways because the thick viscous secretions from abnormal chloride/sodium transport create an ideal chronic obstructive environment for its growth", "Mycobacterium tuberculosis, because CF causes granulomatous inflammation that mimics TB granulomas and harbors the organism", "Bordetella pertussis, which is reactivated in CF patients due to progressive T-cell exhaustion from chronic inflammation" : 3 : "Cystic fibrosis causes abnormal transport of chloride and sodium across secretory epithelia, resulting in thickened, viscous secretions that chronically obstruct the bronchi. This environment prevents normal mucociliary clearance and creates ideal conditions for bacterial colonization. The slides specifically state that CF patients are particularly prone to Pseudomonas aeruginosa. Neutrophils respond to the recurring infections by inducing further inflammation, accelerating lung destruction and respiratory insufficiency — the major cause of morbidity and mortality in CF."
"A 49-year-old male with a long history of daily productive cough and recurrent lung infections undergoes bronchoscopy. The scope reveals abnormally dilated bronchial segments with retained mucus. Which pathologic process explains these findings, and what is the expected clinical presentation?" : "Chronic bronchitis from COPD with mucus gland hypertrophy causing increased secretion volume in normal-caliber bronchi", "Bronchiectasis — recurrent infection and inflammation destroyed the bronchial wall, resulting in dilated bronchial segments that retain mucus and cause repeated infections with daily purulent cough lasting months to years", "Pulmonary fibrosis caused contraction atelectasis, distorting the bronchi and creating apparent dilation on bronchoscopy", "Cystic fibrosis-related abnormal chloride transport thickened secretions but did not dilate the bronchial walls", "Bronchiolitis caused dilation of terminal bronchioles in this adult patient from years of viral infections in childhood" : 2 : "Bronchiectasis is a distinct pathologic process from COPD or cystic fibrosis. Recurrent infection and inflammation destroy the bronchial wall itself, resulting in permanently dilated bronchial segments. These dilated segments retain mucus because normal clearance mechanisms are disrupted, and repeated lung infections occur within them. The defining clinical feature is a daily purulent cough with mucus production lasting months to years. Chronic bronchitis involves mucus hypersecretion but does not cause structural dilation of the bronchial walls. Cystic fibrosis can lead to bronchiectasis as a complication but bronchiectasis itself is the structural endpoint of wall destruction."
"A patient's ABG shows pH 7.38, pCO2 42, pO2 58, HCO3 24. A VBG was attempted first but was considered inadequate for a specific parameter. Which specific value from the VBG would be unreliable and why?" : "The pCO2 from a VBG is unreliable because veins carry higher CO2 than arteries due to tissue gas exchange", "The pH from the VBG is unreliable because venous blood is more alkalotic than arterial blood", "The oxygenation status (pO2) from a VBG is inaccurate because the VBG measures deoxygenated venous blood, not oxygenated arterial blood", "The HCO3 from the VBG is unreliable because bicarbonate is consumed during tissue CO2 buffering", "The VBG cannot assess ventilation status at all, making both pCO2 and pO2 completely unreliable" : 3 : "Per the slides, the specific drawback of a VBG is that the oxygenation status is inaccurate because it measures deoxygenated blood returning from the tissues — not arterial blood heading to the tissues. A VBG can still provide useful information on acid-base status (pH, HCO3) and ventilation status (pCO2), making it an acceptable alternative when arterial access is difficult. For oxygenation, pulse oximetry can supplement the VBG since it non-invasively measures peripheral oxygen saturation. An ABG remains the gold standard when accurate pO2 is clinically critical, particularly when SpO2 is below 90%."
"A 66-year-old male with a history of rheumatoid arthritis on methotrexate presents with a PPD induration of 4 mm. He has no known TB contacts and is not HIV-positive. Is this test positive or negative, and what threshold applies to him?" : "Negative — 4 mm falls below the 5 mm threshold, which applies only to immunocompromised patients or those on immunosuppressive drugs like methotrexate", "Positive — any induration greater than 0 mm is considered positive in patients on methotrexate", "Negative — he does not meet any risk category and requires 15 mm for a positive result", "Positive — 4 mm meets the 5 mm threshold because rheumatoid arthritis is an autoimmune disease equivalent to HIV-level immunosuppression", "Indeterminate — methotrexate invalidates PPD testing and an IGRA should be ordered instead" : 1 : "PPD interpretation is risk-stratified into three thresholds. The 5 mm threshold applies to HIV-positive patients, immunocompromised individuals, recent TB contacts, and patients on immunosuppressive drugs. Methotrexate is an immunosuppressive drug — it suppresses cellular immunity in the same category that lowers the PPD threshold to 5 mm. At 4 mm induration, this patient does NOT meet the 5 mm threshold even with his immunosuppressive therapy. The test is therefore negative. If his induration were 5 mm or more, it would be positive given his immunosuppressive drug use. The 10 mm threshold applies to high-risk occupations, IVDA, and high-risk diseases. The 15 mm threshold applies to everyone regardless of risk."
"A 30-year-old female presents with dry cough, mild chest pain, and shortness of breath. CXR shows bilateral hilar adenopathy. She has no occupational exposures and is immunocompetent. Bronchoscopy shows non-caseating granulomas. First-line treatment is initiated. What disease does she have and what is the first-line treatment?" : "Tuberculosis with bilateral hilar lymph node involvement; first-line treatment is sputum culture followed by anti-TB antibiotics", "Silicosis from environmental silica exposure; first-line treatment is removal from exposure and supportive care", "Sarcoidosis — a multisystem granulomatous disorder of unknown etiology affecting the lungs; first-line management is glucocorticoids", "Idiopathic pulmonary fibrosis causing granulomatous infiltration of the lung parenchyma; first-line treatment is lung biopsy followed by antifibrotics", "Pneumoconiosis from unrecognized organic dust exposure; first-line treatment is corticosteroids and bronchodilators" : 3 : "Sarcoidosis is a multisystem granulomatous disorder of unknown etiology. In the lungs — the most commonly affected organ — it causes bilateral hilar adenopathy, the hallmark chest X-ray finding. Symptoms include dry cough, chest pain, and shortness of breath. Non-caseating granulomas on biopsy confirm sarcoidosis over TB (which produces caseating granulomas). First-line management is glucocorticoids. For refractory cases, methotrexate is used. TB would show caseating granulomas, apical cavitation, and risk factors like immunocompromise. IPF does not cause granulomas. Silicosis and pneumoconiosis require occupational exposures."
"A construction worker presents to the ED after being stabbed in the left chest. On exam he is tachycardic, hypotensive, tachypneic, and has absent breath sounds on the left. Neck veins are distended. Trachea is deviated to the right. CXR is ordered but the patient's BP drops further. What is the correct management sequence?" : "Obtain CXR first to confirm the type and location of injury before any intervention", "Intubate the patient immediately with RSI and place on mechanical ventilation", "Clinically diagnose tension pneumothorax and immediately perform needle aspiration followed by chest tube — do not wait for imaging in a crashing patient", "Administer 2L IV fluid bolus first to address hypotension, then reassess the need for chest intervention", "Perform bilateral thoracotomy in the ED given the likelihood of bilateral injury from a penetrating chest wound" : 3 : "Traumatic pneumothorax — here from a penetrating stab wound — can progress to tension pneumothorax. The classic presentation is present: tachycardia, hypotension, absent breath sounds on the affected side, JVD, and tracheal deviation away from the affected side. For unstable patients, the slides specify resuscitation first — and in tension pneumothorax, the resuscitation IS needle aspiration and chest tube to relieve the pressure. Waiting for CXR in a hemodynamically crashing patient with a clear clinical picture is dangerous. Large (>3 cm) pneumothorax and tension pneumothorax require needle aspiration and chest tube or catheter thoracostomy."

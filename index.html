<!DOCTYPE html>
<script type="text/plain" data-lecture="Pulmonology" data-set="Pulmonology_set_1">
!Pulmonology
"A 28-year-old tall, thin male smoker presents to the ED with sudden left-sided chest pain and absent breath sounds on the left. Imaging reveals air in the pleural space. How should this pneumothorax be classified?" : "Primary pneumothorax", "Secondary pneumothorax", "Traumatic pneumothorax", "Tension pneumothorax" : 1 : "This is a primary pneumothorax because the patient has no preexisting lung disease. Primary pneumothorax typically occurs in young, tall, thin, smoking males and is most commonly caused by rupture of subpleural blebs. Since there is no underlying lung disease like COPD or asthma, and no trauma, secondary and traumatic classifications do not apply. Tension pneumothorax would present with hypotension and tracheal deviation."
"A patient with COPD develops worsening shortness of breath. On exam you note tachycardia, hypotension, absent breath sounds on the right, and tracheal deviation to the left. What is the most likely diagnosis?" : "Simple pneumothorax", "Pleural effusion", "Tension pneumothorax", "Atelectasis" : 3 : "The combination of tracheal deviation AWAY from the affected side, hypotension, tachycardia, and absent breath sounds points to tension pneumothorax. A pleural tear acts as a one-way valve trapping air and building pressure, which compresses the heart and great vessels, impairing venous return and causing cardiovascular compromise. Simple pneumothorax would not cause hypotension or tracheal deviation."
"A 67-year-old woman recovering from open heart surgery develops difficulty taking a deep breath and shows an elevated left hemidiaphragm on chest x-ray. What is the most likely diagnosis?" : "Pulmonary embolism", "Atelectasis", "Pneumothorax", "Pleural effusion" : 2 : "Post-surgical patients are at high risk for atelectasis from hypoventilation — they splint due to pain and have reduced respiratory effort from anesthesia. Atelectasis is loss of lung volume from alveolar collapse, and the classic chest x-ray finding is an elevated diaphragm on the affected side. A pulmonary embolism would not elevate the diaphragm, and pneumothorax would show a white visceral pleural line."
"A 72-year-old male with lung cancer presents with pleuritic chest pain and shortness of breath. Thoracentesis reveals fluid that is inflammatory and high in protein. Which type of pleural effusion is this?" : "Transudate", "Exudate", "Hemothorax", "Chylothorax" : 2 : "Exudates are caused by local factors — such as malignancy — and are characterized by proteinaceous, inflammatory fluid. Transudates are caused by systemic factors like congestive heart failure or cirrhosis and have minimal protein. The key distinction between the two is made using Light's criteria, analyzing protein and LDH levels from the thoracentesis fluid. Malignancy is a classic cause of an exudative effusion."
"A patient has a large pleural effusion causing significant dyspnea and orthopnea. What is the most appropriate intervention after identifying and beginning treatment of the underlying cause?" : "Supplemental oxygen only", "Needle thoracentesis under ultrasound guidance", "Immediate surgical resection", "Oral corticosteroids" : 2 : "Treatment of pleural effusion involves addressing the underlying disorder first, then draining the fluid. Needle thoracentesis under ultrasound guidance is the standard method for draining the pleural fluid causing the patient's dyspnea. If the effusion recurs or is large, a chest tube or indwelling pleural catheter may be needed. Oxygen alone does not remove the mechanical restriction on lung expansion."
"A 3-year-old child is brought in with sudden onset barking cough and inspiratory stridor that began 36 hours after nasal congestion. His symptoms are worse at night. What is the most likely diagnosis?" : "Epiglottitis", "Croup", "Foreign body aspiration", "Pertussis" : 2 : "Croup is a viral respiratory illness causing inflammation of the larynx and subglottic airway, most commonly caused by parainfluenza virus type 1. It begins with congestion and nasal discharge, then progresses to fever, hoarseness, barking cough, and inspiratory stridor over 12 to 48 hours. Epiglottitis would present with the three Ds — distress, drooling, and dysphagia — without the classic barking cough."
"A 5-year-old child presents to the ED in the 'sniffing position' with fever, severe sore throat, drooling, and muffled voice. He looks anxious. What is the priority in management?" : "Obtain lateral neck x-ray immediately", "Start IV antibiotics before securing airway", "Secure the airway first, then gather diagnostics", "Perform laryngoscopy at bedside" : 3 : "Acute epiglottitis is a medical emergency. The priority is always airway, airway, airway. If untreated, the edema of the epiglottis and surrounding structures can cause acute airway obstruction. The patient should be approached calmly to avoid worsening anxiety and edema. A thumb sign on lateral neck x-ray can confirm epiglottitis, but diagnostics are secondary to securing the airway. Antibiotics against the bacterial organism come after the airway is managed."
"A patient with chronic obstructive pulmonary disease is described as a 'blue bloater.' Which of the following best describes the underlying pathophysiology of this subtype?" : "Destruction of alveolar walls with loss of elastic recoil and minimal hypoxia", "Inflamed bronchi with large mucus production causing significant hypoxia and right heart failure", "Reversible bronchospasm with mast cell mediator release", "Fibrosis of lung parenchyma reducing lung compliance" : 2 : "Blue bloaters have chronic bronchitis, which involves inflamed bronchi producing large volumes of mucus. This causes V/Q mismatch, significant hypoxia, retained CO2, and peripheral edema from right heart failure (cor pulmonale). The right heart overworks trying to pump against the hypoxic pulmonary vasculature. In contrast, pink puffers (emphysema) have destruction of alveolar walls with minimal hypoxia but significant CO2 retention."
"A 55-year-old smoker with emphysema uses accessory muscles to breathe and has lost significant weight. Which mechanism best explains the weight loss?" : "Malabsorption from cor pulmonale", "Increased caloric demand from the work of breathing", "Anorexia secondary to hypoxia", "Decreased appetite from chronic steroid use" : 2 : "In emphysema (pink puffer subtype of COPD), destruction and dilatation of alveolar walls with coalescence of terminal bronchioles leads to air trapping and loss of elastic recoil. The work of breathing dramatically increases as the patient uses accessory muscles to compensate. This increased work of breathing raises metabolic demand, causing patients to burn more calories than they consume, leading to weight loss."
"A patient with acute asthma exacerbation uses their rescue inhaler but gets no relief. You escalate to a nebulized anticholinergic. What is the mechanism of action of ipratropium (Atrovent) in this setting?" : "Activates beta-2 receptors to directly relax bronchial smooth muscle", "Blocks acetylcholine at parasympathetic sites in bronchial smooth muscle causing bronchodilation", "Suppresses eosinophilic inflammation in the bronchioles", "Reduces IgE-mediated mast cell degranulation" : 2 : "Ipratropium is an anticholinergic that blocks the action of acetylcholine at parasympathetic sites in bronchial smooth muscle. This blockade removes the parasympathetic bronchoconstrictor tone, allowing bronchodilation. It is used as a rescue inhaler/nebulizer for acute bronchospasm in both asthma and COPD. Albuterol works through the other mechanism (beta-2 activation), so ipratropium complements it via a completely different pathway when the beta-2 approach alone is insufficient."
"A patient with moderate persistent asthma is prescribed salmeterol (Serevent) as a solo therapy without any other inhaled medications. Why is this a concern?" : "Salmeterol causes oral candidiasis", "Salmeterol is contraindicated as monotherapy in asthma without an inhaled corticosteroid", "Salmeterol cannot be used with asthma at all", "Salmeterol is only approved for COPD maintenance" : 2 : "Salmeterol (Serevent) is a long-acting beta agonist (LABA) that is contraindicated as monotherapy in asthma — it must always be used as adjunctive therapy alongside an inhaled corticosteroid (ICS). Using it alone in asthma increases the risk of severe asthma exacerbations. In COPD, it is appropriate as standalone maintenance therapy. The bronchial smooth muscle relaxation it provides does not address the underlying inflammation that drives asthma."
"A patient with asthma is switched from albuterol alone to the addition of fluticasone (Flovent) for maintenance. Why is the inhaled corticosteroid appropriate for this patient's long-term management?" : "It activates beta-2 receptors to prevent bronchospasm", "It directly blocks acetylcholine-mediated bronchoconstriction", "It has potent local anti-inflammatory and vasoconstrictive effects that reduce bronchial and bronchiolar edema", "It increases surfactant production in the alveoli" : 3 : "Asthma involves reversible bronchospasm, mucus plugging, and bronchial/bronchiolar edema. Fluticasone (Flovent) is an inhaled corticosteroid (ICS) indicated for asthma maintenance therapy — its effectiveness comes from direct local anti-inflammatory and vasoconstrictive effects, reducing the edema component of asthma. Beta-2 agonists handle the bronchospasm. ICS is the correct step-up for control, while albuterol remains the rescue agent."
"A 22-year-old with a history of asthma is brought to the ED with severe bronchospasm. IV access is established. Which agent would be most appropriate for a moderate-to-severe asthma exacerbation via IV?" : "Salmeterol", "Fluticasone", "Ipratropium", "Methylprednisolone (Solumedrol)" : 4 : "Methylprednisolone (Solumedrol) is a systemic corticosteroid given IM or IV that is indicated for moderate to severe exacerbations of asthma. Its mechanism is decreasing inflammation by suppressing migration of polymorphonuclear leukocytes and reversing increased capillary permeability. Salmeterol is contraindicated in status asthmaticus. Fluticasone is inhaled and not appropriate for acute severe exacerbation. Ipratropium is inhaled and is used for rescue, not systemic treatment."
"A patient with a known history of HIV presents with shortness of breath, hypoxia, and a subtle initial chest x-ray. His CD4 count has been trending down. What pneumonia organism should be at the top of your differential?" : "Streptococcus pneumoniae", "Legionella pneumophila", "Pneumocystis jirovecii", "Mycobacterium tuberculosis" : 3 : "Pneumocystis jirovecii pneumonia (PCP) is one of the AIDS-defining illnesses. In patients with HIV whose CD4 counts are low, PCP should be strongly considered when they present with shortness of breath and hypoxia, even if the initial chest x-ray appears subtle. Diagnosis is confirmed by bronchoscopy with sputum and tissue collection. Strep pneumoniae causes community-acquired pneumonia in otherwise healthy patients."
"An air conditioner technician presents with fever, productive cough, shortness of breath, and confusion. Labs show low sodium. What pathogen is most likely responsible?" : "Streptococcus pneumoniae", "Legionella pneumophila", "Bordetella pertussis", "Pseudomonas aeruginosa" : 2 : "Legionnaires' disease is caused by Legionella pneumophila, a gram-negative rod that contaminates water systems including air conditioners, swamp coolers, and humidifiers. People inhale aerosolized water droplets containing the bacteria. A key distinguishing feature of Legionella pneumonia is the associated triad of diarrhea, hyponatremia (low sodium), and altered mental status alongside the respiratory symptoms. This constellation of findings — plus the occupational exposure — points directly to Legionella."
"A patient with a 2-week history of nasal congestion and mild cough now develops severe paroxysms of coughing with an inspiratory 'whoop' followed by vomiting. Which phase of pertussis is this patient now in?" : "Catarrhal phase", "Paroxysmal phase", "Convalescent phase", "Prodromal phase" : 2 : "Pertussis (whooping cough) caused by Bordetella pertussis has three phases. The catarrhal phase (1-2 weeks) mimics a URI with malaise, rhinorrhea, and mild cough. The paroxysmal phase (2-3 months) is marked by the classic severe, vigorous cough with inspiratory 'whoop' and post-tussive vomiting or syncope. The convalescent phase features a gradual reduction in symptoms. This patient's timeline — starting with nasal symptoms and progressing to paroxysmal coughing — fits the paroxysmal phase."
"A 6-month-old infant presents with fever, cough, and respiratory distress in the winter. The pediatrician notes wheezing and signs of lower respiratory tract involvement. The most likely causative organism is:" : "Haemophilus influenzae type B", "Parainfluenza virus type 1", "Respiratory syncytial virus (RSV)", "Mycoplasma pneumoniae" : 3 : "Bronchiolitis in infants under 2 years of age is most commonly caused by RSV (Respiratory Syncytial Virus). RSV infects terminal bronchiolar epithelial cells, causing inflammation in the small bronchi and bronchioles, and can lead to severe lower respiratory tract disease including bronchiolitis and bronchospasm in children. It leads to fever, cough, and respiratory distress. Most recover with symptomatic care, but clinicians must monitor for apnea and respiratory failure."
"A 45-year-old with cystic fibrosis is admitted for a pulmonary exacerbation. Sputum cultures repeatedly grow the same organism. Which pathogen is cystic fibrosis patients most prone to colonization with?" : "Streptococcus pneumoniae", "Mycobacterium tuberculosis", "Haemophilus influenzae", "Pseudomonas aeruginosa" : 4 : "Cystic fibrosis causes abnormal transport of chloride and sodium, resulting in thickened, viscous secretions in the bronchi. Chronic airway obstruction from these secretions leads to recurrent infections. Cystic fibrosis patients are particularly prone to colonization and infection with Pseudomonas aeruginosa. Neutrophils respond to these chronic infections by inducing further inflammation, which accelerates lung destruction and respiratory insufficiency."
"A patient with IPF has worsening dyspnea on exertion and a dry nonproductive cough. Which finding on physical exam is most associated with advanced idiopathic pulmonary fibrosis?" : "Barrel chest and prolonged expiration", "Bibasilar crackles and clubbing", "Tripod positioning and stridor", "Hyperresonance and decreased breath sounds" : 2 : "Idiopathic pulmonary fibrosis (IPF) is a chronic, progressive fibrotic disorder causing abnormal proliferation of mesenchymal cells and irreversible fibrosis. Because gas exchange is progressively impaired and the lungs become stiffer, patients develop bibasilar crackles on auscultation from the fibrotic lung tissue. Clubbing appears with advanced disease. Barrel chest and prolonged expiration are obstructive findings seen in COPD, not IPF."
"A patient with IPF requires imaging confirmation. Which of the following best describes the expected findings on high-resolution CT (HRCT) of the chest?" : "Bilateral hilar adenopathy", "Apical cavitation with regional lymph node inflammation", "Peripheral, basilar predominant opacities with honeycombing", "Miliary nodules throughout both lungs" : 3 : "IPF is diagnosed with HRCT of the chest showing peripheral and basilar predominant opacities with honeycombing — a classic pattern representing the fibrotic, scarred lung tissue predominantly at the lung bases. Bilateral hilar adenopathy is the chest finding in sarcoidosis. Apical cavitation suggests active TB reactivation. Miliary nodules throughout both lungs represent disseminated TB. Lung biopsy can confirm the diagnosis when HRCT findings are insufficient."
"A coal miner presents with progressive dyspnea and impaired gas exchange. He has no history of smoking. What is the most likely cause of his restrictive lung disease?" : "Idiopathic pulmonary fibrosis", "Silicosis — a form of pneumoconiosis from crystalline silica exposure", "Sarcoidosis from immune dysregulation", "Asbestosis from prior construction work" : 2 : "Pneumoconiosis is a type of pulmonary fibrosis caused by breathing in environmental organic and inorganic toxins and dust. Silicosis specifically results from exposure to crystalline silica, most commonly in mining and coal workers. The inhaled particles damage lung connective tissues, causing progressive impairment of gas diffusion and exchange. Asbestosis is specifically from asbestos exposure, and IPF has no identified occupational cause."
"A patient with sarcoidosis has a dry cough, chest pain, and shortness of breath. The chest x-ray shows a classic finding. What radiographic finding is most characteristic of pulmonary sarcoidosis?" : "Peripheral honeycombing at the bases", "Bilateral hilar adenopathy", "Unilateral pleural effusion", "Apical cavitation" : 2 : "Sarcoidosis is a multisystem granulomatous disorder of unknown etiology. When it involves the lungs — the most commonly affected organ — it causes bilateral hilar adenopathy on chest imaging. Symptoms include dry cough, chest pain, and shortness of breath. Management involves glucocorticoids, or methotrexate for refractory cases. Peripheral honeycombing is IPF; apical cavitation suggests active tuberculosis."
"A 60-year-old female with a long history of COPD is found to have elevated pulmonary artery pressures. She now has JVD, peripheral edema, and ascites. What complication has she developed?" : "Left heart failure", "Pulmonary embolism", "Cor pulmonale", "Pleuritis" : 3 : "Cor pulmonale is right ventricular hypertrophy and/or impaired function caused by pulmonary hypertension. COPD is one of the leading causes of pulmonary hypertension. When the pulmonary circulation pressure increases, the right ventricle must work harder to force blood through, eventually failing. Signs of right heart failure — JVD, peripheral edema, and ascites — develop as the right ventricle decompensates. This is the classic progression from COPD → pulmonary hypertension → cor pulmonale."
"A 52-year-old man on a long flight develops right calf pain and swelling, then acutely becomes tachycardic and short of breath with pleuritic chest pain. You suspect a pulmonary embolism. Based on Wells criteria, this patient has multiple PE risk factors. What is the next appropriate step?" : "D-dimer only, hold imaging", "Discharge with anticoagulation and outpatient follow-up", "Order CTA or V/Q scan of the chest directly", "Repeat ECG and troponin before imaging" : 3 : "Wells criteria stratifies patients into low, medium, or high-risk for PE. High-risk patients — those with clinical signs of DVT, no alternative diagnosis, and tachycardia — should go directly to CTA or V/Q scan without waiting for D-dimer. D-dimer is useful in medium-risk patients; if D-dimer is low, PE is ruled out, but if high, CTA or V/Q is ordered. For high-risk, imaging should not be delayed by D-dimer testing."
"A patient with a PE is hemodynamically stable with no contraindications to anticoagulation. What is the appropriate treatment?" : "Immediate IVC filter placement", "Thrombolysis and/or anticoagulation therapy", "Emergent surgical embolectomy", "Broad-spectrum antibiotics" : 2 : "For a hemodynamically stable PE patient without contraindications to anticoagulation, the treatment is initiation of thrombolysis and/or anticoagulation therapy. If the patient is unstable, resuscitation comes first. An IVC filter is only placed when there are contraindications to anticoagulation — not as a first-line option in an otherwise eligible patient. Antibiotics are not indicated as PE is a thrombotic, not infectious, process."
"A 40-year-old obese male smoker presents complaining of daytime sleepiness, morning headaches, and his wife reports loud snoring at night. What is the most likely diagnosis?" : "COPD", "Obstructive sleep apnea", "Pulmonary hypertension", "Idiopathic pulmonary fibrosis" : 2 : "Obstructive sleep apnea involves recurrent obstruction of the pharyngeal airway during sleep, associated with hypoxia and sleep fragmentation. It is most common in older, obese males, with risk factors including smoking, family history, and chronic congestion. Patients typically complain of daytime sleepiness and headaches, while spouses report snoring and occasional gasping. During complete obstruction, the airway collapses without compensation, causing apneic episodes."
"A 2-year-old is brought to the ED after suddenly choking while eating peanuts. Now he has a persistent cough and decreased breath sounds on the right. What is the first priority in management?" : "Chest x-ray to confirm location of foreign body", "Bronchoscopy for diagnosis and removal", "Administer nebulized albuterol", "Secure and maintain the airway first" : 4 : "Foreign body aspiration is more common in children and is mostly caused by nuts, seeds, and other organic material. The priority is always the airway. Once the patient is stabilized, both diagnosis and treatment are accomplished with laryngoscopy and/or bronchoscopy. Thirty percent of foreign bodies can be missed on imaging alone, making bronchoscopy essential. Organic material tends to cause worse inflammation than inorganic material, making prompt removal important."
"A 35-year-old patient is admitted to the ICU after septic shock. He develops worsening hypoxia, bilateral diffuse crackles, tachypnea, and cyanosis. Chest x-ray shows bilateral infiltrates. What is the diagnosis?" : "Pulmonary embolism", "Cardiogenic pulmonary edema", "ARDS", "Severe community-acquired pneumonia" : 3 : "Acute Respiratory Distress Syndrome (ARDS) can follow systemic shock or a direct pulmonary insult. In septic shock, reduced pulmonary blood flow and a cytokine storm cause massive endothelial leak — pulmonary capillaries become permeable, the alveoli become boggy, surfactant is washed away, and gas exchange is impaired. Clinically this results in diffuse crackles, tachypnea, hypoxia, cyanosis, and bilateral infiltrates on CXR. Treatment requires mechanical ventilation and hemodynamic monitoring."
"A 33-year-old male with a history of HIV and poor medication adherence presents with fever, productive cough, and hemoptysis. Chest x-ray shows apical cavitation. What is the most likely diagnosis and what does this chest x-ray pattern indicate?" : "Legionella pneumonia with consolidation", "Latent TB presenting for the first time", "Reactivation TB or primary TB in an immunocompromised patient", "Pulmonary carcinoid tumor" : 3 : "In immunocompromised patients — such as those with HIV — TB can escape from its granuloma and become active. Reactivation of TB or primary TB in an immunocompromised host causes apical cavitation and may progress to regional lymph node inflammation on chest x-ray. About 10% of latent TB reactivates per year, and the greater the immunocompromise, the higher the risk. Miliary TB (disseminated) would show small nodules throughout the lungs, not cavitation."
"A patient returns for a PPD skin test read. The induration measures 7 mm. He is a healthcare worker with no known TB exposure and is HIV-negative. Is this a positive or negative test?" : "Positive — any induration over 5 mm is always positive", "Negative — 7 mm is below the 10 mm threshold required for high-risk occupations", "Positive — 7 mm meets the 5 mm threshold for healthcare workers", "Negative — only 15 mm or more is considered positive" : 2 : "PPD interpretation depends on the patient's risk category. A reading of 10 mm is positive for those in high-risk occupations such as healthcare workers, IVDA, or those with high-risk diseases like DM or end-stage renal disease. A reading of 5 mm is positive only for HIV-positive patients, immunocompromised individuals, those on immunosuppressive drugs, or recent TB contacts. At 7 mm, this healthcare worker falls below the 10 mm threshold, making this a negative test in his risk category."
"A 70-year-old male with significant smoking history presents with hemoptysis, weight loss, and a central lung mass on CT arising from the right main bronchus. Which lung carcinoma subtype best fits this presentation?" : "Adenocarcinoma", "Squamous cell carcinoma", "Bronchiolitis obliterans", "Small cell carcinoma" : 2 : "Squamous cell carcinoma of the lung arises from squamous cells and originates in the central part of the lung or in the right/left main bronchi, making it the best fit here. Adenocarcinoma arises in smaller airways (alveoli) and affects glandular cells — it's more peripheral. Small cell carcinoma is very aggressive and strongly associated with smoking but is a different cell type. Large cell carcinoma is undifferentiated. The central bronchial location is the key feature pointing to squamous cell carcinoma."
</script>

<script type="text/plain" data-lecture="Cardiology" data-set="Set 1">
!Cardiology
"Which ion is primarily responsible for the rising phase of the cardiac action potential?" : "Potassium (K+)", "Sodium (Na+)", "Calcium (Ca2+)", "Chloride (Cl-)" : 2 : "The rapid depolarization (Phase 0) of the cardiac action potential is caused by a fast inward Na+ current through voltage-gated sodium channels."
"What does the PR interval on an ECG represent?" : "Ventricular depolarization", "Atrial repolarization", "AV node and His-Purkinje conduction time", "Time from ventricular depolarization to repolarization" : 3 : "The PR interval (0.12–0.20s) reflects the time from onset of atrial depolarization to the beginning of ventricular depolarization, including the delay at the AV node."
"A patient presents with crushing chest pain radiating to the left arm, diaphoresis, and ST elevation in leads II, III, and aVF. Which coronary artery is most likely occluded?" : "Left anterior descending (LAD)", "Left circumflex (LCx)", "Right coronary artery (RCA)", "Left main coronary artery" : 3 : "ST elevation in the inferior leads (II, III, aVF) indicates an inferior STEMI, most commonly caused by occlusion of the right coronary artery."
</script>
<script type="text/plain" data-lecture="Hematology" data-set="Hatology_set_1">
!Hematology
"A 68-year-old male with chronic kidney disease stage IV is found to have a normocytic anemia. Which of the following best explains the pathophysiology of this anemia?" : "Loss of intrinsic factor prevents absorption of vitamin B12", "The diseased kidney produces less erythropoietin to stimulate RBC production", "Iron cannot be absorbed from the terminal ileum", "Platelets are sequestered in the enlarged spleen" : 2 : "Advanced chronic kidney disease causes decreased erythropoietin production. Since erythropoietin normally stimulates the bone marrow to produce RBCs, less stimulation leads to a normocytic anemia."
"A 24-year-old woman has fatigue, pallor, and an MCV of 72. She reports craving and chewing ice throughout the day. Which diagnosis is most likely?" : "Folate deficiency anemia", "Iron deficiency anemia", "Anemia of chronic kidney disease", "Autoimmune hemolytic anemia" : 2 : "A low MCV means microcytic anemia. Iron deficiency is the most common microcytic anemia, and pica such as craving ice is a classic clue."
"A patient with anemia has an MCV of 108 and new numbness, paresthesias, and gait difficulty. Which deficiency best explains these findings?" : "Iron deficiency", "Vitamin B12 deficiency", "Thrombopoietin deficiency", "Factor VIII deficiency" : 2 : "Macrocytosis points toward B12 or folate problems, but neurologic symptoms like paresthesias, weakness, numbness, and gait ataxia specifically point to B12 deficiency."
"A 70-year-old woman develops macrocytic anemia due to atrophic gastritis. She has adequate dietary intake of animal protein but cannot absorb the needed nutrient. What is the appropriate treatment?" : "Oral folate daily", "Monthly intramuscular B12 injections", "Ferrous sulfate with vitamin C", "Low-dose aspirin therapy" : 2 : "Atrophic gastritis can cause loss of intrinsic factor, producing pernicious anemia. Because B12 cannot be absorbed normally, treatment must be parenteral B12 injections."
"A strict vegan develops macrocytic anemia from lack of animal protein intake. Which treatment route is most reasonable if absorption is intact?" : "Oral B12 supplementation", "Monthly intramuscular B12 only", "Platelet transfusion", "Warfarin therapy" : 1 : "B12 comes from animal protein. If the problem is poor intake but the terminal ileum and intrinsic factor pathway are intact, dietary B12 deficiency can respond to oral supplementation."
"A patient with Crohn's disease involving the terminal ileum develops macrocytic anemia. Why does this occur?" : "Iron is absorbed only in the terminal ileum", "B12 is absorbed in the terminal ileum when complexed with intrinsic factor", "Folate requires platelet factor 4 for absorption", "Albumin prevents B12 from leaving the blood vessel" : 2 : "B12 absorption occurs in the terminal ileum after it complexes with intrinsic factor. Terminal ileal inflammation or resection can impair absorption and cause B12 deficiency."
"A patient has an MCV of 76 and is found to have a genetic disorder causing decreased production of alpha or beta globin chains. Which disorder is most likely?" : "Thalassemia", "Pernicious anemia", "Myelodysplasia", "Hemophilia B" : 1 : "Microcytosis points to abnormal hemoglobin production. Thalassemia is caused by decreased production of alpha or beta globin chains."
"A child with severe thalassemia develops bossing of the skull, maxillary enlargement, hepatosplenomegaly, and short stature. What process explains these changes?" : "Autoimmune platelet destruction", "Extramedullary hematopoiesis", "Delayed fibrinolysis", "Vitamin K antagonist effect" : 2 : "In thalassemia major, the body tries to compensate for poor RBC production by forcing other areas of bone and organs to make blood cells. This extramedullary hematopoiesis causes skeletal and organ changes."
"A patient with thalassemia major receives frequent transfusions to reduce extramedullary hematopoiesis. What complication becomes a concern because of this treatment?" : "Iron overload", "Intrinsic factor deficiency", "ADAMTS13 deficiency", "Factor IX deficiency" : 1 : "Frequent transfusions provide needed RBCs, but they also add iron repeatedly. Over time, this can cause iron overload."
"A 31-year-old male of Mediterranean descent develops sudden hemolysis after exposure to an oxidative medication. Which RBC problem is most likely?" : "G6PD deficiency", "Pernicious anemia", "Factor V Leiden", "Hodgkin lymphoma" : 1 : "G6PD protects hemoglobin from oxidative stress. In deficiency, oxidative triggers such as medications, infections, or foods can cause brisk episodic hemolysis."
"A patient has sudden severe anemia with elevated LDH, elevated unconjugated bilirubin, and low haptoglobin. Which process is occurring?" : "Macrocytic anemia from slowed DNA synthesis", "Hemolysis from rapid RBC destruction", "Platelet sequestration from splenomegaly", "Decreased albumin production by the liver" : 2 : "Hemolysis releases RBC contents. LDH and unconjugated bilirubin rise, while haptoglobin falls because it binds and clears free hemoglobin."
"A patient develops antibodies against proteins on their own RBCs and rapidly develops severe anemia. Which condition is most likely?" : "Autoimmune hemolytic anemia", "Iron deficiency anemia", "Thalassemia minor", "Anemia of chronic disease" : 1 : "Autoimmune hemolytic anemia occurs when antibodies attach to the patient's own erythrocytes. That antibody attachment causes RBC lysis and sudden severe hemolytic anemia."
"A patient with sickle cell disease develops severe pain after low oxygen tension causes RBCs to deform and block capillaries. What directly causes the tissue injury?" : "Decreased albumin oncotic pressure", "Ischemia from blocked blood flow", "Loss of intrinsic factor", "Failure of platelet degranulation" : 2 : "Hemoglobin S can deform RBCs into sickled cells when oxygen tension is low. These cells plug capillaries, reduce blood flow, and cause ischemic tissue injury and severe pain."
"Which WBC type is most likely to predominate during acute inflammation and bacterial infection?" : "Lymphocytes", "Neutrophils", "Eosinophils", "Basophils" : 2 : "Neutrophils are actively phagocytic, respond first, and dominate in acute inflammation and bacterial infections."
"A patient has asthma and a parasitic infection. Which WBC is most likely to be elevated?" : "Eosinophils", "Neutrophils", "Monocytes", "T lymphocytes" : 1 : "Eosinophils are associated with NAACP: neoplasm, allergy, airway disease, connective tissue disease, and parasitic disorders."
"A CBC with differential shows a predominance of neutrophils during infection. What is this finding called?" : "Right shift", "Left shift", "Pancytopenia", "Reticulocytosis" : 2 : "A predominance of neutrophils on the differential is termed a left shift, and it is often seen with infection."
"A patient has blasts found in the peripheral blood. Why is this concerning?" : "Blasts are mature lymphocytes that should only be in lymph nodes", "Immature cells should remain in the bone marrow and may indicate leukemia", "Blasts are old RBCs that should be removed by the spleen", "Blasts mean the patient is dehydrated" : 2 : "Immature cells like blasts normally stay in the bone marrow. If they spill into peripheral blood, it suggests a blood disorder, often leukemia."
"Which statement best describes the basic pathophysiology of leukemia?" : "Mature lymphocytes in lymph nodes overproduce antibodies", "A progenitor cell arrests maturation, divides uncontrollably, and does not undergo normal apoptosis", "Platelets bind too strongly to von Willebrand factor", "The kidney stops producing thrombopoietin" : 2 : "In leukemia, a progenitor cell becomes abnormal. Maturation is arrested, cellular division accelerates, and apoptosis is limited, causing immature cells to build up."
"A 4-year-old child is diagnosed with acute lymphoblastic leukemia. Why does this age fit the diagnosis?" : "ALL is most common in children ages 2 to 5 years", "ALL occurs almost exclusively in older adult males", "ALL is caused by the Philadelphia chromosome in older adults", "ALL is a cancer of mature plasma cells" : 1 : "Acute lymphocytic leukemia is most common in children ages 2 to 5 years, with a smaller peak in the elderly."
"An older adult has an incidental CBC finding of chronic lymphocytic leukemia but no symptoms. What is a common initial approach?" : "Immediate radiation for all patients", "Monitor without specific treatment unless rapid progression develops", "Monthly intramuscular B12 injections", "Frequent transfusions to prevent extramedullary hematopoiesis" : 2 : "CLL is often indolent and may be found incidentally. Many patients are monitored without treatment unless signs of rapid progression develop."
"A 72-year-old male is diagnosed with the most common acute leukemia in adults. Which leukemia is this?" : "Acute myelogenous leukemia", "Acute lymphocytic leukemia", "Chronic lymphocytic leukemia", "Hodgkin lymphoma" : 1 : "AML is the most common acute leukemia in adults, has a median age around 70, and is more common in men."
"A patient has chronic myelogenous leukemia associated with a reciprocal translocation between chromosomes 22 and 9. What mutation is this?" : "Reed-Sternberg mutation", "Philadelphia chromosome", "ADAMTS13 mutation", "Intrinsic factor mutation" : 2 : "CML is associated with the Philadelphia chromosome, a reciprocal translocation between chromosomes 22 and 9."
"Which finding best supports Hodgkin lymphoma rather than non-Hodgkin lymphoma?" : "Reed-Sternberg cells on histology", "Punched-out lytic bone lesions", "Factor IX deficiency", "Low haptoglobin" : 1 : "Hodgkin lymphoma is characterized by Reed-Sternberg cells, which are binucleated B cells described as having an owl-eye appearance."
"Why does Hodgkin lymphoma often have a better prognosis than non-Hodgkin lymphoma?" : "It spreads contiguously from one lymph node to the next and usually remains in lymph nodes", "It never causes B symptoms", "It is caused by iron deficiency", "It is always asymptomatic and never requires treatment" : 1 : "Hodgkin lymphoma tends to spread in a contiguous pattern and usually does not involve sites outside the lymph nodes, making spread more predictable than NHL."
"A patient has malignancy of plasma cells in the bone marrow with anemia, renal disease, hypercalcemia, and punched-out lytic bone lesions. Which diagnosis is most likely?" : "Multiple myeloma", "Chronic lymphocytic leukemia", "Hemophilia A", "Immune thrombocytopenic purpura" : 1 : "Multiple myeloma is a plasma cell malignancy. It is characterized by CRAB findings: elevated calcium, renal disease, anemia, and bone lesions."
"A patient with chronic liver disease develops splenomegaly and a low platelet count. What is the most likely mechanism?" : "Increased splenic sequestration of platelets", "Increased erythropoietin production", "Increased production of factor VIII", "Failure of B12 absorption in the terminal ileum" : 1 : "About one-third of platelets can be sequestered in the spleen. Splenomegaly increases splenic trapping, which can lower circulating platelets."
"A patient has thrombocytopenia with pinpoint, non-blanchable red-blue spots on the feet and lower legs. What are these lesions?" : "Petechiae", "Hemarthroses", "Lytic lesions", "Reed-Sternberg cells" : 1 : "When platelet number or function is low, small capillary breaks do not seal normally. This produces petechiae, which are small non-blanchable hemorrhages often seen on the legs and feet."
"A hospitalized patient on heparin develops thrombocytopenia and a new DVT. Why can clotting occur even though the platelet count is low?" : "Heparin induced thrombocytopenia activates platelets while also marking them for destruction", "Heparin causes vitamin K deficiency", "Heparin causes intrinsic factor loss", "Heparin prevents ADAMTS13 from cutting albumin" : 1 : "In HIT, antibodies form against heparin-platelet factor 4 complexes. Platelets are destroyed, lowering the count, but antibody binding also activates platelets, causing paradoxical clotting."
"A 38-year-old woman has thrombocytopenia, stroke-like symptoms, acute kidney injury, and very low ADAMTS13 activity. Which disorder is most likely?" : "Immune thrombocytopenic purpura", "Thrombotic thrombocytopenic purpura", "Hemophilia B", "Factor V Leiden" : 2 : "TTP occurs when ADAMTS13 activity is very low, allowing ultralarge von Willebrand factor molecules to activate platelets. This causes platelet consumption and small-vessel clots leading to AKI and neurologic symptoms."
"A patient has delayed bleeding after surgery because the clot detaches from the damaged vessel wall. Which disorder best explains this?" : "von Willebrand disease", "Factor V Leiden", "Sickle cell anemia", "Multiple myeloma" : 1 : "von Willebrand factor helps attach platelets to the damaged vessel wall. Deficiency creates a clot that is tenuously fixed, so delayed bleeding after surgery can occur when the clot detaches."
"A male patient with Christmas disease develops bleeding into the knee after minor trauma. Which factor is deficient?" : "Factor VIII", "Factor IX", "Factor X", "Factor V" : 2 : "Christmas disease is hemophilia B, which is caused by factor IX deficiency. Hemophilia causes deep bleeding such as hemarthrosis after minor injury."
"A patient with multi-system trauma develops abnormal widespread clotting and bleeding because clotting factors, anticoagulants, and platelets are consumed faster than they can be replaced. Which condition is this?" : "Disseminated intravascular coagulation", "Pernicious anemia", "Chronic lymphocytic leukemia", "Iron deficiency anemia" : 1 : "DIC occurs in severe illness, trauma, shock, or overwhelming infection. The body forms and breaks down clots throughout the vessels, consuming platelets and factors and causing both clotting and bleeding."
"A patient is found to have Factor V Leiden. What is the pathophysiologic problem?" : "Factor V is resistant to inactivation", "Factor V is absent", "Factor V is destroyed by the spleen", "Factor V cannot bind intrinsic factor" : 1 : "Factor V Leiden creates an abnormal factor V that resists inactivation. Once activated, it propagates the clotting cascade longer than normal, increasing venous clot risk."
"A patient with protein C deficiency is most at risk for which complication?" : "Deep venous thrombosis or pulmonary embolism", "Pernicious anemia", "Painless lymphadenopathy from lymphoma", "Punched-out bone lesions" : 1 : "Protein C normally helps inactivate factors Va and VIIIa. Deficiency allows longer activation of clotting factors, causing a hypercoagulable state that tends to produce venous thrombi like DVT and PE."
"A patient is receiving an unfractionated heparin drip for therapeutic anticoagulation. Which lab is commonly used to titrate the dose?" : "PTT or anti-Xa level", "MCV", "RDW", "Reticulocyte count" : 1 : "Therapeutic unfractionated heparin must be monitored to ensure correct dosing. The slide notes PTT is used, though anti-Xa levels are more precise."

"Which medication directly inhibits thrombin and prevents conversion of fibrinogen to fibrin?" : "Dabigatran", "Apixaban", "Aspirin", "Clopidogrel" : 1 : "Dabigatran is a direct thrombin inhibitor. By inhibiting thrombin, it prevents fibrinogen from being converted into fibrin."

<script>
// ─── LOAD DATA FROM EMBEDDED SCRIPT TAGS ─────────────────────────────────────
// Reads all embedded set blocks (script[type="text/plain"][data-lecture]).
// No fetch, no server, no manifest needed.

function parseTxt(text) {
  var lines = text.split('\n').map(function(l) { return l.trim(); }).filter(Boolean);
  var questions = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.charAt(0) === '!') continue;

    // Extract all "quoted" tokens in order
    var tokens = [];
    var tokenRe = /"([^"]*)"/g, m;
    while ((m = tokenRe.exec(line)) !== null) tokens.push(m[1]);

    // Need question + at least 2 choices + explanation
    if (tokens.length < 4) continue;

    var question    = tokens[0];
    var explanation = tokens[tokens.length - 1];
    var choices     = tokens.slice(1, tokens.length - 1);

    // Find the answer integer: pattern is  " : N : "  in the raw line
    var intRe = /"\s*:\s*(\d+)\s*:\s*"/g, intMatch = null, tmp;
    while ((tmp = intRe.exec(line)) !== null) intMatch = tmp;
    if (!intMatch) continue;

    var correctIdx = parseInt(intMatch[1], 10);
    if (isNaN(correctIdx) || correctIdx < 1 || correctIdx > choices.length) continue;

    questions.push({ question: question, choices: choices, correct: correctIdx - 1, explanation: explanation });
  }
  return questions;
}

function loadEmbeddedSets() {
  var tags = document.querySelectorAll('script[type="text/plain"][data-lecture]');
  var lectureMap = {}; // lecture name -> [{name, questions}]
  var lectureOrder = [];

  tags.forEach(function(tag) {
    var lecture = (tag.getAttribute('data-lecture') || '').trim();
    var setName = (tag.getAttribute('data-set') || 'Set').trim();
    var content = tag.textContent;
    var questions = parseTxt(content);

    if (!lecture) return;
    if (!lectureMap[lecture]) {
      lectureMap[lecture] = [];
      lectureOrder.push(lecture);
    }
    lectureMap[lecture].push({ name: setName, questions: questions });
  });

  return lectureOrder.map(function(name) {
    return { lecture: name, sets: lectureMap[name] };
  });
}

// ─── STATE ───────────────────────────────────────────────────────────────────
var data = [];
var activeLecture = null;
var selectedSets = {};
var queue = [];
var queueIdx = 0;
var score = 0;
var answered = 0;
var sessionSetKeys = [];

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.getElementById('quiz-header').style.display = (id === 'quiz-screen') ? 'block' : 'none';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── LECTURE SCREEN ───────────────────────────────────────────────────────────
function buildLectureScreen() {
  var grid = document.getElementById('lecture-grid');
  grid.innerHTML = '';
  data.forEach(function(lec, i) {
    var total = lec.sets.reduce(function(a, s) { return a + s.questions.length; }, 0);
    var card = document.createElement('div');
    card.className = 'lecture-card';
    card.innerHTML =
      '<span class="lecture-num">' + String(i+1).padStart(2,'0') + '</span>' +
      '<div class="lecture-info">' +
        '<div class="lecture-name">' + esc(lec.lecture) + '</div>' +
        '<div class="lecture-sets">' + lec.sets.length + ' set' + (lec.sets.length !== 1 ? 's' : '') + ' · ' + total + ' questions</div>' +
      '</div>' +
      '<span class="lecture-arrow">›</span>';
    card.addEventListener('click', function() { selectLecture(i); });
    grid.appendChild(card);
  });
  showScreen('lecture-screen');
}

// ─── SET SCREEN ───────────────────────────────────────────────────────────────
function selectLecture(idx) {
  activeLecture = data[idx];
  selectedSets = {};
  document.getElementById('set-eyebrow').textContent = activeLecture.lecture;
  document.getElementById('set-title').textContent = 'Choose Sets';

  var grid = document.getElementById('set-grid');
  grid.innerHTML = '';
  activeLecture.sets.forEach(function(s, si) {
    var pill = document.createElement('div');
    pill.className = 'set-pill';
    pill.innerHTML =
      '<span class="set-pill-name">' + esc(s.name) + '</span>' +
      '<span class="set-pill-count">' + s.questions.length + ' questions</span>';
    pill.addEventListener('click', function() {
      var key = String(si);
      if (selectedSets[key]) { delete selectedSets[key]; pill.classList.remove('selected'); }
      else { selectedSets[key] = true; pill.classList.add('selected'); }
      updateStartNote();
    });
    grid.appendChild(pill);
  });
  updateStartNote();
  showScreen('set-screen');
}

function updateStartNote() {
  var n = Object.keys(selectedSets).length;
  document.getElementById('start-note').textContent = n > 0
    ? n + ' set' + (n !== 1 ? 's' : '') + ' selected'
    : 'Tap sets to filter, or start all';
}

document.getElementById('back-to-lectures').addEventListener('click', function() { buildLectureScreen(); });

document.getElementById('start-btn').addEventListener('click', function() {
  var keys = Object.keys(selectedSets).length
    ? Object.keys(selectedSets)
    : activeLecture.sets.map(function(_, i) { return String(i); });
  sessionSetKeys = keys;
  buildQueue(keys);
  if (queue.length === 0) { alert('No questions found in selected sets.'); return; }
  startQuiz();
});

// ─── QUEUE ────────────────────────────────────────────────────────────────────
function buildQueue(keys) {
  queue = [];
  keys.forEach(function(key) {
    var s = activeLecture.sets[parseInt(key)];
    if (s) s.questions.forEach(function(q) { queue.push(q); });
  });
  queueIdx = 0; score = 0; answered = 0;
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function startQuiz() {
  showScreen('quiz-screen');
  renderQuestion(0);
}

function renderQuestion(idx) {
  if (idx >= queue.length) { showComplete(); return; }
  var q = queue[idx];

  document.getElementById('header-topic').textContent = activeLecture.lecture;
  document.getElementById('header-count').textContent = (idx+1) + ' / ' + queue.length;
  document.getElementById('progress-fill').style.width = ((idx / queue.length) * 100) + '%';

  var wrap = document.getElementById('quiz-wrap');
  wrap.innerHTML = '';
  document.getElementById('quiz-scroll').scrollTop = 0;

  var meta = document.createElement('div');
  meta.className = 'q-meta';
  meta.textContent = 'Question ' + (idx+1);
  wrap.appendChild(meta);

  var card = document.createElement('div');
  card.className = 'q-card';
  var qText = document.createElement('div');
  qText.className = 'q-text';
  qText.textContent = q.question;
  card.appendChild(qText);
  wrap.appendChild(card);

  var letters = ['A','B','C','D','E','F'];
  var list = document.createElement('ul');
  list.className = 'choices-list';

  var btns = [];
  q.choices.forEach(function(choice, ci) {
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = '<span class="choice-letter">' + letters[ci] + '</span><span>' + esc(choice) + '</span>';
    btn.addEventListener('click', function() { onChoose(ci, q, btns, exBox, nextRow); });
    btns.push(btn);
    li.appendChild(btn);
    list.appendChild(li);
  });
  wrap.appendChild(list);

  var exBox = document.createElement('div');
  exBox.className = 'explanation-box';
  exBox.innerHTML = '<span class="explanation-label">Explanation</span>' + esc(q.explanation);
  wrap.appendChild(exBox);

  var nextRow = document.createElement('div');
  nextRow.className = 'next-row';
  var nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = (idx + 1 >= queue.length) ? 'See Results' : 'Next →';
  nextBtn.addEventListener('click', function() { queueIdx++; renderQuestion(queueIdx); });
  nextRow.appendChild(nextBtn);
  wrap.appendChild(nextRow);
}

function onChoose(chosenIdx, q, btns, exBox, nextRow) {
  btns.forEach(function(btn, bi) {
    btn.disabled = true;
    if (bi === q.correct) btn.classList.add('correct');
    else if (bi === chosenIdx) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  answered++;
  if (chosenIdx === q.correct) score++;
  if (q.explanation) exBox.classList.add('show');
  nextRow.classList.add('show');
  setTimeout(function() { exBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 80);
}

// ─── COMPLETE ─────────────────────────────────────────────────────────────────
function showComplete() {
  var pct = answered > 0 ? Math.round((score / answered) * 100) : 0;
  document.getElementById('complete-sub').textContent =
    'Finished ' + answered + ' question' + (answered !== 1 ? 's' : '') + ' from ' + activeLecture.lecture + '.';

  var circumference = 276.46;
  setTimeout(function() {
    document.getElementById('ring-fill').style.strokeDashoffset = circumference - (pct / 100) * circumference;
  }, 80);
  document.getElementById('score-pct').textContent = pct + '%';

  var statsRow = document.getElementById('stats-row');
  statsRow.innerHTML = '';
  [[score,'Correct','#5cb87a'], [answered-score,'Wrong','#e05c5c'], [answered,'Total','#e8c27a']].forEach(function(s) {
    var box = document.createElement('div');
    box.className = 'stat-box';
    box.innerHTML = '<span class="stat-val" style="color:' + s[2] + '">' + s[1] + '</span><span class="stat-lbl">' + s[0] + '</span>';
    statsRow.appendChild(box);
  });

  var btns = document.getElementById('cta-btns');
  btns.innerHTML = '';
  function makeBtn(cls, label, fn) {
    var b = document.createElement('button');
    b.className = cls; b.textContent = label;
    b.addEventListener('click', fn);
    btns.appendChild(b);
  }
  makeBtn('btn-pri', 'Retry', function() { buildQueue(sessionSetKeys); startQuiz(); });
  makeBtn('btn-sec', 'Change Sets', function() { selectLecture(data.indexOf(activeLecture)); });
  makeBtn('btn-sec', 'All Subjects', buildLectureScreen);

  document.getElementById('progress-fill').style.width = '100%';
  showScreen('complete-screen');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
data = loadEmbeddedSets();

if (data.length === 0) {
  document.getElementById('error-body').innerHTML =
    'No <code>&lt;script type="text/plain" data-lecture="..." data-set="..."&gt;</code> blocks found in this file.<br><br>' +
    'Open <code>index.html</code> in a text editor and paste your set content following the instructions at the top.';
  showScreen('error-screen');
} else {
  buildLectureScreen();
}
</script>
</body>
</html>

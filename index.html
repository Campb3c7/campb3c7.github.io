<script type="text/plain" data-lecture="Hematology" data-set="Hematology_set_claude">
!Hematology
"A 26-year-old woman with heavy menstrual cycles for the past year presents with fatigue and craving ice constantly throughout the day. Her hemoglobin is 7.1 g/dL. MCV is 68 (low). Which of the following best describes the pathophysiology of her anemia?" : "Lack of intrinsic factor from the parietal cells prevents B-12 absorption at the terminal ileum, slowing RBC nuclear development", "Chronic blood loss depletes iron stores, leaving insufficient raw material to build heme and hemoglobin, resulting in small, pale RBCs", "An autoantibody attacks her own RBCs causing premature destruction and falling hemoglobin", "A genetic mutation reduces the number of functional hemoglobin chain genes, decreasing RBC production", "Erythropoietin deficiency from renal disease reduces the bone marrow's stimulus to produce RBCs" : 2 : "Heavy menstrual cycles cause ongoing blood loss. Each mL of blood lost takes iron with it. When iron stores are depleted, there is insufficient raw material to build heme — the iron-containing component of hemoglobin. Without enough hemoglobin, RBCs are small (low MCV = microcytic) and pale. The classic tip-off is pica — specifically pagophagia (craving ice) — which is a hallmark symptom of iron deficiency anemia. This is a deficiency anemia, not hemolytic, so haptoglobin and bilirubin would be normal."
"A 72-year-old man with a long history of type 2 diabetes and chronic kidney disease stage IV presents with fatigue and shortness of breath. His hemoglobin is 9.2 g/dL, MCV is 88 (normal), and reticulocyte count is low. Which of the following best explains the cause of his anemia?" : "His chronic kidney disease has caused recurrent microscopic hematuria, slowly depleting his iron stores", "His kidneys are no longer producing adequate erythropoietin, so the bone marrow receives insufficient stimulus to produce RBCs", "His poorly controlled diabetes has caused autoimmune destruction of erythroid precursor cells in the bone marrow", "His chronic inflammation from diabetes is sequestering iron within macrophages, making it unavailable for RBC production", "His age-related decline in B-12 absorption is causing delayed nuclear maturation and normocytic anemia" : 2 : "The kidneys are the primary source of erythropoietin (EPO), the hormone that signals the bone marrow to produce red blood cells. In chronic kidney disease, damaged kidneys produce insufficient EPO. Without the EPO signal, the bone marrow does not produce enough RBCs — the low reticulocyte count confirms that the bone marrow is underproducing. The MCV is normal because the RBCs that are made are structurally fine; there just aren't enough of them. This is anemia of chronic kidney disease, treated with exogenous EPO supplementation."
"A 58-year-old woman with rheumatoid arthritis presents with fatigue and a hemoglobin of 10.1 g/dL, MCV 82 (low-normal), and a low reticulocyte count. Iron studies show a low serum iron but a normal or elevated ferritin. Which of the following best explains these findings?" : "She has iron deficiency anemia from chronic GI blood loss caused by NSAID use for her arthritis", "Chronic inflammation causes hepcidin release, which sequesters iron within macrophages making it unavailable for erythropoiesis", "She has thalassemia trait that was unmasked by the inflammatory state of her rheumatoid arthritis", "Her rheumatoid arthritis has caused autoimmune hemolysis with macrophage-mediated RBC destruction", "Elevated inflammatory cytokines have directly suppressed erythropoietin production in the kidneys" : 2 : "Anemia of chronic disease occurs in settings of chronic inflammation — rheumatoid arthritis, IBD, cancer, chronic infections. Inflammatory cytokines stimulate release of hepcidin, a hormone that locks iron inside macrophages and prevents it from being released for erythropoiesis. The iron is there — hence the normal or elevated ferritin (ferritin is an acute phase reactant and goes up with inflammation) — but it is inaccessible. This distinguishes it from true iron deficiency where ferritin is low because total iron stores are depleted."
"A 19-year-old man of Mediterranean descent is found to have a hemoglobin of 9.8 g/dL and an MCV of 62 on routine pre-participation bloodwork. He has no symptoms. A peripheral smear shows many small, pale, misshapen RBCs. He reports his father had 'blood problems' too. Which of the following is most consistent with this presentation?" : "Iron deficiency anemia from dietary insufficiency common in young men with a poor diet", "Thalassemia, a genetic disorder where mutations reduce or eliminate production of one or more hemoglobin chain proteins", "G6PD deficiency, an X-linked disorder causing RBC destruction under oxidative stress", "Autoimmune hemolytic anemia triggered by a recent viral illness common in young adults", "Sickle cell disease, a genetic disorder causing abnormal hemoglobin polymerization" : 2 : "Thalassemias are genetic disorders most common in persons of Mediterranean, African, and Asian descent — an important demographic clue. Mutations reduce or eliminate production of alpha or beta hemoglobin chains. Without the normal complement of chains, hemoglobin is structurally weak and RBCs are small (very low MCV), pale, and fragile. The family history and ethnicity point here. Unlike iron deficiency, where iron stores are depleted, thalassemia patients have normal or elevated iron because the RBC destruction releases iron that cannot be used properly."
"A 23-year-old woman presents with sudden onset fatigue, jaundice, and dark urine over 3 days. Her hemoglobin has dropped from 12.8 to 6.9 g/dL. MCV is 90 and RDW is narrow. Lab work shows elevated LDH, elevated unconjugated bilirubin, and an undetectable haptoglobin. Which of the following is the most likely type of anemia and what do these specific labs confirm?" : "Iron deficiency anemia; the elevated bilirubin reflects poor hepatic clearance of dietary breakdown products", "Hemolytic anemia; RBCs are being destroyed prematurely — LDH and bilirubin are released from lysed RBCs and haptoglobin is consumed mopping up free hemoglobin", "Anemia of chronic disease; the elevated LDH and bilirubin reflect the underlying systemic inflammatory process", "Macrocytic anemia from B-12 deficiency; delayed nuclear maturation causes release of LDH from abnormally large RBCs", "Thalassemia; the narrow RDW confirms a single genetic cause and the bilirubin reflects iron overload from chronic transfusions" : 2 : "This is the classic hemolysis triad. When RBCs are destroyed prematurely, three things happen: LDH is released from the lysed RBC cytoplasm (elevated LDH), hemoglobin is broken down into bilirubin (elevated unconjugated bilirubin causing jaundice and dark urine), and free hemoglobin in the blood is scavenged by haptoglobin until haptoglobin is exhausted (low/undetectable haptoglobin). The rapid drop in hemoglobin over 3 days and the narrow RDW suggest a single acute process, not a chronic nutritional deficiency. Further workup would determine if autoimmune, G6PD-related, or another hemolytic etiology."
"A 34-year-old man with G6PD deficiency is started on primaquine for malaria prophylaxis. Two weeks later he presents with fatigue, scleral icterus, and dark urine. Which of the following best explains what happened?" : "Primaquine caused direct bone marrow suppression reducing RBC production", "Primaquine created oxidative stress that overwhelmed the deficient G6PD enzyme, causing RBC membranes to denature and hemolyze", "Primaquine triggered an autoimmune response producing antibodies against the patient's own RBCs", "Primaquine caused iron deficiency by binding dietary iron in the GI tract, reducing hemoglobin production", "G6PD deficiency causes abnormal hemoglobin chains that polymerize when exposed to medications" : 2 : "G6PD (glucose-6-phosphate dehydrogenase) is an enzyme inside RBCs that neutralizes oxidative stress. Without functional G6PD, oxidative damage accumulates and denatures the hemoglobin — creating Heinz bodies — which causes RBC membrane damage and hemolysis. Oxidative triggers include certain drugs (primaquine, dapsone, sulfa drugs), infections, and fava beans. G6PD is X-linked, so clinical disease occurs almost exclusively in males. The presentation — acute hemolysis after drug exposure — with elevated bilirubin and undetectable haptoglobin confirms intravascular or extravascular RBC destruction."
"A 45-year-old African-American man is admitted for a painful crisis. He has bone pain, his spleen is enlarged, and his hemoglobin is 7.4 g/dL. The PA knows this patient well and notes that his baseline hemoglobin is typically around 8 g/dL. Which of the following best describes the mechanism of his underlying disease?" : "An autoantibody to his RBC surface antigens causes complement-mediated lysis during periods of physiologic stress", "A point mutation causes abnormal beta-globin chains, producing hemoglobin S that polymerizes under low oxygen conditions, distorting RBCs into a sickle shape", "A deletion of two or more alpha-globin genes causes RBCs to form with insufficient structural hemoglobin chains", "Chronic inflammation traps iron in macrophages, and under stress the RBCs collapse due to inadequate hemoglobin content", "A deficiency of the ADAMTS13 enzyme allows ultralong vWF molecules to activate platelets and destroy RBCs in small vessels" : 2 : "Sickle cell disease is caused by a specific point mutation in the beta-globin gene that produces hemoglobin S (HbS). Under conditions of low oxygen (physiologic stress, dehydration, infection, cold), HbS polymerizes and distorts the RBC into a rigid sickle shape. Sickled cells cannot flow through small vessels, causing vaso-occlusion, ischemia, and the painful crisis. The chronically sickled and fragile RBCs also hemolyze, explaining the baseline anemia. Repeated splenic infarction from sickling eventually causes autosplenectomy in many patients."
"A patient is being worked up for a macrocytic anemia. She is found to have a B-12 level of 88 pg/mL (normal >200). She is 68 years old, has no dietary restrictions, and eats meat regularly. Intrinsic factor antibodies are detected. Which of the following best explains how she became B-12 deficient despite eating meat?" : "She has terminal ileum disease preventing absorption of B-12 even when intrinsic factor is present", "Her parietal cells are destroyed by autoantibodies, eliminating intrinsic factor production and making B-12 absorption at the terminal ileum impossible", "She has had a partial gastrectomy which removed the portion of the stomach that absorbs B-12 directly", "Aging reduces the amount of B-12 in animal products, so elderly patients must supplement regardless of diet", "Antibodies to the brush border enzymes at the terminal ileum prevent the B-12/intrinsic factor complex from binding to its receptor" : 2 : "B-12 is found in animal products, but to be absorbed it must bind to intrinsic factor — a protein secreted by gastric parietal cells. The B-12/intrinsic factor complex then travels to the terminal ileum where it is absorbed. In pernicious anemia, autoantibodies destroy the parietal cells, eliminating intrinsic factor production. Without intrinsic factor, B-12 cannot be absorbed no matter how much the patient eats. This is an autoimmune condition — distinct from simple dietary deficiency — and is the classic cause of B-12 deficiency in an older patient who eats a normal diet."
"A 29-year-old woman presents with several weeks of fatigue, paresthesias in both feet, and an unsteady gait. Labs show a hemoglobin of 9.2 g/dL and an MCV of 112 (high). Which of the following neurologic complications is occurring and what is causing both this and the anemia?" : "Peripheral neuropathy and subacute combined degeneration of the spinal cord from B-12 deficiency, which impairs both myelin synthesis and DNA synthesis needed for RBC nuclear maturation", "Peripheral neuropathy from iron deficiency causing abnormal myelin production in peripheral neurons", "Cerebellar ataxia from folate deficiency affecting the cerebellum specifically, combined with macrocytic anemia from reduced DNA synthesis", "Guillain-Barre syndrome triggered by the same autoimmune process that causes autoimmune hemolytic anemia", "Peripheral neuropathy from anemia of chronic disease where cytokines damage the myelin sheath of peripheral nerves" : 1 : "B-12 is required for two critical processes: DNA synthesis (needed for RBC nuclear maturation) and myelin synthesis (needed for the nervous system). When B-12 is deficient, RBCs grow large because DNA replication is delayed — the cell keeps growing but cannot divide, producing a macrocytic anemia. At the same time, myelin cannot be properly synthesized, causing subacute combined degeneration of the dorsal and lateral columns of the spinal cord — presenting as paresthesias, loss of proprioception, and gait ataxia. Folate deficiency causes macrocytic anemia but does NOT cause neurologic symptoms."
"A 28-year-old man with no prior medical history presents to a hematology clinic after abnormal CBC results at a routine physical. His CBC shows: WBC 3.2 (low), hemoglobin 9.8 g/dL (low), platelets 88,000 (low). Bone marrow biopsy shows a hypocellular marrow with fatty replacement. Which of the following best describes this condition?" : "Disseminated intravascular coagulation causing consumption of all cell lines simultaneously", "Aplastic anemia, where the bone marrow fails to produce adequate cells of all lineages, causing pancytopenia", "Multiple myeloma, where plasma cells crowd out normal marrow cells causing pancytopenia", "Leukemia, where immature blasts fill the marrow and suppress normal cell production", "Myelodysplasia, where ineffective hematopoiesis causes qualitative and quantitative defects in all cell lines" : 2 : "When all three cell lines are low simultaneously — low WBC (leukopenia), low hemoglobin (anemia), and low platelets (thrombocytopenia) — this is pancytopenia. A hypocellular marrow with fatty replacement on biopsy is the hallmark of aplastic anemia, where the bone marrow fails entirely. The slide distinguishes this from myelodysplasia (abnormal cells present but dysfunctional) and leukemia (marrow packed with blasts). Causes include idiopathic autoimmune attack on stem cells, radiation, chemotherapy, and certain drugs."
"A 55-year-old man is found to have a WBC of 98,000 with 80% blasts on the peripheral smear. He is pale, has splenomegaly, and reports 3 months of fatigue and recurrent infections. Which of the following best describes the pathophysiology that explains why he keeps getting infections?" : "The overabundant immature blasts directly produce immunosuppressive cytokines that inhibit normal immune function", "The leukemic blasts crowd out normal hematopoietic cells in the bone marrow, leaving no room for production of functional mature neutrophils needed to fight infection", "The splenomegaly is sequestering all functional neutrophils, depleting the circulation of cells needed for infection defense", "The patient has lost production of immunoglobulin-secreting B cells, leaving him with no antibody-mediated immunity", "The high white cell count causes sludging in the bone marrow vasculature, delivering insufficient oxygen to produce functional leukocytes" : 2 : "In leukemia, a stem cell halts development prematurely and reproduces in an uncontrolled fashion, filling the bone marrow with immature, nonfunctional blasts. These blasts physically crowd out the normal hematopoietic precursors — including the progenitors of functional neutrophils, RBCs, and platelets. Without space to develop, normal cell production fails. The patient ends up with large numbers of blasts that cannot fight infection, plus insufficient mature neutrophils. The result: recurrent infections, anemia, and thrombocytopenia — the classic triad of bone marrow failure from leukemia."
"A 4-year-old boy is brought to the pediatrician after his parents notice unexplained bruising and pallor. A CBC shows blasts on the peripheral smear and the boy is referred to oncology. He is ultimately diagnosed with leukemia. Which type is most likely given his age?" : "Acute myelogenous leukemia (AML), which peaks in toddlers and pre-school aged children", "Chronic lymphocytic leukemia (CLL), which is the most common leukemia in young children", "Acute lymphocytic leukemia (ALL), which is most common in young children and is the most common childhood cancer", "Chronic myelogenous leukemia (CML), which commonly presents in school-aged children with the Philadelphia chromosome", "Multiple myeloma, which in rare cases can present in very young children as a bone marrow malignancy" : 3 : "Acute lymphocytic leukemia (ALL) is the most common cancer in children and peaks in pre-school and young school-aged children. It arises from a lymphoid stem cell that halts development and proliferates uncontrollably. AML, in contrast, arises from a myeloid stem cell and is more common in older adults. CLL is a disease of adults over 65. The peripheral smear showing blasts is the hallmark finding for any acute leukemia — blasts in the peripheral blood are not normal and should always raise suspicion for leukemia."
"A 70-year-old man presents with fatigue, bone pain, and is found to have a creatinine of 4.8 (severely elevated), hypercalcemia, and a large protein spike on serum protein electrophoresis. X-rays of the spine show multiple lytic lesions. Which of the following is most likely responsible for his acute kidney injury?" : "Tumor lysis syndrome from rapid leukemic cell death releasing intracellular potassium and phosphate", "Monoclonal immunoglobulin (M-protein) light chains deposited in the renal tubules damage kidney tissue, causing multiple myeloma kidney injury", "Hyperviscosity from excess RBC production by the malignant plasma cells obstructs renal blood flow", "Amyloid deposition from chronic lymphocytic leukemia causes progressive renal failure", "Splenic sequestration of platelets causes microvascular renal thrombosis" : 2 : "Multiple myeloma is a cancer of mature plasma cells that produce massive quantities of a single, abnormal immunoglobulin (M-protein). The light chain components of this immunoglobulin are filtered by the kidney and deposit in the renal tubules, causing direct toxic injury — this is one of the classic manifestations of myeloma. Additionally, hypercalcemia (from osteoclast-activating factors causing bone destruction) also contributes to renal injury by causing renal vasoconstriction. The combination of lytic bone lesions, AKI, hypercalcemia, and the M-spike on protein electrophoresis is the classic myeloma picture."
"A 35-year-old woman presents with painless, rubbery enlarged cervical lymph nodes. She has had fevers, drenching night sweats, and a 15-lb unintentional weight loss over the past 2 months. Biopsy of a lymph node reveals Reed-Sternberg cells. What are the systemic symptoms called and what is this diagnosis?" : "These are called A symptoms and the diagnosis is non-Hodgkin's lymphoma", "These are called B symptoms — fevers, night sweats, and unintentional weight loss — and the diagnosis is Hodgkin's lymphoma", "These are called constitutional symptoms and the diagnosis is chronic lymphocytic leukemia presenting with lymphadenopathy", "These are called B symptoms and the diagnosis is multiple myeloma, which frequently involves cervical lymph nodes", "These are systemic inflammatory response symptoms and the diagnosis is reactive lymphadenopathy from a chronic viral infection" : 2 : "B symptoms — fever, drenching night sweats, and unintentional weight loss greater than 10% body weight — are systemic symptoms associated with lymphoma that indicate a more advanced or aggressive disease process. They carry prognostic significance. Reed-Sternberg cells (large binucleated cells) are the pathognomonic finding of Hodgkin's lymphoma on biopsy. Hodgkin's tends to spread contiguously through lymph node groups and remains confined to the lymphatic system longer than non-Hodgkin's lymphoma, giving it a generally better prognosis."
"A 22-year-old man with Hodgkin's lymphoma is told by his oncologist that his prognosis is relatively favorable compared to non-Hodgkin's lymphoma. Which of the following best explains why Hodgkin's lymphoma generally has a better prognosis?" : "Hodgkin's lymphoma is exclusively a disease of young, otherwise healthy patients who tolerate chemotherapy better", "Hodgkin's lymphoma spreads contiguously through adjacent lymph node chains and tends to remain confined to the lymph nodes, making it more predictable and amenable to targeted radiation and chemotherapy", "Hodgkin's lymphoma grows extremely slowly and often does not require treatment, while non-Hodgkin's requires aggressive therapy", "Hodgkin's lymphoma is cured with a single course of steroids, while non-Hodgkin's requires multi-agent chemotherapy", "Hodgkin's lymphoma cannot metastasize beyond the lymph nodes, making it truly localized by definition" : 2 : "The key pathologic difference is in how these lymphomas spread. Hodgkin's lymphoma spreads in an orderly, contiguous fashion — from one lymph node group to the next adjacent group — and tends to stay within the lymphatic system. This predictable spread pattern means it can be mapped accurately and targeted effectively with radiation and chemotherapy. Non-Hodgkin's lymphoma, in contrast, spreads in a non-contiguous, unpredictable fashion and frequently involves extranodal sites early, making it harder to treat comprehensively. This is the central reason for the difference in prognosis."
"A 16-year-old boy is seen for a sports physical. He reports that he bleeds a lot when he cuts himself and once had severe bleeding after a dental extraction. His father and uncle had similar problems. Labs show a normal PT but a prolonged PTT. Which of the following is the most likely diagnosis?" : "vonWillebrand's disease, because vWF deficiency causes platelet plug failure and prolonged PT", "Hemophilia A or B, because a deficiency of factor VIII or IX (intrinsic pathway factors) causes a prolonged PTT with a normal PT", "ITP, because autoantibody-mediated platelet destruction would cause easy bleeding in a teenage boy", "Factor V Leiden, because this disorder disrupts the intrinsic pathway leading to prolonged PTT", "Vitamin K deficiency, because adolescent males with poor diets frequently cannot produce extrinsic and intrinsic pathway clotting factors" : 2 : "The coagulation cascade has two pathways: the extrinsic pathway (tested by PT) and the intrinsic pathway (tested by PTT). A prolonged PTT with a normal PT means the defect is in the intrinsic pathway — specifically factors VIII, IX, XI, or XII. Hemophilia A is a deficiency of factor VIII; Hemophilia B (Christmas disease) is a deficiency of factor IX. Both are X-linked, which explains the male-predominant family pattern. These clotting factor deficiencies cause bleeding deep in tissues — muscle hematomas (hemarthrosis) — rather than the mucocutaneous bleeding seen with platelet disorders."
"A 17-year-old hemophiliac falls during basketball practice and develops severe swelling and pain in his right knee. Which of the following terms describes this complication and why does hemophilia specifically predispose to this?" : "Petechiae; platelet plug failure in hemophilia leads to small capillary ruptures in the skin over the knee", "Hemarthrosis; deep factor-dependent coagulation is required to stop bleeding in synovial joints, and factor deficiency means bleeding into the joint space cannot be stopped", "Ecchymosis; the platelet plug forms normally but the secondary coagulation cascade fails, causing large surface bruises rather than deep bleeding", "Hematuria; trauma to the knee triggers reflex renal vasodilation causing blood to leak into the urine from the nephrons", "Petechiae and purpura; the trauma activates an autoimmune process that depletes platelets temporarily" : 2 : "Hemophilia causes a deficiency of intrinsic pathway clotting factors (VIII or IX). The platelet plug still forms normally — which is why patients don't get petechiae or gum bleeding like platelet disorders. However, the secondary hemostasis cascade that consolidates the platelet plug with a fibrin clot is impaired. Deep tissues — like joints (hemarthrosis), muscles, and retroperitoneum — require robust secondary hemostasis to stop bleeding. Minor trauma to a joint triggers bleeding that cannot be stopped, filling the joint space with blood. Repeated hemarthrosis damages the joint permanently."
"A patient on heparin for a DVT has their platelet count drop from 220,000 to 58,000 on day 8 of therapy. The PA suspects heparin-induced thrombocytopenia (HIT). Which of the following is the most dangerous clinical consequence of HIT that makes it distinct from simply having a low platelet count?" : "HIT causes massive hemorrhage because the platelet count is too low to form any platelet plug at all", "HIT generates autoantibodies to heparin/platelet factor 4 complexes that paradoxically activate platelets, causing thrombosis — so the patient is at risk of clotting, not bleeding", "HIT causes the bone marrow to completely stop platelet production, leading to prolonged thrombocytopenia for months", "HIT triggers DIC by releasing tissue factor from destroyed platelets, consuming all coagulation factors", "HIT causes the surviving platelets to lose their GP IIb/IIIa receptors, preventing fibrin binding and platelet aggregation" : 2 : "This is the critical distinction about HIT. Most thrombocytopenias cause bleeding because there are too few platelets. HIT is paradoxically a thrombotic condition. The autoantibody formed against the heparin/platelet factor 4 complex actually activates platelets rather than just destroying them. This activation causes platelet aggregation and widespread clot formation — patients develop DVTs, PEs, arterial thromboses, and limb ischemia — all while their platelet count is low. HIT is treated by immediately stopping heparin (including Lovenox) and switching to a non-heparin anticoagulant."
"A 32-year-old woman presents to the ER with confusion, new-onset seizure activity, and acute kidney injury. CBC shows a platelet count of 18,000 and peripheral smear shows schistocytes (fragmented RBCs). ADAMTS13 enzyme activity is nearly absent. Which of the following is the correct diagnosis and mechanism?" : "Immune thrombocytopenic purpura; autoantibodies bind and destroy platelets causing a very low platelet count and end-organ damage from bleeding", "Thrombotic thrombocytopenic purpura; absent ADAMTS13 allows ultralong vWF molecules to activate platelets, causing microthrombi in small vessels that consume platelets and shear RBCs", "Disseminated intravascular coagulation; massive simultaneous activation of the coagulation cascade consumes all platelets and clotting factors", "Heparin-induced thrombocytopenia; heparin antibodies cause platelet activation and endothelial damage in the brain and kidneys", "Hemophilia A presenting atypically; factor VIII deficiency allows uncontrolled bleeding in the cerebral microvasculature" : 2 : "TTP is caused by a deficiency of ADAMTS13, the enzyme that cleaves ultralong vWF multimers into normal-sized fragments. Without ADAMTS13, these ultralong vWF strings accumulate in small blood vessels and spontaneously activate platelets, forming microthrombi throughout the microvasculature. Platelets are consumed by these clots (causing thrombocytopenia) and RBCs are physically sheared apart as they try to squeeze past the microthrombi (causing schistocytes on smear and hemolytic anemia). Microthrombi in the brain cause neurologic symptoms and seizures; microthrombi in the kidneys cause AKI."
"A 68-year-old woman is started on warfarin for a newly diagnosed atrial fibrillation. Her PA orders an INR two weeks later to monitor her therapy. Her INR is 3.8 (therapeutic range 2.0-3.0 for Afib). Which of the following best explains what warfarin does to achieve its anticoagulant effect and why the INR is monitored?" : "Warfarin binds directly to thrombin and factor Xa, blocking the common pathway; INR monitors how completely these factors are blocked", "Warfarin inhibits vitamin K-dependent clotting factor synthesis (factors II, VII, IX, X); since these are extrinsic and common pathway factors, the PT/INR reflects their activity and rises as warfarin takes effect", "Warfarin prevents the GP IIb/IIIa receptor from binding fibrin, impairing platelet plug formation; INR measures platelet function", "Warfarin enhances antithrombin III activity to inactivate factor Xa; the INR monitors antithrombin III levels indirectly", "Warfarin blocks heparin cofactor II, preventing breakdown of factor Va and VIIIa; the INR measures residual clotting factor activity" : 2 : "Warfarin (Jantoven/Coumadin) works by inhibiting Vitamin K epoxide reductase, preventing regeneration of active vitamin K. Since factors II, VII, IX, and X require vitamin K for synthesis (they are vitamin K-dependent), warfarin reduces production of all four. Factors VII and X are extrinsic and common pathway factors — their depletion prolongs the PT, which is used to calculate the INR. The INR is the standardized way to monitor warfarin's effect and adjust dosing. The therapeutic INR for Afib is 2.0–3.0; this patient is slightly supratherapeutic at 3.8 and the dose should be reduced."
"A patient with a known DVT is started on unfractionated heparin (UFH) drip in the hospital. The PA orders a PTT every 6 hours to monitor therapy. Which of the following correctly explains why PTT is used for UFH but not for Lovenox (enoxaparin)?" : "UFH and Lovenox both affect the intrinsic pathway, but only UFH has predictable enough PTT changes to be dose-adjusted; Lovenox has a fixed dose-response that does not require monitoring", "UFH works by enhancing antithrombin III to inactivate thrombin and factor Xa; its effect is highly variable between patients, so PTT monitors the degree of anticoagulation and guides dose adjustment. Lovenox has a predictable pharmacokinetics and fixed dosing that does not require monitoring in most patients", "UFH prolongs the PT because it affects extrinsic pathway factors; Lovenox only affects the PTT so monitoring is not needed", "UFH is renally cleared and requires PTT monitoring only in renal failure; Lovenox is hepatically cleared and never requires monitoring", "Lovenox is monitored with anti-Xa levels, which replaces the PTT entirely even for UFH in current practice" : 2 : "Unfractionated heparin works by binding antithrombin III and greatly enhancing its ability to inactivate thrombin and factor Xa. However, UFH has highly variable pharmacokinetics between patients — the same dose produces very different levels of anticoagulation in different people. Therefore, the PTT (which reflects intrinsic pathway activity, where thrombin acts) is used every 6 hours to assess the degree of anticoagulation and adjust the drip. Lovenox (fractionated heparin) has predictable, reliable pharmacokinetics and a standard weight-based dose response, so routine PTT monitoring is not required."
"A 54-year-old woman with a history of two unprovoked DVTs is found to have Factor V Leiden on hypercoagulability testing. Her hematologist explains that this puts her at significantly elevated clotting risk. Which of the following correctly describes the mechanism of Factor V Leiden?" : "The patient overproduces Factor V, flooding the coagulation cascade with excess procoagulant material", "The patient produces a mutant Factor V that is resistant to inactivation by protein C, allowing it to remain active in the clotting cascade far longer than normal", "The patient has a deficiency of Factor V, which paradoxically activates compensatory clotting pathways causing hypercoagulability", "The patient's Factor V binds to vWF molecules abnormally, causing spontaneous platelet activation and thrombus formation", "The patient cannot produce the inhibitor of Factor V, allowing the coagulation cascade to proceed without a natural brake" : 2 : "Normally, activated Factor V is inactivated by protein C — this is a natural brake on the clotting cascade. In Factor V Leiden, a genetic mutation produces a Factor V molecule with a single amino acid change that makes it resistant to cleavage and inactivation by protein C. The mutant Factor V stays active far longer than it should, continuously driving the coagulation cascade forward. This creates a hypercoagulable state that significantly increases the risk of DVT and PE. Factor V Leiden is the most common inherited thrombophilia."
"A patient with protein C deficiency is seen in hematology for follow-up after a DVT. Her PA explains that protein C deficiency is a hypercoagulable state. What is the normal function of protein C that makes its deficiency dangerous?" : "Protein C normally activates platelets to form a stronger platelet plug; without it, the platelet plug is too weak and paradoxically causes thrombosis as compensation", "Protein C normally inactivates factors Va and VIIIa, acting as a natural anticoagulant brake; without it, these factors remain active and drive excessive clot formation", "Protein C normally activates antithrombin III; without protein C, antithrombin III cannot inactivate thrombin and factor Xa", "Protein C normally stimulates plasminogen to dissolve excess fibrin; without it, fibrin accumulates in vessels causing thrombosis", "Protein C is the only endogenous activator of the extrinsic pathway; without it, coagulation cascades proceed unchecked through the intrinsic pathway alone" : 2 : "Protein C is a natural anticoagulant. When activated, it cleaves and inactivates factors Va and VIIIa — two important amplifiers of the coagulation cascade. Without protein C (or its cofactor protein S), factors Va and VIIIa remain active and continuously accelerate clot formation. The result is a hypercoagulable state with significantly elevated risk of DVT and PE. Protein C deficiency, protein S deficiency, and Factor V Leiden (which makes Factor Va resistant to protein C) all act through the same final common pathway of unchecked Factor Va and VIIIa activity."
"A 44-year-old man is in the surgical ICU following a ruptured abdominal aortic aneurysm repair with massive transfusion of 18 units of PRBCs. His labs now show: platelets 28,000, PT markedly prolonged, PTT markedly prolonged, fibrinogen nearly undetectable, and schistocytes on the peripheral smear. Which of the following best describes what is happening?" : "The massive transfusion has diluted the patient's iron stores, causing an acute severe iron deficiency anemia with secondary thrombocytopenia", "Disseminated intravascular coagulation; the massive vascular injury triggered simultaneous widespread clotting cascade activation that has consumed all platelets and clotting factors, leaving the patient with simultaneous clotting and bleeding", "Heparin-induced thrombocytopenia from the heparin given intraoperatively has consumed platelets and caused paradoxical thrombosis", "Thrombotic thrombocytopenic purpura triggered by the surgical stress has caused ADAMTS13 deficiency and microthrombi formation", "Aplastic anemia unmasked by the physiologic stress of surgery has caused simultaneous failure of all three cell lines" : 2 : "Disseminated intravascular coagulation (DIC) occurs when a massive insult — trauma, sepsis, obstetric catastrophe, massive surgery — simultaneously activates the coagulation cascade throughout the body. Clotting factors and platelets are consumed forming microthrombi everywhere, while secondary fibrinolysis kicks in to dissolve the clots. The result is consumption of all platelets (low platelets), all clotting factors (prolonged PT and PTT), and fibrinogen (low fibrinogen), with RBC shearing from microthrombi (schistocytes). The patient bleeds from everywhere because there is nothing left to clot with."
"A 62-year-old man presents with fatigue, pallor, and a hemoglobin of 8.2 g/dL. His MCV is 104 (macrocytic) and RDW is wide. He denies GI symptoms and eats a balanced diet. He has a history of Crohn's disease affecting the terminal ileum and has had two bowel resections. Which vitamin deficiency is most likely causing his macrocytic anemia and why?" : "Folate deficiency from malabsorption because Crohn's disease predominantly affects the jejunum where folate is absorbed", "B-12 deficiency because the terminal ileum — the exclusive site of B-12 absorption — has been damaged and resected due to Crohn's disease", "Vitamin K deficiency from chronic malabsorption causing impaired DNA synthesis in erythroid precursors", "Iron deficiency from chronic GI blood loss despite normal MCV because iron deficiency always progresses to macrocytic anemia in later stages", "Thiamine deficiency from poor intake in the setting of Crohn's-related anorexia causing macrocytic changes in the marrow" : 2 : "B-12 is absorbed exclusively at the terminal ileum, where it binds to the intrinsic factor/B-12 complex and is taken up by specific receptors. The terminal ileum is also the most commonly affected site in Crohn's disease. Surgical resection of diseased terminal ileum removes the only absorption site for B-12. Even if the patient eats meat daily, B-12 cannot be absorbed without a functioning terminal ileum. The body stores years of B-12, so deficiency can take years to develop after resection — making it easy to miss without routine monitoring."
"A 58-year-old woman is found to have a platelet count of 28,000 on routine bloodwork. She has no bleeding symptoms and feels well. She is on no new medications. Labs show large platelets on smear, a bone marrow biopsy shows normal or increased megakaryocytes, and a direct Coombs test is negative. Spleen is mildly enlarged on imaging. Which of the following is the most likely diagnosis?" : "Thrombotic thrombocytopenic purpura; ADAMTS13 deficiency is causing platelet consumption in microthrombi", "Immune thrombocytopenic purpura (ITP); autoantibodies bind platelets causing splenic destruction, while the bone marrow responds by increasing megakaryocyte production to compensate", "Aplastic anemia; the bone marrow is failing to produce platelets, which is why they are low", "Heparin-induced thrombocytopenia; a prior heparin exposure generated antibodies that are now clearing platelets even without current heparin use", "Multiple myeloma; plasma cell infiltration of the marrow is suppressing megakaryocyte production" : 2 : "ITP is an autoimmune disorder where antibodies target platelet surface antigens, leading to platelet destruction in the spleen. The bone marrow responds by increasing megakaryocyte production to compensate — hence the increased megakaryocytes on biopsy (the marrow is working hard but the spleen is destroying platelets faster than they can be made). Large platelets are released as the marrow rushes production. The splenomegaly reflects the spleen's active role in destroying antibody-coated platelets. Unlike TTP, there are no microthrombi, no schistocytes, and no neurologic or renal involvement."
"A 24-year-old woman is found to have a platelet count of 22,000. Further workup confirms ITP. She has no bleeding. Her physician considers starting treatment. Which of the following medications would be most appropriate as initial therapy for ITP?" : "Start oral vancomycin to eradicate H. pylori, which is the underlying trigger for all cases of ITP", "Corticosteroids such as prednisone to suppress the autoimmune response and reduce antibody-mediated platelet destruction", "Start Lovenox to prevent paradoxical thrombosis from platelet activation by ITP antibodies", "Begin plasmapheresis immediately to remove the autoantibodies before they can destroy more platelets", "Start azathioprine as first-line immunosuppression because steroids are too slow to work in autoimmune platelet disorders" : 2 : "ITP is caused by autoantibodies attacking platelets and causing their destruction in the spleen. The goal of treatment is to reduce the autoimmune attack. Corticosteroids (prednisone) are the first-line treatment — they suppress the immune system, reducing antibody production and also reducing the spleen's phagocytic activity against antibody-coated platelets. In severe or refractory cases, IVIG, splenectomy, or thrombopoietin receptor agonists may be used. Plasmapheresis is used for TTP, not ITP. Unlike HIT, ITP does not cause thrombosis — the low platelets here cause bleeding risk, not clotting."
"A 19-year-old man is evaluated for a bleeding disorder. He reports easy bruising, prolonged bleeding from minor cuts, and heavy nosebleeds. His sister has the same problem. PT and PTT are both normal. Platelet count is normal. A ristocetin cofactor assay shows reduced activity. Which of the following is the most likely diagnosis?" : "Hemophilia A; factor VIII deficiency causes prolonged bleeding despite a normal PTT in mild cases", "vonWillebrand's disease; reduced or absent vWF impairs the initial platelet adhesion step of primary hemostasis, causing mucocutaneous bleeding with normal PT and PTT", "ITP; the autoantibody causes a qualitative platelet defect rather than a quantitative one, explaining normal platelet count with abnormal bleeding", "Factor V Leiden; although hypercoagulable, Factor V Leiden patients can paradoxically bleed when the excess clotting consumes platelets", "Bernard-Soulier syndrome; absent GP Ib receptor prevents platelet adhesion but would show abnormal platelet count on CBC" : 2 : "vonWillebrand's disease (vWD) is the most common inherited bleeding disorder. vWF is a large multimeric protein that serves two roles: it mediates platelet adhesion to damaged subendothelium (primary hemostasis), and it acts as a carrier protein for factor VIII. Deficiency of vWF causes a primary hemostasis defect — bleeding from mucosal surfaces (nosebleeds, heavy menses, gum bleeding, prolonged cuts). Since vWF is not a clotting factor itself, PT and PTT are usually normal. The ristocetin cofactor assay specifically tests vWF function. It is autosomal dominant, explaining the sister's similar symptoms."
"A 48-year-old woman presents with a painful swollen left calf and shortness of breath. CT pulmonary angiogram confirms a pulmonary embolism. Hypercoagulability workup reveals antiphospholipid antibody syndrome. Her PA begins anticoagulation therapy. Which of the following anticoagulants works by directly inhibiting factor Xa, does not require monitoring, and is given as a fixed oral dose?" : "Warfarin (Jantoven); it inhibits vitamin K-dependent factor X production and is given at a fixed oral dose", "Unfractionated heparin; it enhances antithrombin III to inactivate factor Xa and is given as a fixed oral dose", "Apixaban (Eliquis); it is a direct factor Xa inhibitor given as a fixed oral dose without routine monitoring", "Dabigatran (Pradaxa); it directly inhibits factor Xa and is the most common oral anticoagulant used for PE", "Clopidogrel (Plavix); it blocks the ADP receptor on platelets, indirectly reducing factor Xa activation" : 3 : "The newer direct oral anticoagulants (DOACs) offer targeted coagulation factor inhibition without the monitoring requirements of warfarin. Apixaban (Eliquis) directly inhibits factor Xa — blocking the common step where both the intrinsic and extrinsic pathways converge. It is given as a fixed oral dose and does not require routine INR monitoring. Dabigatran (Pradaxa) is a direct thrombin inhibitor, not a factor Xa inhibitor. Warfarin inhibits synthesis of vitamin K-dependent factors but requires INR monitoring. Clopidogrel is an antiplatelet agent, not an anticoagulant."
"A 52-year-old woman with newly diagnosed atrial fibrillation and a prior history of stroke asks her PA what the goal of anticoagulation is and why aspirin alone is not sufficient. Which of the following best explains why anticoagulants rather than antiplatelet agents are used to prevent cardioembolic stroke in Afib?" : "Aspirin only inhibits the extrinsic pathway, leaving the intrinsic pathway free to form thrombi in the fibrillating atrium", "Thrombi that form in the fibrillating atrium form under conditions of stasis, not arterial injury — they are fibrin-rich clots that require anticoagulation to prevent; antiplatelet agents like aspirin target platelet aggregation at sites of vascular injury, which is a different mechanism", "Aspirin causes too much GI bleeding in patients with Afib, making anticoagulants safer despite similar efficacy for clot prevention", "Anticoagulants directly cardiovert the atrial fibrillation, reducing thrombus formation, while aspirin has no effect on the cardiac rhythm", "Antiplatelet agents cannot cross the blood-brain barrier to prevent stroke, while anticoagulants achieve therapeutic CNS levels" : 2 : "This is a key clinical concept. Virchow's triad describes what causes thrombus formation: stasis, endothelial injury, and hypercoagulability. In atrial fibrillation, blood pools in the fibrillating left atrial appendage — the primary mechanism is stasis. Stasis promotes fibrin-rich clots (red thrombus). Anticoagulants (warfarin, DOACs) prevent fibrin formation and are the appropriate therapy. Antiplatelet agents (aspirin, clopidogrel) target platelet aggregation at sites of vascular injury — their mechanism is suited to arterial thrombosis (white thrombus) like in coronary artery disease or after stroke from atherosclerosis, not cardioembolism from Afib."
</script>
<script type="text/plain" data-lecture="GI" data-set="GI_set_1">
!GI
"A 47-year-old woman presents with epigastric pain that gets better after she eats a sandwich. EGD reveals an ulcer in the first 3 cm of the duodenum. Which of the following is the most likely etiology?" : "H. pylori infection or heavy NSAID use", "Reflux of alkaline bile into the stomach", "Excessive mucous production by the gastric mucosa", "Barrett's esophagus progressing to adenocarcinoma", "Zollinger-Ellison syndrome from a pancreatic tumor" : 1 : "Duodenal ulcers are most commonly caused by H. pylori infection or heavy NSAID use and are classically located in the duodenal bulb within the first 3 cm. The key differentiator here is that duodenal ulcer pain is relieved with eating — food buffers the acid — whereas gastric ulcer pain is worsened by eating. This is the opposite pattern and is a classic board point."
"A 34-year-old man with longstanding poorly controlled type 1 diabetes presents with nausea, bloating and early satiety. A gastric emptying study shows markedly delayed emptying. What is the most appropriate dietary recommendation for this patient?" : "High-fiber, high-protein diet with three large meals per day", "Small, frequent meals of bland, liquid or semi-liquid foods", "A plant-based diet high in raw vegetables and whole grains", "Empiric PPI therapy to reduce gastric acid as first-line treatment", "Avoidance of all carbohydrates to minimize osmotic load in the stomach" : 2 : "Poorly controlled diabetes is the most common cause of enteric neuropathy leading to gastroparesis — the autonomic nerves that drive gastric peristalsis are damaged by chronic hyperglycemia. Because the stomach is not emptying well, solids and large meals make symptoms worse. Treatment is dietary management: small, frequent meals of bland, liquid or soft foods so the stomach does not have to work as hard to empty."
"A 28-year-old woman on oral contraceptives presents with burning substernal chest pain that worsens when she lies down at night and after drinking coffee. She was recently started on a calcium channel blocker for migraines. Which of the following best explains why her symptoms may have worsened since starting the new medication?" : "Calcium channel blockers increase gastric acid secretion by stimulating parietal cells", "Calcium channel blockers reduce lower esophageal sphincter tone, worsening reflux", "Calcium channel blockers inhibit prostaglandin synthesis, damaging the gastric mucosa", "Calcium channel blockers cause pyloric stenosis leading to gastric acid backup", "Calcium channel blockers increase the osmolarity of gastric contents" : 2 : "GERD occurs when the lower esophageal sphincter (LES) loses tone and allows caustic gastric acid to reflux into the unprotected esophagus. Calcium channel blockers are smooth muscle relaxants, and since the LES is composed of smooth muscle, CCBs directly reduce LES tone and worsen reflux. Other medications that do the same include narcotics and benzodiazepines. The patient already had predisposing factors (lying flat, caffeine), and the CCB pushed her over the threshold."
"A 55-year-old woman with a history of obesity and long-standing GERD is noted on EGD to have replacement of normal squamous epithelium with columnar epithelium in the distal esophagus. What is the clinical significance of this finding?" : "This represents a benign adaptive change that is fully reversible with PPI therapy", "This is called Barrett's esophagus and carries a 2-5% risk of progressing to esophageal adenocarcinoma", "This represents erosive esophagitis and is treated with high-dose H2 blockers", "This is the hallmark of esophageal squamous cell carcinoma which is immediately actionable", "This finding is normal in patients who are obese and represents mucosal hypertrophy" : 2 : "Long-standing GERD can cause repeated chemical burns to the esophagus from gastric acid. Over time, the normal squamous epithelium is replaced by columnar epithelium in a process called Barrett's esophagus. This is a premalignant condition — in 2-5% of affected patients, it progresses to esophageal adenocarcinoma. This is why patients with long-standing GERD need surveillance EGDs."
"A 62-year-old man with alcoholic cirrhosis presents to the ER vomiting large amounts of bright red blood. His BP is 88/60. Which of the following is the most likely source of his bleeding and why is he at especially high risk of severe hemorrhage?" : "Mallory-Weiss tear; the tear is at the GE junction and cannot be sutured easily", "Esophageal varices; portal hypertension causes engorged collateral veins that rupture easily and the patient likely has coagulopathy from liver failure", "Duodenal ulcer; NSAIDs are hepatotoxic and cirrhotic patients use them frequently", "Angiodysplasia; degeneration of blood vessels is accelerated by alcohol", "Diverticular bleed; diverticula are common in patients with chronic constipation from liver disease" : 2 : "Portal hypertension — a consequence of chronic liver disease — causes blood to back up in the portal system and form collateral vessels at the esophagus (varices). These thin-walled vessels rupture easily and bleed briskly. The patient is at extreme risk because: 1) varices are non-compressible, and 2) the failing liver no longer synthesizes coagulation factors, causing coagulopathy. The combination of massive hemorrhage and inability to clot makes this a life-threatening emergency."
"A 19-year-old college student returns from a cruise with sudden onset of nausea, non-bloody vomiting, and watery diarrhea. Multiple people on her floor also got sick after the same dinner. What is the most appropriate management?" : "Admit to the hospital and begin IV vancomycin to treat C. difficile colitis", "Prescribe oral ciprofloxacin and metronidazole for presumed bacterial enterocolitis", "Supportive care with oral electrolyte solutions; limit narcotics to allow excretion of the toxin", "Order a CT abdomen and pelvis with contrast to evaluate for perforation", "Prescribe oral mesalamine as first-line treatment for inflammatory bowel disease flare" : 3 : "This presentation — abrupt onset of nausea, vomiting, and non-bloody diarrhea in a cluster of people after a shared meal — is classic for acute viral gastroenteritis, most commonly Norovirus (Norwalk virus). This is a self-limiting illness, and treatment is supportive: sips and chips — popsicles and electrolyte solutions. Narcotics should be avoided because slowing motility prevents excretion of the viral toxin. IV fluids and antiemetics are given if hospitalized."
"A patient is diagnosed with C. difficile colitis after a course of broad-spectrum antibiotics for a urinary tract infection. Which of the following best explains the pathophysiology of this condition?" : "The antibiotics directly stimulate C. difficile toxin production by blocking cell wall synthesis", "The antibiotics kill normal enteric flora, allowing C. difficile to overgrow and produce enterotoxins causing secretory diarrhea", "C. difficile colonizes the small bowel and causes osmotic diarrhea by disrupting brush border enzymes", "The patient developed an allergic reaction to the antibiotic, causing colonic inflammation", "C. difficile produces urease, which neutralizes colonic pH and causes watery stools" : 2 : "Humans are normally colonized with C. difficile, but healthy enteric flora keep it suppressed. Prolonged antibiotic exposure kills the competing normal flora, allowing C. difficile to overgrow. C. difficile then produces enterotoxins that cause colonic inflammation and a secretory diarrhea — the intestinal epithelial cells are stimulated to secrete water into the lumen. A very high WBC (>18K) is a characteristic lab finding. Treatment is oral vancomycin or fidaxomycin."
"A 70-year-old man with a history of diverticulosis presents with sudden onset of painless bright red blood per rectum, filling the toilet bowl. His vital signs are stable. What is the most likely diagnosis and how does it occur?" : "Diverticulitis; bacterial overgrowth inside a diverticulum causes rupture and hemorrhage", "Colorectal cancer; occult bleeding becomes massive when the tumor erodes into a major vessel", "Diverticular bleed; the penetrating artery at the neck of the diverticulum stretches and ruptures as the sac forms", "Angiodysplasia; new blood vessel formation in the colon is stimulated by chronic constipation", "Internal hemorrhoids; straining at stool causes venous engorgement and rupture" : 3 : "Diverticular bleeding is the most common cause of lower GI bleeding. Diverticula form where penetrating arteries enter the colon wall — areas of natural weakness. As the diverticular sac forms and stretches, it puts traction on this artery, which can rupture and produce copious, painless hematochezia. Key point: diverticular bleeding and diverticulitis are two distinct complications of diverticulosis that do not typically occur simultaneously."
"A 24-year-old woman diagnosed with ulcerative colitis one year ago presents with 3-4 loose stools per week, occasional blood, and mild crampy pain. She has no fevers, weight loss, or hospitalizations. Which of the following is the most appropriate first-line pharmacologic treatment?" : "IV solumedrol for 3 days followed by oral prednisone taper", "Azathioprine (Imuran) as initial therapy to prevent disease progression", "Infliximab (Remicade) as a biologic agent because UC responds best to TNF inhibitors", "Mesalamine (Asacol), a 5-ASA derivative, as initial treatment for mild disease", "Oral vancomycin because UC is triggered by an enteric infection" : 4 : "This patient has mild UC — infrequent symptoms, no systemic signs, and no hospitalizations. The treatment ladder for IBD starts with the least aggressive agents. For mild disease, 5-ASA derivatives like mesalamine are the appropriate first-line treatment. Steroids (prednisone/solumedrol) are used only for acute flares to knock down inflammation quickly. Azathioprine and biologics like infliximab come into play only if 5-ASA agents fail or the patient has repeated flares."
"A 21-year-old man with Crohn's disease presents to the ER with 2 weeks of worsening abdominal pain, bloody mucous stools, 12 lb weight loss, and a fever of 99.8°F. What is the most appropriate initial pharmacologic treatment?" : "Start mesalamine enema as it is the most targeted treatment for Crohn's flares", "Begin azathioprine immediately as it is the most powerful immunomodulator available", "Administer IV solumedrol to rapidly reduce severe inflammation, then taper to oral prednisone", "Prescribe oral infliximab because biologics are always first-line for Crohn's disease", "Start oral ciprofloxacin and metronidazole empirically for infectious colitis" : 3 : "This patient is having a severe Crohn's flare — fever, significant weight loss, bloody stools, and significant pain. For an acute severe flare, the goal is to knock down the inflammation rapidly. Steroids (IV solumedrol, then oral prednisone taper) are the correct choice. Azathioprine takes 2-3 months to begin working and is therefore useless in an acute flare — it is a maintenance drug, not an acute treatment. Mesalamine is more helpful in UC than Crohn's and is only for mild disease."
"A patient with IBD has been on azathioprine (Imuran) for 6 months. At follow-up, routine labs show a WBC of 2.1 (low), elevated AST/ALT, and the patient reports a low-grade fever. What is the correct interpretation of these findings?" : "The patient is having an IBD flare that is causing systemic inflammation and elevated liver enzymes", "These are known side effects of azathioprine — it causes cytopenias, hepatitis, and fever — and CBC/LFTs must be routinely monitored", "The patient has developed C. difficile colitis as a complication of their IBD therapy", "The patient has developed hepatitis C from an unrelated source and needs antiviral therapy", "This pattern is consistent with infliximab therapy and can be managed by doubling the dose" : 2 : "Azathioprine (Imuran) is an immunomodulatory drug used for IBD that cannot be controlled with 5-ASA agents. Its known side effects include cytopenias (low WBC, low platelets), hepatitis (elevated LFTs), and fever. Patients on azathioprine also have an increased risk of infection and a slightly increased risk of lymphoma and non-melanoma skin cancers. This is why routine monitoring of CBC and LFTs is required. The drug is also teratogenic — women must use contraception."
"A 58-year-old woman presents with LLQ pain, low-grade fever, and changes in her bowel habits for the past 4 days. She has a history of chronic constipation and a low-fiber diet. CT of the abdomen shows wall thickening of the sigmoid colon with surrounding fat stranding. What is the most likely diagnosis and appropriate outpatient treatment?" : "Ulcerative colitis flare; start oral mesalamine and increase fiber intake", "Colorectal cancer; urgent surgical referral is needed", "Diverticulitis; treat with oral antibiotics covering gram negatives and anaerobes, clear liquid diet, and follow up in 48 hours", "Small bowel obstruction; admit for watchful waiting and IV hydration", "Infectious colitis from C. difficile; treat with oral vancomycin" : 3 : "This patient has a classic presentation of diverticulitis — LLQ pain, fever, and BM changes in an older patient with risk factors (low-fiber diet, chronic constipation). Diverticula form on the left side of the colon (descending and sigmoid) in areas of wall weakness. When the opening of a diverticulum becomes blocked, bacteria overgrow causing infection. Outpatient treatment is oral antibiotics covering gram negatives and anaerobes (Augmentin, or Cipro + Flagyl) plus a clear liquid diet, with reassessment in 48 hours."
"A patient with end-stage liver disease from hepatitis C is brought in confused by his family. He was found sitting in his own feces and did not know what day it was. His family reports he has been constipated for 4 days. What is the most likely cause of his altered mental status?" : "The patient is in alcohol withdrawal delirium since he has liver disease from drinking", "The patient has developed a subdural hematoma from a fall related to his coagulopathy", "Constipation has caused buildup of ammonia and colonic bacterial toxins in the blood, precipitating hepatic encephalopathy", "The patient has acute bacterial meningitis as a complication of his immunocompromised state", "The patient has developed hyponatremia from diuretic overuse causing cerebral edema" : 3 : "The failing liver cannot detoxify products of protein metabolism and colonic bacterial activity, particularly ammonia. Patients with chronic liver disease exist at a baseline of mild cognitive dysfunction. Any event that increases toxin production or slows excretion — especially constipation — can precipitate hepatic encephalopathy. Constipation causes ammonia and bacterial toxins to accumulate in the colon and be absorbed into the bloodstream, which the damaged liver cannot clear. Treatment involves keeping the GI tract moving briskly."
"A 48-year-old man with alcoholic cirrhosis develops ascites. Which two pathophysiologic mechanisms best explain the development of his ascites?" : "Increased gastric acid secretion and bacterial overgrowth in the gut", "Elevated hydrostatic pressure in the portal vein combined with decreased oncotic pressure from reduced albumin synthesis", "Renal failure causing fluid retention and lymphatic obstruction in the thoracic duct", "Decreased ADH production by the hypothalamus and excess sodium intake from his diet", "Increased prostaglandin synthesis causing vasodilation and systemic fluid accumulation" : 2 : "The liver is the primary site of albumin synthesis. In cirrhosis, the failing liver can no longer produce albumin, causing hypoalbuminemia and loss of oncotic pressure within blood vessels — fluid leaks out into the interstitium. Additionally, fibrosis of the liver causes portal hypertension — high hydrostatic pressure in the portal vein — which forces fluid out of vessels into the peritoneal cavity. These two forces together — low oncotic pressure plus high hydrostatic pressure — drive the formation of ascites."
"A 38-year-old woman presents with RUQ pain, fevers, and jaundice. Labs show elevated alkaline phosphatase and bilirubin but only mildly elevated AST and ALT. Ultrasound is ordered. What pattern of liver injury does this lab result represent and what is the best imaging modality for this suspected diagnosis?" : "Hepatocellular injury pattern; CT scan is the best modality", "Cholestatic injury pattern; ultrasound is the modality of choice for biliary tract disease", "Hepatocellular injury pattern; MRI is the most sensitive test for hepatocyte damage", "Cholestatic injury pattern; EGD is needed to evaluate for varices", "Normal liver labs; the patient likely has a musculoskeletal cause of RUQ pain" : 2 : "Liver injury occurs in two patterns: hepatocellular injury shows predominantly elevated ALT and AST, while cholestatic injury shows predominantly elevated alkaline phosphatase (ALKP) and bilirubin. The slide notes that cholestatic pattern suggests biliary tract disease. Ultrasound is the imaging modality of choice for biliary tract disease — it can detect gallstones, biliary dilation, and cholecystitis. CT is used for high-acuity abdominal presentations but ultrasound is better suited for the biliary system."
"A 52-year-old man with a 20-year history of heavy daily alcohol use presents with fatigue and mild confusion. Labs show AST 310, ALT 140 (AST:ALT ratio of approximately 2:1), and mildly prolonged PT/INR. What is the most likely diagnosis?" : "Metabolic-associated steatohepatitis (MASH) because ALT is greater than AST", "Acute hepatitis A because the transaminases are in the hundreds and the patient has confusion", "Alcoholic liver disease because AST is approximately 2x the ALT in a hepatocellular pattern", "Chronic hepatitis C because transaminase elevations in the low hundreds are characteristic", "Cholestatic liver disease because the PT/INR is elevated indicating biliary obstruction" : 3 : "Each etiology of liver disease has a characteristic lab pattern. Alcoholic liver disease classically causes transaminase elevations in the hundreds in a hepatocellular pattern, with a distinctive AST:ALT ratio of approximately 2:1 — AST is about twice the ALT. In contrast, MASH (fatty liver from metabolic dysfunction) causes ALT > AST. Chronic viral hepatitis causes elevations in the low hundreds in a hepatocellular pattern but without the 2:1 AST:ALT ratio. The prolonged PT/INR reflects declining liver synthetic function."
"A 65-year-old woman presents with coffee-ground emesis and melena. She takes ibuprofen daily for her arthritis. EGD shows an ulcer in the lesser curvature of the stomach. A biopsy is taken. Why is it essential that ALL gastric ulcers be biopsied?" : "To determine the depth of the ulcer and whether perforation has occurred", "Because all gastric ulcers must be biopsied to rule out hidden malignancy", "To confirm H. pylori infection so that antibiotics can be prescribed", "To rule out Crohn's disease affecting the gastric mucosa", "To test for NSAID metabolites that may have accumulated in the mucosal layer" : 2 : "Gastric ulcers are most commonly found in the lesser curvature of the stomach and occur predominantly in adults over 50. Unlike duodenal ulcers where cancer is very rare, gastric ulcers carry a risk of underlying gastric malignancy. Therefore, the slide explicitly states that ALL gastric ulcers must be biopsied for hidden cancer. This is a key differentiator from duodenal ulcers. The pain of gastric ulcers also typically worsens with eating (unlike duodenal ulcers which are relieved by eating)."
"A 45-year-old man presents with acute pancreatitis. He is hypotensive (BP 84/58), tachycardic, and his oxygen saturation is dropping. He has no history of alcohol use and recently had a gallstone seen on ultrasound. What pathophysiologic process best explains his hemodynamic instability?" : "The gallstone has migrated to the coronary arteries causing a myocardial infarction", "Massive cytokine release from severe pancreatitis has caused vascular endothelium to become leaky, shifting fluid to the third space", "The patient has developed alcoholic cardiomyopathy causing low cardiac output", "The gallstone is obstructing the portal vein causing portal hypertension and ascites", "Pancreatic enzyme insufficiency is causing malabsorption and severe hypoalbuminemia" : 2 : "The two most common causes of acute pancreatitis are alcohol (more common in men) and gallstones (more common in women). The pancreas normally secretes zymogens (pre-enzymes) that are only activated at the brush border. In pancreatitis, these enzymes are prematurely activated and begin digesting pancreatic tissue. In severe cases, massive cytokine release causes the vascular endothelium to become leaky, shifting large amounts of fluid into the third space — causing hypotension, pulmonary edema (wet lungs), and electrolyte abnormalities."
"A 72-year-old woman with diverticulosis presents with painless maroon-colored stools and a hemoglobin that has dropped from 11.2 to 7.8 over 6 hours. The patient denies abdominal pain or fever. Which of the following best differentiates this presentation from diverticulitis?" : "Diverticulitis causes hematochezia while diverticular bleeding causes melena", "Diverticulitis presents with LLQ pain and fever while diverticular bleeding is painless hematochezia; they do not generally occur simultaneously", "Diverticular bleeding occurs in the right colon while diverticulitis always occurs in the sigmoid", "Diverticulitis is caused by arterial rupture while diverticular bleeding is caused by bacterial infection", "Both conditions require the same treatment: IV antibiotics and colonoscopy" : 2 : "This is a classic board distinction. Diverticulosis (having diverticula) predisposes to two separate complications: diverticulitis, which presents with LLQ pain, fever, and bowel changes; and diverticular bleeding, which presents with painless, often brisk hematochezia. The slides explicitly state that 'diverticular bleeding and diverticulitis do NOT generally happen simultaneously.' Diverticula form where penetrating arteries enter the colon wall, and as the sac stretches this artery, it can rupture and produce painless bleeding."
"A 17-year-old girl presents with crampy abdominal pain, diarrhea with mucous and occasional blood, and a 10 lb weight loss over the past 6 months. Colonoscopy shows skip lesions with cobblestone-appearing, thickened bowel in the terminal ileum with areas of normal tissue in between. Which of the following is most likely to be a complication of this specific disease over time?" : "Colorectal cancer at 6 times the average risk because the disease involves the colon", "Fistula formation because the inflammation is transmural, affecting all layers of the bowel", "Pancolitis because the disease inevitably spreads contiguously from the rectum proximally", "Barrett's esophagus because Crohn's frequently involves the upper GI tract in teenagers", "Toxic megacolon exclusively because only the mucosal layer of the colon is affected" : 2 : "This presentation — skip lesions, cobblestone appearance, terminal ileum involvement, with normal tissue in between diseased tissue — is Crohn's disease. The critical pathophysiologic distinction is that Crohn's inflammation is transmural (affects all layers of the bowel), unlike UC which only affects the innermost mucosal layer. Transmural inflammation leads to fistula formation, abscess, adhesions, and bowel wall thickening. UC, not Crohn's, carries the higher risk of colorectal cancer (6x the average person) and does not form fistulas because the inflammation is superficial."
"A patient presents with LLQ pain, nausea, vomiting, and abdominal distension. He has not passed gas or had a bowel movement in 3 days. Plain film radiograph shows massively dilated loops of bowel. He has a history of 3 prior abdominal surgeries. Which of the following is the most likely cause of this presentation?" : "A volvulus causing a large bowel obstruction", "Adhesions from prior surgery causing a small bowel obstruction", "Diverticulitis with abscess formation causing bowel wall thickening", "Intussusception, which is common in adults who have had prior abdominal surgeries", "A paralytic ileus from narcotic use after his most recent surgery" : 2 : "The most common cause of small bowel obstruction (SBO) is adhesions from a prior surgery or a prior inflammatory process. This patient's history of three abdominal surgeries is the key clue. When there is a blockage of forward progress in the small bowel, air and liquid back up, causing distension, nausea, vomiting, and obstipation (failure to pass gas or stool). A complete SBO requires surgical treatment, while a partial SBO is managed with watchful waiting, hydration, and correction of electrolyte abnormalities."
"A 29-year-old woman presents to the GI clinic. She has had ulcerative colitis for several years, and despite mesalamine therapy, she continues to have frequent flares. She is not currently in a flare. She is 8 weeks pregnant and wants to know if azathioprine is safe. What is the correct answer?" : "Azathioprine is safe in pregnancy because it is a 5-ASA derivative with few systemic effects", "Azathioprine is teratogenic and women must be on effective contraception while taking it; its use in pregnancy is a concern", "Azathioprine is safe in the first trimester only; it must be discontinued after 12 weeks gestation", "Azathioprine has not been studied in pregnancy, but it is generally presumed to be safe because IBD is common in women of childbearing age", "Azathioprine poses no teratogenic risk, but it must be avoided in pregnancy because it causes severe nausea" : 2 : "Azathioprine (Imuran) is an immunomodulatory drug used for IBD not controlled by 5-ASA agents. The slides specifically state that it is teratogenic — women must be on effective contraception while taking this medication. The fact that this patient is now pregnant raises a significant concern, and this must be discussed with the patient and the obstetrics team. Azathioprine also takes 2-3 months to work, so it cannot be used for acute flares regardless."
"A 34-year-old man undergoes a Roux-en-Y gastric bypass for morbid obesity. Six months later he presents with fatigue, pallor, and tingling in his feet. Labs show a macrocytic anemia. Why is this patient at risk for vitamin deficiencies after this surgery?" : "The procedure removes the fundus of the stomach which secretes most digestive enzymes", "The duodenum is bypassed, reducing absorption of key nutrients like B-12, iron, and fat-soluble vitamins which are absorbed there", "The procedure causes chronic dumping syndrome which leads to malabsorption of all nutrients", "Ghrelin reduction after the surgery causes decreased appetite resulting in nutritional deficiency", "The small neo-stomach cannot produce enough intrinsic factor to absorb B-12" : 2 : "The Roux-en-Y gastric bypass creates a small neo-stomach connected directly to the jejunum. The duodenum remains in place but no longer receives food — it only carries bile and pancreatic enzymes (the pancreatobiliary arm). Since the duodenum is bypassed, nutrients that are normally absorbed there — including iron, calcium, and fat-soluble vitamins — are no longer absorbed properly. B-12 absorption at the terminal ileum is also impaired because intrinsic factor (produced by parietal cells) may not adequately mix with food. Patients must remain on supplemental vitamins lifelong."
"A 60-year-old man with known alcoholic cirrhosis develops rapid-onset confusion after going on a 48-hour alcohol binge. His family notes he was doing well before this. Which of the following best explains why an acute alcohol binge specifically triggers hepatic encephalopathy in a cirrhotic patient?" : "Alcohol directly destroys surviving hepatocytes, causing acute-on-chronic liver failure within 48 hours", "The alcohol binge causes an acute GI bleed, increasing digested protein load which the liver cannot process, and directly reduces liver blood flow through dehydration and vasodilation", "Alcohol stimulates aldosterone release causing sodium retention and encephalopathy from hypernatremia", "The sudden increase in portal pressure from alcohol causes varices to rupture, dropping cerebral perfusion pressure", "Alcohol inhibits ammonia excretion in the kidneys, causing ammonia to accumulate in the bloodstream" : 2 : "Hepatic encephalopathy in a cirrhotic patient occurs when the liver cannot detoxify ammonia and toxins from protein metabolism and colonic bacteria. Several precipitants can trigger it, and an alcohol binge contributes in multiple ways: it can cause GI bleeding (which increases digested protein load and ammonia production), it reduces liver blood flow through dehydration, and alcohol itself is directly hepatotoxic. The slides list these as known precipitants: alcohol binge, GI bleed, medications that slow peristalsis, and reduced liver blood flow from shock or dehydration."
"A patient with chronic liver disease has a serum albumin of 1.8 g/dL (normal 3.5-5.0) and significant bilateral lower extremity edema. His abdomen is protuberant with shifting dullness. Which of the following best explains why low albumin contributes to both edema and ascites?" : "Low albumin increases hepatic portal pressure by reducing blood viscosity and increasing portal flow", "Albumin normally maintains vascular oncotic pressure; when albumin is low, oncotic pressure falls and fluid leaks from vessels into the interstitium and peritoneal cavity", "Low albumin causes the kidneys to retain sodium and water, increasing hydrostatic pressure throughout the body", "Albumin is responsible for transporting bile salts; low albumin leads to bile acid accumulation causing osmotic fluid shifts", "Low albumin reduces the production of antidiuretic hormone (ADH), causing renal free water excretion and fluid redistribution" : 2 : "The liver is the primary site of albumin synthesis. Albumin is the main protein in the blood, and it creates oncotic pressure — the chemical 'pull' that keeps fluid inside blood vessels. When the cirrhotic liver can no longer synthesize albumin, oncotic pressure falls. Without sufficient oncotic pressure to retain fluid, water leaks from the vascular space into the interstitium (causing edema) and into the peritoneal cavity (contributing to ascites). This is compounded by portal hypertension, which adds elevated hydrostatic pressure to drive fluid outward."
"A 50-year-old woman with a hiatal hernia and obesity presents with daily heartburn and regurgitation. Non-pharmacologic interventions have not helped. Her symptoms occur every day and are predictable after meals. She currently uses calcium carbonate (Tums) as needed. What is the most appropriate next step in pharmacologic management?" : "Continue Tums as needed since antacids are the most powerful acid-reducing medications available", "Add an H2 blocker like famotidine (Pepcid) to reduce histamine-mediated acid amplification on a consistent basis", "Prescribe a proton pump inhibitor as it is the strongest acid treatment available and is appropriate for daily predictable symptoms", "Refer immediately for surgical repair of her hiatal hernia as medication is not appropriate for structural GERD", "Start oral azathioprine to reduce the esophageal immune response driving her symptoms" : 3 : "The treatment ladder for GERD escalates in potency. Antacids (Tums) work by neutralizing acid on a PRN basis — they are only appropriate for occasional symptoms. The slides state that if symptoms occur nearly every day or predictably, stronger medication should be used. H2 blockers (famotidine/Pepcid) block histamine-mediated acid amplification. Proton pump inhibitors (e.g., lansoprazole/Prevacid) block the H+/K+ ATPase pump entirely and are the strongest acid-reducing medications available, making them appropriate for this patient with daily, predictable GERD."
"A 66-year-old man presents with painless bright red rectal bleeding. He reports no abdominal pain or recent straining. He denies weight loss, fevers, or change in stool caliber. Colonoscopy shows diffuse vascular abnormalities in the cecum. What is the most likely diagnosis?" : "Hemorrhoids; BRBPR in a patient over 60 is almost always hemorrhoidal in origin", "Colorectal cancer; all rectal bleeding in patients over 65 must be assumed malignant until proven otherwise", "Angiodysplasia; degeneration of previously normal colonic blood vessels causing hematochezia, the second most common cause of lower GI bleeding", "Internal hemorrhoids that have progressed to external hemorrhoids, explaining the cecal involvement", "Ischemic colitis; the cecum is particularly prone to ischemia because it is a watershed area" : 3 : "Angiodysplasia is degeneration of previously normal blood vessels in the colon, and it is the second most common cause of lower GI bleeding. It most commonly affects the cecum and right colon. It can present with either melena (upper GI pattern) or hematochezia depending on the rate of bleeding. Hemorrhoids typically cause BRBPR in small amounts on toilet tissue after a hard stool — not painless filling of the toilet bowl. Colorectal cancer typically causes occult bleeding, not brisk hematochezia. The colonoscopic finding of vascular ectasias in the cecum is characteristic of angiodysplasia."

"A 45-year-old woman is found to have chronic hepatitis C on routine screening. She has no symptoms and her AST is 88, ALT is 92. She reports a remote history of IV drug use in her 20s. She had no idea she was infected. Why is chronic HCV often asymptomatic and clinically silent for years?" : "HCV directly suppresses immune function, preventing the inflammatory response that would cause symptoms", "Chronic HCV typically causes only low-level transaminase elevations in the low hundreds in a hepatocellular pattern, and many patients are unaware they are infected until liver disease is advanced", "HCV lives exclusively in bile ducts and does not cause hepatocyte inflammation unless it enters the bloodstream", "Chronic HCV only causes symptoms in patients who drink alcohol, explaining why this woman had no symptoms", "HCV causes a cholestatic injury pattern with minimal AST/ALT elevation, which is why it goes undetected" : 2 : "Chronic hepatitis C is described in the slides as 'hard to get but hard to give away' — 85% of immunocompetent persons develop chronic infection. Chronic HCV causes only low-level transaminase elevations (low hundreds) in a hepatocellular pattern — much less dramatic than acute hepatitis (which can cause AST/ALT in the thousands). Patients often have no symptoms for years. This is why testing should be considered in persons with IVDA history, remote blood transfusions, or military service (baby boomers). Chronic HCV is now almost always curable."
"A 32-year-old woman complains of bloating and watery diarrhea every time she eats ice cream or drinks milk. She has no symptoms with other foods. What is the pathophysiologic mechanism of her symptoms?" : "Her immune system has produced IgE antibodies against milk proteins, triggering mast cell degranulation and secretory diarrhea", "She has lactase deficiency; unabsorbed lactose increases intraluminal osmolarity in the small bowel, drawing water in and causing osmotic diarrhea", "She has a congenital absence of the brush border, preventing absorption of all dairy-based nutrients", "She has developed Crohn's disease affecting the terminal ileum, impairing fat absorption from dairy", "She has secretory diarrhea caused by enterotoxins in dairy products that are not killed by pasteurization" : 2 : "This is a textbook example of osmotic diarrhea. Lactose is broken down by the enzyme lactase at the brush border of the small intestine. If a person has lactase deficiency, lactose cannot be absorbed. The unabsorbed lactose is an osmotically active substance that draws water into the intestinal lumen along the concentration gradient. This osmotic water shift causes the bloating and watery diarrhea. The slides use this exact example to illustrate osmotic diarrhea. This is distinct from secretory diarrhea, where hormones or enterotoxins actively stimulate water secretion from intestinal epithelial cells."

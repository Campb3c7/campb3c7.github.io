id risks outweigh benefits."}, {"q": "Severe COVID in lecture includes:", "choices": ["O2 saturation ≤94% or need for oxygen/ventilation", "No symptoms", "Only sore throat", "Normal O2 and no risk factors"], "correct": 0, "exp": "Severe disease includes hypoxia or oxygen/vent need."}], "apply": [{"q": "A 66-year-old with mild COVID symptoms, normal oxygen saturation, and no dyspnea asks for dexamethasone. Best answer?", "choices": ["Give steroids because all COVID gets steroids", "Avoid steroids; consider outpatient antiviral if high-risk and eligible", "Give oseltamivir", "Give acyclovir"], "correct": 1, "exp": "Outpatients do not receive steroids; high-risk outpatients may receive Paxlovid/remdesivir."}, {"q": "A hospitalized COVID patient now requires supplemental oxygen. Which therapy becomes appropriate?", "choices": ["Steroids", "Nystatin", "Nitrofurantoin", "Valacyclovir"], "correct": 0, "exp": "Steroids are reserved for hospitalized patients requiring oxygen or ventilation support."}]}, {"id": "lo15-covid-outpatient", "name": "LO 15 — Outpatient COVID Treatment Options", "hy": true, "cards": [{"title": "Who is treated outpatient", "html": "<p>Outpatient treatment is indicated for mild to moderate COVID patients at risk for progression to severe disease, including adults ≥65, immunocompromised patients, and those with multiple comorbidities. Treatment is unlikely to benefit asymptomatic or low-risk patients.</p>", "hy": true}, {"title": "Preferred and alternative options", "html": "<p><strong>Nirmatrelvir-ritonavir (Paxlovid)</strong> is preferred and should be started ASAP and within 5 days of symptoms. Drug interactions are common. <strong>Remdesivir</strong> IV daily for 3 days is an alternative if Paxlovid cannot be used or is unavailable, and should be started within 7 days.</p>", "hy": true}], "test": [{"q": "Outpatient COVID treatment is most indicated for:", "choices": ["Low-risk asymptomatic patients", "Mild/moderate patients at risk for progression", "Everyone with exposure only", "Only patients on ventilators"], "correct": 1, "exp": "Outpatient treatment is for mild/moderate disease at risk for progression."}, {"q": "Paxlovid should be initiated:", "choices": ["Within 5 days of symptoms", "After 30 days", "Only after oxygen requirement", "Only IV daily x3"], "correct": 0, "exp": "The lecture says initiate ASAP and within 5 days."}, {"q": "A major barrier to Paxlovid is:", "choices": ["Drug interactions are common", "It only treats HSV", "It is inhaled only", "It causes nail fungus"], "correct": 0, "exp": "Ritonavir component creates many interactions."}, {"q": "Alternative outpatient COVID option if Paxlovid unavailable:", "choices": ["Remdesivir IV daily x3 days", "Oseltamivir x5 days", "Nystatin", "Penicillin G"], "correct": 0, "exp": "Remdesivir IV x3 days is an alternative within 7 days of symptom onset."}], "apply": [{"q": "A 72-year-old with diabetes has day 2 mild COVID, normal oxygen saturation, and multiple meds. Best plan?", "choices": ["Evaluate for Paxlovid eligibility and interactions", "Give steroids immediately", "No treatment ever because outpatient", "Give acyclovir"], "correct": 0, "exp": "High-risk outpatient within 5 days should be considered for Paxlovid, with interactions checked."}, {"q": "A low-risk asymptomatic person tests positive for COVID. According to lecture, outpatient antiviral treatment is:", "choices": ["Unlikely to benefit", "Always mandatory", "Steroids first-line", "Remdesivir for 10 days"], "correct": 0, "exp": "Treatment is unlikely to benefit asymptomatic or low-risk patients."}]}, {"id": "lo16-influenza-antivirals", "name": "LO 16 — Who Should Receive Influenza Antivirals", "hy": true, "cards": [{"title": "Who gets treated", "html": "<p>Start influenza treatment ASAP if the patient requires hospitalization, has severe/complicated/progressive illness, or is high-risk for complications: immunosuppressed, multiple/significant comorbidities, age ≥65, age ≤2, or pregnancy.</p>", "hy": true}, {"title": "Agents and timing", "html": "<p><strong>Oseltamivir</strong> is PO and agent of choice for hospitalized, pregnant, and immunosuppressed patients. Zanamivir is inhaled. Baloxavir is newer, costly, and single-dose. Treatment works best within 48 hours of symptom onset.</p>", "hy": true}, {"title": "Duration", "html": "<p>Oseltamivir and zanamivir treatment duration is 5 days. Prophylaxis is 7–10 days. Baloxavir is single-dose and weight-based.</p>", "hy": false}], "test": [{"q": "Influenza antivirals should be given to patients who:", "choices": ["Require hospitalization", "Have no symptoms and low risk", "Are only exposed but not high risk", "Have fungal infection"], "correct": 0, "exp": "Hospitalized influenza patients should be treated."}, {"q": "High-risk influenza groups include:", "choices": ["Age ≥65 or ≤2", "Only age 20–30", "No comorbidities only", "Low-risk athletes only"], "correct": 0, "exp": "Age ≥65 or ≤2 are high risk."}, {"q": "Oseltamivir and zanamivir treatment duration is:", "choices": ["1 day", "3 days", "5 days", "30 days"], "correct": 2, "exp": "Treatment duration is 5 days."}, {"q": "Healthy outpatients get what benefit from influenza antivirals?", "choices": ["Illness shortened by about 1 day", "Guaranteed cure in 2 hours", "No benefit ever", "Prevention of all complications"], "correct": 0, "exp": "Benefit is minimal in healthy outpatients, about 1 day shorter."}], "apply": [{"q": "A pregnant patient is diagnosed with influenza within 24 hours of symptoms. Which drug is agent of choice?", "choices": ["Oseltamivir", "Acyclovir", "Nirmatrelvir-ritonavir", "Fluconazole"], "correct": 0, "exp": "Oseltamivir is agent of choice for pregnant influenza patients."}, {"q": "A healthy 25-year-old outpatient with influenza asks if oseltamivir is mandatory. Best interpretation from lecture?", "choices": ["Benefit is minimal, may shorten illness by about one day", "It is mandatory in all healthy outpatients", "Steroids are preferred", "Ganciclovir is first-line"], "correct": 0, "exp": "Healthy outpatients have minimal benefit; may reduce illness by ~1 day."}]}, {"id": "lo17-cmv", "name": "LO 17 — CMV Risk & Treatment", "hy": true, "cards": [{"title": "Who is at risk", "html": "<p>CMV causes no symptoms in patients with normal immunity, but immunocompromised patients can have multiorgan involvement. High-risk groups include HIV, transplant, and oncology patients.</p>", "hy": true}, {"title": "CMV antivirals", "html": "<p><strong>Ganciclovir</strong> is IV only. <strong>Valganciclovir</strong> is PO only and is converted to ganciclovir. They are used for prophylaxis, treatment, and suppression of CMV infections in immunocompromised patients.</p>", "hy": true}, {"title": "Not first-line for HSV", "html": "<p>Ganciclovir/valganciclovir are not first-line for HSV or zoster due to higher toxicity risk, especially bone marrow suppression.</p>", "hy": false}], "test": [{"q": "CMV is most concerning in:", "choices": ["Immunocompromised patients", "Only healthy athletes", "Only patients with tinea", "Only patients with uncomplicated cystitis"], "correct": 0, "exp": "CMV disease is a major issue in immunocompromised patients."}, {"q": "Which drugs treat CMV?", "choices": ["Ganciclovir/valganciclovir", "Oseltamivir/zanamivir", "Acyclovir/valacyclovir only", "Terbinafine/nystatin"], "correct": 0, "exp": "Ganciclovir and valganciclovir treat CMV."}, {"q": "Valganciclovir is:", "choices": ["PO prodrug converted to ganciclovir", "IV only", "Inhaled influenza drug", "Topical antifungal"], "correct": 0, "exp": "Valganciclovir is PO and converted to ganciclovir."}, {"q": "Ganciclovir/valganciclovir are not first-line for HSV because:", "choices": ["Higher toxicity/bone marrow suppression risk", "They have no oral version", "They are topical only", "They do not treat CMV"], "correct": 0, "exp": "The lecture notes higher toxicity, including bone marrow suppression."}], "apply": [{"q": "A transplant patient develops CMV infection. Which treatment matches lecture?", "choices": ["Ganciclovir or valganciclovir", "Oseltamivir", "Acyclovir as first-line CMV therapy", "Nystatin"], "correct": 0, "exp": "CMV in immunocompromised patients is treated with ganciclovir/valganciclovir."}, {"q": "An immunocompetent person has prior CMV exposure but no symptoms. What does lecture suggest?", "choices": ["CMV often causes no symptoms in normal immunity", "Treat all with ganciclovir", "Give steroids", "Use terbinafine"], "correct": 0, "exp": "CMV typically has no symptoms in patients with normal immunity."}]}, {"id": "lo18-topical-antifungals", "name": "LO 18 — Why Topical Antifungals Are Preferred Locally", "hy": true, "cards": [{"title": "Local infections", "html": "<p>Local fungal infections include candidiasis (oropharyngeal, esophageal, cutaneous, vulvovaginal) and dermatophytes/tinea (corporis, cruris, pedis, capitis).</p>", "hy": true}, {"title": "Why topical first", "html": "<p>Topical antifungals are primary treatment for local infections because systemic exposure is low, so there is little concern for adverse events or drug interactions.</p>", "hy": true}, {"title": "Topical coverage distinctions", "html": "<p>Nystatin is only useful for Candida infections and is ineffective against tinea. Azole creams/ointments treat candidiasis and tinea. Topical terbinafine treats cutaneous tinea but will not eradicate nail infections.</p>", "hy": false}], "test": [{"q": "Topical antifungals are preferred for local infections because:", "choices": ["Low systemic exposure means fewer adverse events/interactions", "They treat fungemia", "They cover CMV", "They are always broader than systemic agents"], "correct": 0, "exp": "Topicals have low systemic exposure."}, {"q": "Nystatin is ineffective against:", "choices": ["Tinea", "Candida", "Oropharyngeal candidiasis", "Cutaneous candidiasis"], "correct": 0, "exp": "Nystatin treats Candida only, not tinea."}, {"q": "Azole creams and ointments can treat:", "choices": ["Candidiasis and tinea", "Only CMV", "Only influenza", "Only MRSA"], "correct": 0, "exp": "Lecture lists azole creams for candidiasis and tinea."}, {"q": "Topical terbinafine will not eradicate:", "choices": ["Nail infections", "Cutaneous tinea", "Athlete’s foot skin infection", "Dermatophyte skin infection"], "correct": 0, "exp": "Topical terbinafine does not eradicate nail infections."}], "apply": [{"q": "A patient has tinea pedis. Which topical should NOT be chosen because it only treats Candida?", "choices": ["Nystatin", "Clotrimazole", "Miconazole", "Topical terbinafine"], "correct": 0, "exp": "Nystatin is ineffective for tinea."}, {"q": "A healthy patient has localized cutaneous candidiasis. Why start topical therapy?", "choices": ["Low systemic exposure and few interactions/ADEs", "It treats invasive candidemia better", "It prevents CMV", "It covers Pseudomonas"], "correct": 0, "exp": "For local infections, topical agents are primary due to low systemic exposure."}]}, {"id": "lo19-azoles", "name": "LO 19 — Azole Antifungal Spectrum", "hy": true, "cards": [{"title": "Azole spectrum ladder", "html": "<table class=\"learn-table\"><tr><th>Azole</th><th>Key spectrum/DOC</th></tr><tr><td>Fluconazole</td><td>Most narrow/benign; susceptible Candida; DOC for severe Candida with proven susceptibility; reaches CNS and urine</td></tr><tr><td>Itraconazole</td><td>Broader than fluconazole; more potent against endemic fungi; DOC histoplasmosis</td></tr><tr><td>Voriconazole</td><td>Broader; Aspergillus and resistant Candida; DOC aspergillosis; no Mucorales</td></tr><tr><td>Posaconazole / Isavuconazole</td><td>Broadest azoles; yeasts, molds, Mucorales; costly and reserved</td></tr></table>", "hy": true}, {"title": "Systemic azole cautions", "html": "<p>Systemic azoles have many drug interactions and hepatotoxicity risk. Monitor LFTs weekly. Fluconazole is the most commonly used, most narrow, and lower risk compared with other azoles.</p>", "hy": false}], "test": [{"q": "The most narrow systemic azole is:", "choices": ["Fluconazole", "Voriconazole", "Posaconazole", "Isavuconazole"], "correct": 0, "exp": "Fluconazole is most narrow/benign."}, {"q": "Drug of choice for histoplasmosis is:", "choices": ["Itraconazole", "Fluconazole", "Nystatin", "Terbinafine"], "correct": 0, "exp": "Itraconazole is DOC for uncomplicated endemic fungi like histoplasmosis."}, {"q": "Drug of choice for aspergillosis is:", "choices": ["Voriconazole", "Fluconazole", "Acyclovir", "Oseltamivir"], "correct": 0, "exp": "Voriconazole is DOC for aspergillosis."}, {"q": "Broadest azoles that cover Mucorales include:", "choices": ["Posaconazole and isavuconazole", "Fluconazole only", "Itraconazole only", "Nystatin"], "correct": 0, "exp": "Posaconazole/isavuconazole cover Mucorales."}], "apply": [{"q": "A patient with proven Candida albicans candidemia is stable and susceptible. Which azole can be drug of choice?", "choices": ["Fluconazole", "Terbinafine", "Nystatin topical", "Oseltamivir"], "correct": 0, "exp": "Fluconazole is DOC for severe Candida infections with proven susceptibility."}, {"q": "A patient has invasive aspergillosis. Which azole is DOC but lacks Mucorales activity?", "choices": ["Voriconazole", "Fluconazole", "Itraconazole", "Nystatin"], "correct": 0, "exp": "Voriconazole is DOC for Aspergillus but lacks Mucorales activity."}]}, {"id": "lo20-terbinafine", "name": "LO 20 — Oral Terbinafine Unique Indication & Duration", "hy": true, "cards": [{"title": "The unique oral indication", "html": "<p>Terbinafine has PO and topical formulations. The <strong>only PO use</strong> from lecture is <strong>onychomycosis</strong> (nail fungus).</p>", "hy": true}, {"title": "Duration", "html": "<p>Therapy must continue until the infected nail grows out completely: fingernails require <strong>6+ weeks</strong>, toenails require <strong>12+ weeks</strong>.</p>", "hy": true}, {"title": "Topical distinction", "html": "<p>Topical terbinafine is available over the counter for cutaneous tinea infections but will not eradicate nail infections.</p>", "hy": false}], "test": [{"q": "The only PO use for terbinafine from lecture is:", "choices": ["Onychomycosis", "Candidemia", "CMV", "HSV encephalitis"], "correct": 0, "exp": "Oral terbinafine is only for onychomycosis."}, {"q": "Toenail onychomycosis requires terbinafine for about:", "choices": ["3 days", "1 week", "12+ weeks", "1 year minimum"], "correct": 2, "exp": "Toenails require 12+ weeks."}, {"q": "Fingernail onychomycosis requires terbinafine for about:", "choices": ["6+ weeks", "24 hours", "5 days", "12 months"], "correct": 0, "exp": "Fingernails require 6+ weeks."}, {"q": "Topical terbinafine will not:", "choices": ["Eradicate nail infections", "Treat cutaneous tinea", "Be available OTC", "Treat dermatophyte skin infection"], "correct": 0, "exp": "Topical terbinafine will not eradicate nail infection."}], "apply": [{"q": "A patient has confirmed toenail onychomycosis. Which regimen concept matches lecture?", "choices": ["Oral terbinafine for 12+ weeks", "Topical nystatin for 5 days", "IV echinocandin", "Paxlovid"], "correct": 0, "exp": "PO terbinafine is used for onychomycosis; toenails need 12+ weeks."}, {"q": "A patient uses OTC topical terbinafine on a fungal toenail and fails. Why?", "choices": ["Topical cream will not eradicate nail infections", "Terbinafine never treats fungi", "It only treats Candida", "It treats CMV"], "correct": 0, "exp": "Topical terbinafine works for cutaneous tinea, not nail infections."}]}, {"id": "lo21-echinocandins-vs-azoles", "name": "LO 21 — Echinocandins vs Azoles", "hy": true, "cards": [{"title": "Echinocandin basics", "html": "<p>Echinocandins include caspofungin, micafungin, and anidulafungin. They are <strong>IV only</strong>. All agents share the same spectrum.</p>", "hy": true}, {"title": "How they differ from azoles", "html": "<p>Echinocandins have broader spectrum than fluconazole, cover Candida and Aspergillus including resistant Candida (C. glabrata and C. krusei), and have a better safety profile than azoles with fewer serious drug interactions and lower rates of toxicities.</p>", "hy": true}, {"title": "Important gap", "html": "<p>Echinocandins do not cover Mucorales. Posaconazole and isavuconazole are the azoles that cover Mucorales.</p>", "hy": false}], "test": [{"q": "Echinocandins are administered:", "choices": ["IV only", "PO only", "Topical only", "Inhaled only"], "correct": 0, "exp": "Echinocandins are IV only."}, {"q": "Echinocandins cover:", "choices": ["Candida and Aspergillus", "HSV and CMV", "Influenza and COVID", "Only tinea"], "correct": 0, "exp": "They cover Candida and Aspergillus."}, {"q": "Echinocandins include coverage of resistant Candida such as:", "choices": ["C. glabrata and C. krusei", "HSV-1 and HSV-2", "Pseudomonas", "MRSA"], "correct": 0, "exp": "The lecture lists resistant Candida coverage."}, {"q": "Compared with azoles, echinocandins generally have:", "choices": ["Better safety profile and fewer serious interactions", "More hepatotoxicity and interactions", "Oral-only dosing", "Mucorales coverage"], "correct": 0, "exp": "The lecture says echinocandins have better safety/fewer serious interactions."}], "apply": [{"q": "A critically ill patient has candidemia and is on many interacting medications. Why might an echinocandin be preferred?", "choices": ["Broad Candida coverage and fewer serious interactions/toxicities than azoles", "It is oral and cheap", "It covers Mucorales best", "It treats CMV"], "correct": 0, "exp": "Echinocandins have broad Candida coverage and better safety profile."}, {"q": "A patient has suspected mucormycosis. Why is an echinocandin inadequate?", "choices": ["Echinocandins do not cover Mucorales", "Echinocandins are too narrow for Candida", "Echinocandins only treat bacteria", "They cannot be given IV"], "correct": 0, "exp": "The lecture does not list Mucorales coverage for echinocandins."}]}, {"id": "lo22-fungemia-invasive-candida", "name": "LO 22 — Empiric Fungemia / Invasive Candidiasis", "hy": true, "cards": [{"title": "Treat sterile-site fungi as true pathogens", "html": "<p>Fungi from blood cultures or other sterile fluids should be treated as true pathogens and require systemic antifungal therapy. Sterile sites include CSF, joint fluid, blood, and peritoneal fluid.</p>", "hy": true}, {"title": "Drug of choice", "html": "<p>Echinocandins are routine use and drug of choice for invasive candidiasis, especially in critically ill and neutropenic patients. They are broader than fluconazole and cover resistant Candida.</p>", "hy": true}, {"title": "Fluconazole role", "html": "<p>Fluconazole can be drug of choice for severe Candida infections with proven susceptibility, such as Candida albicans candidemia, and it achieves urinary and CNS concentrations.</p>", "hy": false}], "test": [{"q": "Fungi growing from blood culture should be treated as:", "choices": ["True pathogen requiring systemic therapy", "Contaminant always", "Viral illness", "Local tinea only"], "correct": 0, "exp": "Fungi from sterile sites require systemic antifungal therapy."}, {"q": "Empiric drug of choice for invasive candidiasis in critically ill/neutropenic patients:", "choices": ["Echinocandin", "Topical nystatin", "Oral terbinafine", "Oseltamivir"], "correct": 0, "exp": "Echinocandins are DOC for invasive candidiasis."}, {"q": "Echinocandins are preferred over fluconazole empirically because:", "choices": ["Broader Candida coverage including resistant strains", "They are topical", "They treat bacteria", "They cover CMV"], "correct": 0, "exp": "They cover resistant Candida and are broader than fluconazole."}, {"q": "Fluconazole can be DOC when Candida is:", "choices": ["Proven susceptible", "Mucorales", "Aspergillus only", "Unknown resistant species in shock"], "correct": 0, "exp": "Fluconazole is DOC for severe Candida infections with proven susceptibility."}], "apply": [{"q": "A neutropenic ICU patient has yeast growing in blood cultures. Which empiric therapy best matches lecture?", "choices": ["Echinocandin such as caspofungin/micafungin", "Nystatin swish", "Terbinafine", "Valacyclovir"], "correct": 0, "exp": "Echinocandins are DOC for invasive candidiasis, especially critically ill/neutropenic patients."}, {"q": "A stable patient has Candida albicans candidemia with proven fluconazole susceptibility. Which step may be appropriate?", "choices": ["Fluconazole therapy", "Oseltamivir", "Topical terbinafine only", "No systemic therapy"], "correct": 0, "exp": "Fluconazole is DOC for severe Candida infections with proven susceptibility."}]}, {"id": "drug-names", "name": "Generic Medication Recognition — Uses, Spectrum, DOC, Major Warnings", "hy": true, "cards": [{"title": "Why this section exists", "html": "<p>This section is not a separate lecture objective, but it matches the drug-name clarification. You are responsible for recognizing medications primarily by <strong>generic name</strong>, including major clinical use, major adverse effects/black-box warnings, spectrum concepts, and drug-of-choice associations discussed in lecture.</p>", "hy": true}, {"title": "Antibacterial quick map", "html": "<table class=\"learn-table\"><tr><th>Generic</th><th>Must-recognize lecture point</th></tr><tr><td>Ciprofloxacin</td><td>FQ; UTI/Pseudomonas; not CAP due to poor Strep pneumo</td></tr><tr><td>Levofloxacin</td><td>FQ; CAP + UTI + Pseudomonas</td></tr><tr><td>Moxifloxacin</td><td>FQ; CAP + anaerobes; not UTI; no Pseudomonas</td></tr><tr><td>Nafcillin</td><td>Anti-staph penicillin; DOC MSSA</td></tr><tr><td>Ceftriaxone</td><td>3rd gen ceph; DOC Strep pneumoniae; CAP/UTI/meningitis/gonorrhea</td></tr><tr><td>Cefepime</td><td>4th gen ceph; broad incl Pseudomonas, no anaerobes</td></tr><tr><td>Piperacillin-tazobactam</td><td>Broad penicillin/BLI; Pseudomonas + anaerobes + Enterococcus</td></tr><tr><td>Vancomycin</td><td>IV systemic gram-positive/MRSA; PO only C. diff; nephrotoxicity</td></tr><tr><td>Nitrofurantoin</td><td>Uncomplicated cystitis only; avoid CrCl &lt;30</td></tr><tr><td>Clindamycin</td><td>SSTI/strep/dental alternative; BBW C. diff</td></tr><tr><td>TMP-SMX</td><td>UTI DOC; reliable PO MRSA; folate synthesis</td></tr><tr><td>Doxycycline</td><td>MRSA SSTI, CAP/COPD, Chlamydia first-line; not UTI</td></tr><tr><td>Metronidazole</td><td>Anaerobes + protozoa; adds anaerobe coverage; severe C. diff combo</td></tr></table>", "hy": true}, {"title": "Antivirals and antifungals quick map", "html": "<table class=\"learn-table\"><tr><th>Generic</th><th>Must-recognize lecture point</th></tr><tr><td>Acyclovir</td><td>HSV/VZV; IV DOC HSV encephalitis</td></tr><tr><td>Valacyclovir</td><td>PO prodrug of acyclovir; HSV/VZV</td></tr><tr><td>Ganciclovir</td><td>IV CMV in immunocompromised; marrow suppression</td></tr><tr><td>Valganciclovir</td><td>PO prodrug of ganciclovir; CMV</td></tr><tr><td>Oseltamivir</td><td>PO influenza A/B; choice hospitalized/pregnant/immunosuppressed</td></tr><tr><td>Zanamivir</td><td>Inhaled influenza A/B</td></tr><tr><td>Nirmatrelvir-ritonavir</td><td>Paxlovid; outpatient COVID high-risk; start within 5 days; interactions</td></tr><tr><td>Fluconazole</td><td>Narrow azole; susceptible Candida; CNS/urine; high bioavailability</td></tr><tr><td>Voriconazole</td><td>DOC Aspergillosis; resistant Candida; no Mucorales</td></tr><tr><td>Posaconazole</td><td>Broad azole; Mucorales; reserved/costly</td></tr><tr><td>Terbinafine</td><td>PO only onychomycosis; 6+ weeks fingernails, 12+ weeks toenails</td></tr><tr><td>Caspofungin/einocandins</td><td>IV only; DOC invasive candidiasis; Candida + Aspergillus incl resistant Candida</td></tr></table>", "hy": true}], "test": [{"q": "Ciprofloxacin is NOT used for CAP because it lacks reliable coverage of:", "choices": ["Strep pneumoniae", "Pseudomonas", "Enterobacterales", "Gram-negatives"], "correct": 0, "exp": "Ciprofloxacin cannot be used for CAP due to lack of Strep pneumoniae coverage."}, {"q": "Moxifloxacin cannot be used for UTI because:", "choices": ["It lacks adequate urinary concentrations", "It has no anaerobe coverage", "It is IV only", "It is a beta-lactam"], "correct": 0, "exp": "Lecture says moxifloxacin cannot be used for UTI due to inadequate urinary concentrations."}, {"q": "Nafcillin is drug of choice for:", "choices": ["MSSA", "MRSA", "CMV", "Tinea"], "correct": 0, "exp": "Nafcillin is DOC for MSSA."}, {"q": "Cefepime is best recognized as:", "choices": ["4th gen ceph with Pseudomonas coverage", "Topical antifungal", "HSV antiviral", "PO-only UTI drug"], "correct": 0, "exp": "Cefepime is broad and covers Pseudomonas."}, {"q": "Piperacillin-tazobactam covers all EXCEPT:", "choices": ["Pseudomonas", "Anaerobes", "MRSA", "Enterococcus"], "correct": 2, "exp": "Pip/tazo covers Pseudomonas, Enterococcus, anaerobes, but not MRSA."}, {"q": "Only oral vancomycin use is:", "choices": ["C. diff colitis", "MRSA bacteremia", "HSV encephalitis", "UTI"], "correct": 0, "exp": "PO vancomycin is not absorbed and remains in the gut for C. diff."}, {"q": "Nitrofurantoin is only used for:", "choices": ["Uncomplicated cystitis", "Pyelonephritis", "Bacteremia", "Meningitis"], "correct": 0, "exp": "Nitrofurantoin only treats uncomplicated cystitis."}, {"q": "TMP-SMX mechanism from lecture:", "choices": ["Folate synthesis inhibition", "Cell wall rupture", "Viral replication blockade", "Ergosterol inhibition"], "correct": 0, "exp": "TMP-SMX blocks folic acid synthesis."}, {"q": "Doxycycline is first-line for:", "choices": ["Chlamydia", "C. diff", "CMV", "Mucormycosis"], "correct": 0, "exp": "Doxycycline is first-line for Chlamydia."}, {"q": "Metronidazole covers only:", "choices": ["Anaerobes and protozoans", "MRSA and VRE", "HSV and VZV", "Candida and tinea"], "correct": 0, "exp": "Metronidazole covers only anaerobes and protozoans."}, {"q": "Valganciclovir is a prodrug converted to:", "choices": ["Ganciclovir", "Acyclovir", "Oseltamivir", "Fluconazole"], "correct": 0, "exp": "Valganciclovir is converted to ganciclovir."}, {"q": "Voriconazole is drug of choice for:", "choices": ["Aspergillosis", "Onychomycosis", "Influenza", "MSSA"], "correct": 0, "exp": "Voriconazole is DOC for Aspergillosis."}, {"q": "Posaconazole is important because it covers:", "choices": ["Mucorales", "Only tinea", "Only influenza", "Only UTI pathogens"], "correct": 0, "exp": "Posaconazole/isavuconazole cover Mucorales."}, {"q": "Caspofungin belongs to which class?", "choices": ["Echinocandins", "Fluoroquinolones", "Macrolides", "Natural penicillins"], "correct": 0, "exp": "Caspofungin is an echinocandin."}], "apply": [{"q": "A patient has MRSA bacteremia. Which vancomycin route is appropriate?", "choices": ["IV vancomycin", "PO vancomycin", "Topical vancomycin", "Inhaled vancomycin"], "correct": 0, "exp": "Only IV vancomycin treats systemic infections."}, {"q": "A patient has outpatient CAP and needs atypical coverage. Which listed medication could help cover atypicals?", "choices": ["Doxycycline", "Nitrofurantoin", "Vancomycin", "Nystatin"], "correct": 0, "exp": "Doxycycline covers atypicals and is used in CAP."}, {"q": "A patient has HSV encephalitis. Which medication is drug of choice?", "choices": ["IV acyclovir", "Valganciclovir", "Oseltamivir", "Terbinafine"], "correct": 0, "exp": "IV acyclovir is DOC for HSV encephalitis."}, {"q": "A high-risk outpatient with mild COVID on day 3 is eligible for treatment. Which generic drug pair is preferred?", "choices": ["Nirmatrelvir-ritonavir", "Acyclovir-valacyclovir", "Ganciclovir-valganciclovir", "Ceftriaxone-cefepime"], "correct": 0, "exp": "Nirmatrelvir-ritonavir is Paxlovid, preferred outpatient option."}, {"q": "A critically ill neutropenic patient has invasive candidiasis. Which generic class/drug is best empirically?", "choices": ["Echinocandin such as caspofungin", "Terbinafine", "Nystatin", "Oseltamivir"], "correct": 0, "exp": "Echinocandins are DOC for invasive candidiasis."}]}]}];
let currentPackId = 'pharm-master';
let learnState = {topic:null, idx:0, known:{}};
let quizState = {mode:null, topic:null, queue:[], idx:0, score:0, answered:0, missed:[], isRetry:false};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pack(){return PACKS.find(p=>p.id===currentPackId) || PACKS[0];}
function packbar(){return '<div class="packbar"><div class="pack-label">Study Pack</div><div class="pack-tabs">'+PACKS.map(p=>'<button class="pack-tab '+(p.id===currentPackId?'active':'')+'" onclick="switchPack(\''+p.id+'\')">'+esc(p.name)+'</button>').join('')+'</div></div>';}
function switchPack(id){currentPackId=id; learnState={topic:null,idx:0,known:{}}; renderView(); renderLearnHome(); renderQuizHome('test'); renderQuizHome('apply');}
document.querySelectorAll('.tab-item').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('view-'+t.dataset.tab).classList.add('active');}));
function renderView(){const p=pack();let html=packbar()+'<div class="view-head"><div class="view-eyebrow">Expandable subjects</div><div class="view-title">View</div><div class="view-desc">Choose a study pack above. Each pack has its own Learn, Test, and Apply sections, so future subjects can be added without mixing them together.</div></div><div class="source-lock">Source lock: all antimicrobial facts in this app are based on the uploaded lecture slideshow only. The LO pack contains 22 objective sections plus a generic medication recognition section.</div><div class="map-grid">';p.topics.forEach((t,i)=>{html+='<div class="map-card"><h3>'+esc(t.name)+'</h3><p>'+t.cards.length+' learn cards · '+t.test.length+' test questions · '+t.apply.length+' application cases</p><div class="map-row">'+(t.hy?'<span class="map-pill">high yield</span>':'')+'<span class="map-pill">learn</span><span class="map-pill">test</span><span class="map-pill">apply</span></div></div>';});html+='</div>';document.getElementById('view-container').innerHTML=html;}
function renderTopicList(mode){const p=pack();let label=mode==='learn'?'Understand before you memorize':mode==='test'?'Active recall':'Clinical reasoning';let title=mode==='learn'?'Learn':mode==='test'?'Test':'Apply';let desc=mode==='learn'?'Concept-first cards for the selected pack.':'Recall questions before cases. The LO pack is built objective-by-objective.':'PANCE-style vignettes that force clinical use of the same slideshow facts.';let html=packbar()+'<div class="view-head"><div class="view-eyebrow">'+label+'</div><div class="view-title">'+title+'</div><div class="view-desc">'+desc+'</div></div><div class="topic-list">';p.topics.forEach((t,i)=>{let count=mode==='learn'?t.cards.length:(mode==='test'?t.test.length:t.apply.length);html+='<div class="topic-card" onclick="'+(mode==='learn'?'startLearn':'startQuiz')+'(\''+(mode==='learn'?t.id:mode)+'\''+(mode==='learn'?'':',\''+t.id+'\'')+')"><span class="topic-num">'+String(i+1).padStart(2,'0')+'</span><div class="topic-info"><div class="topic-name">'+esc(t.name)+(t.hy?' <span class="hy-flag">high yield</span>':'')+'</div><div class="topic-meta">'+count+' '+(mode==='learn'?'cards':'questions')+'</div></div><span class="topic-arrow">›</span></div>';});html+='</div>';return html;}
function renderLearnHome(){document.getElementById('learn-container').innerHTML=renderTopicList('learn');}
function renderQuizHome(mode){document.getElementById(mode+'-container').innerHTML=renderTopicList(mode);}
function startLearn(id){learnState.topic=pack().topics.find(t=>t.id===id);learnState.idx=0;learnState.known={};renderLearnCard();}
function renderLearnCard(){const t=learnState.topic,i=learnState.idx,c=document.getElementById('learn-container');if(i>=t.cards.length){renderLearnDone();return;}const card=t.cards[i],pct=(i/t.cards.length)*100;let html='<button class="back-btn" onclick="renderLearnHome()">← All topics</button><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="counter">'+(i+1)+' of '+t.cards.length+' · '+esc(t.name)+'</div><div class="learn-card"><div class="kicker">'+esc(t.name)+(card.hy?' · ★ high yield':'')+'</div><div class="learn-title">'+esc(card.title)+'</div><div class="learn-body">'+card.html+'</div></div><div class="learn-actions"><button class="learn-btn btn-dunno" onclick="learnNext(false)">Not yet</button><button class="learn-btn btn-know" onclick="learnNext(true)">I know this</button></div><div class="learn-nav"><button onclick="learnPrev()" '+(i===0?'disabled':'')+'>← back</button><button onclick="renderLearnDone()">skip to end →</button></div>';c.innerHTML=html;c.parentElement.scrollTop=0;}
function learnNext(known){learnState.known[learnState.idx]=known;learnState.idx++;renderLearnCard();}function learnPrev(){if(learnState.idx>0){learnState.idx--;renderLearnCard();}}
function renderLearnDone(){const t=learnState.topic,known=Object.values(learnState.known).filter(Boolean).length,total=t.cards.length,c=document.getElementById('learn-container');c.innerHTML='<div class="learn-done"><div class="learn-done-badge">📖</div><h3>'+esc(t.name)+' complete</h3><p>You marked '+known+' of '+total+' cards as known. Test it before moving on.</p><div class="stats-row"><div class="stat-box"><span class="stat-val" style="color:var(--green)">'+known+'</span><span class="stat-lbl">Known</span></div><div class="stat-box"><span class="stat-val" style="color:var(--text2)">'+(total-known)+'</span><span class="stat-lbl">Review</span></div></div><div class="cta-btns"><button class="btn-pri" onclick="goTab(\'test\');startQuiz(\'test\',\''+t.id+'\')">Test this topic →</button><button class="btn-sec" onclick="startLearn(\''+t.id+'\')">Restudy</button><button class="btn-sec" onclick="renderLearnHome()">All topics</button></div></div>';}
function goTab(tab){document.querySelectorAll('.tab-item').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.querySelector('.tab-item[data-tab="'+tab+'"]').classList.add('active');document.getElementById('view-'+tab).classList.add('active');}
function startQuiz(mode,id){const t=pack().topics.find(x=>x.id===id);if(!t){renderQuizHome(mode);return;}const qs=(mode==='test'?t.test:t.apply).slice();quizState={mode,topic:t,queue:qs,idx:0,score:0,answered:0,missed:[],isRetry:false};renderQuizQuestion();}
function retryMissed(){const s=quizState;if(!s.missed.length)return;quizState={mode:s.mode,topic:s.topic,queue:s.missed.slice(),idx:0,score:0,answered:0,missed:[],isRetry:true};renderQuizQuestion();}
function renderQuizQuestion(){const s=quizState,c=document.getElementById(s.mode+'-container');if(s.idx>=s.queue.length){renderQuizComplete();return;}const q=s.queue[s.idx],pct=(s.idx/s.queue.length)*100,letters=['A','B','C','D','E'];let html='<button class="back-btn" onclick="renderQuizHome(\''+s.mode+'\')">← All topics</button><div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div><div class="counter">'+(s.idx+1)+' / '+s.queue.length+' · '+esc(s.topic.name)+'</div><div class="q-meta">'+(s.mode==='apply'?'PANCE-style application':'Recall proof')+' '+(s.idx+1)+'</div><div class="q-card"><div class="q-text '+(s.mode==='apply'?'vignette':'')+'">'+esc(q.q)+'</div><ul class="choices-list" id="choices">';q.choices.forEach((ch,ci)=>{html+='<li><button class="choice-btn" data-ci="'+ci+'"><span class="choice-letter">'+letters[ci]+'</span><span>'+esc(ch)+'</span></button></li>';});html+='</ul></div><div class="explanation-box" id="exp"><span class="explanation-label">Explanation</span>'+esc(q.exp)+'</div><div class="next-row" id="nextrow"><button class="next-btn" id="nextbtn">'+(s.idx+1>=s.queue.length?'See Results':'Next →')+'</button></div>';c.innerHTML=html;c.parentElement.scrollTop=0;document.querySelectorAll('#choices .choice-btn').forEach(btn=>btn.addEventListener('click',()=>chooseAnswer(parseInt(btn.dataset.ci),q)));document.getElementById('nextbtn').addEventListener('click',()=>{quizState.idx++;renderQuizQuestion();});}
function chooseAnswer(ci,q){document.querySelectorAll('#choices .choice-btn').forEach((btn,bi)=>{btn.disabled=true;if(bi===q.correct)btn.classList.add('correct');else if(bi===ci)btn.classList.add('wrong');else btn.classList.add('dimmed');});quizState.answered++;if(ci===q.correct)quizState.score++;else quizState.missed.push(q);document.getElementById('exp').classList.add('show');document.getElementById('nextrow').classList.add('show');}
function renderQuizComplete(){const s=quizState,c=document.getElementById(s.mode+'-container'),pct=s.answered?Math.round((s.score/s.answered)*100):0,miss=s.missed.length;let html='<div class="complete-wrap"><span class="complete-badge">'+(pct>=85?'🎯':pct>=70?'💪':'📚')+'</span><h2 class="complete-title">'+(pct>=85?'Strong!':pct>=70?'Getting there':'Review this before moving on')+'</h2><p class="complete-sub">'+esc(s.topic.name)+' — '+s.score+' of '+s.answered+' correct.</p><div class="stats-row"><div class="stat-box"><span class="stat-val" style="color:var(--green)">'+s.score+'</span><span class="stat-lbl">Correct</span></div><div class="stat-box"><span class="stat-val" style="color:var(--red)">'+(s.answered-s.score)+'</span><span class="stat-lbl">Wrong</span></div><div class="stat-box"><span class="stat-val" style="color:var(--accent)">'+pct+'%</span><span class="stat-lbl">Score</span></div></div><div class="cta-btns">';if(miss>0)html+='<button class="btn-pri" onclick="retryMissed()">Redo '+miss+' missed →</button>';if(s.mode==='test')html+='<button class="'+(miss>0?'btn-sec':'btn-pri')+'" onclick="goTab(\'apply\');startQuiz(\'apply\',\''+s.topic.id+'\')">Apply this topic 🩺</button>';html+='<button class="btn-sec" onclick="startQuiz(\''+s.mode+'\',\''+s.topic.id+'\')">Restart</button><button class="btn-sec" onclick="renderQuizHome(\''+s.mode+'\')">All topics</button></div></div>';c.innerHTML=html;}
renderView();renderLearnHome();renderQuizHome('test');renderQuizHome('apply');
</script>

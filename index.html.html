<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0f0e0c;--surface:#1a1916;--surface2:#222018;--surface3:#28251f;--border:#2e2b26;--border2:#3a3730;--text:#f0ece3;--text2:#a09a8e;--text3:#6b6560;--accent:#e8c27a;--accent2:#7cc4a0;--accent-dim:rgba(232,194,122,.12);--blue:#6fa8dc;--blue-dim:rgba(111,168,220,.12);--red:#e05c5c;--red-dim:rgba(224,92,92,.12);--green:#5cb87a;--green-dim:rgba(92,184,122,.12);--radius:14px;--radius-sm:9px}html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}body{overflow:hidden}#tabbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(15,14,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;z-index:100}.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;transition:color .15s;position:relative}.tab-item .ico{font-size:17px}.tab-item.active{color:var(--accent)}.tab-item.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--accent);border-radius:2px}.view{display:none;position:fixed;top:56px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}.view.active{display:block}.container{max-width:720px;margin:0 auto;padding:22px 18px 88px}.packbar{position:sticky;top:0;background:linear-gradient(180deg,var(--bg),rgba(15,14,12,.92));z-index:5;padding:4px 0 14px;margin-bottom:6px}.pack-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}.pack-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.pack-tab{white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:999px;padding:9px 13px;font:600 12px 'DM Sans';cursor:pointer}.pack-tab.active{background:var(--accent);border-color:var(--accent);color:#0f0e0c}.view-head{margin-bottom:18px}.view-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}.view-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;letter-spacing:-.02em}.view-desc{font-size:13.5px;color:var(--text2);margin-top:6px;line-height:1.6}.topic-list{display:flex;flex-direction:column;gap:9px}.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color .15s,background .15s,transform .12s}.topic-card:hover{border-color:var(--accent);background:var(--surface2);transform:translateX(3px)}.topic-num{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--accent);opacity:.45;min-width:34px}.topic-info{flex:1}.topic-name{font-size:14.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.topic-meta{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--text3)}.topic-arrow{color:var(--text3);font-size:18px}.hy-flag{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.08em;background:var(--accent-dim);color:var(--accent);padding:2px 6px;border-radius:20px;border:1px solid rgba(232,194,122,.25);text-transform:uppercase}.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text3);cursor:pointer;margin-bottom:18px;border:none;background:none;font-family:'DM Sans';padding:0}.back-btn:hover{color:var(--text2)}.map-grid{display:grid;grid-template-columns:1fr;gap:10px}.map-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px}.map-card h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:6px}.map-card p{color:var(--text2);font-size:13px;line-height:1.55}.map-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.map-pill{font-family:'DM Mono';font-size:10px;color:var(--accent);border:1px solid rgba(232,194,122,.25);background:var(--accent-dim);border-radius:999px;padding:4px 7px}.progress-track{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:12px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#f5d89a);border-radius:99px;transition:width .35s}.counter{font-family:'DM Mono';font-size:11px;color:var(--text3);text-align:center;margin-bottom:14px}.learn-card,.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;margin-bottom:14px;animation:cardIn .25s}@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.kicker{font-family:'DM Mono';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-bottom:10px}.learn-title{font-family:'Playfair Display';font-size:23px;font-weight:700;line-height:1.25;margin-bottom:14px}.learn-body{font-size:14.5px;line-height:1.72;color:#d8d3c8}.learn-body p{margin-bottom:12px}.learn-body strong{color:var(--text);font-weight:700}.hl{color:var(--accent);font-weight:700}.learn-body ul,.learn-body ol{margin:10px 0 14px;padding-left:24px}.learn-body li{margin-bottom:8px}.learn-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12.2px}.learn-table th{background:var(--surface3);color:var(--accent);font-family:'DM Mono';font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:8px;text-align:left;border:1px solid var(--border2);font-weight:500}.learn-table td{padding:8px;border:1px solid var(--border);color:#cfc9bd;vertical-align:top}.learn-actions{display:flex;gap:10px}.learn-btn{flex:1;border:none;border-radius:var(--radius-sm);padding:14px;font-family:'DM Sans';font-size:14px;font-weight:700;cursor:pointer}.btn-know{background:var(--green-dim);color:var(--green);border:1.5px solid rgba(92,184,122,.4)}.btn-dunno{background:var(--surface2);color:var(--text2);border:1.5px solid var(--border2)}.learn-nav{display:flex;justify-content:space-between;margin-top:12px}.learn-nav button{background:none;border:none;color:var(--text3);font-size:12px;cursor:pointer;font-family:'DM Mono';padding:6px}.q-meta{font-family:'DM Mono';font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:.75;margin-bottom:10px}.q-text{font-family:'Playfair Display';font-size:18px;font-weight:700;line-height:1.4}.q-text.vignette{font-family:'DM Sans';font-size:15px;font-weight:600;line-height:1.6}.choices-list{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:14px}.choice-btn{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;text-align:left;cursor:pointer;font-family:'DM Sans';font-size:14px;color:var(--text);display:flex;gap:12px;align-items:flex-start;transition:border-color .13s,background .13s;line-height:1.5}.choice-btn:disabled{cursor:default}.choice-btn.correct{border-color:var(--green);background:var(--green-dim)}.choice-btn.wrong{border-color:var(--red);background:var(--red-dim);color:var(--text2)}.choice-btn.dimmed{opacity:.42}.choice-letter{font-family:'DM Mono';font-size:11px;color:var(--text3);min-width:18px;padding-top:1px}.explanation-box{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:14px 16px;margin-top:4px;font-size:13.5px;line-height:1.7;color:var(--text2);display:none}.explanation-box.show{display:block}.explanation-label{font-family:'DM Mono';font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:block}.next-row{display:none;justify-content:flex-end;margin-top:10px}.next-row.show{display:flex}.next-btn,.btn-pri{background:var(--accent);color:#0f0e0c;border:none;border-radius:var(--radius-sm);padding:11px 22px;font-family:'DM Sans';font-size:14px;font-weight:700;cursor:pointer}.btn-sec{background:var(--surface);color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 18px;font-family:'DM Sans';font-size:13px;font-weight:600;cursor:pointer}.complete-wrap,.learn-done{text-align:center;padding:26px 10px;animation:cardIn .3s}.complete-badge,.learn-done-badge{font-size:44px;display:block;margin-bottom:14px}.complete-title,.learn-done h3{font-family:'Playfair Display';font-size:29px;font-weight:900;margin-bottom:8px}.complete-sub,.learn-done p{font-size:14px;color:var(--text2);margin-bottom:22px;line-height:1.6}.stats-row{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 17px;min-width:84px}.stat-val{display:block;font-family:'Playfair Display';font-size:24px;font-weight:700;line-height:1;margin-bottom:4px}.stat-lbl{font-family:'DM Mono';font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}.cta-btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.source-lock{background:var(--surface2);border-left:3px solid var(--accent2);padding:12px 14px;border-radius:0 8px 8px 0;font-size:12.5px;color:#9dc8be;font-family:'DM Mono';margin-bottom:16px;line-height:1.6}@media(min-width:760px){.map-grid{grid-template-columns:1fr 1fr}}
</style>

<script>
const PACKS = [{"id": "pharm-master", "name": "Pharm Master Review", "desc": "Broad sections that let you review the whole antimicrobial lecture by theme.", "topics": [{"id": "master--strategy-and-stewardship", "name": "Master — Strategy & Stewardship", "hy": true, "cards": [{"title": "The three coverage intents", "html": "<p><strong>Prophylaxis</strong> prevents infection before it exists. In surgery, it is usually one dose just before incision, with re-dosing only for prolonged procedures and post-op dosing rarely needed beyond 24 hours.</p><p><strong>Empiric coverage</strong> treats the most likely pathogens before cultures finalize. This is where broad spectrum therapy is usually appropriate, especially in critically ill patients.</p><p><strong>Targeted/definitive therapy</strong> begins once infection is confirmed and culture/sensitivity data are available. The goal is to de-escalate to a narrow agent.</p>", "hy": true}, {"title": "Broad spectrum has multiple meanings", "html": "<p>A broad-spectrum antibiotic may cover many organisms within one group, multiple organism groups, or resistant organisms such as <strong>MRSA</strong> or <strong>Pseudomonas</strong>.</p><p>Broad spectrum is most useful for empiric coverage when the organism is unknown, disease is severe, or nosocomial/resistant pathogens are possible.</p>", "hy": true}, {"title": "Definition and purpose", "html": "<p>Antimicrobial stewardship means using antibiotics appropriately and safely: only when needed, choosing the right agent, and administering it the right way. Goals include improved outcomes, fewer adverse events, reduced length of stay, financial savings, and slowed resistance.</p>", "hy": true}, {"title": "The five-step process", "html": "<ol><li><strong>What:</strong> Determine infection site, likely organisms, workup/cultures.</li><li><strong>Who:</strong> Consider severity, culture history, allergies, renal function, comorbidities.</li><li><strong>Design:</strong> Choose agents that reach the site and cover suspected organisms. Use PO if able. Avoid redundant therapy. Dose for indication/renal function. Be cost-effective.</li><li><strong>Modify:</strong> Evaluate daily, stop unnecessary agents, narrow with susceptibilities, transition to PO if applicable.</li><li><strong>Duration/monitoring:</strong> Choose shortest effective course; rarely need >7 days; monitor labs for prolonged courses >2 weeks.</li></ol>", "hy": true}], "test": [{"q": "A preoperative antibiotic dose given just before incision is best described as:", "choices": ["Targeted therapy", "Empiric therapy", "Prophylaxis", "Escalation"], "correct": 2, "exp": "Prophylaxis prevents infection before it exists."}, {"q": "Broad antibiotics started before culture results are available for suspected sepsis are:", "choices": ["Targeted therapy", "Empiric therapy", "Prophylaxis", "Definitive therapy"], "correct": 1, "exp": "Empiric therapy covers likely pathogens before cultures finalize."}, {"q": "Once cultures finalize and sensitivities identify a susceptible organism, the next antibiotic step is usually:", "choices": ["De-escalate to narrow targeted therapy", "Escalate to a carbapenem", "Stop all monitoring", "Add anaerobic coverage"], "correct": 0, "exp": "Targeted therapy means narrowing based on culture/sensitivity results."}, {"q": "A broad-spectrum agent may be defined by coverage of:", "choices": ["Only one susceptible organism", "Multiple groups or resistant organisms", "Only viruses", "Only anaerobes"], "correct": 1, "exp": "Broad can mean multiple organism groups or resistant organisms like MRSA/Pseudomonas."}, {"q": "In most cases, narrow-spectrum agents should be used:", "choices": ["For all empiric therapy", "Only before cultures are drawn", "After organism/sensitivities are known", "Only for viral infections"], "correct": 2, "exp": "Narrow agents are preferred for targeted therapy after culture data."}, {"q": "A narrow agent may be acceptable empirically when:", "choices": ["The infection is mild and local resistance patterns support it", "The patient is in septic shock", "Cultures show ESBL", "The source is unknown and severe"], "correct": 0, "exp": "The lecture notes an exception for mild infection and/or antibiogram support."}, {"q": "Antimicrobial stewardship means:", "choices": ["Using the newest antibiotic first", "Appropriate, safe antibiotic use only when needed", "Avoiding cultures", "Treating all positive tests"], "correct": 1, "exp": "Stewardship optimizes antimicrobial use."}, {"q": "About what percent of acute-care antibiotic prescribing is unnecessary or suboptimal?", "choices": ["5%", "30%", "70%", "100%"], "correct": 1, "exp": "The lecture states approximately 30%."}, {"q": "Which action is stewardship-consistent?", "choices": ["Continue vancomycin when no Staph aureus is found", "Treat asymptomatic bacteriuria", "Narrow when sensitivities are known", "Use IV therapy despite stable PO tolerance"], "correct": 2, "exp": "Narrowing after sensitivities is a stewardship action."}, {"q": "The first step in antimicrobial management is to:", "choices": ["Determine infection site and likely organisms", "Pick the broadest drug", "Check brand names", "Start antifungals"], "correct": 0, "exp": "Step 1 is determine infection/site and likely organisms."}, {"q": "Which is a patient-specific factor in the regimen process?", "choices": ["Color of pill", "Renal function", "Font on the label", "Brand familiarity only"], "correct": 1, "exp": "Renal function is a key patient factor."}, {"q": "Combination therapy should generally:", "choices": ["Be redundant for the same organisms", "Cover different organisms and/or have different mechanisms", "Always include vancomycin", "Always include antifungals"], "correct": 1, "exp": "The lecture warns not to be redundant."}], "apply": [{"q": "A 67-year-old is hypotensive with suspected pneumonia. Blood and sputum cultures are sent, but results will take 48–72 hours. What is the best initial strategy?", "choices": ["Wait for cultures before treating", "Start broad empiric therapy now", "Give one prophylactic dose only", "Use the narrowest possible Strep-only agent"], "correct": 1, "exp": "In a critically ill patient, appropriate empiric therapy improves outcomes; cultures guide narrowing later."}, {"q": "A stable patient has mild nonpurulent cellulitis in an area where local data show high susceptibility to a narrow Strep-active agent. What is reasonable?", "choices": ["Use narrow empiric therapy", "Always use meropenem", "Use antifungal therapy", "Delay all therapy for 7 days"], "correct": 0, "exp": "Narrow empiric therapy may be acceptable for mild infections based on local patterns."}, {"q": "An elderly patient with dementia has altered mental status but no urinary symptoms, fever, or hemodynamic instability. Urine culture is positive. Best stewardship choice?", "choices": ["Treat automatically for UTI", "Consider monitoring off antibiotics if noninfectious process/dehydration is likely", "Start meropenem", "Start antifungals"], "correct": 1, "exp": "The lecture emphasizes altered mental status does not equal UTI and asymptomatic bacteriuria should not be treated."}, {"q": "A patient with suspected intra-abdominal infection needs empiric therapy. Which reasoning is best?", "choices": ["Pick an agent that reaches the site and covers GI flora, gram-negatives and anaerobes", "Treat only Staph aureus", "Choose nitrofurantoin because it reaches urine", "Wait until final cultures even if ill"], "correct": 0, "exp": "The regimen must reach the site and cover suspected organisms."}]}, {"id": "master--core-pharm-concepts", "name": "Master — Core Pharm Concepts", "hy": true, "cards": [{"title": "Bioavailability definition", "html": "<p><strong>Bioavailability</strong> is the percent of a drug absorbed with oral administration. If bioavailability is 100%, the IV and PO doses are equal or very similar. If bioavailability is 50%, the oral dose may need to be twice the IV dose because only half reaches the bloodstream.</p>", "hy": true}, {"title": "Most reported allergies are not true IgE allergy", "html": "<p>Penicillin allergy is commonly reported, but only <span class=\"hl\">10–15%</span> of reported allergies are true IgE-mediated allergies. Side effects or unclear childhood reactions are often mislabeled as allergy.</p>", "hy": true}, {"title": "What beta-lactamases do", "html": "<p><strong>Beta-lactamases</strong> are bacterial enzymes that degrade beta-lactam antibiotics. They are a resistance mechanism.</p>", "hy": true}, {"title": "Patient-specific factors", "html": "<p>When selecting an antibiotic dose, consider severity of illness, culture history, allergies, renal function, comorbidities, weight/BMI, age, and the site/indication.</p>", "hy": true}, {"title": "Beta-lactam strengths", "html": "<p>Beta-lactams include penicillins, cephalosporins, and carbapenems. They cause bacterial cell wall rupture, are potent, and cause rapid bacterial cell death.</p>", "hy": true}], "test": [{"q": "Bioavailability means:", "choices": ["Percent of oral drug absorbed", "Percent excreted unchanged", "Renal clearance estimate", "Tissue distribution only"], "correct": 0, "exp": "Bioavailability is the percent absorbed after oral administration."}, {"q": "If a drug has 100% oral bioavailability, then:", "choices": ["PO cannot be used", "IV and PO doses are equal or similar", "It only treats urine infections", "It must be renally cleared"], "correct": 1, "exp": "100% bioavailability means oral absorption is complete."}, {"q": "Which medication is listed as having excellent oral bioavailability?", "choices": ["Vancomycin", "Cefazolin", "Fluconazole", "Piperacillin-tazobactam"], "correct": 2, "exp": "Fluconazole is listed as excellent bioavailability."}, {"q": "Only what percent of reported penicillin allergies are true IgE-mediated allergies?", "choices": ["1–2%", "10–15%", "50%", "90%"], "correct": 1, "exp": "The lecture says only 10–15% are true IgE-mediated."}, {"q": "Cross-reactivity among beta-lactams is now thought to be mainly due to:", "choices": ["Shared beta-lactam core only", "Side-chain structure", "Oral bioavailability", "Renal clearance"], "correct": 1, "exp": "The lecture says avoid agents with similar side chains."}, {"q": "A patient reports nausea with penicillin. This is best categorized as:", "choices": ["Anaphylaxis", "Intolerance/side effect", "Guaranteed cross-reactivity", "MRSA risk"], "correct": 1, "exp": "Nausea is an intolerance/side effect, not a true allergy."}, {"q": "Beta-lactamases are:", "choices": ["Viral proteins", "Bacterial enzymes that degrade beta-lactams", "Fungal cell wall targets", "Human renal enzymes"], "correct": 1, "exp": "Beta-lactamases degrade beta-lactam antibiotics."}, {"q": "Which is a beta-lactamase inhibitor from lecture?", "choices": ["Clavulanate", "Nafcillin", "Cefepime", "Fluconazole"], "correct": 0, "exp": "Clavulanate is a BLI."}, {"q": "Adding a beta-lactamase inhibitor generally:", "choices": ["Decreases spectrum", "Increases spectrum compared with the antibiotic alone", "Makes the drug antiviral", "Removes gram-positive activity"], "correct": 1, "exp": "Antibiotic + BLI increases spectrum."}, {"q": "Most antibiotic renal dose adjustments are based on:", "choices": ["BMI only", "CrCl using Cockcroft-Gault", "Hemoglobin A1c", "Blood pressure"], "correct": 1, "exp": "The lecture specifies CrCl via Cockcroft-Gault."}, {"q": "Reduced renal function can cause:", "choices": ["Only higher efficacy", "Reduced efficacy, increased toxicity, or both", "No change in antibiotics", "Only fungal infection"], "correct": 1, "exp": "Reduced renal function may reduce efficacy and/or increase toxicity."}, {"q": "Which drug may be less effective if renal function is too low because it must concentrate in urine?", "choices": ["Nitrofurantoin", "Acyclovir", "Azithromycin", "Terbinafine"], "correct": 0, "exp": "Nitrofurantoin requires renal concentration in urine for cystitis efficacy."}, {"q": "Beta-lactams kill bacteria by:", "choices": ["Blocking viral replication", "Causing bacterial cell wall rupture", "Blocking fungal ergosterol only", "Inhibiting mammalian folate"], "correct": 1, "exp": "Beta-lactams disrupt cell wall synthesis and cause rupture."}, {"q": "Which is a reason beta-lactams are preferred?", "choices": ["They are poorly studied", "They are generally safe and well tolerated", "They treat all viruses", "They never need renal adjustment"], "correct": 1, "exp": "The lecture emphasizes safety, tolerability, and experience."}, {"q": "Beta-lactams are excellent options when:", "choices": ["The bacteria are susceptible", "The organism is HSV", "The infection is fungal only", "The patient has untreated severe anaphylaxis to all beta-lactams"], "correct": 0, "exp": "The lecture says beta-lactams are excellent when bacteria are susceptible."}], "apply": [{"q": "A hospitalized patient on IV levofloxacin is afebrile, improving, tolerating PO, and has no absorption issue. Best next step?", "choices": ["Continue IV for the entire course", "Switch to oral levofloxacin", "Switch to IV vancomycin", "Stop therapy because PO is weaker"], "correct": 1, "exp": "Levofloxacin has excellent bioavailability, so oral therapy is appropriate once stable."}, {"q": "A patient needs ceftriaxone but reports “penicillin allergy.” On questioning, the reaction was nausea only. What is the best interpretation?", "choices": ["Avoid all beta-lactams", "This is intolerance, so beta-lactam use is generally okay", "Use ganciclovir instead", "This confirms IgE allergy"], "correct": 1, "exp": "The lecture says intolerance/side effects do not require avoiding beta-lactams."}, {"q": "A patient with an animal bite needs oral therapy covering mixed oral flora and anaerobes. Which lecture drug is drug of choice?", "choices": ["Amoxicillin/clavulanate", "Nafcillin", "Nitrofurantoin", "Acyclovir"], "correct": 0, "exp": "Augmentin is drug of choice for bite wounds and gains anaerobe/MSSA coverage through clavulanate."}, {"q": "An 82-year-old has confusion after a renally-cleared antibiotic was not dose adjusted. Which lecture concept explains this?", "choices": ["Reduced CrCl can increase CNS toxicity", "Broad spectrum prevents toxicity", "Oral agents always cause confusion", "Allergic cross-reactivity"], "correct": 0, "exp": "Fluoroquinolones and cephalosporins can cause CNS effects if not dose-reduced for low CrCl."}, {"q": "Culture shows MSSA bacteremia. Why is nafcillin/cefazolin preferred over vancomycin when susceptible?", "choices": ["Beta-lactams are better for susceptible MSSA and are preferred when bacteria are susceptible", "Vancomycin has no gram-positive activity", "MSSA requires antifungals", "Oral vancomycin is systemic"], "correct": 0, "exp": "The lecture states beta-lactams are preferred when susceptible; vancomycin is not DOC for MSSA."}]}, {"id": "master--antibiotic-names-doc-and-warnings", "name": "Master — Antibiotic Names, DOC & Warnings", "hy": true, "cards": [{"title": "Fluoroquinolone black box warnings", "html": "<p>Fluoroquinolones have black box warnings for tendon rupture/inflammation, exacerbation of myasthenia gravis, and risk of aortic aneurysm/dissection. They also have CNS side effects, especially altered mental status in elderly patients, and possible QT prolongation.</p>", "hy": true}, {"title": "Carbapenems are broadest", "html": "<p>Carbapenems are the broadest antibiotic class. They cover many gram-positives, gram-negatives, anaerobes, and ESBL-producing organisms.</p>", "hy": true}, {"title": "What “drug of choice” means", "html": "<p>A drug of choice is the preferred agent when a specific organism or infection is identified and patient factors allow its use. DOC is not always the broadest drug; it is the best targeted choice for that situation.</p>", "hy": true}, {"title": "Why this section exists", "html": "<p>This section is not a separate lecture objective, but it matches the drug-name clarification. You are responsible for recognizing medications primarily by <strong>generic name</strong>, including major clinical use, major adverse effects/black-box warnings, spectrum concepts, and drug-of-choice associations discussed in lecture.</p>", "hy": true}], "test": [{"q": "Which warning is associated with fluoroquinolones?", "choices": ["Tendon rupture/inflammation", "Candida colonization only", "Mucormycosis", "No adverse effects"], "correct": 0, "exp": "FQs carry tendon rupture/inflammation warning."}, {"q": "Which class can exacerbate myasthenia gravis?", "choices": ["Fluoroquinolones", "Topical azoles", "Echinocandins", "Natural penicillins"], "correct": 0, "exp": "FQs have a black box warning for MG exacerbation."}, {"q": "Which antibiotic has a black box warning for high C. diff risk?", "choices": ["Clindamycin", "Nitrofurantoin", "Acyclovir", "Terbinafine"], "correct": 0, "exp": "Clindamycin carries a C. diff warning."}, {"q": "The antibiotic class with the broadest spectrum is:", "choices": ["Macrolides", "Carbapenems", "Natural penicillins", "Nitrofurantoin"], "correct": 1, "exp": "The lecture explicitly says carbapenems are broadest of all antibiotic classes."}, {"q": "Carbapenems do NOT cover:", "choices": ["Anaerobes", "ESBL-producing organisms", "MRSA", "Many gram-negatives"], "correct": 2, "exp": "Carbapenems have no MRSA coverage."}, {"q": "Which carbapenem lacks Enterococcus, Pseudomonas, and Acinetobacter coverage?", "choices": ["Meropenem", "Imipenem", "Ertapenem", "Doripenem"], "correct": 2, "exp": "Ertapenem is the less broad carbapenem."}, {"q": "Drug of choice for syphilis is:", "choices": ["Penicillin G", "Cefepime", "Metronidazole", "Valacyclovir"], "correct": 0, "exp": "Penicillin G is DOC for syphilis."}, {"q": "Drug of choice for MSSA infections includes:", "choices": ["Nafcillin or cefazolin", "Vancomycin only", "Acyclovir", "Fluconazole"], "correct": 0, "exp": "Anti-staph penicillins and cefazolin are DOC for MSSA."}, {"q": "Drug of choice for bite wounds is:", "choices": ["Amoxicillin/clavulanate", "Nitrofurantoin", "Oseltamivir", "Nystatin"], "correct": 0, "exp": "Augmentin is DOC for bite wounds."}, {"q": "Ciprofloxacin is NOT used for CAP because it lacks reliable coverage of:", "choices": ["Strep pneumoniae", "Pseudomonas", "Enterobacterales", "Gram-negatives"], "correct": 0, "exp": "Ciprofloxacin cannot be used for CAP due to lack of Strep pneumoniae coverage."}, {"q": "Moxifloxacin cannot be used for UTI because:", "choices": ["It lacks adequate urinary concentrations", "It has no anaerobe coverage", "It is IV only", "It is a beta-lactam"], "correct": 0, "exp": "Lecture says moxifloxacin cannot be used for UTI due to inadequate urinary concentrations."}, {"q": "Nafcillin is drug of choice for:", "choices": ["MSSA", "MRSA", "CMV", "Tinea"], "correct": 0, "exp": "Nafcillin is DOC for MSSA."}], "apply": [{"q": "An older patient with known aortic aneurysm needs a UTI antibiotic. Which class should be avoided if alternatives exist?", "choices": ["Fluoroquinolones", "Beta-lactams", "Topical antifungals", "Echinocandins"], "correct": 0, "exp": "FQs have a warning for aortic aneurysm/dissection."}, {"q": "A urine culture grows ESBL-producing E. coli in a sick inpatient. Which class is most appropriate from lecture?", "choices": ["Carbapenem", "Macrolide", "Tetracycline", "Nystatin"], "correct": 0, "exp": "Carbapenems are drug of choice for ESBL-producing gram-negatives."}, {"q": "A patient has primary syphilis and no contraindication. Best therapy?", "choices": ["Penicillin G", "Doxycycline as first choice", "Piperacillin-tazobactam", "Caspofungin"], "correct": 0, "exp": "Penicillin G is drug of choice for syphilis."}, {"q": "A patient has MRSA bacteremia. Which vancomycin route is appropriate?", "choices": ["IV vancomycin", "PO vancomycin", "Topical vancomycin", "Inhaled vancomycin"], "correct": 0, "exp": "Only IV vancomycin treats systemic infections."}]}, {"id": "master--antivirals", "name": "Master — Antivirals", "hy": true, "cards": [{"title": "HSV and VZV antivirals", "html": "<p><strong>Acyclovir</strong> and <strong>valacyclovir</strong> cover HSV-1, HSV-2, and VZV. Valacyclovir is a PO prodrug converted to acyclovir. Routine uses include active infection and chronic suppression. HSV encephalitis is treated with IV acyclovir.</p>", "hy": true}, {"title": "The steroid rule", "html": "<p>For outpatients with COVID, steroid risks outweigh benefits. Steroids are reserved for <strong>hospitalized patients who require oxygen or ventilation support</strong>.</p>", "hy": true}, {"title": "Who is treated outpatient", "html": "<p>Outpatient treatment is indicated for mild to moderate COVID patients at risk for progression to severe disease, including adults ≥65, immunocompromised patients, and those with multiple comorbidities. Treatment is unlikely to benefit asymptomatic or low-risk patients.</p>", "hy": true}, {"title": "Who gets treated", "html": "<p>Start influenza treatment ASAP if the patient requires hospitalization, has severe/complicated/progressive illness, or is high-risk for complications: immunosuppressed, multiple/significant comorbidities, age ≥65, age ≤2, or pregnancy.</p>", "hy": true}, {"title": "Who is at risk", "html": "<p>CMV causes no symptoms in patients with normal immunity, but immunocompromised patients can have multiorgan involvement. High-risk groups include HIV, transplant, and oncology patients.</p>", "hy": true}], "test": [{"q": "Acyclovir and valacyclovir cover:", "choices": ["HSV-1, HSV-2, VZV", "CMV only", "Influenza only", "COVID only"], "correct": 0, "exp": "They cover HSV-1, HSV-2, and VZV."}, {"q": "Drug of choice for HSV encephalitis is:", "choices": ["IV acyclovir", "Oseltamivir", "Ganciclovir", "Fluconazole"], "correct": 0, "exp": "HSV encephalitis requires IV acyclovir."}, {"q": "Which treats influenza A and B?", "choices": ["Oseltamivir", "Valacyclovir", "Ganciclovir", "Terbinafine"], "correct": 0, "exp": "Oseltamivir treats influenza A and B."}, {"q": "COVID steroids are reserved for patients who:", "choices": ["Are asymptomatic", "Have mild outpatient disease", "Are hospitalized and require oxygen/ventilation", "Have any positive test"], "correct": 2, "exp": "The lecture says reserve steroids for hospitalized patients requiring oxygen/ventilation."}, {"q": "For COVID outpatients, steroids generally:", "choices": ["Have risks outweighing benefits", "Are always first-line", "Replace Paxlovid", "Treat influenza"], "correct": 0, "exp": "The lecture says outpatient steroid risks outweigh benefits."}, {"q": "Severe COVID in lecture includes:", "choices": ["O2 saturation ≤94% or need for oxygen/ventilation", "No symptoms", "Only sore throat", "Normal O2 and no risk factors"], "correct": 0, "exp": "Severe disease includes hypoxia or oxygen/vent need."}, {"q": "Outpatient COVID treatment is most indicated for:", "choices": ["Low-risk asymptomatic patients", "Mild/moderate patients at risk for progression", "Everyone with exposure only", "Only patients on ventilators"], "correct": 1, "exp": "Outpatient treatment is for mild/moderate disease at risk for progression."}, {"q": "Paxlovid should be initiated:", "choices": ["Within 5 days of symptoms", "After 30 days", "Only after oxygen requirement", "Only IV daily x3"], "correct": 0, "exp": "The lecture says initiate ASAP and within 5 days."}, {"q": "A major barrier to Paxlovid is:", "choices": ["Drug interactions are common", "It only treats HSV", "It is inhaled only", "It causes nail fungus"], "correct": 0, "exp": "Ritonavir component creates many interactions."}, {"q": "Influenza antivirals should be given to patients who:", "choices": ["Require hospitalization", "Have no symptoms and low risk", "Are only exposed but not high risk", "Have fungal infection"], "correct": 0, "exp": "Hospitalized influenza patients should be treated."}, {"q": "High-risk influenza groups include:", "choices": ["Age ≥65 or ≤2", "Only age 20–30", "No comorbidities only", "Low-risk athletes only"], "correct": 0, "exp": "Age ≥65 or ≤2 are high risk."}, {"q": "Oseltamivir and zanamivir treatment duration is:", "choices": ["1 day", "3 days", "5 days", "30 days"], "correct": 2, "exp": "Treatment duration is 5 days."}, {"q": "CMV is most concerning in:", "choices": ["Immunocompromised patients", "Only healthy athletes", "Only patients with tinea", "Only patients with uncomplicated cystitis"], "correct": 0, "exp": "CMV disease is a major issue in immunocompromised patients."}, {"q": "Which drugs treat CMV?", "choices": ["Ganciclovir/valganciclovir", "Oseltamivir/zanamivir", "Acyclovir/valacyclovir only", "Terbinafine/nystatin"], "correct": 0, "exp": "Ganciclovir and valganciclovir treat CMV."}, {"q": "Valganciclovir is:", "choices": ["PO prodrug converted to ganciclovir", "IV only", "Inhaled influenza drug", "Topical antifungal"], "correct": 0, "exp": "Valganciclovir is PO and converted to ganciclovir."}], "apply": [{"q": "A 28-year-old has genital HSV recurrence and can take oral meds. Which drug class choice fits lecture?", "choices": ["Valacyclovir/acyclovir", "Ganciclovir only", "Oseltamivir", "Posaconazole"], "correct": 0, "exp": "Oral acyclovir/valacyclovir treats HSV active infections and suppression."}, {"q": "A 66-year-old with mild COVID symptoms, normal oxygen saturation, and no dyspnea asks for dexamethasone. Best answer?", "choices": ["Give steroids because all COVID gets steroids", "Avoid steroids; consider outpatient antiviral if high-risk and eligible", "Give oseltamivir", "Give acyclovir"], "correct": 1, "exp": "Outpatients do not receive steroids; high-risk outpatients may receive Paxlovid/remdesivir."}, {"q": "A 72-year-old with diabetes has day 2 mild COVID, normal oxygen saturation, and multiple meds. Best plan?", "choices": ["Evaluate for Paxlovid eligibility and interactions", "Give steroids immediately", "No treatment ever because outpatient", "Give acyclovir"], "correct": 0, "exp": "High-risk outpatient within 5 days should be considered for Paxlovid, with interactions checked."}, {"q": "A pregnant patient is diagnosed with influenza within 24 hours of symptoms. Which drug is agent of choice?", "choices": ["Oseltamivir", "Acyclovir", "Nirmatrelvir-ritonavir", "Fluconazole"], "correct": 0, "exp": "Oseltamivir is agent of choice for pregnant influenza patients."}, {"q": "A transplant patient develops CMV infection. Which treatment matches lecture?", "choices": ["Ganciclovir or valganciclovir", "Oseltamivir", "Acyclovir as first-line CMV therapy", "Nystatin"], "correct": 0, "exp": "CMV in immunocompromised patients is treated with ganciclovir/valganciclovir."}]}, {"id": "master--antifungals", "name": "Master — Antifungals", "hy": true, "cards": [{"title": "Local infections", "html": "<p>Local fungal infections include candidiasis (oropharyngeal, esophageal, cutaneous, vulvovaginal) and dermatophytes/tinea (corporis, cruris, pedis, capitis).</p>", "hy": true}, {"title": "Azole spectrum ladder", "html": "<table class=\"learn-table\"><tr><th>Azole</th><th>Key spectrum/DOC</th></tr><tr><td>Fluconazole</td><td>Most narrow/benign; susceptible Candida; DOC for severe Candida with proven susceptibility; reaches CNS and urine</td></tr><tr><td>Itraconazole</td><td>Broader than fluconazole; more potent against endemic fungi; DOC histoplasmosis</td></tr><tr><td>Voriconazole</td><td>Broader; Aspergillus and resistant Candida; DOC aspergillosis; no Mucorales</td></tr><tr><td>Posaconazole / Isavuconazole</td><td>Broadest azoles; yeasts, molds, Mucorales; costly and reserved</td></tr></table>", "hy": true}, {"title": "The unique oral indication", "html": "<p>Terbinafine has PO and topical formulations. The <strong>only PO use</strong> from lecture is <strong>onychomycosis</strong> (nail fungus).</p>", "hy": true}, {"title": "Echinocandin basics", "html": "<p>Echinocandins include caspofungin, micafungin, and anidulafungin. They are <strong>IV only</strong>. All agents share the same spectrum.</p>", "hy": true}, {"title": "Treat sterile-site fungi as true pathogens", "html": "<p>Fungi from blood cultures or other sterile fluids should be treated as true pathogens and require systemic antifungal therapy. Sterile sites include CSF, joint fluid, blood, and peritoneal fluid.</p>", "hy": true}], "test": [{"q": "Topical antifungals are preferred for local infections because:", "choices": ["Low systemic exposure means fewer adverse events/interactions", "They treat fungemia", "They cover CMV", "They are always broader than systemic agents"], "correct": 0, "exp": "Topicals have low systemic exposure."}, {"q": "Nystatin is ineffective against:", "choices": ["Tinea", "Candida", "Oropharyngeal candidiasis", "Cutaneous candidiasis"], "correct": 0, "exp": "Nystatin treats Candida only, not tinea."}, {"q": "Azole creams and ointments can treat:", "choices": ["Candidiasis and tinea", "Only CMV", "Only influenza", "Only MRSA"], "correct": 0, "exp": "Lecture lists azole creams for candidiasis and tinea."}, {"q": "The most narrow systemic azole is:", "choices": ["Fluconazole", "Voriconazole", "Posaconazole", "Isavuconazole"], "correct": 0, "exp": "Fluconazole is most narrow/benign."}, {"q": "Drug of choice for histoplasmosis is:", "choices": ["Itraconazole", "Fluconazole", "Nystatin", "Terbinafine"], "correct": 0, "exp": "Itraconazole is DOC for uncomplicated endemic fungi like histoplasmosis."}, {"q": "Drug of choice for aspergillosis is:", "choices": ["Voriconazole", "Fluconazole", "Acyclovir", "Oseltamivir"], "correct": 0, "exp": "Voriconazole is DOC for aspergillosis."}, {"q": "The only PO use for terbinafine from lecture is:", "choices": ["Onychomycosis", "Candidemia", "CMV", "HSV encephalitis"], "correct": 0, "exp": "Oral terbinafine is only for onychomycosis."}, {"q": "Toenail onychomycosis requires terbinafine for about:", "choices": ["3 days", "1 week", "12+ weeks", "1 year minimum"], "correct": 2, "exp": "Toenails require 12+ weeks."}, {"q": "Fingernail onychomycosis requires terbinafine for about:", "choices": ["6+ weeks", "24 hours", "5 days", "12 months"], "correct": 0, "exp": "Fingernails require 6+ weeks."}, {"q": "Echinocandins are administered:", "choices": ["IV only", "PO only", "Topical only", "Inhaled only"], "correct": 0, "exp": "Echinocandins are IV only."}, {"q": "Echinocandins cover:", "choices": ["Candida and Aspergillus", "HSV and CMV", "Influenza and COVID", "Only tinea"], "correct": 0, "exp": "They cover Candida and Aspergillus."}, {"q": "Echinocandins include coverage of resistant Candida such as:", "choices": ["C. glabrata and C. krusei", "HSV-1 and HSV-2", "Pseudomonas", "MRSA"], "correct": 0, "exp": "The lecture lists resistant Candida coverage."}, {"q": "Fungi growing from blood culture should be treated as:", "choices": ["True pathogen requiring systemic therapy", "Contaminant always", "Viral illness", "Local tinea only"], "correct": 0, "exp": "Fungi from sterile sites require systemic antifungal therapy."}, {"q": "Empiric drug of choice for invasive candidiasis in critically ill/neutropenic patients:", "choices": ["Echinocandin", "Topical nystatin", "Oral terbinafine", "Oseltamivir"], "correct": 0, "exp": "Echinocandins are DOC for invasive candidiasis."}, {"q": "Echinocandins are preferred over fluconazole empirically because:", "choices": ["Broader Candida coverage including resistant strains", "They are topical", "They treat bacteria", "They cover CMV"], "correct": 0, "exp": "They cover resistant Candida and are broader than fluconazole."}], "apply": [{"q": "A patient has tinea pedis. Which topical should NOT be chosen because it only treats Candida?", "choices": ["Nystatin", "Clotrimazole", "Miconazole", "Topical terbinafine"], "correct": 0, "exp": "Nystatin is ineffective for tinea."}, {"q": "A patient with proven Candida albicans candidemia is stable and susceptible. Which azole can be drug of choice?", "choices": ["Fluconazole", "Terbinafine", "Nystatin topical", "Oseltamivir"], "correct": 0, "exp": "Fluconazole is DOC for severe Candida infections with proven susceptibility."}, {"q": "A patient has confirmed toenail onychomycosis. Which regimen concept matches lecture?", "choices": ["Oral terbinafine for 12+ weeks", "Topical nystatin for 5 days", "IV echinocandin", "Paxlovid"], "correct": 0, "exp": "PO terbinafine is used for onychomycosis; toenails need 12+ weeks."}, {"q": "A critically ill patient has candidemia and is on many interacting medications. Why might an echinocandin be preferred?", "choices": ["Broad Candida coverage and fewer serious interactions/toxicities than azoles", "It is oral and cheap", "It covers Mucorales best", "It treats CMV"], "correct": 0, "exp": "Echinocandins have broad Candida coverage and better safety profile."}, {"q": "A neutropenic ICU patient has yeast growing in blood cultures. Which empiric therapy best matches lecture?", "choices": ["Echinocandin such as caspofungin/micafungin", "Nystatin swish", "Terbinafine", "Valacyclovir"], "correct": 0, "exp": "Echinocandins are DOC for invasive candidiasis, especially critically ill/neutropenic patients."}]}]}, {"id": "pharm-lo", "name": "Pharm LO-by-LO", "desc": "Each section equals one lecture learning outcome, plus a generic medication recognition section.", "topics": [{"id": "lo01-coverage-intent", "name": "LO 1 — Prophylaxis, Empiric, Targeted Coverage", "hy": true, "cards": [{"title": "The three coverage intents", "html": "<p><strong>Prophylaxis</strong> prevents infection before it exists. In surgery, it is usually one dose just before incision, with re-dosing only for prolonged procedures and post-op dosing rarely needed beyond 24 hours.</p><p><strong>Empiric coverage</strong> treats the most likely pathogens before cultures finalize. This is where broad spectrum therapy is usually appropriate, especially in critically ill patients.</p><p><strong>Targeted/definitive therapy</strong> begins once infection is confirmed and culture/sensitivity data are available. The goal is to de-escalate to a narrow agent.</p>", "hy": true}, {"title": "The decision rhythm", "html": "<p>The rhythm is: <span class=\"hl\">start broad when you do not know → narrow when you do know</span>.</p><ul><li>Prophylaxis: prevent predictable infection.</li><li>Empiric: cover likely organisms before results.</li><li>Targeted: choose the narrowest effective regimen after cultures/sensitivities.</li></ul>", "hy": false}], "test": [{"q": "A preoperative antibiotic dose given just before incision is best described as:", "choices": ["Targeted therapy", "Empiric therapy", "Prophylaxis", "Escalation"], "correct": 2, "exp": "Prophylaxis prevents infection before it exists."}, {"q": "Broad antibiotics started before culture results are available for suspected sepsis are:", "choices": ["Targeted therapy", "Empiric therapy", "Prophylaxis", "Definitive therapy"], "correct": 1, "exp": "Empiric therapy covers likely pathogens before cultures finalize."}, {"q": "Once cultures finalize and sensitivities identify a susceptible organism, the next antibiotic step is usually:", "choices": ["De-escalate to narrow targeted therapy", "Escalate to a carbapenem", "Stop all monitoring", "Add anaerobic coverage"], "correct": 0, "exp": "Targeted therapy means narrowing based on culture/sensitivity results."}, {"q": "Which pairing is correct?", "choices": ["Prophylaxis = after sensitivities", "Empiric = before cultures finalize", "Targeted = before infection exists", "Definitive = no organism known"], "correct": 1, "exp": "Empiric therapy is the initial treatment before culture results are available."}], "apply": [{"q": "A 67-year-old is hypotensive with suspected pneumonia. Blood and sputum cultures are sent, but results will take 48–72 hours. What is the best initial strategy?", "choices": ["Wait for cultures before treating", "Start broad empiric therapy now", "Give one prophylactic dose only", "Use the narrowest possible Strep-only agent"], "correct": 1, "exp": "In a critically ill patient, appropriate empiric therapy improves outcomes; cultures guide narrowing later."}, {"q": "A patient with bacteremia was started on broad therapy. Cultures now show a susceptible organism and the patient is improving. Best next step?", "choices": ["Continue broad therapy because it worked", "De-escalate to targeted therapy", "Add vancomycin automatically", "Stop antibiotics immediately"], "correct": 1, "exp": "Targeted/definitive therapy should reduce unnecessary coverage."}]}, {"id": "lo02-spectrum", "name": "LO 2 — Broad vs Narrow Spectrum", "hy": true, "cards": [{"title": "Broad spectrum has multiple meanings", "html": "<p>A broad-spectrum antibiotic may cover many organisms within one group, multiple organism groups, or resistant organisms such as <strong>MRSA</strong> or <strong>Pseudomonas</strong>.</p><p>Broad spectrum is most useful for empiric coverage when the organism is unknown, disease is severe, or nosocomial/resistant pathogens are possible.</p>", "hy": true}, {"title": "Narrow spectrum is the goal once you know", "html": "<p>Narrow-spectrum agents have limited pathogen coverage, either naturally or due to resistance. They are usually not best for empiric therapy unless infection is mild or local antibiogram data support it.</p><p>Once cultures and sensitivities are known, narrow therapy to reduce unnecessary coverage.</p>", "hy": false}], "test": [{"q": "A broad-spectrum agent may be defined by coverage of:", "choices": ["Only one susceptible organism", "Multiple groups or resistant organisms", "Only viruses", "Only anaerobes"], "correct": 1, "exp": "Broad can mean multiple organism groups or resistant organisms like MRSA/Pseudomonas."}, {"q": "In most cases, narrow-spectrum agents should be used:", "choices": ["For all empiric therapy", "Only before cultures are drawn", "After organism/sensitivities are known", "Only for viral infections"], "correct": 2, "exp": "Narrow agents are preferred for targeted therapy after culture data."}, {"q": "A narrow agent may be acceptable empirically when:", "choices": ["The infection is mild and local resistance patterns support it", "The patient is in septic shock", "Cultures show ESBL", "The source is unknown and severe"], "correct": 0, "exp": "The lecture notes an exception for mild infection and/or antibiogram support."}, {"q": "Which organism makes an antibiotic “broad” from a resistant-organism perspective?", "choices": ["Viridans strep", "MRSA", "Candida albicans", "HSV-1"], "correct": 1, "exp": "Coverage of resistant organisms like MRSA or Pseudomonas is considered broad."}], "apply": [{"q": "A stable patient has mild nonpurulent cellulitis in an area where local data show high susceptibility to a narrow Strep-active agent. What is reasonable?", "choices": ["Use narrow empiric therapy", "Always use meropenem", "Use antifungal therapy", "Delay all therapy for 7 days"], "correct": 0, "exp": "Narrow empiric therapy may be acceptable for mild infections based on local patterns."}, {"q": "An ICU patient with suspected nosocomial pneumonia and prior antibiotic exposure needs initial coverage. Which principle applies?", "choices": ["Use broad empiric coverage because MDROs are possible", "Use no antibiotics because cultures are pending", "Use only oral nitrofurantoin", "Use topical therapy"], "correct": 0, "exp": "Severe/nosocomial infection with MDRO risk warrants broad empiric coverage."}]}, {"id": "lo03-bioavailability", "name": "LO 3 — Bioavailability & Oral Antibiotics", "hy": true, "cards": [{"title": "Bioavailability definition", "html": "<p><strong>Bioavailability</strong> is the percent of a drug absorbed with oral administration. If bioavailability is 100%, the IV and PO doses are equal or very similar. If bioavailability is 50%, the oral dose may need to be twice the IV dose because only half reaches the bloodstream.</p>", "hy": true}, {"title": "Why oral antibiotics matter", "html": "<p>Oral therapy is often cheaper, more convenient, and avoids IV-line complications such as infection or thrombophlebitis. IV therapy is not required initially unless the patient cannot tolerate PO, has reduced absorption risk, or has infections where IV is required/preferred such as endocarditis, Staph aureus bacteremia, osteomyelitis, or meningitis.</p>", "hy": true}, {"title": "High-bioavailability antimicrobials", "html": "<p>Excellent PO absorption: fluoroquinolones (<strong>ciprofloxacin, levofloxacin, moxifloxacin</strong>), doxycycline, metronidazole, linezolid, clindamycin, fluconazole, and TMP-SMX.</p>", "hy": false}], "test": [{"q": "Bioavailability means:", "choices": ["Percent of oral drug absorbed", "Percent excreted unchanged", "Renal clearance estimate", "Tissue distribution only"], "correct": 0, "exp": "Bioavailability is the percent absorbed after oral administration."}, {"q": "If a drug has 100% oral bioavailability, then:", "choices": ["PO cannot be used", "IV and PO doses are equal or similar", "It only treats urine infections", "It must be renally cleared"], "correct": 1, "exp": "100% bioavailability means oral absorption is complete."}, {"q": "Which medication is listed as having excellent oral bioavailability?", "choices": ["Vancomycin", "Cefazolin", "Fluconazole", "Piperacillin-tazobactam"], "correct": 2, "exp": "Fluconazole is listed as excellent bioavailability."}, {"q": "A major benefit of oral therapy over prolonged IV therapy is:", "choices": ["Higher line infection risk", "Lower cost and fewer IV-line complications", "Always broader spectrum", "No need for monitoring ever"], "correct": 1, "exp": "PO therapy reduces cost and line-related complications when clinically appropriate."}], "apply": [{"q": "A hospitalized patient on IV levofloxacin is afebrile, improving, tolerating PO, and has no absorption issue. Best next step?", "choices": ["Continue IV for the entire course", "Switch to oral levofloxacin", "Switch to IV vancomycin", "Stop therapy because PO is weaker"], "correct": 1, "exp": "Levofloxacin has excellent bioavailability, so oral therapy is appropriate once stable."}, {"q": "A patient has Staph aureus bacteremia. Which route principle from lecture applies?", "choices": ["PO is always preferred immediately", "IV therapy is almost always required/preferred", "Topical therapy is first-line", "No monitoring is required"], "correct": 1, "exp": "The slideshow specifically lists Staph aureus bacteremia as an infection where IV therapy is almost always required."}]}, {"id": "lo04-pen-allergy", "name": "LO 4 — Investigating Penicillin Allergy", "hy": true, "cards": [{"title": "Most reported allergies are not true IgE allergy", "html": "<p>Penicillin allergy is commonly reported, but only <span class=\"hl\">10–15%</span> of reported allergies are true IgE-mediated allergies. Side effects or unclear childhood reactions are often mislabeled as allergy.</p>", "hy": true}, {"title": "What to investigate", "html": "<p>Ask what happened: nausea/intolerance, rash/hives, tongue swelling, renal toxicity, or anaphylaxis. The previous reaction determines whether beta-lactams can be used.</p><ul><li>Intolerance/side effect: any beta-lactam is generally okay if adherence is not an issue.</li><li>True allergy such as rash/hives: avoid similar side chains.</li><li>Severe reaction/anaphylaxis: weigh risk/benefit and consider alternatives.</li></ul>", "hy": true}, {"title": "Reference type", "html": "<p>The reference to use is a <strong>side-chain cross-reactivity chart</strong>, such as the Northwestern Medicine beta-lactam allergy resource shown in lecture. Cross-reactivity is now thought to be driven by side-chain structure, not simply the beta-lactam core.</p>", "hy": false}], "test": [{"q": "Only what percent of reported penicillin allergies are true IgE-mediated allergies?", "choices": ["1–2%", "10–15%", "50%", "90%"], "correct": 1, "exp": "The lecture says only 10–15% are true IgE-mediated."}, {"q": "Cross-reactivity among beta-lactams is now thought to be mainly due to:", "choices": ["Shared beta-lactam core only", "Side-chain structure", "Oral bioavailability", "Renal clearance"], "correct": 1, "exp": "The lecture says avoid agents with similar side chains."}, {"q": "A patient reports nausea with penicillin. This is best categorized as:", "choices": ["Anaphylaxis", "Intolerance/side effect", "Guaranteed cross-reactivity", "MRSA risk"], "correct": 1, "exp": "Nausea is an intolerance/side effect, not a true allergy."}, {"q": "The reference that helps identify beta-lactams to avoid or use safely is a:", "choices": ["QT interval nomogram", "Side-chain chart", "Creatinine clearance calculator", "CDC vaccine schedule"], "correct": 1, "exp": "The lecture shows a side-chain allergy resource/chart."}], "apply": [{"q": "A patient needs ceftriaxone but reports “penicillin allergy.” On questioning, the reaction was nausea only. What is the best interpretation?", "choices": ["Avoid all beta-lactams", "This is intolerance, so beta-lactam use is generally okay", "Use ganciclovir instead", "This confirms IgE allergy"], "correct": 1, "exp": "The lecture says intolerance/side effects do not require avoiding beta-lactams."}, {"q": "A patient reports hives after amoxicillin. What should you do before choosing another beta-lactam?", "choices": ["Use any cephalosporin without review", "Check a beta-lactam side-chain chart and avoid similar side chains", "Automatically give moxifloxacin", "Ignore the reaction"], "correct": 1, "exp": "True allergy requires side-chain based assessment."}]}, {"id": "lo05-bli", "name": "LO 5 — Beta-Lactamase Inhibitors", "hy": true, "cards": [{"title": "What beta-lactamases do", "html": "<p><strong>Beta-lactamases</strong> are bacterial enzymes that degrade beta-lactam antibiotics. They are a resistance mechanism.</p>", "hy": true}, {"title": "What inhibitors do", "html": "<p><strong>Beta-lactamase inhibitors</strong> block those enzymes. Adding a BLI increases spectrum compared with the antibiotic alone.</p><p>Lecture examples: clavulanate, sulbactam, and tazobactam. Newer inhibitors include avibactam, relebactam, vaborbactam, and durlobactam.</p>", "hy": true}, {"title": "Spectrum changes from lecture", "html": "<p>Aminopenicillin + BLI does not change Strep or Enterococcus coverage, but adds MSSA and anaerobes and increases gram-negative coverage. Piperacillin-tazobactam covers Enterobacterales, Pseudomonas, gram-positives, and anaerobes.</p>", "hy": false}], "test": [{"q": "Beta-lactamases are:", "choices": ["Viral proteins", "Bacterial enzymes that degrade beta-lactams", "Fungal cell wall targets", "Human renal enzymes"], "correct": 1, "exp": "Beta-lactamases degrade beta-lactam antibiotics."}, {"q": "Which is a beta-lactamase inhibitor from lecture?", "choices": ["Clavulanate", "Nafcillin", "Cefepime", "Fluconazole"], "correct": 0, "exp": "Clavulanate is a BLI."}, {"q": "Adding a beta-lactamase inhibitor generally:", "choices": ["Decreases spectrum", "Increases spectrum compared with the antibiotic alone", "Makes the drug antiviral", "Removes gram-positive activity"], "correct": 1, "exp": "Antibiotic + BLI increases spectrum."}, {"q": "Amoxicillin/clavulanate gains additional coverage of:", "choices": ["HSV", "MSSA and anaerobes", "MRSA only", "Mucorales"], "correct": 1, "exp": "Aminopenicillin + BLI adds MSSA, anaerobes, and more gram-negative coverage."}], "apply": [{"q": "A patient with an animal bite needs oral therapy covering mixed oral flora and anaerobes. Which lecture drug is drug of choice?", "choices": ["Amoxicillin/clavulanate", "Nafcillin", "Nitrofurantoin", "Acyclovir"], "correct": 0, "exp": "Augmentin is drug of choice for bite wounds and gains anaerobe/MSSA coverage through clavulanate."}, {"q": "A severe nosocomial infection may require broad gram-negative, Pseudomonas, gram-positive, and anaerobic coverage. Which penicillin/BLI fits?", "choices": ["Penicillin VK", "Ampicillin alone", "Piperacillin-tazobactam", "Dicloxacillin"], "correct": 2, "exp": "Piperacillin-tazobactam covers Enterobacterales, Pseudomonas, gram-positives, and anaerobes."}]}, {"id": "lo06-dose-factors", "name": "LO 6 — Patient Factors for Antibiotic Dosing", "hy": true, "cards": [{"title": "Patient-specific factors", "html": "<p>When selecting an antibiotic dose, consider severity of illness, culture history, allergies, renal function, comorbidities, weight/BMI, age, and the site/indication.</p>", "hy": true}, {"title": "Renal function drives many adjustments", "html": "<p>Most antibiotics need adjustment for reduced renal function. Doses are adjusted using creatinine clearance estimated by the <strong>Cockcroft-Gault equation</strong>. Reduced renal function can cause reduced efficacy, increased toxicity, or both.</p>", "hy": true}, {"title": "Elderly patients", "html": "<p>Elderly patients often have muscle wasting and kidney dysfunction. They are more susceptible to adverse events, especially when medications are not dose-adjusted for renal dysfunction.</p>", "hy": false}], "test": [{"q": "Most antibiotic renal dose adjustments are based on:", "choices": ["BMI only", "CrCl using Cockcroft-Gault", "Hemoglobin A1c", "Blood pressure"], "correct": 1, "exp": "The lecture specifies CrCl via Cockcroft-Gault."}, {"q": "Reduced renal function can cause:", "choices": ["Only higher efficacy", "Reduced efficacy, increased toxicity, or both", "No change in antibiotics", "Only fungal infection"], "correct": 1, "exp": "Reduced renal function may reduce efficacy and/or increase toxicity."}, {"q": "Which drug may be less effective if renal function is too low because it must concentrate in urine?", "choices": ["Nitrofurantoin", "Acyclovir", "Azithromycin", "Terbinafine"], "correct": 0, "exp": "Nitrofurantoin requires renal concentration in urine for cystitis efficacy."}, {"q": "Why are elderly patients high-risk for antibiotic adverse events?", "choices": ["They always absorb less PO drug", "Muscle wasting/kidney dysfunction can mask reduced CrCl", "They do not get infections", "They cannot take oral drugs"], "correct": 1, "exp": "Elderly patients often have muscle wasting and renal dysfunction, increasing ADE risk."}], "apply": [{"q": "An 82-year-old has confusion after a renally-cleared antibiotic was not dose adjusted. Which lecture concept explains this?", "choices": ["Reduced CrCl can increase CNS toxicity", "Broad spectrum prevents toxicity", "Oral agents always cause confusion", "Allergic cross-reactivity"], "correct": 0, "exp": "Fluoroquinolones and cephalosporins can cause CNS effects if not dose-reduced for low CrCl."}, {"q": "A woman with uncomplicated cystitis has CrCl <30 mL/min. Why avoid nitrofurantoin?", "choices": ["It becomes too broad", "Urine concentrations may be inadequate and toxicity risk rises", "It treats only CMV", "It crosses the BBB too well"], "correct": 1, "exp": "The lecture says avoid nitrofurantoin if CrCl <30 because urine levels are inadequate and systemic ADE risk rises."}]}, {"id": "lo07-stewardship", "name": "LO 7 — Antimicrobial Stewardship", "hy": true, "cards": [{"title": "Definition and purpose", "html": "<p>Antimicrobial stewardship means using antibiotics appropriately and safely: only when needed, choosing the right agent, and administering it the right way. Goals include improved outcomes, fewer adverse events, reduced length of stay, financial savings, and slowed resistance.</p>", "hy": true}, {"title": "What prescribers can do", "html": "<ul><li>Monitor off antibiotics when a noninfectious process is likely.</li><li>Avoid antibiotics for predominantly viral illness.</li><li>Do not treat asymptomatic bacteriuria.</li><li>Narrow as soon as cultures are available.</li><li>Eliminate MRSA coverage ASAP if no Staph aureus.</li><li>Switch to high-bioavailability PO agents when stable.</li><li>Use cost-effective, convenient agents.</li></ul>", "hy": true}, {"title": "Why it matters", "html": "<p>About 30% of acute-care antibiotic prescribing is unnecessary or suboptimal. Antibiotic exposure increases adverse events, resistant organism colonization/infection, and C. difficile risk. Up to 85% of C. diff patients had antibiotics in the prior 28 days.</p>", "hy": false}], "test": [{"q": "Antimicrobial stewardship means:", "choices": ["Using the newest antibiotic first", "Appropriate, safe antibiotic use only when needed", "Avoiding cultures", "Treating all positive tests"], "correct": 1, "exp": "Stewardship optimizes antimicrobial use."}, {"q": "About what percent of acute-care antibiotic prescribing is unnecessary or suboptimal?", "choices": ["5%", "30%", "70%", "100%"], "correct": 1, "exp": "The lecture states approximately 30%."}, {"q": "Which action is stewardship-consistent?", "choices": ["Continue vancomycin when no Staph aureus is found", "Treat asymptomatic bacteriuria", "Narrow when sensitivities are known", "Use IV therapy despite stable PO tolerance"], "correct": 2, "exp": "Narrowing after sensitivities is a stewardship action."}, {"q": "Up to what percent of C. diff patients had antibiotic exposure within the previous 28 days?", "choices": ["10%", "35%", "50%", "85%"], "correct": 3, "exp": "The lecture states up to 85%."}], "apply": [{"q": "An elderly patient with dementia has altered mental status but no urinary symptoms, fever, or hemodynamic instability. Urine culture is positive. Best stewardship choice?", "choices": ["Treat automatically for UTI", "Consider monitoring off antibiotics if noninfectious process/dehydration is likely", "Start meropenem", "Start antifungals"], "correct": 1, "exp": "The lecture emphasizes altered mental status does not equal UTI and asymptomatic bacteriuria should not be treated."}, {"q": "A patient on vancomycin plus cefepime improves. Cultures show no Staph aureus. What stewardship action is most appropriate?", "choices": ["Stop vancomycin if no MRSA/Staph aureus indication remains", "Add linezolid", "Continue vancomycin for safety", "Switch to PO vancomycin for bacteremia"], "correct": 0, "exp": "The lecture says eliminate MRSA coverage ASAP when not needed."}]}, {"id": "lo08-regimen-process", "name": "LO 8 — Selecting an Antibiotic Regimen", "hy": true, "cards": [{"title": "The five-step process", "html": "<ol><li><strong>What:</strong> Determine infection site, likely organisms, workup/cultures.</li><li><strong>Who:</strong> Consider severity, culture history, allergies, renal function, comorbidities.</li><li><strong>Design:</strong> Choose agents that reach the site and cover suspected organisms. Use PO if able. Avoid redundant therapy. Dose for indication/renal function. Be cost-effective.</li><li><strong>Modify:</strong> Evaluate daily, stop unnecessary agents, narrow with susceptibilities, transition to PO if applicable.</li><li><strong>Duration/monitoring:</strong> Choose shortest effective course; rarely need >7 days; monitor labs for prolonged courses >2 weeks.</li></ol>", "hy": true}, {"title": "Don’t be redundant", "html": "<p>Combination therapy should cover different organisms and/or use different mechanisms. Do not stack agents that cover the same thing without a reason.</p>", "hy": false}], "test": [{"q": "The first step in antimicrobial management is to:", "choices": ["Determine infection site and likely organisms", "Pick the broadest drug", "Check brand names", "Start antifungals"], "correct": 0, "exp": "Step 1 is determine infection/site and likely organisms."}, {"q": "Which is a patient-specific factor in the regimen process?", "choices": ["Color of pill", "Renal function", "Font on the label", "Brand familiarity only"], "correct": 1, "exp": "Renal function is a key patient factor."}, {"q": "Combination therapy should generally:", "choices": ["Be redundant for the same organisms", "Cover different organisms and/or have different mechanisms", "Always include vancomycin", "Always include antifungals"], "correct": 1, "exp": "The lecture warns not to be redundant."}, {"q": "Routine lab monitoring may be needed for courses longer than:", "choices": ["24 hours", "3 days", "2 weeks", "1 dose"], "correct": 2, "exp": "The lecture notes lab monitoring for prolonged courses >2 weeks."}], "apply": [{"q": "A patient with suspected intra-abdominal infection needs empiric therapy. Which reasoning is best?", "choices": ["Pick an agent that reaches the site and covers GI flora, gram-negatives and anaerobes", "Treat only Staph aureus", "Choose nitrofurantoin because it reaches urine", "Wait until final cultures even if ill"], "correct": 0, "exp": "The regimen must reach the site and cover suspected organisms."}, {"q": "A patient rapidly improves on therapy for a mild/moderate infection. What duration principle applies?", "choices": ["Rarely need more than 7 days; choose shorter courses when appropriate", "Always give 30 days", "Stop after one dose for all infections", "Never monitor"], "correct": 0, "exp": "The lecture states newer studies support shorter courses and rarely >7 days."}]}, {"id": "lo09-beta-lactam-preferred", "name": "LO 9 — Why Beta-Lactams Are Preferred", "hy": true, "cards": [{"title": "Beta-lactam strengths", "html": "<p>Beta-lactams include penicillins, cephalosporins, and carbapenems. They cause bacterial cell wall rupture, are potent, and cause rapid bacterial cell death.</p>", "hy": true}, {"title": "Why preferred when susceptible", "html": "<ul><li>Generally safe and well tolerated.</li><li>Well studied with extensive clinical experience.</li><li>Distribute widely into tissues/fluids.</li><li>Effective for many infection types.</li><li>Available in IV and/or PO forms.</li></ul><p>They are excellent options when bacteria are susceptible.</p>", "hy": true}], "test": [{"q": "Beta-lactams kill bacteria by:", "choices": ["Blocking viral replication", "Causing bacterial cell wall rupture", "Blocking fungal ergosterol only", "Inhibiting mammalian folate"], "correct": 1, "exp": "Beta-lactams disrupt cell wall synthesis and cause rupture."}, {"q": "Which is a reason beta-lactams are preferred?", "choices": ["They are poorly studied", "They are generally safe and well tolerated", "They treat all viruses", "They never need renal adjustment"], "correct": 1, "exp": "The lecture emphasizes safety, tolerability, and experience."}, {"q": "Beta-lactams are excellent options when:", "choices": ["The bacteria are susceptible", "The organism is HSV", "The infection is fungal only", "The patient has untreated severe anaphylaxis to all beta-lactams"], "correct": 0, "exp": "The lecture says beta-lactams are excellent when bacteria are susceptible."}], "apply": [{"q": "Culture shows MSSA bacteremia. Why is nafcillin/cefazolin preferred over vancomycin when susceptible?", "choices": ["Beta-lactams are better for susceptible MSSA and are preferred when bacteria are susceptible", "Vancomycin has no gram-positive activity", "MSSA requires antifungals", "Oral vancomycin is systemic"], "correct": 0, "exp": "The lecture states beta-lactams are preferred when susceptible; vancomycin is not DOC for MSSA."}, {"q": "A clinician avoids all beta-lactams because of an undocumented childhood nausea reaction. Why is that a problem?", "choices": ["It may unnecessarily limit excellent antibiotics", "It improves stewardship", "It prevents all C. diff", "It treats CMV"], "correct": 0, "exp": "The lecture says investigate allergies because beta-lactams are excellent and should not be limited unnecessarily."}]}, {"id": "lo10-bbw", "name": "LO 10 — Black Box Warnings & Major Adverse Events", "hy": true, "cards": [{"title": "Fluoroquinolone black box warnings", "html": "<p>Fluoroquinolones have black box warnings for tendon rupture/inflammation, exacerbation of myasthenia gravis, and risk of aortic aneurysm/dissection. They also have CNS side effects, especially altered mental status in elderly patients, and possible QT prolongation.</p>", "hy": true}, {"title": "Clindamycin warning", "html": "<p>Clindamycin is not first-line because resistance is substantial and it has a black box warning for high risk of causing <strong>C. difficile</strong>.</p>", "hy": true}, {"title": "Linezolid major warnings from lecture", "html": "<p>Linezolid may interact with psychiatric medications and has risk of bone marrow suppression, especially when treatment exceeds 14 days. This is usually reversible after discontinuation.</p>", "hy": false}], "test": [{"q": "Which warning is associated with fluoroquinolones?", "choices": ["Tendon rupture/inflammation", "Candida colonization only", "Mucormycosis", "No adverse effects"], "correct": 0, "exp": "FQs carry tendon rupture/inflammation warning."}, {"q": "Which class can exacerbate myasthenia gravis?", "choices": ["Fluoroquinolones", "Topical azoles", "Echinocandins", "Natural penicillins"], "correct": 0, "exp": "FQs have a black box warning for MG exacerbation."}, {"q": "Which antibiotic has a black box warning for high C. diff risk?", "choices": ["Clindamycin", "Nitrofurantoin", "Acyclovir", "Terbinafine"], "correct": 0, "exp": "Clindamycin carries a C. diff warning."}, {"q": "Linezolid treatment longer than 14 days increases risk of:", "choices": ["Bone marrow suppression", "Aortic dissection", "Tinea pedis", "Urinary concentration failure"], "correct": 0, "exp": "Linezolid can cause bone marrow suppression, especially >14 days."}], "apply": [{"q": "An older patient with known aortic aneurysm needs a UTI antibiotic. Which class should be avoided if alternatives exist?", "choices": ["Fluoroquinolones", "Beta-lactams", "Topical antifungals", "Echinocandins"], "correct": 0, "exp": "FQs have a warning for aortic aneurysm/dissection."}, {"q": "A patient on clindamycin develops watery diarrhea. Which complication is most concerning from lecture?", "choices": ["C. difficile", "HSV encephalitis", "CMV colitis from acyclovir", "Mucorales"], "correct": 0, "exp": "Clindamycin is high risk for C. diff."}]}, {"id": "lo11-broadest-class", "name": "LO 11 — Broadest Antibiotic Class", "hy": true, "cards": [{"title": "Carbapenems are broadest", "html": "<p>Carbapenems are the broadest antibiotic class. They cover many gram-positives, gram-negatives, anaerobes, and ESBL-producing organisms.</p>", "hy": true}, {"title": "Important gaps", "html": "<p>Carbapenems do <strong>not</strong> cover MRSA. Ertapenem has less coverage and does not cover Enterococcus, Pseudomonas, or Acinetobacter.</p>", "hy": true}, {"title": "When reserved", "html": "<p>Carbapenems are reserved for nosocomial infections or when resistant organisms are suspected. They are drug of choice for ESBL-producing gram-negatives.</p>", "hy": false}], "test": [{"q": "The antibiotic class with the broadest spectrum is:", "choices": ["Macrolides", "Carbapenems", "Natural penicillins", "Nitrofurantoin"], "correct": 1, "exp": "The lecture explicitly says carbapenems are broadest of all antibiotic classes."}, {"q": "Carbapenems do NOT cover:", "choices": ["Anaerobes", "ESBL-producing organisms", "MRSA", "Many gram-negatives"], "correct": 2, "exp": "Carbapenems have no MRSA coverage."}, {"q": "Which carbapenem lacks Enterococcus, Pseudomonas, and Acinetobacter coverage?", "choices": ["Meropenem", "Imipenem", "Ertapenem", "Doripenem"], "correct": 2, "exp": "Ertapenem is the less broad carbapenem."}, {"q": "Carbapenems are drug of choice for:", "choices": ["ESBL-producing gram-negatives", "HSV encephalitis", "Onychomycosis", "CMV"], "correct": 0, "exp": "Carbapenems are DOC for ESBL-producing gram-negatives."}], "apply": [{"q": "A urine culture grows ESBL-producing E. coli in a sick inpatient. Which class is most appropriate from lecture?", "choices": ["Carbapenem", "Macrolide", "Tetracycline", "Nystatin"], "correct": 0, "exp": "Carbapenems are drug of choice for ESBL-producing gram-negatives."}, {"q": "A clinician says meropenem covers MRSA because it is the broadest class. What correction is needed?", "choices": ["Carbapenems are broad but do not cover MRSA", "Carbapenems only cover viruses", "Meropenem is topical only", "Ertapenem covers Pseudomonas best"], "correct": 0, "exp": "Broadest does not mean MRSA coverage."}]}, {"id": "lo12-doc", "name": "LO 12 — Drug of Choice Logic", "hy": true, "cards": [{"title": "What “drug of choice” means", "html": "<p>A drug of choice is the preferred agent when a specific organism or infection is identified and patient factors allow its use. DOC is not always the broadest drug; it is the best targeted choice for that situation.</p>", "hy": true}, {"title": "DOC anchors from lecture", "html": "<table class=\"learn-table\"><tr><th>Situation</th><th>Drug of choice</th></tr><tr><td>Syphilis</td><td>Penicillin G</td></tr><tr><td>MSSA</td><td>Nafcillin or cefazolin</td></tr><tr><td>Enterococcus faecalis</td><td>Ampicillin/amoxicillin</td></tr><tr><td>Bite wounds</td><td>Amoxicillin/clavulanate</td></tr><tr><td>MRSA</td><td>Vancomycin (systemic); TMP-SMX as reliable PO option</td></tr><tr><td>Uncomplicated cystitis</td><td>Nitrofurantoin or TMP-SMX</td></tr><tr><td>C. diff</td><td>PO vancomycin or fidaxomicin</td></tr><tr><td>HSV encephalitis</td><td>IV acyclovir</td></tr><tr><td>Aspergillosis</td><td>Voriconazole</td></tr><tr><td>Invasive candidiasis</td><td>Echinocandin</td></tr></table>", "hy": true}], "test": [{"q": "Drug of choice for syphilis is:", "choices": ["Penicillin G", "Cefepime", "Metronidazole", "Valacyclovir"], "correct": 0, "exp": "Penicillin G is DOC for syphilis."}, {"q": "Drug of choice for MSSA infections includes:", "choices": ["Nafcillin or cefazolin", "Vancomycin only", "Acyclovir", "Fluconazole"], "correct": 0, "exp": "Anti-staph penicillins and cefazolin are DOC for MSSA."}, {"q": "Drug of choice for bite wounds is:", "choices": ["Amoxicillin/clavulanate", "Nitrofurantoin", "Oseltamivir", "Nystatin"], "correct": 0, "exp": "Augmentin is DOC for bite wounds."}, {"q": "Drug of choice for invasive candidiasis in critically ill/neutropenic patients is:", "choices": ["Topical nystatin", "Echinocandin", "Terbinafine", "Oseltamivir"], "correct": 1, "exp": "Echinocandins are DOC for invasive candidiasis, especially critically ill/neutropenic patients."}], "apply": [{"q": "A patient has primary syphilis and no contraindication. Best therapy?", "choices": ["Penicillin G", "Doxycycline as first choice", "Piperacillin-tazobactam", "Caspofungin"], "correct": 0, "exp": "Penicillin G is drug of choice for syphilis."}, {"q": "A patient has confirmed MSSA bacteremia. Which targeted choice best matches lecture?", "choices": ["Nafcillin or cefazolin", "PO vancomycin", "Nitrofurantoin", "Moxifloxacin"], "correct": 0, "exp": "MSSA is treated best with nafcillin/cefazolin when possible."}]}, {"id": "lo13-hsv-resp-antivirals", "name": "LO 13 — HSV & Respiratory Virus Antivirals", "hy": true, "cards": [{"title": "HSV and VZV antivirals", "html": "<p><strong>Acyclovir</strong> and <strong>valacyclovir</strong> cover HSV-1, HSV-2, and VZV. Valacyclovir is a PO prodrug converted to acyclovir. Routine uses include active infection and chronic suppression. HSV encephalitis is treated with IV acyclovir.</p>", "hy": true}, {"title": "Respiratory virus antivirals", "html": "<p>Influenza A/B agents include <strong>oseltamivir</strong>, <strong>zanamivir</strong>, and <strong>baloxavir</strong>. COVID outpatient preferred therapy is <strong>nirmatrelvir-ritonavir (Paxlovid)</strong>; remdesivir IV daily for 3 days is an alternative when Paxlovid cannot be used or is unavailable.</p>", "hy": true}], "test": [{"q": "Acyclovir and valacyclovir cover:", "choices": ["HSV-1, HSV-2, VZV", "CMV only", "Influenza only", "COVID only"], "correct": 0, "exp": "They cover HSV-1, HSV-2, and VZV."}, {"q": "Drug of choice for HSV encephalitis is:", "choices": ["IV acyclovir", "Oseltamivir", "Ganciclovir", "Fluconazole"], "correct": 0, "exp": "HSV encephalitis requires IV acyclovir."}, {"q": "Which treats influenza A and B?", "choices": ["Oseltamivir", "Valacyclovir", "Ganciclovir", "Terbinafine"], "correct": 0, "exp": "Oseltamivir treats influenza A and B."}, {"q": "Preferred outpatient COVID antiviral from lecture:", "choices": ["Nirmatrelvir-ritonavir", "Dexamethasone for all", "Acyclovir", "Zanamivir"], "correct": 0, "exp": "Paxlovid is preferred outpatient therapy for eligible high-risk patients."}], "apply": [{"q": "A 28-year-old has genital HSV recurrence and can take oral meds. Which drug class choice fits lecture?", "choices": ["Valacyclovir/acyclovir", "Ganciclovir only", "Oseltamivir", "Posaconazole"], "correct": 0, "exp": "Oral acyclovir/valacyclovir treats HSV active infections and suppression."}, {"q": "A patient with influenza A is hospitalized. Which antiviral is agent of choice from lecture?", "choices": ["Oseltamivir", "Acyclovir", "Nirmatrelvir-ritonavir", "Fluconazole"], "correct": 0, "exp": "Oseltamivir is agent of choice for hospitalized influenza patients."}]}, {"id": "lo14-covid-steroids", "name": "LO 14 — COVID Patients Who Should Receive Steroids", "hy": true, "cards": [{"title": "The steroid rule", "html": "<p>For outpatients with COVID, steroid risks outweigh benefits. Steroids are reserved for <strong>hospitalized patients who require oxygen or ventilation support</strong>.</p>", "hy": true}, {"title": "COVID severity definitions from lecture", "html": "<p>Mild disease: upper respiratory symptoms treated at home. Moderate disease: dyspnea or hospitalization. Severe disease: hypoxia with O2 saturation ≤94%, or need for oxygen/ventilatory support.</p>", "hy": false}], "test": [{"q": "COVID steroids are reserved for patients who:", "choices": ["Are asymptomatic", "Have mild outpatient disease", "Are hospitalized and require oxygen/ventilation", "Have any positive test"], "correct": 2, "exp": "The lecture says reserve steroids for hospitalized patients requiring oxygen/ventilation."}, {"q": "For COVID outpatients, steroids generally:", "choices": ["Have risks outweighing benefits", "Are always first-line", "Replace Paxlovid", "Treat influenza"], "correct": 0, "exp": "The lecture says outpatient stero
